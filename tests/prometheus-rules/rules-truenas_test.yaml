# Unit tests for the TrueNAS CPU package temperature and reboot alerts.
#
# The healthy reference here is 35-40C under a full pool scrub (measured on
# this host immediately after a power cycle), not the 62C idle baseline the
# retained metrics window showed — that baseline was itself recorded with
# cooling already degraded. See rules-truenas.yaml for the full reasoning.
rule_files:
  - rules/truenas-rules.yaml
evaluation_interval: 1m
tests:
  # Acceptance case: a healthy host under load never approaches either
  # threshold, and a normal uptime never looks like a restart.
  - interval: 1m
    name: healthy load stays silent
    input_series:
      - series: 'truenas_cpu_temperature_celsius{host="truenas",sensor="package"}'
        values: '38+0x60'
      - series: 'truenas_uptime_seconds{host="truenas"}'
        values: '500000+60x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: TrueNASCPUPackageHot
        exp_alerts: []
      - eval_time: 45m
        alertname: TrueNASCPUPackageCritical
        exp_alerts: []
      - eval_time: 45m
        alertname: TrueNASUnexpectedReboot
        exp_alerts: []

  # A brief boost to Tjmax is the CPU working as intended (AM5 desktop Ryzen
  # regulates at 95C once it gets there) and must not page anyone: two
  # minutes at 95C then back to baseline never satisfies either tier's hold.
  - interval: 1m
    name: a Tjmax boost shorter than the for windows does not page
    input_series:
      - series: 'truenas_cpu_temperature_celsius{host="truenas",sensor="package"}'
        values: '95 95 38+0x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: TrueNASCPUPackageHot
        exp_alerts: []
      - eval_time: 4m
        alertname: TrueNASCPUPackageCritical
        exp_alerts: []
      - eval_time: 8m
        alertname: TrueNASCPUPackageHot
        exp_alerts: []
      - eval_time: 8m
        alertname: TrueNASCPUPackageCritical
        exp_alerts: []

  # 92C sustained is the measured pre-power-off plateau. The critical tier
  # fires first on its 2m hold; once the warning tier's 5m hold elapses both
  # tiers are active together, which is the expected shape of the real
  # incident — every recorded excursion held 92-95C for minutes, not seconds.
  - interval: 1m
    name: the pre-shutdown ramp pages critical first then both tiers
    input_series:
      - series: 'truenas_cpu_temperature_celsius{host="truenas",sensor="package"}'
        values: '92+0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: TrueNASCPUPackageCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              host: truenas
              sensor: package
            exp_annotations:
              summary: "TrueNAS truenas CPU package at 92C — power-off imminent"
              description: >-
                The CPU package on truenas has held above 90C for 2m —
                the same ramp that preceded a hard power-off by nine minutes.
                Pause any running scrub or resilver from the TrueNAS UI now to
                shed load; that buys minutes, not a fix. A power-off takes every
                PVC on the truenas-nfs and truenas-iscsi classes with it.
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"
      - eval_time: 6m
        alertname: TrueNASCPUPackageCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              host: truenas
              sensor: package
            exp_annotations:
              summary: "TrueNAS truenas CPU package at 92C — power-off imminent"
              description: >-
                The CPU package on truenas has held above 90C for 2m —
                the same ramp that preceded a hard power-off by nine minutes.
                Pause any running scrub or resilver from the TrueNAS UI now to
                shed load; that buys minutes, not a fix. A power-off takes every
                PVC on the truenas-nfs and truenas-iscsi classes with it.
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"
      - eval_time: 6m
        alertname: TrueNASCPUPackageHot
        exp_alerts:
          - exp_labels:
              severity: warning
              host: truenas
              sensor: package
            exp_annotations:
              summary: "TrueNAS truenas CPU package at 92C — cooling suspect"
              description: >-
                The CPU package on truenas has held above 80C for 5m,
                against a 35-40C reference under full pool load. Heat is not
                leaving the CPU: check that the fan is actually spinning, and
                check the fan header and curve before anything else. The host has
                previously power-cycled twice in 26 minutes in this state, taking
                every PVC on the truenas-nfs and truenas-iscsi classes with it.
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

  # 82C is above the warning tier but below the critical one: the signature a
  # failing fan or a dried mount produces on this workload — it never has to
  # touch 90C to prove cooling has failed, and it must not page Discord.
  - interval: 1m
    name: cooling failure below the critical tier pages the warning only
    input_series:
      - series: 'truenas_cpu_temperature_celsius{host="truenas",sensor="package"}'
        values: '82+0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: TrueNASCPUPackageHot
        exp_alerts: []
      - eval_time: 3m
        alertname: TrueNASCPUPackageCritical
        exp_alerts: []
      - eval_time: 6m
        alertname: TrueNASCPUPackageCritical
        exp_alerts: []
      - eval_time: 6m
        alertname: TrueNASCPUPackageHot
        exp_alerts:
          - exp_labels:
              severity: warning
              host: truenas
              sensor: package
            exp_annotations:
              summary: "TrueNAS truenas CPU package at 82C — cooling suspect"
              description: >-
                The CPU package on truenas has held above 80C for 5m,
                against a 35-40C reference under full pool load. Heat is not
                leaving the CPU: check that the fan is actually spinning, and
                check the fan header and curve before anything else. The host has
                previously power-cycled twice in 26 minutes in this state, taking
                every PVC on the truenas-nfs and truenas-iscsi classes with it.
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

  # ARC growing to fill RAM must not page: truenas_memory_available_bytes
  # (MemAvailable) craters on this precisely because MemAvailable does not
  # count ARC as reclaimable, but truenas_arc_available_memory_bytes — ZFS's
  # own free-outside-ARC accounting — stays comfortably positive throughout,
  # which is the case for the alert to stay silent.
  - interval: 1m
    name: ARC filling RAM alone does not page
    input_series:
      - series: 'truenas_memory_available_bytes{host="truenas"}'
        values: '2000000000+0x20'
      - series: 'truenas_memory_total_bytes{host="truenas"}'
        values: '32720100000+0x20'
      - series: 'truenas_arc_available_memory_bytes{host="truenas"}'
        values: '4000000000+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: TrueNASMemoryAvailableLow
        exp_alerts: []

  # A brief dip below zero is ARC self-correcting (arc_available_memory can
  # be transiently negative while ARC finds its target size) and must not
  # page before the `for:` window elapses.
  - interval: 1m
    name: a brief ARC-available dip does not page
    input_series:
      - series: 'truenas_arc_available_memory_bytes{host="truenas"}'
        values: '-1000000+0x10 2000000+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: TrueNASMemoryAvailableLow
        exp_alerts: []
      - eval_time: 20m
        alertname: TrueNASMemoryAvailableLow
        exp_alerts: []

  # Sustained negative ARC-available headroom is the real signal: ZFS itself
  # cannot free enough memory outside the ARC to stay positive, independent
  # of how large ARC has grown.
  - interval: 1m
    name: sustained negative ARC headroom pages
    input_series:
      - series: 'truenas_arc_available_memory_bytes{host="truenas"}'
        values: '-500000000+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: TrueNASMemoryAvailableLow
        exp_alerts:
          - exp_labels:
              severity: warning
              host: truenas
            exp_annotations:
              summary: "TrueNAS truenas has no memory headroom outside ARC"
              description: "truenas's ARC-independent memory headroom has been negative for 15m — ZFS's own signal that it cannot free enough memory, not just that ARC is large. Expect NFS and iSCSI latency before anything is killed."
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

  # truenas_uptime_seconds resetting below 10m is the reboot signal,
  # independent of temperature — half of the recorded power-offs happened
  # with the package at 35-39C, no thermal signature at all. The alert must
  # also resolve once uptime crosses 10m, so a second power-cycle minutes
  # later (the recorded pairs were 18 and 25 minutes apart) fires as its own
  # event.
  - interval: 1m
    name: an uptime reset pages the reboot alert then resolves
    input_series:
      - series: 'truenas_uptime_seconds{host="truenas"}'
        values: '30+60x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: TrueNASUnexpectedReboot
        exp_alerts: []
      - eval_time: 3m
        alertname: TrueNASUnexpectedReboot
        exp_alerts:
          - exp_labels:
              severity: warning
              host: truenas
            exp_annotations:
              summary: "TrueNAS truenas rebooted 3m 30s ago"
              description: >-
                The NAS reports an uptime under 10m, so it has rebooted. If the
                reboot was not deliberate, the cause is not visible from the
                cluster — the Graphite push carries no power, PSU or thermal-event
                data. Read the host's own logs and its UPS service state, and
                check whether the reboot coincided with heavy pool IO; half of
                the recorded power-offs happened with the CPU cool, so do not
                assume a thermal cause.
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"
      - eval_time: 12m
        alertname: TrueNASUnexpectedReboot
        exp_alerts: []

  # --- truenas-storage-api group: truenas-prometheus-exporter's metrics ---
  #
  # The two-state truenas_zfs_pool_state shape below reproduces the exact
  # rows a healthy and a degraded pool report from pool.query, per this
  # exporter's collector.go — one series per named state, not a full status
  # enum.
  - interval: 1m
    name: pool state — online stays silent, degraded pages, not-online is exclusive
    input_series:
      - series: 'truenas_zfs_pool_state{pool="storage",state="online"}'
        values: '1+0x20'
      - series: 'truenas_zfs_pool_state{pool="storage",state="degraded"}'
        values: '0+0x20'
      - series: 'truenas_zfs_pool_state{pool="scratch",state="online"}'
        values: '0+0x20'
      - series: 'truenas_zfs_pool_state{pool="scratch",state="degraded"}'
        values: '1+0x20'
      - series: 'truenas_zfs_pool_state{pool="faulty",state="online"}'
        values: '0+0x20'
      - series: 'truenas_zfs_pool_state{pool="faulty",state="degraded"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: TrueNASPoolDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              pool: scratch
            exp_annotations:
              summary: "TrueNAS pool scratch is DEGRADED"
              description: "ZFS pool scratch has lost redundancy. Data is still served but a further disk failure risks the pool. Check pool status and replace the failed vdev member."
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"
      - eval_time: 6m
        alertname: TrueNASPoolNotOnline
        exp_alerts:
          - exp_labels:
              severity: critical
              pool: faulty
            exp_annotations:
              summary: "TrueNAS pool faulty is not ONLINE"
              description: "ZFS pool faulty is faulted, suspended or otherwise not online. Every democratic-csi volume and the Loki chunk store on this pool are affected."
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

  # Bytes, not GiB — the unit docs/adr/0025 confirmed pool.dataset.query
  # actually reports, and the mistake that made the deleted version of this
  # rule structurally silent.
  - interval: 1m
    name: dataset capacity ratio pages at 85% and 95%
    input_series:
      - series: 'truenas_zfs_dataset_used_bytes{pool="storage",dataset="storage"}'
        values: '80+0x20'
      - series: 'truenas_zfs_dataset_available_bytes{pool="storage",dataset="storage"}'
        values: '20+0x20'
      - series: 'truenas_zfs_dataset_used_bytes{pool="scratch",dataset="scratch"}'
        values: '96+0x20'
      - series: 'truenas_zfs_dataset_available_bytes{pool="scratch",dataset="scratch"}'
        values: '4+0x20'
    alert_rule_test:
      # storage sits at a flat 80/(80+20) = 80%, under the 85% threshold, so
      # it never alerts — only scratch (96%) does.
      - eval_time: 11m
        alertname: TrueNASPoolCapacityHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              pool: scratch
              dataset: scratch
            exp_annotations:
              summary: "TrueNAS pool scratch above 85% full"
              description: "Pool scratch (dataset scratch) is 96% full."
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"
      - eval_time: 6m
        alertname: TrueNASPoolCapacityCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              pool: scratch
              dataset: scratch
            exp_annotations:
              summary: "TrueNAS pool scratch above 95% full"
              description: "Pool scratch (dataset scratch) is 96% full and at real risk of failing writes. Free space or expand the pool now."
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

  # Labeled by device name (`disk`), not `serial` — disk.temperatures
  # (docs/adr/0025) does not return a serial, unlike the deleted rule's
  # assumption. Thresholds unchanged from that deleted rule.
  - interval: 1m
    name: disk temperature pages at 50C and 60C
    input_series:
      - series: 'truenas_disk_temperature_celsius{disk="sda"}'
        values: '38+0x20'
      - series: 'truenas_disk_temperature_celsius{disk="sdb"}'
        values: '55+0x20'
      - series: 'truenas_disk_temperature_celsius{disk="sdc"}'
        values: '65+0x20'
    alert_rule_test:
      # sdc (65C) is also above the 50C High threshold in addition to
      # Critical below — both alerts are keyed on independent thresholds
      # over the same series, not mutually exclusive the way the two pool
      # state alerts are.
      - eval_time: 16m
        alertname: TrueNASDiskTemperatureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              disk: sdb
            exp_annotations:
              summary: "TrueNAS disk sdb at 55C"
              description: "Disk sdb has read above 50C for 15m. Check airflow around that bay before it becomes the critical threshold."
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"
          - exp_labels:
              severity: warning
              disk: sdc
            exp_annotations:
              summary: "TrueNAS disk sdc at 65C"
              description: "Disk sdc has read above 50C for 15m. Check airflow around that bay before it becomes the critical threshold."
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"
      - eval_time: 11m
        alertname: TrueNASDiskTemperatureCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              disk: sdc
            exp_annotations:
              summary: "TrueNAS disk sdc at 65C"
              description: "Disk sdc has read above 60C for 10m — real risk of an early failure. Check the fan and airflow for that bay now."
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

  # A disk with no test history, or a status the exporter does not classify
  # (RUNNING), emits no truenas_disk_smart_test_passed series at all — see
  # collector.go's smartPassStatuses/smartFailStatuses. Only an explicit 0
  # pages.
  - interval: 1m
    name: SMART test failure pages, a disk with no series does not
    input_series:
      - series: 'truenas_disk_smart_test_passed{disk="sda"}'
        values: '1+0x10'
      - series: 'truenas_disk_smart_test_passed{disk="sdb"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TrueNASDiskSmartTestFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              disk: sdb
            exp_annotations:
              summary: "TrueNAS disk sdb failed its SMART self-test"
              description: "The most recent SMART self-test on sdb reported failure. Treat this disk as failing and plan a replacement; do not wait for a pool DEGRADED alert, which only fires once redundancy is actually lost."
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

  # dial_ok is set once at process start and never retried (main.go), so
  # this alert has no `for:` window — a single sample of 0 is already the
  # whole story, not a blip to debounce.
  - interval: 1m
    name: exporter down and auth-failed are independent signals
    input_series:
      - series: 'up{job="truenas-prometheus-exporter"}'
        values: '0+0x15'
      - series: 'truenas_exporter_dial_ok'
        values: '0+0x2'
    alert_rule_test:
      - eval_time: 11m
        alertname: TrueNASPrometheusExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: truenas-prometheus-exporter
            exp_annotations:
              summary: "TrueNAS API-polling exporter is not scrapeable"
              description: "truenas-prometheus-exporter has been unscrapeable for 10m. Pool state, capacity, temperature and SMART alerting are blind until it recovers."
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"
      - eval_time: 1m
        alertname: TrueNASPrometheusExporterAuthFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "TrueNAS API-polling exporter never authenticated"
              description: "truenas-prometheus-exporter's one, process-lifetime dial to the TrueNAS middleware failed or was rejected. It will not retry on its own — check the pod's logs for the reason, fix it (rotate kv/truenas-prometheus, not kv/truenas-csi), and redeploy."
              runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"
