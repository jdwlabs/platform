  # The fallback reads only mc_agent_connected, which reads 0 while the agent
  # is parked, so it cannot tell a park from a lost session. The agent here is
  # parked from 61m and its presence series end at 90m — a store that went
  # unready across a restart, say. The last sample (89m) ages out of the
  # three-minute bridge at 93m, the fallback's average is already saturated,
  # and the five-minute hold fires it at 98m with no actor label. This pins
  # that limit so a change to it is deliberate.
