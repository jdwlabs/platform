        values: '1+0x200'
      - series: 'kube_deployment_status_replicas_available{namespace="jdwillmsen-prd",deployment="jdwillmsen-minecraft-fwb-prd-afk-bot-2",job="kube-state-metrics"}'
        values: '1+0x60 0+0x140'
