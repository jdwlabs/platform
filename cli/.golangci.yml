version: "2"

run:
  timeout: 5m

linters:
  # Listed explicitly even though every one of these is a v2 default: the
  # migration from v1 dropped this block precisely because it was redundant,
  # which leaves a later change to those defaults silently reducing coverage
  # with no diff to review.
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

# Defaults are 50 per linter and 3 per repeated message, and a truncated report
# says nothing about being truncated — a partial result reads exactly like a
# nearly-clean one.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
