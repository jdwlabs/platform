# Documented exceptions to tools/check-image-pins.py's digest-pin requirement.
#
# Every entry MUST carry a non-empty `reason` explaining why the exception is
# deliberate. An entry that no longer matches an actual unpinned reference is
# treated as stale and fails the check — remove it once the file is fixed or
# no longer exists.
#
# `path` is repo-relative; `ref` is the FULL reference the checker composes
# for that location, tag included (e.g. `redis:7.4-alpine`) — together they
# are the unique key. The tag is part of the key on purpose: an exemption is
# granted to a specific image, so bumping `redis:7.4-alpine` to `redis:latest`
# re-opens the question instead of silently inheriting the old reason.
# A reference whose tag lives in a sibling key (`dbReadyImage`/`dbReadyTag`)
# is composed the same way the chart template joins them.
#
# Three categories of entry appear below:
#   - deliberate: the reference is intentionally not digest-pinned, for a
#     documented reason (e.g. it tracks a vendored chart's own appVersion,
#     which is itself pinned by the chart revision in tenant.yaml).
#   - not-rendered: the reference exists in a values file this check reads,
#     but nothing in the cluster resolves it (a disabled subchart's defaults,
#     a `helm test` hook, a default shadowed by a tenant overlay). Pinning it
#     would edit dead configuration.
#   - pre-existing: this check is new; these references predate it and were
#     never pinned. They are recorded here — not silently ignored — so CI is
#     green without hand-editing any image reference as part of adding the
#     check. Paying these down is follow-up work, not bundled here.
#
# A reference is pinned rather than listed here whenever the pin does not
# change what a running workload resolves to today. That is why the two
# in-house charts under helm-charts/ (db-ui, kubelet-serving-cert-approver)
# carry digests: both use fixed version tags, so the digest is exactly what
# the tag already resolves to.
exceptions:
  - path: tenants/platform/services/arc-systems/values.yaml
    ref: ghcr.io/actions/gha-runner-scale-set-controller
    reason: >-
      deliberate: tag is intentionally left empty so the controller image
      tracks the vendored gha-runner-scale-set-controller chart's own
      appVersion, which is itself pinned by that chart's `revision` in
      tenants/platform/tenant.yaml — not a rolling tag.

  - path: helm-charts/litellm-helm/values.yaml
    ref: ghcr.io/berriai/litellm-database
    reason: >-
      deliberate: the empty tag makes the deployment template render
      `main-<appVersion>`, and this chart's appVersion is literally `latest`,
      so the gateway runs the upstream `main-latest` build. Combined with
      pullPolicy IfNotPresent, the nodes hold whatever `main-latest` was when
      they first pulled it — pinning to the digest `main-latest` resolves to
      today would therefore not freeze the running build, it would UPGRADE
      it. Choosing a specific LiteLLM build is a version decision for the
      AI-SRE gateway and is deliberately not made by a CI coverage change.

  - path: helm-charts/litellm-helm/values.yaml
    ref: docker.io/bitnamilegacy/postgresql
    reason: >-
      not-rendered: chart default for the db-ready init container, shadowed
      by tenants/platform/services/litellm/values.yaml which sets both
      dbReadyImage and dbReadyTag. The default's `dbReadyTag: ""` also means
      the effective tag comes from a Go-template `default` in
      templates/deployment.yaml, which no static scan of values can see, so a
      digest written here would describe an image this chart never resolves.

  - path: tenants/platform/services/litellm/values.yaml
    ref: docker.io/bitnamilegacy/postgresql:16.1.0-debian-11-r20
    reason: >-
      pre-existing: the db-ready init container image predates this check.
      The chart splits it across `dbReadyImage` and `dbReadyTag`, which the
      template joins as `<image>:<tag>`, so a digest can only be expressed by
      appending it to the tag value. Pinning it restarts the live LiteLLM
      gateway and is grouped with the litellm image work, not with widening
      this check's coverage.

  - path: helm-charts/litellm-helm/templates/tests/test-connection.yaml
    ref: busybox
    reason: >-
      not-rendered: this Pod carries the `helm.sh/hook: test` annotation, so
      it is only created by an explicit `helm test` run. ArgoCD never renders
      it during a sync, so this reference never reaches the cluster.

  - path: helm-charts/litellm-helm/charts/postgresql/values.yaml
    ref: docker.io/bitnami/postgresql:16.2.0-debian-12-r8
    reason: >-
      not-rendered: vendored Bitnami postgresql subchart, gated in
      litellm-helm/Chart.yaml by `condition: db.deployStandalone`, which
      tenants/platform/services/litellm/values.yaml sets to false (litellm
      uses the CNPG-managed cluster). No template in this subchart renders.
      Editing vendored upstream values in place would also make the next
      resync of the subchart a merge conflict.

  - path: helm-charts/litellm-helm/charts/postgresql/values.yaml
    ref: docker.io/bitnami/os-shell:12-debian-12-r16
    reason: >-
      not-rendered: volume-permissions init container of the vendored Bitnami
      postgresql subchart, which is gated off by
      `condition: db.deployStandalone` (false in the litellm tenant overlay).

  - path: helm-charts/litellm-helm/charts/postgresql/values.yaml
    ref: docker.io/bitnami/postgres-exporter:0.15.0-debian-12-r14
    reason: >-
      not-rendered: metrics sidecar of the vendored Bitnami postgresql
