apiVersion: v1
kind: Secret
metadata:
  name: minecraft-fwb-console-bridge
  namespace: jdwillmsen-prd
stringData:
  # Add the actual keys/values required by the console-bridge container
  EXAMPLE_KEY: "example-value"
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-cred
  namespace: jdwillmsen-prd
type: kubernetes.io/dockerconfigjson
data:
  # .dockerconfigjson base64 encoded JSON with GHCR credentials
  # Replace with output of: echo -n '{"auths":{"ghcr.io":{"username":"<USER>","password":"<TOKEN>","email":"<EMAIL>","auth":"<base64(user:token)"}}}}' | base64
  .dockerconfigjson: "e30="
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jdwillmsen-minecraft-fwb-prd-minecraft-bedrock
  namespace: jdwillmsen-prd
spec:
  serviceName: jdwillmsen-minecraft-fwb-prd-minecraft-bedrock
  replicas: 1
  selector:
    matchLabels:
      app: minecraft-bedrock
  template:
    metadata:
      labels:
        app: minecraft-bedrock
    spec:
      imagePullSecrets:
        - name: ghcr-cred
      containers:
        - name: minecraft-bedrock
          image: itzg/minecraft-bedrock-server:2026.8.2
          ports:
            - containerPort: 19132
              protocol: UDP
          # ... existing config ...
        - name: console-bridge
          image: ghcr.io/jdwillmsen/mc-console-bridge:0.1.0
          envFrom:
            - secretRef:
                name: minecraft-fwb-console-bridge
          # ... existing config ...
