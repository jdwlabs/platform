apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jdwlabs/platform.git
    targetRevision: main
    path: bootstrap
    directory:
      recurse: true
      # crds/ is owned exclusively by the platform-crds Application (00-crds.yaml,
      # wave -1) so CRDs exist before wave-1/2 services that ship ServiceMonitor/
      # PodMonitor manifests. Without this exclude, this app's recursive sweep
      # re-applies the same objects under the same field manager as a second,
      # redundant owner.
      exclude: crds/**
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
