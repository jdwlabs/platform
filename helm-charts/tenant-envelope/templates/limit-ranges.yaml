{{- range .Values.namespaces }}
{{- if and (hasKey $.Values._limitRangeTiers .quotaTier) (not .noLimitRange) }}
{{- $tier := index $.Values._limitRangeTiers .quotaTier }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
  namespace: {{ .name }}
spec:
  limits:
    {{- /* Each block renders only if its tier defines it, so a tier can ship a
    request floor without also imposing a ceiling. Kept as a template comment:
    a YAML one would land in every rendered LimitRange and show up as a diff on
    objects that are otherwise unchanged. */}}
    - type: Container
      {{- if or $tier.defaultCpu $tier.defaultMemory }}
      default:
        {{- with $tier.defaultCpu }}
        cpu: {{ . | quote }}
        {{- end }}
        {{- with $tier.defaultMemory }}
        memory: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if or $tier.defaultRequestCpu $tier.defaultRequestMemory }}
      defaultRequest:
        {{- with $tier.defaultRequestCpu }}
        cpu: {{ . | quote }}
        {{- end }}
        {{- with $tier.defaultRequestMemory }}
        memory: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if or $tier.maxCpu $tier.maxMemory }}
      max:
        {{- with $tier.maxCpu }}
        cpu: {{ . | quote }}
        {{- end }}
        {{- with $tier.maxMemory }}
        memory: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- with $tier.maxStorage }}
    - type: PersistentVolumeClaim
      max:
        storage: {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
