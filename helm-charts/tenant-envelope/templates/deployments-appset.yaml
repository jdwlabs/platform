{{- if .Values.deploymentRepo.url }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.name }}-deployments
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions:
    - "missingkey=error"
  generators:
    - matrix:
        generators:
          - git:
              repoURL: {{ .Values.deploymentRepo.url | quote }}
              revision: {{ .Values.deploymentRepo.revision | quote }}
              files:
                - path: argocd/*/config.yaml
          - list:
              elementsYaml: '{{ "{{" }} .apps | toJson {{ "}}" }}'
  template:
    metadata:
      name: '{{ .Values.name }}-{{ "{{" }} .name {{ "}}" }}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ "{{" }} .syncWave | default "0" | toString {{ "}}" }}'
        # Diff against a server-side dry-run apply instead of the client-side
        # merge, which does not apply CRD schema defaults. A sparse HTTPRoute
        # render — no rule matches, no backendRef weight, no parentRef
        # group/kind — therefore read as drift against the defaulted live
        # object, and the fix for that was to ignore those paths. But under
        # RespectIgnoreDifferences an ignored path is stripped from the
        # manifest before it is applied too, so a route could declare a path
        # match or a backend weight, diff clean, sync green, and route
        # nothing. Server-side diff resolves the same defaults the apiserver
        # does, so the sparse render is Synced with no HTTPRoute ignores at
        # all and a real matches or weight change converges live.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: tenant-{{ .Values.name }}
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.persistentVolumeClaimRetentionPolicy
            - .spec.podManagementPolicy
            {{- /*
            .spec.updateStrategy is deliberately NOT ignored here, unlike in
            services-appset.yaml. Ignoring it does not merely hide drift: with
            ServerSideApply and RespectIgnoreDifferences both set, ArgoCD strips
            the path before diffing and applying, so it never claims ownership
            of the field and the live value can never converge on the manifest.
            A tenant declaring RollingUpdate silently stayed OnDelete forever,
            making every image bump a merge plus a manual pod delete.

            The services appset keeps the ignore because Vault depends on it —
            three replicas, each returning sealed, where an automatic roll risks
            quorum (adr/0007-vault-stays-on-ondelete.md). No workload under a
            tenant deployment repo has that shape today, so the two appsets
            differ on purpose.
            */}}
            - .spec.template.metadata.annotations
            - .spec.volumeClaimTemplates[]?.apiVersion
            - .spec.volumeClaimTemplates[]?.kind
            - .spec.volumeClaimTemplates[]?.spec.volumeMode
            - .spec.volumeClaimTemplates[]?.status
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.metadata.annotations."checksum/secret"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      destination:
        namespace: '{{ "{{" }} .namespace {{ "}}" }}'
        server: https://kubernetes.default.svc
  templatePatch: |
    spec:
      sources:
        - repoURL: {{ .Values.deploymentRepo.url | quote }}
          path: '{{ "{{" }} .chartPath {{ "}}" }}'
          targetRevision: {{ .Values.deploymentRepo.revision | quote }}
          helm:
            valueFiles:
              {{ "{{-" }} range .valueFiles {{ "}}" }}
              - {{ "{{" }} . {{ "}}" }}
              {{ "{{-" }} end {{ "}}" }}
{{- end }}
