# Per-tenant Grafana folder + team + folder-RBAC + Loki/Tempo datasources,
# driven by the `observability` block in tenant.yaml. See
# docs/observability/DASHBOARDS-AND-MULTITENANCY.md §5.1/§5.3/§5.4/§5.5:
# tenancy is folders + folder-RBAC + teams (never Grafana organizations) plus
# native X-Scope-OrgID isolation at the Loki/Tempo store, and it all rides
# tenant.yaml so onboarding stays a single-file change.
#
# Grafana's folder/team/permission/datasource objects live in Grafana's own
# store, not as Kubernetes resources, so ArgoCD cannot reconcile them
# directly (the same constraint the Git Sync Connection/Repository objects
# have — see the grafana service's gitsync-apply-job.yaml). This Job is the
# same pattern applied to folders/teams/RBAC/datasources instead of Git Sync
# resources.
#
# The datasources aren't restricted to the tenant's folder — Grafana OSS has
# no per-datasource query-permission RBAC (that's an Enterprise feature), so
# "scoped to the tenant's folder" here means named and intended for that
# folder's dashboards, not access-controlled to them. The actual isolation is
# store-level: the datasource's X-Scope-OrgID header means it can only ever
# return that tenant's data no matter who queries through it.
#
# A tenant may hold a second folder it does not create: the one Git Sync makes
# for `observability/dashboards/<tenant>`, named by `grafana.gitSyncFolder`.
# Folder-RBAC is what makes a folder tenant-private, and Grafana's default
# grants are inherited by anything created without it, so that folder is
# readable by every user in the instance — the other tenants' teams included —
# until this Job replaces its permission list. It is permissioned here rather
# than by the Application that creates it because the team and access level are
# tenant.yaml's to define, not the platform grafana service's.
#
# It renders into the `monitoring` namespace (where Grafana and its admin
# credentials live), which the governance ApplicationSet can reach because it
# deploys tenant-envelope under the elevated `bootstrap` AppProject — this
# tenant's own restricted AppProject (rendered by appproject.yaml) is not
# what governs this Job.
#
# Ordering caveat: this Job's own sync-wave only orders it against the other
# resources this chart renders for the same tenant; it does not order it
# against the separate `platform-grafana` Application. The readiness wait
# below is deliberately generous to absorb that, rather than assuming
# cross-Application sequencing.
{{- if .Values.observability.tenantId }}
{{- $folderUID := .Values.observability.grafana.folder }}
{{- $gitSyncFolderUID := .Values.observability.grafana.gitSyncFolder | default "" }}
{{- $teamName := .Values.observability.grafana.team }}
{{- $permLevel := include "tenant-envelope.grafanaPermissionLevel" .Values.observability.grafana.access }}
{{- $tenantID := .Values.observability.tenantId }}
{{- $lokiUID := printf "%s-loki" .Values.name }}
{{- $tempoUID := printf "%s-tempo" .Values.name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-{{ .Values.name }}-grafana-observability
  namespace: monitoring
data:
  folder.json: |
    {"uid": {{ $folderUID | quote }}, "title": {{ .Values.displayName | default $folderUID | quote }}}
  team.json: |
    {"name": {{ $teamName | quote }}}
  loki-datasource.json: |
    {
      "uid": {{ $lokiUID | quote }},
      "name": {{ printf "%s Loki" .Values.name | quote }},
      "type": "loki",
      "access": "proxy",
      "url": "http://platform-loki:3100",
      "jsonData": {"httpHeaderName1": "X-Scope-OrgID"},
      "secureJsonData": {"httpHeaderValue1": {{ $tenantID | quote }}}
    }
  tempo-datasource.json: |
    {
      "uid": {{ $tempoUID | quote }},
      "name": {{ printf "%s Tempo" .Values.name | quote }},
      "type": "tempo",
      "access": "proxy",
      "url": "http://platform-tempo:3200",
      "jsonData": {
        "httpHeaderName1": "X-Scope-OrgID",
        "tracesToLogsV2": {"datasourceUid": {{ $lokiUID | quote }}}
      },
      "secureJsonData": {"httpHeaderValue1": {{ $tenantID | quote }}}
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant-{{ .Values.name }}-grafana-observability-apply
  namespace: monitoring
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1500
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # Numeric uid, not a name: runAsNonRoot is enforced by the kubelet
        # before the image's user database is consulted, so a named user
        # fails admission. 472 is the grafana image's own uid.
        runAsUser: 472
        runAsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply
          # Reuses the Grafana image purely for its curl, matching the
          # gitsync-apply-job precedent: already present on the nodes and
          # version-pinned alongside the chart.
          image: docker.io/grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          env:
            - name: GF_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-user
            - name: GF_PASS
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password
            - name: FOLDER_UID
              value: {{ $folderUID | quote }}
            - name: GITSYNC_FOLDER_UID
              value: {{ $gitSyncFolderUID | quote }}
            - name: TEAM_NAME
              value: {{ $teamName | quote }}
            - name: PERM_LEVEL
              value: {{ $permLevel | quote }}
            - name: LOKI_DS_UID
              value: {{ $lokiUID | quote }}
            - name: TEMPO_DS_UID
              value: {{ $tempoUID | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              API="http://platform-grafana.monitoring.svc/api"
              LAST_BODY=/tmp/last-response

              # Cross-Application ordering isn't guaranteed (see the template
              # comment), so this loop tolerates Grafana not existing yet, not
              # just "still booting". Up to ~12 minutes before giving up.
              i=0
              while [ "$i" -lt 150 ]; do
                code=$(curl -sS -o /dev/null -w '%{http_code}' "$API/health" || echo 000)
                [ "$code" = "200" ] && break
                i=$((i + 1))
                sleep 5
              done
              if [ "$i" -ge 150 ]; then
                echo "grafana never became healthy at $API/health"
                exit 1
              fi

              # ensure_folder: create-if-absent, matching the write-once
              # posture of the gitsync job -- an existing folder (dashboards
              # may already live in it) is left untouched rather than
              # re-titled.
              code=$(curl -sS -o "$LAST_BODY" -w '%{http_code}' \
                -u "$GF_USER:$GF_PASS" "$API/folders/$FOLDER_UID")
              case "$code" in
                200)
                  echo "folder $FOLDER_UID already present, leaving untouched"
                  ;;
                404)
                  code=$(curl -sS -o "$LAST_BODY" -w '%{http_code}' -X POST \
                    -H 'Content-Type: application/json' \
                    -u "$GF_USER:$GF_PASS" \
                    --data-binary "@/etc/observability/folder.json" \
                    "$API/folders")
                  case "$code" in
                    2*) echo "created folder $FOLDER_UID" ;;
                    *)
                      echo "POST /api/folders returned $code:"
                      cat "$LAST_BODY"
                      exit 1
                      ;;
                  esac
                  ;;
                *)
                  echo "unexpected status $code probing folder $FOLDER_UID:"
                  cat "$LAST_BODY"
                  exit 1
                  ;;
              esac

              # ensure_team: the search endpoint does substring matching, so
              # totalCount must come back exactly 1 before this trusts the
              # response as "the" team -- anything else (0 or >1) is handled
              # explicitly rather than guessed at.
              code=$(curl -sS -o "$LAST_BODY" -w '%{http_code}' \
                -u "$GF_USER:$GF_PASS" "$API/teams/search?query=$TEAM_NAME")
              if [ "$code" != "200" ]; then
                echo "GET /api/teams/search returned $code:"
                cat "$LAST_BODY"
                exit 1
              fi
              if grep -q '"totalCount":0' "$LAST_BODY"; then
                code=$(curl -sS -o "$LAST_BODY" -w '%{http_code}' -X POST \
                  -H 'Content-Type: application/json' \
                  -u "$GF_USER:$GF_PASS" \
                  --data-binary "@/etc/observability/team.json" \
                  "$API/teams")
                case "$code" in
                  2*) echo "created team $TEAM_NAME" ;;
                  *)
                    echo "POST /api/teams returned $code:"
                    cat "$LAST_BODY"
                    exit 1
                    ;;
                esac
                TEAM_ID=$(grep -oE '"teamId":[0-9]+' "$LAST_BODY" | head -1 | cut -d: -f2)
              elif grep -q '"totalCount":1' "$LAST_BODY" \
                && [ "$(grep -o "\"name\":\"$TEAM_NAME\"" "$LAST_BODY" | wc -l)" -eq 1 ]; then
                echo "team $TEAM_NAME already present, leaving untouched"
                TEAM_ID=$(grep -oE '"id":[0-9]+' "$LAST_BODY" | head -1 | cut -d: -f2)
              else
                echo "ambiguous team search for '$TEAM_NAME' (expected exactly one exact-name match):"
                cat "$LAST_BODY"
                exit 1
              fi
              if [ -z "${TEAM_ID:-}" ]; then
                echo "could not resolve a team id for $TEAM_NAME from:"
                cat "$LAST_BODY"
                exit 1
              fi

              # Folder permissions are a full replace, not additive, so this
              # is safe to reconcile on every sync (unlike the create-only
              # folder/team steps above) -- it always ends in exactly the
              # tenant team holding $PERM_LEVEL on the folder, regardless of
              # what was set by hand in between. Replacing the list is also
              # what drops Grafana's inherited Viewer/Editor grants, which is
              # the step that makes a folder tenant-private rather than merely
              # tenant-named.
              set_folder_permissions() {
                uid="$1"
                code=$(curl -sS -o "$LAST_BODY" -w '%{http_code}' -X POST \
                  -H 'Content-Type: application/json' \
                  -u "$GF_USER:$GF_PASS" \
                  --data-binary "{\"items\":[{\"teamId\":$TEAM_ID,\"permission\":$PERM_LEVEL}]}" \
                  "$API/folders/$uid/permissions")
                case "$code" in
                  200) echo "folder $uid permissions set: team $TEAM_NAME ($TEAM_ID) -> level $PERM_LEVEL" ;;
                  *)
                    echo "POST /api/folders/$uid/permissions returned $code:"
                    cat "$LAST_BODY"
                    exit 1
                    ;;
                esac
              }

              set_folder_permissions "$FOLDER_UID"

              # ensure_datasource: full-replace reconcile, same reasoning as
              # the folder permissions step above -- the tenant header this
              # datasource carries must always match tenant.yaml, so this
              # converges on every sync rather than create-once.
              ensure_datasource() {
                uid="$1"
                file="$2"
                code=$(curl -sS -o "$LAST_BODY" -w '%{http_code}' \
                  -u "$GF_USER:$GF_PASS" "$API/datasources/uid/$uid")
                case "$code" in
                  200)
                    code=$(curl -sS -o "$LAST_BODY" -w '%{http_code}' -X PUT \
                      -H 'Content-Type: application/json' \
                      -u "$GF_USER:$GF_PASS" \
                      --data-binary "@$file" \
                      "$API/datasources/uid/$uid")
                    case "$code" in
                      200) echo "datasource $uid updated" ;;
                      *)
                        echo "PUT /api/datasources/uid/$uid returned $code:"
                        cat "$LAST_BODY"
                        exit 1
                        ;;
                    esac
                    ;;
                  404)
                    code=$(curl -sS -o "$LAST_BODY" -w '%{http_code}' -X POST \
                      -H 'Content-Type: application/json' \
                      -u "$GF_USER:$GF_PASS" \
                      --data-binary "@$file" \
                      "$API/datasources")
                    case "$code" in
                      2*) echo "created datasource $uid" ;;
                      *)
                        echo "POST /api/datasources returned $code:"
                        cat "$LAST_BODY"
                        exit 1
                        ;;
                    esac
                    ;;
                  *)
                    echo "unexpected status $code probing datasource $uid:"
                    cat "$LAST_BODY"
                    exit 1
                    ;;
                esac
              }
              ensure_datasource "$LOKI_DS_UID" /etc/observability/loki-datasource.json
              ensure_datasource "$TEMPO_DS_UID" /etc/observability/tempo-datasource.json

              # The Git Sync folder gets the same treatment, and comes last
              # because it is the only step waiting on another Application --
              # everything above is this Job's own to converge. It is waited for
              # rather than probed once: it is created by the separate
              # platform-grafana Application, which this Job's sync-wave does
              # not order against (see the template comment). Never created
              # here -- with sync.target folder the repository owns that UID,
              # and a folder Git Sync did not create is one it refuses to
              # adopt, so creating it would break the sync it belongs to.
              #
              # Giving up is an error rather than a skip. The only reason to
              # skip would be "the folder is not there", which is
              # indistinguishable from "the folder is there and open" without
              # asking, and a tenant folder every other tenant can read is a
              # worse outcome than a failed sync.
              if [ -n "$GITSYNC_FOLDER_UID" ]; then
                i=0
                code=000
                while [ "$i" -lt 60 ]; do
                  code=$(curl -sS -o /dev/null -w '%{http_code}' \
                    -u "$GF_USER:$GF_PASS" "$API/folders/$GITSYNC_FOLDER_UID" || echo 000)
                  [ "$code" = "200" ] && break
                  i=$((i + 1))
                  sleep 5
                done
                if [ "$code" != "200" ]; then
                  echo "git sync folder $GITSYNC_FOLDER_UID never appeared (last status $code)"
                  echo "it is created by the $GITSYNC_FOLDER_UID repository in platform-grafana; check platformctl gitsync status"
                  exit 1
                fi
                set_folder_permissions "$GITSYNC_FOLDER_UID"
              fi
          volumeMounts:
            - name: resources
              mountPath: /etc/observability
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: resources
          configMap:
            name: tenant-{{ .Values.name }}-grafana-observability
        - name: tmp
          emptyDir: {}
{{- end }}
