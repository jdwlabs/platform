{{- range .Values.namespaces }}
{{- $namespace := .name }}
{{- $policy := .networkPolicy | default "default" }}
{{- /*
Opt-in, not opt-out: a namespace enforces only once it explicitly sets
enforce: true. Cilium has no per-namespace audit mode, so this toggle is the
only staged-rollout mechanism a future enforcement-enabling change has — an
opt-out default would flip every currently-unlabeled tenant namespace to full
enforcement simultaneously the moment a policy engine starts running, and the
default tier's allow-set (Postgres + monitoring only) is not exhaustive
enough to survive that for real workload traffic (e.g. same-namespace
pod-to-pod calls have no rule at all).
*/}}
{{- $enforce := eq .enforce true }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- if eq $policy "default" }}
{{- /*
noDatabaseMonitoringEgress drops this one allow for a namespace whose
workloads use neither Postgres nor OTLP, such as an internet-facing webhook
receiver: NetworkPolicies only add, so the namespace cannot narrow it away
itself.
*/}}
{{- if not .noDatabaseMonitoringEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database-monitoring-egress
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 4317
          protocol: TCP
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-ingress
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
{{- end }}
{{- if .externalEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-egress
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.244.0.0/16
              - 10.96.0.0/12
              - 192.168.1.0/24
      ports:
        - port: 443
          protocol: TCP
{{- end }}
{{- if or (eq $policy "default") (eq $policy "platform") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-tls
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: nginx-gateway
  to:
    - group: ""
      kind: Secret
{{- end }}
{{- if or (eq $policy "ci") (eq $policy "platform") (not $enforce) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}
{{- end }}
{{- if or (eq $policy "platform") (not $enforce) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-ingress
  namespace: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - {}
{{- end }}
{{- /*
The tiers above know nothing about what a namespace runs, and a workload's own
flows cannot be added from its deployment repo: the tenant AppProject denies
NetworkPolicy and CiliumNetworkPolicy, so that isolation stays governance-owned
and a tenant cannot widen its own envelope. These two lists are where such a
flow is admitted instead, in the tenant file a code owner approves.

A spec is rendered as written. Policies only add, so an entry can widen the
namespace's allow-set and never narrow it; while the allow-all pair above is
still rendered an entry changes nothing, which is what lets the allows land
and be read back before the namespace enforces.

The Cilium list exists for the peers vanilla NetworkPolicy cannot name. A node
address is not matched by an ipBlock here, so the API server -- which every
pod reaches at a control-plane node's address -- is reachable only through
the kube-apiserver entity.
*/}}
{{- range .extraNetworkPolicies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ required (printf "namespace %s: every extraNetworkPolicies entry needs a name" $namespace) .name }}
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  {{- required (printf "namespace %s: extraNetworkPolicies entry %s needs a spec" $namespace .name) .spec | toYaml | nindent 2 }}
{{- end }}
{{- range .extraCiliumNetworkPolicies }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ required (printf "namespace %s: every extraCiliumNetworkPolicies entry needs a name" $namespace) .name }}
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  {{- required (printf "namespace %s: extraCiliumNetworkPolicies entry %s needs a spec" $namespace .name) .spec | toYaml | nindent 2 }}
{{- end }}
{{- end }}
