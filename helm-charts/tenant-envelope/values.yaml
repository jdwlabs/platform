name: ""
displayName: ""
githubOrg: ""
contacts: []

deploymentRepo:
  url: ""
  revision: main

namespaces: []

project:
  elevated: false
  clusterResourceWhitelist: []
  extraSourceRepos: []

services: []

# Per-tenant observability footprint (Grafana folder/team/RBAC). Absent
# (tenantId empty) renders nothing — the platform tenant's own "Platform"
# folder predates this model and stays sidecar/ConfigMap-provisioned rather
# than being retrofitted here. See docs/observability/DASHBOARDS-AND-MULTITENANCY.md
# §5.5 for the design this schema implements.
observability:
  tenantId: ""
  grafana:
    folder: ""
    team: ""
    access: view
    # UID of the folder Git Sync creates for this tenant's dashboards, when it
    # has one. Empty means no synced folder to permission — it is not created
    # here either way, only granted to the tenant team.
    gitSyncFolder: ""

_platform:
  repoURL: https://github.com/jdwlabs/platform.git
  revision: main

_arc:
  controllerServiceAccount:
    name: platform-arc-systems-gha-rs-controller
    namespace: arc-systems

_quotaTiers:
  small:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 4Gi
    persistentvolumeclaims: "5"
    services.loadbalancers: "1"
  standard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "6"
    limits.memory: 8Gi
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
  large:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "20"
    services.loadbalancers: "5"
  ci:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 20Gi
    persistentvolumeclaims: "10"
    services.loadbalancers: "0"

_limitRangeTiers:
  # The platform tier is deliberately defaultRequest-only, and memory-only.
  #
  # A `default` (limit) would put a memory ceiling on platform components whose
  # footprint tracks cluster activity rather than their own load — storage
  # instance managers, the gateway data plane, the monitoring stack. An OOM kill
  # there is a worse failure than the unbounded growth a ceiling would prevent,
  # and it would land the moment the controller recreates the pod, which for
  # storage is plausibly mid-rebuild. Workload tiers below can afford a ceiling;
  # the layer everything else depends on cannot.
  #
  # `max` is omitted for the same reason: it rejects pods outright rather than
  # capping them, so a chart upgrade that raises a request would stop the
  # platform from scheduling at all.
  #
  # Only memory is defaulted because only memory drives eviction. A container
  # with no memory request makes its whole pod BestEffort — first evicted under
  # node pressure — which has already cost this cluster an outage. CPU is
  # compressible and its absence throttles rather than kills, so a CPU default
  # would reserve capacity on every node to prevent a failure mode that does not
  # exist here.
  #
  # This defaults only containers that set nothing themselves; a container with
  # its own request keeps it, even if lower. The tier is a floor for containers
  # whose chart renders no resources at all, not a correction for sized ones.
  platform:
    defaultRequestMemory: "64Mi"
  small:
    defaultCpu: "200m"
    defaultMemory: "256Mi"
    defaultRequestCpu: "50m"
    defaultRequestMemory: "64Mi"
    maxCpu: "2"
    maxMemory: "4Gi"
    maxStorage: "20Gi"
  standard:
    defaultCpu: "500m"
    defaultMemory: "512Mi"
    defaultRequestCpu: "50m"
    defaultRequestMemory: "64Mi"
    maxCpu: "4"
    maxMemory: "8Gi"
    maxStorage: "50Gi"
  large:
    defaultCpu: "1"
    defaultMemory: "1Gi"
    defaultRequestCpu: "100m"
    defaultRequestMemory: "128Mi"
    maxCpu: "16"
    maxMemory: "32Gi"
    maxStorage: "100Gi"
  ci:
    defaultCpu: "500m"
    defaultMemory: "512Mi"
    defaultRequestCpu: "100m"
    defaultRequestMemory: "128Mi"
    maxCpu: "8"
    maxMemory: "16Gi"
    maxStorage: "50Gi"
