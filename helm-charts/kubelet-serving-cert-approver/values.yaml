image:
  repository: ghcr.io/alex1989hu/kubelet-serving-cert-approver
  # Digest is the multi-arch manifest-list digest for the tag above, not a
  # per-arch child manifest — the tag stays for readability, the digest is
  # what actually gets resolved.
  tag: "0.11.0@sha256:f17017b53983fe93f5a07ef85b2e448b9e4be848d45f05c325c8f2c77e1171c4"
  pullPolicy: IfNotPresent

replicas: 1

revisionHistoryLimit: 3

namespace:
  name: kubelet-serving-cert-approver
  create: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

probes:
  # initialDelaySeconds raised from upstream defaults to prevent CrashLoop during
  # node-cold-start. This is the second of the two patches in the old BOOTSTRAP Phase 8.
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

metrics:
  service:
    enabled: true
    port: 9090
  serviceMonitor:
    enabled: true
    interval: 60s

priorityClassName: system-cluster-critical

nodeSelector: {}
tolerations:
  - effect: NoSchedule
    key: node.cloudprovider.kubernetes.io/uninitialized
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - preference:
          matchExpressions:
            - key: node-role.kubernetes.io/master
              operator: DoesNotExist
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
        weight: 100
