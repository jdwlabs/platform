image:
  repository: adminer
  # Digest is the multi-arch OCI index digest for the tag above, not a
  # per-arch child manifest — the tag stays for readability, the digest is
  # what actually gets resolved.
  tag: "6.0.1@sha256:f742dcf1b6ca95733b54c4e020488ce78f3e774d73543a6ded9b4eaea8974f3d"
  pullPolicy: IfNotPresent

replicas: 1

revisionHistoryLimit: 3

service:
  port: 80

# Memory-bounded: the live upstream deployment was BestEffort and observed
# spiking to ~600Mi, so the limit gives headroom above that while still
# protecting the node. The CPU limit is set generously high — an interactive
# admin UI should never hit 1 CPU, so the limit satisfies bounded-by-policy
# without adding throttle latency. The request is sized off steady-state
# (~34Mi observed) rather than the spike the limit covers, since the spike
# is occasional query load, not the baseline the scheduler should reserve.
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Adminer is plain PHP serving world-readable files, so it tolerates running
# as an arbitrary high UID (the OpenShift model). An explicit numeric UID/GID
# lets runAsNonRoot be verified by the kubelet (the image's own "adminer" user
# is non-numeric, which would otherwise CreateContainerConfigError).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

# Root FS is read-only; PHP only ever writes session files, which land on the
# emptyDir mounted at /tmp by the deployment template.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Extra environment variables for the adminer container
# (e.g. ADMINER_DEFAULT_SERVER to pre-fill the login form).
env: []

nodeSelector: {}
tolerations: []
affinity: {}
