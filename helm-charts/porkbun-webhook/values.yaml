# The GroupName here is used to identify your company or business unit that
# created this webhook.
# For example, this may be "acme.mycompany.com".
# This name will need to be referenced in each Issuer's `webhook` stanza to
# inform cert-manager of where to send ChallengePayload resources in order to
# solve the DNS01 challenge.
# This group name should be **unique**, hence using your own company's domain
# here is recommended.
groupName: jdwlabs.com

revisionHistoryLimit: 3

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  repository: ghcr.io/mdonoughe/porkbun-webhook
  tag: v0.1.5
  pullPolicy: IfNotPresent

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# The webhook serves the ACME DNS-01 solver API on 443, which is why root and
# NET_BIND_SERVICE both stay. A non-root uid would not help: an added capability
# only reaches a non-root process through ambient capabilities, which the
# container runtime does not grant, so the bind would fail instead. The port is
# not freely movable either -- the Service and the APIService that front this
# webhook both name it, and a solver that cannot answer a challenge stops
# certificate issuance for every domain in the cluster.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

# Defaulted rather than left empty: an unset block makes the pod BestEffort,
# which is invisible to the scheduler and evicted first under node memory
# pressure. The floor matches observed steady-state; the ceiling is memory
# only, because a CPU quota would throttle DNS-01 challenge bursts at renewal
# time for no benefit on an otherwise idle node.
resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

externalSecrets:
  - refreshInterval: 1m
    secretStoreName: vault
    secretStoreKind: ClusterSecretStore
    secretName: porkbun

envSecrets:
  - secretKey: secret-key
    key: porkbun
    property: secret-key
    secretName: porkbun
  - secretKey: api-key
    key: porkbun
    property: api-key
    secretName: porkbun
