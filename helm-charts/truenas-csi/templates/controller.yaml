apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-csi-controller
  namespace: {{ .Release.Namespace }}
  # Replace rather than server-side apply: the live Deployment was created
  # before the chart declared a strategy, so the API server's defaulted
  # rollingUpdate block has no field manager and an apply that only states
  # type: Recreate leaves it in place, which the API server then rejects as
  # Forbidden. A replace submits the whole spec, so no stale default survives.
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: {{ .Values.controller.replicas }}
  # Recreate, not RollingUpdate: with leader election off at a single replica
  # (see the sidecar args) nothing else stops an old and a new controller pod
  # from provisioning concurrently during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: truenas-csi-controller
  template:
    metadata:
      labels:
        app: truenas-csi-controller
    spec:
      serviceAccountName: truenas-csi-controller-sa
      # Hardening over upstream (which sets no securityContext anywhere): the
      # controller pod needs no host access, so every container runs with the
      # default seccomp profile, no privilege escalation, and all capabilities
      # dropped. The driver container keeps a writable root filesystem and the
      # image's own (root) user — both unverified against the upstream image
      # and deliberately not tightened during the PoC; the corresponding scan
      # findings are dismissed with this reasoning recorded.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: csi-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--node-id=$(NODE_ID)"
            - "--mode=controller"
            - "--v={{ .Values.logVerbosity }}"
          env:
            {{- include "truenas-csi.driverEnv" . | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- if .Values.controller.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9808
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 5
          {{- end }}

        - name: csi-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.sidecars.resources | nindent 12 }}
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            # No Topology feature gate: the driver reports no accessible
            # topology, so there is nothing for the provisioner to constrain
            # PVs by.
            - "--extra-create-metadata"
            {{- include "truenas-csi.leaderElectionArg" . | nindent 12 }}
            - "--default-fstype=ext4"
            - "--timeout=60s"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: csi-attacher
          image: {{ .Values.sidecars.attacher.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.sidecars.resources | nindent 12 }}
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            {{- include "truenas-csi.leaderElectionArg" . | nindent 12 }}
            - "--timeout=60s"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        {{- if .Values.sidecars.snapshotter.enabled }}
        - name: csi-snapshotter
          image: {{ .Values.sidecars.snapshotter.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.sidecars.resources | nindent 12 }}
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            {{- include "truenas-csi.leaderElectionArg" . | nindent 12 }}
            - "--timeout=60s"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        {{- end }}

        - name: csi-resizer
          image: {{ .Values.sidecars.resizer.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.sidecars.resources | nindent 12 }}
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            {{- include "truenas-csi.leaderElectionArg" . | nindent 12 }}
            - "--timeout=60s"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        {{- if .Values.controller.livenessProbe.enabled }}
        - name: liveness-probe
          image: {{ .Values.sidecars.livenessProbe.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.sidecars.resources | nindent 12 }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--health-port=9808"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        {{- end }}

      volumes:
        - name: socket-dir
          emptyDir: {}
