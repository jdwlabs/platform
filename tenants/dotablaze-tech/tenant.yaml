name: dotablaze-tech
displayName: "Dotablaze Tech"
githubOrg: dotablaze-tech
contacts:
  - dotablazegaming@gmail.com

deploymentRepo:
  url: https://github.com/dotablaze-tech/deployments.git
  revision: main

namespaces:
  - name: dotablaze-tech-non
    quotaTier: standard
    networkPolicy: default
    # enforce is deferred: this namespace's pods predate the policy engine and
    # carry no Cilium identity, so a restrictive set resolves against nothing
    # today and would instead bite whichever pod restarts first — an unrelated
    # deploy, eviction, drain or OOM kill — under an allow-set no observation
    # window ever covered, because audit mode is per-endpoint and these
    # endpoints did not exist. Set it once this namespace's pods are
    # Cilium-managed and the allow-set below has been checked against their
    # observed traffic.
    externalEgress: true
  - name: dotablaze-tech-prd
    quotaTier: standard
    networkPolicy: default
    externalEgress: true
  - name: dotablaze-tech-runners
    quotaTier: ci
    networkPolicy: ci
    enforce: true
    arc: true

project:
  elevated: false
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

observability:
  tenantId: dotablaze-tech
  grafana:
    folder: dotablaze-tech
    team: dotablaze-tech
    access: edit

services:
  # ARC is dormant: CI runs exclusively on GitHub-hosted runners. Kept
  # commented (values/postInstall intact, namespace still defined) for easy
  # re-enable — see platform OPERATIONS.md "Self-hosted CI runners (ARC)".
  # - name: arc-runner-set-dotablaze-tech
  #   chart: gha-runner-scale-set
  #   repo: ghcr.io/actions/actions-runner-controller-charts
  #   revision: 0.14.1
  #   namespace: dotablaze-tech-runners
  #   postInstall: true
  #   syncWave: 5

  - name: dotablaze-tech-schemas
    chart: ""
    repo: ""
    revision: ""
    namespace: database
    postInstall: false
    rawManifests: true
    syncWave: 5

  - name: dotablaze-tech-alerts
    chart: ""
    repo: ""
    revision: ""
    namespace: dotablaze-tech-non
    postInstall: false
    rawManifests: true
    syncWave: 2
