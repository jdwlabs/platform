name: dotablaze-tech
displayName: "Dotablaze Tech"
githubOrg: dotablaze-tech
contacts:
  - dotablazegaming@gmail.com

deploymentRepo:
  url: https://github.com/dotablaze-tech/deployments.git
  revision: main

namespaces:
  - name: dotablaze-tech-non
    quotaTier: standard
    networkPolicy: default
    enforce: true
    # Second attempt, 2026-08-21. First attempt crashlooped because
    # meowbot's postgres backend (platform-postgresql-cluster-non-3) was
    # unmanaged -- caught live via Hubble, fixed via a CNPG-safe
    # promote+recreate sequence; all 6 database-namespace postgres pods are
    # now Cilium-managed (see jdwlabs/tenant.yaml for the kubelet-probe fix
    # that was also needed). Outbound only to Discord's API/gateway (public
    # HTTPS, covered by external-egress) and cross-namespace Postgres on
    # 5432 (already allowed).
    externalEgress: true
  - name: dotablaze-tech-prd
    quotaTier: standard
    networkPolicy: default
    enforce: true
    # Second attempt, 2026-08-21. Same fix and verification as -non.
    externalEgress: true
  - name: dotablaze-tech-runners
    quotaTier: ci
    networkPolicy: ci
    enforce: true
    arc: true

project:
  elevated: false
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

observability:
  tenantId: dotablaze-tech
  grafana:
    folder: dotablaze-tech
    team: dotablaze-tech
    access: edit
    gitSyncFolder: dotablaze-tech-dashboards

services:
  # ARC is dormant: CI runs exclusively on GitHub-hosted runners. Kept
  # commented (values/postInstall intact, namespace still defined) for easy
  # re-enable — see platform OPERATIONS.md "Self-hosted CI runners (ARC)".
  # - name: arc-runner-set-dotablaze-tech
  #   chart: gha-runner-scale-set
  #   repo: ghcr.io/actions/actions-runner-controller-charts
  #   revision: 0.14.1
  #   namespace: dotablaze-tech-runners
  #   postInstall: true
  #   syncWave: 5

  - name: dotablaze-tech-schemas
    chart: ""
    repo: ""
    revision: ""
    namespace: database
    postInstall: false
    rawManifests: true
    syncWave: 5

  - name: dotablaze-tech-alerts
    chart: ""
    repo: ""
    revision: ""
    namespace: dotablaze-tech-non
    postInstall: false
    rawManifests: true
    syncWave: 2
