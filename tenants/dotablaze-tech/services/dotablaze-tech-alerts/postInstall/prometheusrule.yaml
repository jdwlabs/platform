apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dotablaze-tech-tenant-alerts
  namespace: dotablaze-tech-non
  labels:
    tenant: dotablaze-tech
spec:
  groups:
    - name: dotablaze-tech-tenant
      rules:
        - alert: DotablazeTechResourceQuotaNearLimit
          # Every dotablaze-tech namespace already renders a ResourceQuota via
          # tenant-envelope, so this is a real signal today rather than one
          # invented for the rule — no separate service needs to exist first.
          expr: |
            max by (namespace, resource) (
              kube_resourcequota{namespace=~"dotablaze-tech-.*", type="used"}
              / kube_resourcequota{namespace=~"dotablaze-tech-.*", type="hard"}
            ) > 0.85
          for: 10m
          labels:
            severity: warning
            tenant: dotablaze-tech
          annotations:
            summary: "dotablaze-tech namespace {{ $labels.namespace }} quota for {{ $labels.resource }} above 85%"
            description: "{{ $labels.resource }} usage is {{ $value | humanizePercentage }} of the ResourceQuota in {{ $labels.namespace }}."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"
