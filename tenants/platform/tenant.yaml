name: platform
displayName: "Platform Infrastructure"
githubOrg: jdwlabs
contacts:
  - jdwillmsen@gmail.com

deploymentRepo:
  url: ""
  revision: ""

namespaces:
  - name: argocd
    quotaTier: platform
    networkPolicy: platform
  - name: cert-manager
    quotaTier: platform
    networkPolicy: platform
  - name: longhorn-system
    quotaTier: platform
    networkPolicy: platform
  - name: vault
    quotaTier: platform
    networkPolicy: platform
  - name: vault-config-operator
    quotaTier: platform
    networkPolicy: platform
  - name: external-secrets
    quotaTier: platform
    networkPolicy: platform
  - name: monitoring
    quotaTier: platform
    networkPolicy: platform
  - name: headlamp
    quotaTier: platform
    networkPolicy: platform
  - name: cnpg-system
    quotaTier: platform
    networkPolicy: platform
  - name: arc-systems
    quotaTier: platform
    networkPolicy: platform
  - name: database
    quotaTier: platform
    networkPolicy: platform
  - name: metrics-server
    quotaTier: platform
    networkPolicy: platform
  - name: kube-system
    quotaTier: platform
    networkPolicy: platform
    # No LimitRange here: the unbounded containers left in this namespace
    # (kube-proxy, the flannel install-config init) come from Talos machine
    # config, not from anything this repo renders. Defaulting their requests
    # would change the admitted spec of components owned by the infrastructure
    # repo, and the cluster's static control-plane pods bypass admission
    # anyway, so the change would be both out-of-band and partial. The trade is
    # live: these are the only genuinely BestEffort pods left, and a request
    # carries no OOM risk — revisit alongside the machine config, not here.
    noLimitRange: true
  - name: nginx-gateway
    quotaTier: platform
    networkPolicy: platform
  - name: porkbun-webhook
    quotaTier: platform
    networkPolicy: platform
  - name: kubelet-serving-cert-approver
    quotaTier: platform
    networkPolicy: platform
  - name: democratic-csi
    quotaTier: platform
    networkPolicy: platform
  - name: truenas-csi
    quotaTier: platform
    networkPolicy: platform
  - name: ai-sre
    quotaTier: platform
    networkPolicy: platform
  - name: reloader
    quotaTier: platform
    networkPolicy: platform

project:
  elevated: true
  clusterResourceWhitelist: []
  extraSourceRepos:
    - 'https://argoproj.github.io/argo-helm'
    - 'https://charts.jetstack.io'
    - 'https://helm.cilium.io'
    - 'https://charts.longhorn.io'
    - 'https://charts.external-secrets.io'
    - 'https://helm.releases.hashicorp.com'
    - 'https://redhat-cop.github.io/vault-config-operator'
    - 'https://kubernetes-sigs.github.io/metrics-server/'
    - 'https://grafana.github.io/helm-charts'
    - 'https://grafana-community.github.io/helm-charts'
    - 'https://prometheus-community.github.io/helm-charts'
    - 'https://kubernetes-sigs.github.io/headlamp/'
    - 'https://cloudnative-pg.github.io/charts'
    - 'ghcr.io/actions/actions-runner-controller-charts'
    - 'ghcr.io/nginx/charts'
    - 'https://democratic-csi.github.io/charts/'
    - 'docker.litellm.ai/berriai'
    - 'https://stakater.github.io/stakater-charts'

services:
  # Wave 0: Management plane self-hosting
  - name: argo-cd
    chart: argo-cd
    repo: https://argoproj.github.io/argo-helm
    revision: 10.4.1
    namespace: argocd
    postInstall: true
    syncWave: 0

  # Wave 1: Core infrastructure (Networking, TLS, Storage)
  # Policy engine only — Flannel keeps the CNI slot and the datapath. Audit
  # mode is off, but that does not mean workloads are isolated: pods predating
  # this DaemonSet have no CiliumEndpoint, so no identity, so no policy is
  # evaluated against them — which today is every pod in every namespace that
  # enforces. See docs/TENANT-MODEL.md for the measured coverage; enforce: true
  # on a namespace is not on its own evidence that its pods are isolated.
  #
  # Reverted once on 2026-08-13 (root cause not yet isolated at the time) and
  # re-enabled the same day once it was: ADR 0019 identifies and fixes the
  # actual cause (endpointRoutes conflicting with this cluster's bridge-mode
  # Flannel), on top of two earlier, narrower fixes already in this values
  # file and its postInstall ConfigMap (CNI plugin chaining-mode; the TLS
  # secrets namespace). All three are addressed before this re-enable.
  - name: cilium
    chart: cilium
    repo: https://helm.cilium.io
    revision: 1.20.1
    namespace: kube-system
    postInstall: true
    syncWave: 1

  - name: cert-manager
    chart: cert-manager
    repo: https://charts.jetstack.io
    revision: v1.21.1
    namespace: cert-manager
    postInstall: true
    syncWave: 1

  - name: porkbun-webhook
    chart: ""
    chartPath: helm-charts/porkbun-webhook
    repo: https://github.com/jdwlabs/platform.git
    revision: main
    namespace: porkbun-webhook
    postInstall: false
    syncWave: 1

  - name: kubelet-serving-cert-approver
    chart: ""
    chartPath: helm-charts/kubelet-serving-cert-approver
    repo: https://github.com/jdwlabs/platform.git
    revision: main
    namespace: kubelet-serving-cert-approver
    postInstall: false
    syncWave: 1

  - name: nginx-gateway-fabric
    chart: nginx-gateway-fabric
    repo: ghcr.io/nginx/charts
    revision: 2.6.7
    namespace: nginx-gateway
    postInstall: true
    syncWave: 1

  - name: longhorn
    chart: longhorn
    repo: https://charts.longhorn.io
    revision: 1.12.1
    namespace: longhorn-system
    postInstall: true
    syncWave: 1

  # Node-local storage for throwaway/ephemeral workloads (CI runner _work),
  # decoupling them from Longhorn's iSCSI data plane.
  - name: local-path-provisioner
    chart: ""
    repo: ""
    revision: ""
    namespace: kube-system
    rawManifests: true
    postInstall: false
    syncWave: 1

  - name: democratic-csi
    chart: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    revision: 0.15.1
    namespace: democratic-csi
    postInstall: true
    syncWave: 1

  # Second release of the same chart: csiDriver.name is per-release, so the
  # iSCSI transport cannot share the NFS release.
  - name: democratic-csi-iscsi
    chart: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    revision: 0.15.1
    namespace: democratic-csi
    postInstall: true
    syncWave: 1

  # Official iXsystems driver (WebSocket API), installed in parallel with the
  # two democratic-csi releases above — disjoint namespace, credential and
  # dataset parents, so the two CSI control planes never touch each other's
  # NAS objects. Serves only the -poc StorageClasses until the validation in
  # docs/truenas-csi-migration-poc.md passes; the democratic-csi releases stay
  # authoritative for truenas-nfs/truenas-iscsi throughout. See
  # docs/adr/0029-truenas-csi-evaluated-as-democratic-csi-replacement.md.
  - name: truenas-csi
    chart: ""
    chartPath: helm-charts/truenas-csi
    repo: https://github.com/jdwlabs/platform.git
    revision: main
    namespace: truenas-csi
    postInstall: true
    syncWave: 1

  # Wave 2: Platform services
  - name: external-secrets
    chart: external-secrets
    repo: https://charts.external-secrets.io
    revision: 2.10.0
    namespace: external-secrets
    postInstall: true
    syncWave: 2

  - name: vault
    chart: vault
    repo: https://helm.releases.hashicorp.com
    revision: 0.34.1
    namespace: vault
    postInstall: true
    syncWave: 2

  - name: vault-config-operator
    chart: vault-config-operator
    repo: https://redhat-cop.github.io/vault-config-operator
    revision: v1.0.2
    namespace: vault-config-operator
    postInstall: false
    syncWave: 2

  - name: metrics-server
    chart: metrics-server
    repo: https://kubernetes-sigs.github.io/metrics-server/
    revision: 3.14.0
    namespace: metrics-server
    postInstall: false
    syncWave: 2

  - name: monitoring
    chart: k8s-monitoring
    repo: https://grafana.github.io/helm-charts
    revision: 4.5.0
    namespace: monitoring
    postInstall: false
    syncWave: 2

  - name: grafana
    chart: grafana
    repo: https://grafana-community.github.io/helm-charts
    revision: 12.11.2
    namespace: monitoring
    postInstall: true
    syncWave: 2

  - name: loki
    chart: loki
    repo: https://grafana.github.io/helm-charts
    revision: 7.3.0
    namespace: monitoring
    # The directory exists again, now holding the ruler's rule ConfigMaps. It
    # cannot live with the other alert rules under kube-prometheus-stack: those
    # are PrometheusRule CRs read by the Prometheus Operator, while these are
    # LogQL and only the Loki rules sidecar in this release ever reads them.
    # (Its previous occupant, the Loki dashboard, is owned by Git Sync now.)
    postInstall: true
    syncWave: 2

  - name: kube-prometheus-stack
    chart: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    revision: "88.6.1"
    namespace: monitoring
    postInstall: true
    syncWave: 2

  - name: blackbox-exporter
    chart: prometheus-blackbox-exporter
    repo: https://prometheus-community.github.io/helm-charts
    revision: "11.17.2"
    namespace: monitoring
    postInstall: false
    syncWave: 2

  # TrueNAS has no Prometheus endpoint of its own — Graphite push is the only
  # metrics export its API offers, so the receiving half has to live here.
  # rawManifests because no upstream chart models a push-ingest target that is
  # scraped from one port and written to on another.
  # Keeps the apex A record pointing at the current WAN address. The zone is a
  # wildcard CNAME onto the apex, so every published name follows this record.
  - name: porkbun-ddns
    chart: ""
    repo: ""
    revision: ""
    namespace: porkbun-webhook
    postInstall: false
    rawManifests: true
    syncWave: 2

  - name: truenas-graphite-exporter
    chart: ""
    repo: ""
    revision: ""
    namespace: monitoring
    rawManifests: true
    postInstall: false
    syncWave: 2

  # Pool state, dataset capacity and SMART, none of which the Graphite push
  # above can carry (docs/adr/0025). rawManifests for the same reason as
  # truenas-graphite-exporter: no upstream chart models a single-tenant
  # poller against an in-house image.
  - name: truenas-prometheus-exporter
    chart: ""
    repo: ""
    revision: ""
    namespace: monitoring
    rawManifests: true
    postInstall: false
    syncWave: 2

  # Distributed tracing backend. Single-binary Tempo chart now lives in the
  # grafana-community repo (grafana/helm-charts copy is deprecated).
  - name: tempo
    chart: tempo
    repo: https://grafana-community.github.io/helm-charts
    revision: 2.3.0
    namespace: monitoring
    postInstall: true
    syncWave: 2

  - name: headlamp
    chart: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    revision: 0.45.0
    namespace: headlamp
    postInstall: true
    syncWave: 2

  # Watches Secrets/ConfigMaps cluster-wide and rolls the Deployments that
  # consume them on change (see docs/adr/0016). The RBAC grant this needs
  # (cluster-wide Secret read, cluster-wide workload patch) is why this entry
  # is not synced without a deliberate go-ahead: ArgoCD's root App tracks this
  # tenant.yaml, so merging alone would apply it.
  - name: reloader
    chart: reloader
    repo: https://stakater.github.io/stakater-charts
    revision: 2.2.16
    namespace: reloader
    postInstall: false
    syncWave: 2

  # Wave 3: Operators
  - name: cnpg-operator
    chart: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    revision: 0.29.0
    namespace: cnpg-system
    postInstall: true
    syncWave: 3

  # ARC is dormant: CI runs exclusively on GitHub-hosted runners. The controller
  # is kept here (commented, with its values/postInstall intact) so self-hosted
  # runners can be re-enabled by uncommenting — see OPERATIONS.md "Self-hosted
  # CI runners (ARC) — dormant". The arc-systems namespace stays defined above.
  # - name: arc-systems
  #   chart: gha-runner-scale-set-controller
  #   repo: ghcr.io/actions/actions-runner-controller-charts
  #   revision: 0.14.1
  #   namespace: arc-systems
  #   postInstall: true
  #   syncWave: 3

  # Wave 4: Shared database infrastructure
  - name: postgresql-cluster-non
    chart: cluster
    repo: https://cloudnative-pg.github.io/charts
    revision: 0.8.1
    namespace: database
    postInstall: false
    syncWave: 4

  - name: postgresql-cluster-prd
    chart: cluster
    repo: https://cloudnative-pg.github.io/charts
    revision: 0.8.1
    namespace: database
    postInstall: false
    syncWave: 4

  - name: db-ui
    chart: ""
    chartPath: helm-charts/db-ui
    repo: https://github.com/jdwlabs/platform.git
    revision: main
    namespace: database
    postInstall: true
    syncWave: 4

  - name: postgres-backup
    chart: ""
    repo: ""
    revision: ""
    namespace: database
    rawManifests: true
    postInstall: false
    syncWave: 5

  # Wave 4: AI-SRE gateway database and cache
  - name: litellm-db
    chart: cluster
    repo: https://cloudnative-pg.github.io/charts
    revision: 0.8.1
    namespace: ai-sre
    postInstall: false
    syncWave: 4

  - name: litellm-redis
    chart: ""
    repo: ""
    revision: ""
    namespace: ai-sre
    rawManifests: true
    postInstall: false
    syncWave: 4

  # Wave 5: AI-SRE LiteLLM gateway (depends on litellm-db wave 4).
  # Vendored chart: upstream hardcodes a purged bitnami image in the db-ready
  # init container — see helm-charts/litellm-helm/README.md.
  - name: litellm
    chart: ""
    chartPath: helm-charts/litellm-helm
    repo: https://github.com/jdwlabs/platform.git
    revision: main
    namespace: ai-sre
    postInstall: true
    syncWave: 5

  # Wave 5: HolmesGPT agent (talks to litellm gateway, same wave; retries until ready)
  - name: holmes
    chart: holmes
    repo: https://robusta-charts.storage.googleapis.com
    revision: 0.40.0
    namespace: ai-sre
    postInstall: true
    syncWave: 5

  # Wave 6: AI-SRE alert relay (webhook target; calls holmes wave 5, litellm wave 5)
  - name: ai-sre-relay
    chart: ""
    repo: ""
    revision: ""
    namespace: ai-sre
    rawManifests: true
    postInstall: false
    syncWave: 6
