global:
  # User-deployed components (longhorn-manager, longhorn-ui, driver-deployer).
  # Control-plane nodes have no toleration for their own NoSchedule taint set
  # at pod-creation time, so a taint-timing race during a CP rejoin/reboot can
  # still leave a stray pod there; nodeSelector prevents it from ever landing.
  nodeSelector:
    workload.jdwlabs.io/worker: "true"

networkPolicies:
  enabled: false

defaultSettings:
  # The chart key is priorityClass, not priorityClassName — the *Name variants
  # previously here were silently ignored and longhorn ran the chart default
  # longhorn-critical. This setting also covers system-managed components
  # (instance-manager, CSI, engine-image) and is the default for user-deployed
  # components that don't set their own priorityClass.
  priorityClass: platform-critical
  defaultReplicaCount: 3
  replicaSoftAntiAffinity: true
  replicaAutoBalance: "best-effort"
  storageOverProvisioningPercentage: 150
  storageMinimalAvailablePercentage: 20
  upgradeChecker: false
  autoCleanupSystemGeneratedSnapshot: true
  orphanResourceAutoDeletion: "replica-data"
  dataLocality: "best-effort"
  deletingConfirmationFlag: true
  # Automatic engine upgrade stays disabled: this cluster has a documented
  # history of instance-manager cascade failures, and instance-manager
  # memory footprint scales with attached volumes and rebuild activity.
  # Engine upgrades are done manually, in a batched window, per the
  # engine-upgrade runbook — an unattended cluster-wide upgrade is the
  # opposite of that.
  concurrentAutomaticEngineUpgradePerNodeLimit: 0
  # System-managed components (engine-image, instance-manager, longhorn-csi-plugin).
  systemManagedComponentsNodeSelector: "workload.jdwlabs.io/worker:true"
  # The CSI components all ran BestEffort — this Longhorn setting (a JSON
  # string) is the only knob the chart exposes for them. Requests are ~1.5-2x
  # observed per pod (attacher ~26Mi, provisioner ~32Mi, resizer ~27Mi,
  # snapshotter ~34Mi, csi-plugin pod ~52Mi across its three containers);
  # limits leave >=2x headroom so volume churn doesn't OOM the CSI path.
  systemManagedCSIComponentsResourceLimits: >-
    {"csi-attacher":{"requests":{"memory":"48Mi"},"limits":{"memory":"128Mi"}},
    "csi-provisioner":{"requests":{"memory":"64Mi"},"limits":{"memory":"128Mi"}},
    "csi-resizer":{"requests":{"memory":"48Mi"},"limits":{"memory":"128Mi"}},
    "csi-snapshotter":{"requests":{"memory":"64Mi"},"limits":{"memory":"128Mi"}},
    "longhorn-csi-plugin":{"requests":{"memory":"64Mi"},"limits":{"memory":"256Mi"}},
    "node-driver-registrar":{"requests":{"memory":"16Mi"},"limits":{"memory":"64Mi"}},
    "longhorn-liveness-probe":{"requests":{"memory":"16Mi"},"limits":{"memory":"64Mi"}}}

longhornManager:
  priorityClass: platform-critical
  resources:
    requests:
      cpu: "100m"
      # ~165Mi steady-state per manager; 512Mi leaves churn headroom without
      # reserving 1Gi/node the scheduler can never hand out. OOM protection
      # comes from the limit below, not the request.
      memory: "512Mi"
    limits:
      cpu: "1000m"
      # Raised from 1Gi to stop OOM-kills under volume churn. Do not lower.
      memory: "2Gi"

# The chart exposes no resources values for longhorn-driver-deployer,
# longhorn-ui, the engine-image DaemonSet, or instance-manager memory
# (guaranteedInstanceManagerCPU is CPU-only) — earlier longhornDriver/
# longhornUI resources blocks here were silently ignored by the chart and
# have been removed rather than left looking effective.
#
# Re-verified by rendering the chart end-to-end and reading every template
# (not just this values.schema): the gap is wider than resources alone.
# pre-pull-share-manager-image (the second container in the longhorn-manager
# DaemonSet pod) has no resources hook either. snapshot-cleanup,
# snapshot-delete, and filesystem-trim pods, like instance-manager and the
# engine-image DaemonSet above, are created imperatively by longhorn-manager
# at runtime for RecurringJob CRs — they never appear in this chart's
# rendered output, so there is no YAML here to attach limits to.
#
# No template in this chart sets a startupProbe on any container, and
# there's no values/settings hook to add one — rendering with these values
# start to finish turns up exactly one probe in the whole manifest set
# (longhorn-manager's readinessProbe) and exactly one container resources
# block (longhorn-manager's). That startupProbe gate applies to boot-
# sensitive workloads where a slow start trips a livenessProbe restart loop
# (the JVM usersrole outage this rule exists for); it doesn't apply here —
# longhorn-manager's requests trim (above) and the CSI components' limits
# (below) are request/limit-only changes with no livenessProbe in the path
# to restart-loop, so they were tightened directly, per this repo's
# memory-efficiency hit-list classifying Longhorn as a low-risk trim. The
# remaining components genuinely have no resources hook this chart exposes
# at all (see the Longhorn chart-gap allowlist in
# docs/memory-efficiency/02-qos-offenders.md, tracked upstream at
# longhorn/longhorn#13202 and #6351) — nothing further to tighten here
# short of forking the chart, which isn't worth it for the waste involved.
longhornDriver:
  priorityClass: platform-critical

longhornUI:
  replicas: 1

ingress:
  enabled: false # Managed via Gateway API in postInstall

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3
  reclaimPolicy: Retain
