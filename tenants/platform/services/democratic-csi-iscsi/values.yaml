csiDriver:
  name: "org.democratic-csi.iscsi"

# Second democratic-csi release alongside the NFS one. csiDriver.name is
# per-release, so a single release cannot serve both transports. ArgoCD names
# the Helm release after the Application (platform-democratic-csi-iscsi), so
# resources do not collide with the NFS release in this same namespace.
#
# Block rather than file: this class exists for workloads whose data is a
# database expecting POSIX locking and mmap semantics — LevelDB, SQLite — which
# are not reliable over NFS. Bulk and RWX workloads belong on truenas-nfs.
driver:
  # Set only so the chart selects iSCSI host mounts (not NFS); the actual
  # driver config comes from existingConfigSecret.
  config:
    driver: freenas-api-iscsi
  existingConfigSecret: democratic-csi-iscsi-driver-config

storageClasses: []   # StorageClass managed declaratively in postInstall

# Mirrors the sizing already established for the NFS release: both pods ran
# BestEffort there and were first to evict under node memory pressure. The
# iSCSI node container does attach/mount work rather than NFS mounts, but the
# footprint is comparable, so the same requests apply until observed otherwise.
csiProxy:
  resources:
    requests:
      memory: 16Mi
    limits:
      memory: 64Mi

controller:
  driver:
    # Same floating-`latest` problem, same digest, same reasoning as the NFS
    # release -- see the long note on controller.driver.image in
    # tenants/platform/services/democratic-csi/values.yaml. The two releases
    # were verified to be running this identical digest before it was pinned,
    # and they are deliberately kept on one version: a driver skew between the
    # NFS and iSCSI releases is a debugging trap, not a safety margin.
    image:
      tag: latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced
    resources:
      requests:
        memory: 96Mi
      limits:
        memory: 256Mi
  externalAttacher:
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
  externalProvisioner:
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
  externalResizer:
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
  externalSnapshotter:
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi

node:
  # Talos runs kubelet in its own mount namespace, so the chart's default
  # hostPath of /etc/iscsi does not resolve even though that directory exists
  # on the host — the node pods sit in ContainerCreating with "hostPath type
  # check failed: /etc/iscsi is not a directory". hostPID plus the nsenter
  # strategy below is the supported Talos path: the driver enters the host
  # namespace and runs the initiator the iscsi-tools extension provides,
  # rather than shipping its own.
  hostPID: true
  driver:
    # Under the nsenter strategy the driver runs the host's iscsiadm, so this
    # volume is vestigial — it only has to resolve, on a writable path, at a
    # container mountPath the chart does not already use. /etc/iscsi does not
    # resolve in kubelet's mount namespace; /usr/local/etc is part of the
    # immutable image, so DirectoryOrCreate there fails read-only; and
    # /var/lib/iscsi collides with the chart's own iscsi-info mount, which
    # leaves ArgoCD unable to diff the DaemonSet at all.
    # Same image and reasoning as controller.driver.image above; the chart
    # defaults this key to `latest` independently of the controller's.
    image:
      tag: latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced
    iscsiDirHostPath: /var/etc/iscsi
    iscsiDirHostPathType: DirectoryOrCreate
    extraEnv:
      - name: ISCSIADM_HOST_STRATEGY
        value: nsenter
      - name: ISCSIADM_HOST_PATH
        value: /usr/local/sbin/iscsiadm
    resources:
      requests:
        memory: 96Mi
      limits:
        memory: 256Mi
  driverRegistrar:
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 64Mi
  cleanup:
    resources:
      requests:
        memory: 16Mi
      limits:
        memory: 32Mi
  # Same reasoning as the NFS release: the node DaemonSet has no business on
  # control-plane nodes, and explicit anti-affinity survives a taint-timing
  # race during a CP rejoin in a way that relying on the taint alone does not.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  # Storage node plugin still has to run its unmount/cleanup path on a node
  # the control plane has marked unhealthy (node.kubernetes.io/unreachable,
  # node.cilium.io/agent-not-ready, etc.) -- without this, any NoSchedule
  # taint the DaemonSet controller doesn't auto-tolerate makes
  # kube-state-metrics report the existing pod as misscheduled. Tolerate
  # every taint here, same posture as the truenas-csi node DaemonSet
  # (helm-charts/truenas-csi/templates/node.yaml), and keep the
  # nodeAffinity above -- not tolerations -- as the only thing keeping this
  # off control-plane nodes.
  tolerations:
    - operator: Exists
