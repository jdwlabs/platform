# The rendered config below talks to TrueNAS over the REST API, which TrueNAS
# removes in 26. That is not an oversight and not a config-only fix: no build
# of democratic-csi speaks the replacement WebSocket API, so there is nothing
# to cut over to and the NAS is gated at 25.10.x instead. See
# docs/adr/0024-truenas-rest-removal-blocks-democratic-csi.md before changing
# httpConnection or the driver name here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: democratic-csi-iscsi-driver-config
  namespace: democratic-csi
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: democratic-csi-iscsi-driver-config
    template:
      data:
        driver-config-file.yaml: |
          driver: freenas-api-iscsi
          httpConnection:
            # HTTPS, not HTTP. TrueNAS auto-revokes an API key the moment it is
            # presented over plain HTTP — "Attempt to use over an insecure
            # transport" — which takes the CSI control plane down for every
            # class at once: no provisioning, no deletion, no expansion.
            # allowInsecure skips verification of the self-signed iXsystems
            # certificate the appliance ships; the transport is still encrypted,
            # which is what the appliance is actually checking for.
            protocol: https
            host: 192.168.1.205
            port: 443
            allowInsecure: true
            apiKey: "{{ .api_key }}"
          zfs:
            datasetParentName: storage/k8s/iscsi/vols
            detachedSnapshotsDatasetParentName: storage/k8s/iscsi/snaps
            zvolEnableReservation: false
            # 16K balances ZFS metadata overhead against read amplification for
            # the small random writes a LevelDB-backed workload produces.
            zvolBlocksize: 16K
          iscsi:
            targetPortal: "192.168.1.205:3260"
            interface: ""
            # Target names are prefixed/suffixed so volumes provisioned by this
            # cluster are identifiable on the TrueNAS side.
            namePrefix: csi-
            nameSuffix: "-cluster"
            targetGroups:
              # Numeric IDs of the portal and initiator group configured on
              # TrueNAS. Provisioning fails until both exist.
              - targetGroupPortalGroup: 1
                targetGroupInitiatorGroup: 1
                targetGroupAuthType: None
            extentInsecureTpc: true
            extentXenCompat: false
            extentDisablePhysicalBlocksize: true
            extentBlocksize: 512
            extentRpm: "SSD"
            extentAvailThreshold: 0
          node:
            mount:
              # Run fsck before mounting a staged ext4 device. Off by default in
              # this driver, and the gap that turns a transient session drop into
              # a manual recovery: when the initiator loses the target mid-write,
              # ext4 aborts the journal and latches the mount read-only, and that
              # state survives the session coming back. Nothing else in the attach
              # path replays the journal — the Go mount helper that does this for
              # in-tree volumes is not on this driver's path at all.
              #
              # The check is forced and preening (fsck -f -p), so it repairs only
              # what is unambiguous and refuses anything needing a decision. A
              # journal replay exits non-zero for "errors corrected", which fails
              # that NodeStageVolume; the retry then finds a clean filesystem and
              # mounts it, so recovery costs one backoff rather than a human. A
              # genuinely damaged filesystem keeps failing to stage, with the
              # reason in the pod's events, instead of mounting and going
              # read-only again under load.
              #
              # Cost is a full check on every attach, which scales with volume
              # size rather than usage. The mode to watch for is not slower
              # mounts but a check that outruns kubelet's NodeStageVolume
              # timeout: kubelet abandons the call, the volume fails to stage,
              # and the staging-failure alert fires on a filesystem that was
              # never damaged — the repair itself reported as the fault.
              # Revisit sizing before this class grows volumes large enough for
              # a preening pass to approach that timeout.
              checkFilesystem:
                ext4:
                  enabled: true
  data:
    - secretKey: api_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: truenas-csi
        property: api_key
