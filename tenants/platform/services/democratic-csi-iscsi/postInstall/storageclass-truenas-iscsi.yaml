apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-iscsi
  annotations:
    # Block-backed tier on the TrueNAS RAIDZ2 pool: a ZFS zvol per volume,
    # exported over iSCSI, formatted and mounted by the consuming node.
    #
    # Exists because the node's own kernel owns the filesystem here, so POSIX
    # locking, mmap and fsync behave as they do on a local disk. Databases —
    # LevelDB, SQLite — are unsafe on the NFS class for exactly that reason.
    # Bulk and RWX workloads still belong on truenas-nfs; this class is
    # single-writer by construction.
    #
    # Not the default: Longhorn stays the default tier, and is the only class
    # that survives the NAS being unavailable.
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: org.democratic-csi.iscsi
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  fsType: ext4
  detachedVolumesFromSnapshots: "false"
