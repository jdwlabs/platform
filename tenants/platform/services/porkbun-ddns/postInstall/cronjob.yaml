apiVersion: batch/v1
kind: CronJob
metadata:
  name: porkbun-ddns
  namespace: porkbun-webhook
spec:
  # Every 15 minutes. The WAN address changes rarely but without warning, and
  # the cost of a check is one API call; the cost of missing one is that every
  # externally published service is unreachable until a human notices.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # failedJobsHistoryLimit only prunes an old failed Job when a *new*
      # failure pushes the count over the limit, so one failure followed by
      # nothing but successes (the common case here) lingers forever and
      # keeps kube_job_failed pinned at 1. TTL-clean any finished Job after a
      # day regardless of subsequent successes -- well beyond Alertmanager's
      # 4h repeat_interval, so a still-firing alert is never retracted before
      # it has been notified.
      ttlSecondsAfterFinished: 86400
      # Resolver blips here outlast a single pod. Observed over two weeks:
      # 8 of ~1140 runs failed, every one with "Could not resolve host"
      # on all four in-pod curl attempts (~35s), on two different nodes,
      # while both CoreDNS pods stayed up with zero SERVFAILs and zero
      # forward health-check failures -- and the next scheduled run always
      # succeeded. So a fresh pod (new sandbox, new endpoint) is the retry
      # that actually helps, and each pod attempt below is already ~65s of
      # curl retries. Two extra pods keep the whole Job well inside one
      # schedule interval; an outage that outlasts all three still fails
      # the Job and fires KubeJobFailed, which is the case worth a page.
      backoffLimit: 2
      # Pod attempts plus the job controller's backoff (10s, 20s) must never
      # spill into the next 15-minute slot, where concurrencyPolicy: Forbid
      # would skip it. Everything finishes far short of this; it is a ceiling.
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ddns
              image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  memory: 32Mi
                  cpu: 10m
                limits:
                  memory: 128Mi
                  cpu: 200m
              env:
                - name: DOMAIN
                  value: jdwlabs.com
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: porkbun-ddns
                      key: api-key
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: porkbun-ddns
                      key: secret-key
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # -4 on every call is load-bearing, not defensive. This network
                  # has working IPv6, so an unforced request egresses over v6 and
                  # Porkbun's ping then reports the v6 address — which, written
                  # into an A record, breaks DNS for the whole zone. Observed:
                  # ping returned 2600:1700:3b40:cd0::41 while the A record held
                  # 104.53.12.62.
                  # --retry-all-errors is load-bearing: plain --retry only
                  # covers HTTP-transient response codes, not a resolver
                  # failure, and "Could not resolve host" (curl exit 6) is
                  # exactly the failure mode the intermittent blips
                  # produce. Six attempts with a fixed 5s gap (~65s with
                  # musl's own resolver timeouts) absorb a blip inside one
                  # pod run; the pod-level retries above cover the ones
                  # that outlast it.
                  CURL="curl -4 -sS --max-time 20 --retry 5 --retry-delay 5 --retry-all-errors"
                  API="https://api.porkbun.com/api/json/v3"
                  AUTH="{\"apikey\":\"$API_KEY\",\"secretapikey\":\"$SECRET_KEY\"}"

                  # Porkbun's ping reports the address it sees the request coming
                  # from, so the WAN address and the DNS provider agree by
                  # construction. A third-party IP service would be a second
                  # opinion that can disagree.
                  PING=$($CURL -X POST "$API/ping" -d "$AUTH")
                  echo "$PING" | grep -q '"status":"SUCCESS"' || {
                    echo "FATAL: porkbun ping failed: $PING" >&2; exit 1; }
                  WAN=$(echo "$PING" | sed -n 's/.*"yourIp":"\([^"]*\)".*/\1/p')
                  # Refuse anything that is not dotted-quad. An A record holding
                  # an IPv6 address takes the zone down, so a bad parse must stop
                  # here rather than be written.
                  case "$WAN" in
                    *:*) echo "FATAL: ping returned an IPv6 address ($WAN); need -4" >&2; exit 1 ;;
                    *.*.*.*) ;;
                    *) echo "FATAL: could not parse an IPv4 address from: $PING" >&2; exit 1 ;;
                  esac

                  CUR=$($CURL -X POST "$API/dns/retrieveByNameType/$DOMAIN/A/" -d "$AUTH")
                  echo "$CUR" | grep -q '"status":"SUCCESS"' || {
                    echo "FATAL: retrieving A record failed: $CUR" >&2; exit 1; }
                  HAVE=$(echo "$CUR" | sed -n 's/.*"content":"\([^"]*\)".*/\1/p')

                  if [ "$WAN" = "$HAVE" ]; then
                    echo "$DOMAIN A record already $WAN, nothing to do"
                    exit 0
                  fi

                  echo "WAN address changed: $HAVE -> $WAN, updating $DOMAIN"
                  RES=$($CURL -X POST "$API/dns/editByNameType/$DOMAIN/A/" \
                    -d "{\"apikey\":\"$API_KEY\",\"secretapikey\":\"$SECRET_KEY\",\"content\":\"$WAN\",\"ttl\":\"600\"}")
                  echo "$RES" | grep -q '"status":"SUCCESS"' || {
                    echo "FATAL: updating A record failed: $RES" >&2; exit 1; }
                  echo "updated $DOMAIN A record to $WAN"
