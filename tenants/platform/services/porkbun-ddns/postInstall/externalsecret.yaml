apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: porkbun-ddns
  namespace: porkbun-webhook
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: porkbun-ddns
  data:
    # Same credential the cert-manager webhook uses for DNS-01. Reused rather
    # than issued separately: both are Porkbun DNS writes for the same zone, so
    # a second key would double the rotation burden without narrowing anything.
    - secretKey: api-key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: porkbun
        property: api-key
    - secretKey: secret-key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: porkbun
        property: secret-key
