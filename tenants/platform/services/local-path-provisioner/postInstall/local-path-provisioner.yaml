---
# local-path-provisioner (rancher/local-path-provisioner v0.0.31)
# Node-local dynamic storage for throwaway/ephemeral workloads (CI runner
# _work). Talos note: the data path is /var/local-path-provisioner because
# Talos root is immutable and only /var is writable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-path-provisioner-leader
  namespace: kube-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-path-provisioner-leader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-path-provisioner-leader
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  replicas: 1
  # GitOps rollback is a git revert + ArgoCD resync, not `kubectl rollout
  # undo`; retaining old ReplicaSets buys nothing here.
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: local-path-provisioner-service-account
      # The provisioner never touches the node filesystem itself -- it schedules
      # a helper pod per volume to do that -- so it needs neither root nor a
      # host-mapped account. The image declares no user, so the uid has to be
      # numeric for runAsNonRoot to be enforceable at admission.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: local-path-provisioner
          image: rancher/local-path-provisioner:v0.0.31
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/var/local-path-provisioner"]
        }
      ]
    }
  # 0777 is load-bearing, not sloppiness: the volume is a hostPath, and kubelet
  # does not apply a pod's fsGroup to hostPath volumes, so there is no group
  # ownership to narrow to and a non-root runner can only write into a
  # world-writable directory. 0770 plus a matching fsGroup was considered and
  # rejected for that reason — it breaks CI writes without closing the hole.
  #
  # Accepted exposure: every CI checkout under the node path is world-readable
  # on the node filesystem. Tenant runner namespaces run PSA restricted with
  # enforce: true and cannot mount hostPath, so reach is bounded to
  # platform-tier namespaces, where a workload could read any tenant's
  # checked-out source. Narrowing it needs a different mechanism (privileged
  # per-volume chown, or moving _work off hostPath), not a mode change here.
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  # Reclaim runs this in a helper pod pinned to the volume's node. The pod
  # tolerates everything, so a cordoned node still reclaims, but a NotReady or
  # removed node strands the PV and its on-disk data indefinitely — see the
  # OPERATIONS runbook entry on orphaned local-path PVs after node loss.
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: helper-pod
          image: busybox
          imagePullPolicy: IfNotPresent
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
