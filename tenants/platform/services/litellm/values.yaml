# Provider-agnostic LLM gateway. Backend swap = edit model_list, no client change.

# ArgoCD holds prior manifests in git history; no need for k8s to keep old
# ReplicaSets around too.
revisionHistoryLimit: 0

# Use the CNPG-managed litellm-db cluster instead of the chart's bundled Postgres.
# CNPG generates secret platform-litellm-db-cluster-app with keys username/password/host/uri.
db:
  deployStandalone: false
  useExisting: true
  endpoint: platform-litellm-db-cluster-rw.ai-sre.svc.cluster.local
  # 'app', not 'litellm': the cnpg cluster chart bootstraps its default
  # database/owner (app/app), matching the prd/non postgres clusters.
  database: app
  secret:
    name: platform-litellm-db-cluster-app
    usernameKey: username
    passwordKey: password
  # Chart default docker.io/bitnami/postgresql:<pinned> no longer resolves --
  # Bitnami purged versioned tags from the bitnami org; the same tag lives on
  # in bitnamilegacy. Only used by the db-ready wait init container.
  dbReadyImage: docker.io/bitnamilegacy/postgresql
  dbReadyTag: "16.1.0-debian-11-r20"
  # Polls the database until it answers, then exits. Upstream renders no
  # resources for it at all, which left the pod BestEffort no matter how the
  # gateway container beside it was sized.
  dbReadyResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

# Built-in Redis disabled; we use our own ephemeral Redis (litellm-redis service).
redis:
  enabled: false

# Injects provider API keys and LITELLM_MASTER_KEY as env vars from Vault-backed ESO secret.
environmentSecrets:
  - litellm-secrets
  # Not actually sensitive -- PYTHONPATH is a plain directory string. The
  # chart's only extension point for extra container env vars is
  # environmentSecrets (secretRef only, no plain-ConfigMap envFrom exists in
  # this chart), so it's carried in a Secret purely to fit that mechanism;
  # see postInstall/custom-callbacks-configmap.yaml for what it points at
  # and why.
  - litellm-callbacks-pythonpath

# Opt-in for Reloader (installed via the platform GitOps path, not yet live):
# rolls this Deployment when litellm-secrets above is rotated. Inert until
# Reloader is installed.
deploymentAnnotations:
  secret.reloader.stakater.com/reload: "litellm-secrets"

proxy_config:
  model_list:
    # Zero-cost tier only — no paid API credits on any provider. Alias is
    # role-named so backend swaps (Phase 4 local vLLM) never touch clients.
    # All three backends verified for tool calling, which Holmes requires.
    # OpenRouter :free = 50 req/day at $0 balance (1000/day once $10 lifetime
    # credit purchased); NIM direct is a separate free quota pool.
    # gpt-oss-120b leads on latency: nemotron-3-ultra-550b measured 433-600s+
    # per investigation (blowing the relay's per-alert deadline); the ultra
    # model stays as the deeper-reasoning fallback.
    - model_name: sre-investigator
      litellm_params:
        model: openrouter/openai/gpt-oss-120b:free
        api_key: os.environ/OPENROUTER_API_KEY
        # Holmes asks for 64k output tokens; some providers reserve quota for
        # the full max_tokens per request. 16k is ample for RCA prose.
        max_tokens: 16384
    - model_name: sre-investigator-fb1
      litellm_params:
        model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
        api_key: os.environ/OPENROUTER_API_KEY
        max_tokens: 16384
    - model_name: sre-investigator-fb2
      litellm_params:
        model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
        api_key: os.environ/NVIDIA_NIM_API_KEY
        max_tokens: 16384
    # Local tier: RTX 5090 VM on pve5 (vllm-inference, static IP outside
    # the DHCP churn). Quota-immune backstop when every cloud pool is
    # rate-limited or dark; sits last as the local-of-last-resort tier.
    # Qwen3-Coder-30B-A3B (AWQ 4-bit) MoE — stronger tool calling than the
    # prior gpt-oss-20b, same served endpoint contract.
    - model_name: sre-investigator-local
      litellm_params:
        model: hosted_vllm/qwen/qwen3-coder-30b-a3b
        api_base: http://192.168.1.50:8000/v1
        max_tokens: 16384
  general_settings:
    # LITELLM_MASTER_KEY is injected from the litellm-secrets ESO secret above.
    master_key: os.environ/LITELLM_MASTER_KEY
    store_model_in_db: true
  router_settings:
    redis_host: litellm-redis.ai-sre.svc.cluster.local
    redis_port: 6379
    # Free endpoints rate-limit and brown-out; degrade across quota pools
    # before failing an investigation.
    fallbacks:
      - sre-investigator: ["sre-investigator-fb1", "sre-investigator-fb2", "sre-investigator-local"]
  litellm_settings:
    drop_params: true
    num_retries: 2
    # Server-side max_tokens ceiling. litellm_params.max_tokens above is only
    # a default -- the router always lets a caller's explicit max_tokens win
    # (see postInstall/custom-callbacks-configmap.yaml for the full why).
    # LiteLLM's get_instance_fn (litellm/proxy/types_utils/utils.py) first
    # checks for this module as a file living next to config.yaml itself; only
    # when that exact path doesn't exist does it fall back to a plain
    # importlib.import_module(), which searches PYTHONPATH. custom_callbacks.py
    # is deliberately NOT placed next to config.yaml (see the volumes/env
    # comments below for why), so this always takes the PYTHONPATH fallback.
    callbacks: custom_callbacks.guardrail_instance

# Mounts the ConfigMap from postInstall/custom-callbacks-configmap.yaml as its
# own full directory, not a second file injected into config.yaml's directory.
# First attempt used a subPath mount of this ConfigMap into /etc/litellm/
# (already the litellm-config ConfigMap volume's mount point) and it failed at
# container-init with "not a directory" -- two independent volumes racing to
# both populate the same parent directory is a known-fragile pattern across
# container runtimes, not something specific to this chart. A dedicated
# directory sidesteps the collision entirely; environmentSecrets below sets
# PYTHONPATH so LiteLLM's import fallback (see the callbacks comment above)
# can still find it.
volumes:
  - name: litellm-custom-callbacks
    configMap:
      name: litellm-custom-callbacks
volumeMounts:
  - name: litellm-custom-callbacks
    mountPath: /etc/litellm-callbacks
    readOnly: true

# Boot spike (Prisma engine + proxy import) OOMKilled the container at both
# 512Mi and 1Gi within ~4s; verified starting clean at 2Gi. Request matches
# the limit so the pod stays Guaranteed on memory and is not an OOM-kill
# candidate under node pressure.
#
# Right-sizing was investigated and reverted: this repo's own Phase 1
# baseline (docs/memory-efficiency/appendix-workloads.md,
# 03-chart-inventory.md) records live usage at ~1988Mi, not the ~1.48Gi a
# later point-in-time sample suggested -- and that 1988Mi figure is what
# the prior deliberate raise from 512Mi was based on. Trimming below live
# usage on a Guaranteed pod is a next-sync OOMKill, not a risk. Left at 2Gi.
# The chart's own Deployment template already carries a startupProbe
# (failureThreshold: 30, periodSeconds: 10 -> up to 5 minutes), so the boot
# spike has probe headroom independent of this resources block.
resources:
  requests: {cpu: 100m, memory: 2Gi}
  limits: {memory: 2Gi}
