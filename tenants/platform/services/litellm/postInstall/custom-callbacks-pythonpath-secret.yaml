# Not sensitive data -- a plain directory path. Exists as a Secret only
# because environmentSecrets (secretRef) is the litellm-helm chart's only
# extension point for extra container env vars; there is no plain-ConfigMap
# envFrom in this chart. Points LiteLLM's custom_callbacks module import at
# the directory custom-callbacks-configmap.yaml mounts, per the volumes/
# volumeMounts comment in values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-callbacks-pythonpath
  namespace: ai-sre
type: Opaque
stringData:
  PYTHONPATH: /etc/litellm-callbacks
