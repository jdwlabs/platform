# Enforces a real per-request max_tokens ceiling before a request reaches the
# backend, sized to the ACTUAL prompt for this call, not a static number.
#
# litellm_params.max_tokens on a model_list entry is a DEFAULT only --
# LiteLLM's router builds the outgoing request as {**litellm_params,
# **kwargs}, so a caller's explicit max_tokens always wins over the config
# value. Holmes always sends an explicit max_tokens (falls back to a
# max(64000, 12%-of-context) floor when it can't resolve a model's real
# limit, which it can't for a proxy-aliased self-hosted model), so the
# config's existing max_tokens: 16384 on each entry was never actually
# enforced.
#
# A single static output ceiling (first cut of this guardrail: 16000 for
# every model) is not enough on its own -- confirmed live 2026-08-14, the
# drift-scan CronJob's actual prompt is ~16769 tokens, so 16000 output +
# 16769 input = 32769, one over sre-investigator-local's 32768 context
# window (ContextWindowExceededError). Worse, Holmes is agentic and appends
# each tool result to the conversation across an investigation's multiple
# turns, so the prompt genuinely grows call-to-call -- any fixed number
# picked to fit today's prompt size can still fail on a later turn or a
# bigger investigation. Counting the real prompt on every call and sizing
# the output budget to what's actually left is the only way to keep the
# guarantee true as prompts grow, not just patch today's observed size.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-custom-callbacks
  namespace: ai-sre
data:
  custom_callbacks.py: |
    from typing import Literal, Optional

    import litellm
    from litellm.integrations.custom_logger import CustomLogger
    from litellm.proxy.proxy_server import UserAPIKeyAuth, DualCache

    # Each model_list entry's real backend context window (input + output
    # tokens combined). sre-investigator-local is the only entry whose
    # backend (vLLM, max_model_len=32768) hard-rejects an over-limit request
    # instead of tolerating it -- the cloud entries (OpenRouter, NVIDIA NIM)
    # accept far more today, but every entry is covered here so the
    # guarantee holds regardless of what a given provider currently
    # tolerates or how that changes.
    CONTEXT_WINDOW_BY_MODEL = {
        "sre-investigator": 131072,
        "sre-investigator-fb1": 131072,
        "sre-investigator-fb2": 131072,
        "sre-investigator-local": 32768,
    }
    # Any model_list entry not named above still gets a conservative window
    # -- new entries are safe by default rather than silently uncapped.
    DEFAULT_CONTEXT_WINDOW = 32768

    # Reserved for message formatting/role overhead that a raw token count of
    # the message content can undercount by. Deliberately conservative.
    SAFETY_MARGIN_TOKENS = 512
    # Never returns less than this -- a near-exhausted context gets a short
    # response instead of an outright max_tokens<=0 error, and this floor is
    # the signal something upstream (prompt size, this model's fit for the
    # task) needs attention rather than the guardrail silently degrading.
    MIN_OUTPUT_TOKENS = 512
    # Absolute cap regardless of how much context is free -- RCA prose does
    # not need more than this, and it bounds a single response's cost/latency
    # even against a model with a very large context window.
    MAX_OUTPUT_TOKENS_ABSOLUTE = 16000


    class MaxTokensCeilingGuardrail(CustomLogger):
        async def async_pre_call_hook(
            self,
            user_api_key_dict: UserAPIKeyAuth,
            cache: DualCache,
            data: dict,
            call_type: Literal[
                "completion",
                "text_completion",
                "embeddings",
                "image_generation",
                "moderation",
                "audio_transcription",
            ],
        ) -> Optional[dict]:
            requested = data.get("max_tokens")
            if requested is None:
                return data

            model = data.get("model", "")
            context_window = CONTEXT_WINDOW_BY_MODEL.get(model, DEFAULT_CONTEXT_WINDOW)

            messages = data.get("messages") or []
            try:
                prompt_tokens = litellm.token_counter(model=model, messages=messages)
            except Exception:
                import logging

                logging.getLogger("litellm").warning(
                    "max_tokens_ceiling_guardrail: token_counter failed for model=%s, "
                    "falling back to the absolute output cap without a context check",
                    model,
                )
                data["max_tokens"] = min(requested, MAX_OUTPUT_TOKENS_ABSOLUTE)
                return data

            available = context_window - prompt_tokens - SAFETY_MARGIN_TOKENS
            ceiling = max(MIN_OUTPUT_TOKENS, min(available, MAX_OUTPUT_TOKENS_ABSOLUTE))

            if requested > ceiling:
                import logging

                logging.getLogger("litellm").warning(
                    "max_tokens_ceiling_guardrail: clamped model=%s requested=%s to "
                    "ceiling=%s (prompt_tokens=%s, context_window=%s)",
                    model,
                    requested,
                    ceiling,
                    prompt_tokens,
                    context_window,
                )
                data["max_tokens"] = ceiling

            return data


    guardrail_instance = MaxTokensCeilingGuardrail()
