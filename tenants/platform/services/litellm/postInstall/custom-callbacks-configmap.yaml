# Enforces a real per-request max_tokens ceiling before a request reaches the
# backend, sized to the ACTUAL prompt for this call, not a static number.
#
# litellm_params.max_tokens on a model_list entry is a DEFAULT only --
# LiteLLM's router builds the outgoing request as {**litellm_params,
# **kwargs}, so a caller's explicit max_tokens always wins over the config
# value. Holmes always sends an explicit max_tokens (falls back to a
# max(64000, 12%-of-context) floor when it can't resolve a model's real
# limit, which it can't for a proxy-aliased self-hosted model), so the
# config's existing max_tokens: 16384 on each entry was never actually
# enforced.
#
# A single static output ceiling (first cut of this guardrail: 16000 for
# every model) is not enough on its own -- confirmed live 2026-08-14, the
# drift-scan CronJob's actual prompt is ~16769 tokens, so 16000 output +
# 16769 input = 32769, one over sre-investigator-local's 32768 context
# window (ContextWindowExceededError). Worse, Holmes is agentic and appends
# each tool result to the conversation across an investigation's multiple
# turns, so the prompt genuinely grows call-to-call -- any fixed number
# picked to fit today's prompt size can still fail on a later turn or a
# bigger investigation. Counting the real prompt on every call and sizing
# the output budget to what's actually left is the only way to keep the
# guarantee true as prompts grow, not just patch today's observed size.
#
# That dynamic sizing still had one gap: the guardrail always authorized at
# least MIN_OUTPUT_TOKENS, even when the prompt alone left less room than
# that -- confirmed live 2026-08-26, the drift-scan CronJob got a 512-output
# request through this guardrail whose prompt was already 32257 tokens
# against sre-investigator-local's 32768 window, one token over even at the
# floor (ContextWindowExceededError again, just at the opposite end of the
# budget). The floor is now a refusal threshold instead of a value it will
# force through -- see the refusal branch below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-custom-callbacks
  namespace: ai-sre
data:
  custom_callbacks.py: |
    from typing import Literal, Optional

    import litellm
    from fastapi import HTTPException
    from litellm.integrations.custom_logger import CustomLogger
    from litellm.proxy.proxy_server import UserAPIKeyAuth, DualCache

    # Each model_list entry's real backend context window (input + output
    # tokens combined). sre-investigator-local is the only entry whose
    # backend (vLLM, max_model_len=32768) hard-rejects an over-limit request
    # instead of tolerating it -- the cloud entries (OpenRouter, NVIDIA NIM)
    # accept far more today, but every entry is covered here so the
    # guarantee holds regardless of what a given provider currently
    # tolerates or how that changes.
    CONTEXT_WINDOW_BY_MODEL = {
        "sre-investigator": 131072,
        "sre-investigator-fb1": 131072,
        "sre-investigator-fb2": 131072,
        "sre-investigator-local": 32768,
    }
    # Any model_list entry not named above still gets a conservative window
    # -- new entries are safe by default rather than silently uncapped.
    DEFAULT_CONTEXT_WINDOW = 32768

    # Reserved for everything a token count of messages+tools still can't
    # capture exactly: the fallback tokenizer (unrecognized model names get
    # a generic encoding, not the backend's real one -- confirmed live this
    # undercounts against vLLM's own count for this Qwen deployment), chat
    # template / special-token overhead, and Holmes' skill-file injection
    # (tenants/platform/services/holmes/values.yaml customSkills, sizeable
    # runbook markdown that can land in the system prompt outside of
    # messages/tools).
    #
    # Confirmed live 2026-08-14 against the real drift-scan CronJob, whose
    # prompt is deterministic across runs -- vLLM's own error reports "at
    # least 16769 input tokens" every time. A first cut without `tools` in
    # the count (no margin beyond the request itself) and a second cut with
    # tools + a 2048 margin both still let the request through unclamped by
    # context (hit the 16000 absolute cap, meaning this guardrail's own
    # prompt_tokens estimate was under roughly 14720 -- a 2000+ token
    # undercount against vLLM's real count, on top of whatever the 2048
    # margin was already covering). Rather than keep chasing the exact size
    # of an estimation gap this code cannot directly observe, widened well
    # past it and re-verified against the same real job.
    SAFETY_MARGIN_TOKENS = 6000
    # The smallest output budget this guardrail will authorize. Below this,
    # refuse the call outright instead of forcing it through anyway (see the
    # refusal branch below) -- a near-exhausted context is the signal that
    # something upstream (prompt size, this model's fit for the task) needs
    # attention, not something to paper over with a token budget too small
    # to be useful.
    MIN_OUTPUT_TOKENS = 512
    # Absolute cap regardless of how much context is free -- RCA prose does
    # not need more than this, and it bounds a single response's cost/latency
    # even against a model with a very large context window.
    MAX_OUTPUT_TOKENS_ABSOLUTE = 16000


    class MaxTokensCeilingGuardrail(CustomLogger):
        async def async_pre_call_hook(
            self,
            user_api_key_dict: UserAPIKeyAuth,
            cache: DualCache,
            data: dict,
            call_type: Literal[
                "completion",
                "text_completion",
                "embeddings",
                "image_generation",
                "moderation",
                "audio_transcription",
            ],
        ) -> Optional[dict]:
            requested = data.get("max_tokens")
            if requested is None:
                return data

            model = data.get("model", "")
            context_window = CONTEXT_WINDOW_BY_MODEL.get(model, DEFAULT_CONTEXT_WINDOW)

            messages = data.get("messages") or []
            try:
                # `tools=` matters: Holmes is a function-calling agent, so its
                # request carries tool-schema definitions that add real prompt
                # tokens vLLM's own count includes -- confirmed live, omitting
                # this was the largest single piece of the undercount that let
                # a real request through at the ceiling despite this guardrail.
                prompt_tokens = litellm.token_counter(
                    model=model, messages=messages, tools=data.get("tools")
                )
            except Exception:
                import logging

                logging.getLogger("litellm").warning(
                    "max_tokens_ceiling_guardrail: token_counter failed for model=%s, "
                    "falling back to the absolute output cap without a context check",
                    model,
                )
                data["max_tokens"] = min(requested, MAX_OUTPUT_TOKENS_ABSOLUTE)
                return data

            available = context_window - prompt_tokens - SAFETY_MARGIN_TOKENS

            if available < MIN_OUTPUT_TOKENS:
                # Forcing the MIN_OUTPUT_TOKENS floor here (the old behavior)
                # authorizes prompt_tokens + MIN_OUTPUT_TOKENS even when that
                # sum is already over context_window -- confirmed live
                # 2026-08-26: sre-investigator-local rejected a request with
                # max_tokens clamped to exactly 512 because the backend's own
                # count (which this estimate can undercount, see
                # SAFETY_MARGIN_TOKENS above) put the prompt alone at 32257
                # against a 32768 window, one token short of even the floor.
                # A fixed SAFETY_MARGIN_TOKENS can't rule this out for every
                # future prompt size (Holmes' conversation grows call to
                # call), so refuse outright instead of forwarding a request
                # this guardrail already knows will overflow -- the caller
                # gets the same non-200-is-inconclusive outcome as any other
                # backend rejection, but from an accurate, attributable cause
                # instead of an opaque ContextWindowExceededError.
                import logging

                logging.getLogger("litellm").warning(
                    "max_tokens_ceiling_guardrail: refusing model=%s, "
                    "prompt_tokens=%s leaves no safe room under "
                    "context_window=%s (safety_margin=%s, min_output=%s)",
                    model,
                    prompt_tokens,
                    context_window,
                    SAFETY_MARGIN_TOKENS,
                    MIN_OUTPUT_TOKENS,
                )
                raise HTTPException(
                    status_code=400,
                    detail=(
                        "max_tokens_ceiling_guardrail: prompt_tokens="
                        f"{prompt_tokens} leaves no safe room under "
                        f"context_window={context_window} for model={model} "
                        f"(even the {MIN_OUTPUT_TOKENS}-token output floor); "
                        "refusing rather than forwarding a request already "
                        "known to overflow"
                    ),
                )

            # available >= MIN_OUTPUT_TOKENS is now guaranteed, so this can
            # never clamp below the floor -- unlike the old max(MIN_OUTPUT_
            # TOKENS, ...) form, it also never clamps *up* past what's
            # actually available.
            ceiling = min(available, MAX_OUTPUT_TOKENS_ABSOLUTE)

            if requested > ceiling:
                import logging

                logging.getLogger("litellm").warning(
                    "max_tokens_ceiling_guardrail: clamped model=%s requested=%s to "
                    "ceiling=%s (prompt_tokens=%s, context_window=%s)",
                    model,
                    requested,
                    ceiling,
                    prompt_tokens,
                    context_window,
                )
                data["max_tokens"] = ceiling

            return data


    guardrail_instance = MaxTokensCeilingGuardrail()
