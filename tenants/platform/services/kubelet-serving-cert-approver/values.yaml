# Namespace is created by governance-platform (tenant envelope from tenants/platform/tenant.yaml).
# Disabling chart-side namespace creation prevents a SharedResourceWarning
# between platform-kubelet-serving-cert-approver and governance-platform.
namespace:
  create: false

# ArgoCD holds prior manifests in git history; no need for k8s to keep old
# ReplicaSets around too.
revisionHistoryLimit: 0
