apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 */6 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # failedJobsHistoryLimit only prunes old Jobs when a *new* failure pushes
      # the count over the limit. If backups keep succeeding, a single old
      # failed Job object lingers forever and keeps kube_job_failed pinned at
      # 1. TTL-clean any finished Job after a day regardless of subsequent
      # successes.
      ttlSecondsAfterFinished: 86400
      # Never + a small backoffLimit instead of OnFailure: with OnFailure the
      # Job controller deletes the crash-looping pod once the limit is hit, so
      # a failed run kept its Job object but lost every log line explaining
      # why. Never leaves each failed pod in place until the TTL above.
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          # Only the publish step talks to the API server, to write its
          # freshness numbers into a ConfigMap (rbac.yaml). The token is
          # mounted into that container alone rather than automounted into
          # all three, so the dump and upload steps -- the latter holding the
          # Drive token -- carry no cluster credential.
          serviceAccountName: postgres-backup
          automountServiceAccountToken: false
          # 999 is the postgres account baked into the postgres image; a uid
          # above 10000 would not own the paths that image expects to own.
          # Both images declare no user, so the uid has to be numeric for
          # runAsNonRoot to be enforceable at admission. fsGroup is what makes
          # the shared backup volume writable by the dump container and
          # readable by the upload container that follows it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: postgres:17
              # Requests only, no limits: pod QoS is computed across init
              # containers too, so an unbounded one here drops the whole backup
              # pod to BestEffort and makes it first to be evicted. A memory
              # ceiling is the wrong lever — pg_dumpall's footprint scales with
              # the largest table it streams, and an OOM kill silently costs a
              # backup rather than capping anything worth capping.
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: platform-postgresql-cluster-prd-superuser
                      key: password
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  pg_dumpall \
                    -h platform-postgresql-cluster-prd-rw.database.svc \
                    -U postgres \
                    --clean --if-exists \
                  | gzip > /backup/prd-$(date -u +%Y%m%dT%H%M%SZ).sql.gz
              # The dump is streamed straight to the backup volume and the
              # password arrives by environment, so nothing needs the image's
              # own filesystem to be writable.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - mountPath: /backup
                  name: backup
            # An init container rather than the main one so that the publish
            # step below cannot start until the upload has been verified: a
            # freshness timestamp must never advance for a dump that did not
            # land.
            - name: upload
              image: rclone/rclone:1.74.4@sha256:c61954aaa32328a5486715dd063a81c7879f5195ad3505cd362deddd509dc4a1
              # Unlike the dump init container beside it, rclone's footprint
              # doesn't scale with dump size (it streams in fixed-size
              # chunks), so a memory ceiling here doesn't risk turning a slow
              # leak into a lost backup the way it would for pg_dumpall.
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              env:
                # rclone rewrites its config in place whenever it refreshes the
                # Drive access token, so the config cannot be read straight off
                # the secret mount -- that mount is read-only. Copying it to a
                # scratch path keeps the write target valid while leaving the
                # rest of the filesystem sealed. The default location is under
                # the home directory, which no longer exists for this uid.
                - name: RCLONE_CONFIG
                  value: /tmp/rclone.conf
              # `rclone copy` exits 0 having copied nothing, so its exit code
              # is not evidence that a dump reached Drive -- prd backups once
              # stopped landing for six days with every run green. The size
              # Drive reports for the new object has to match the local file
              # before anything is recorded as a success.
              #
              # Expired dumps are deleted outright, not trashed: Drive trash
              # counts against the storage quota for 30 days, so trashing a
              # week of dumps kept roughly half the quota pinned and the
              # uploads eventually failed with storageQuotaExceeded. The filter
              # and depth limit keep this from reaching the litellm dumps in the
              # subdirectory, which have their own job. Expiry failure is only
              # warned about: the upload above has already succeeded.
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  cp /rclone-config/rclone.conf "$RCLONE_CONFIG"
                  set -- /backup/prd-*.sql.gz
                  if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
                    echo "FATAL: expected exactly one dump in /backup, found: $*" >&2
                    exit 1
                  fi
                  NAME="$(basename "$1")"
                  LOCAL_BYTES="$(stat -c %s "$1")"
                  rclone copy /backup gdrive:postgres-backups
                  REMOTE_BYTES="$(rclone lsf gdrive:postgres-backups --files-only --max-depth 1 \
                    --format s --include "$NAME")"
                  if [ "$REMOTE_BYTES" != "$LOCAL_BYTES" ]; then
                    echo "FATAL: $NAME is $LOCAL_BYTES bytes locally but '$REMOTE_BYTES' on Drive" >&2
                    exit 1
                  fi
                  echo "verified $NAME on Drive, $REMOTE_BYTES bytes"
                  printf 'name=%s\nbytes=%s\nverified_at=%s\n' \
                    "$NAME" "$REMOTE_BYTES" "$(date +%s)" > /result/verified
                  rclone delete gdrive:postgres-backups --min-age 7d --drive-use-trash=false \
                    --include 'prd-*.sql.gz' --max-depth 1 \
                    || echo "WARN: backup expiry failed" >&2
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - mountPath: /backup
                  name: backup
                - mountPath: /rclone-config
                  name: rclone-config
                  readOnly: true
                - mountPath: /tmp
                  name: tmp
                - mountPath: /result
                  name: result
          containers:
            # Publishes the job-output freshness contract
            # (docs/observability/JOB-OUTPUT-FRESHNESS.md) for the exporter in
            # exporter.yaml to serve. Values come from the upload step's check
            # of the object on Drive, not from this run's exit codes.
            - name: publish
              image: alpine/k8s:1.36.5@sha256:094adf64cdc4827377cdbe7ea5747472ce115f9fbc64a4e35970ec66777f9a00
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              env:
                # kubectl keeps its discovery cache under $HOME, and the root
                # filesystem is read-only.
                - name: HOME
                  value: /tmp
                - name: BACKUP_JOB
                  value: postgres-backup
                - name: METRICS_CM
                  value: postgres-backup-metrics
                # Must match exporter.yaml, which serves the same two values
                # as placeholders before the first run has reported. 8h is
                # the 6h schedule plus room for one slow run; the stale alert
                # adds its own 30m on top.
                - name: MAX_AGE_SECONDS
                  value: "28800"
                # About a tenth of a dump on 2026-11-27 (~366MB). A dump far
                # below its usual size means data is missing from it -- a
                # dropped database, or the wrong cluster dumped -- which no
                # exit code reports.
                - name: MIN_BYTES
                  value: "52428800"
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  NAME="$(sed -n 's/^name=//p' /result/verified)"
                  BYTES="$(sed -n 's/^bytes=//p' /result/verified)"
                  TS="$(sed -n 's/^verified_at=//p' /result/verified)"
                  # Prometheus rejects a whole scrape on one malformed line,
                  # which would take every gauge here down at once -- better
                  # to fail the run than publish something unparseable.
                  for v in "$BYTES" "$TS" "$MAX_AGE_SECONDS" "$MIN_BYTES"; do
                    if [[ ! "$v" =~ ^[0-9]+$ ]]; then
                      echo "FATAL: '$v' is not a number; not publishing" >&2
                      exit 1
                    fi
                  done
                  L="backup_job=\"${BACKUP_JOB}\",artifact=\"dump\""
                  {
                    echo "# HELP backup_last_success_timestamp_seconds Unix time an artifact was last verified written and non-empty."
                    echo "# TYPE backup_last_success_timestamp_seconds gauge"
                    echo "backup_last_success_timestamp_seconds{${L}} ${TS}"
                    echo "# HELP backup_last_artifact_bytes Size in bytes of that artifact."
                    echo "# TYPE backup_last_artifact_bytes gauge"
                    echo "backup_last_artifact_bytes{${L}} ${BYTES}"
                    echo "# HELP backup_max_age_seconds Freshness budget this producer publishes for itself."
                    echo "# TYPE backup_max_age_seconds gauge"
                    echo "backup_max_age_seconds{${L}} ${MAX_AGE_SECONDS}"
                    echo "# HELP backup_min_artifact_bytes Size below which this producer's artifact is suspect."
                    echo "# TYPE backup_min_artifact_bytes gauge"
                    echo "backup_min_artifact_bytes{${L}} ${MIN_BYTES}"
                  } > /tmp/metrics.txt
                  kubectl create configmap "$METRICS_CM" -n database \
                    --from-file=metrics.txt=/tmp/metrics.txt \
                    --dry-run=client -o yaml | kubectl apply -n database -f -
                  echo "published freshness metrics for $NAME"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - mountPath: /result
                  name: result
                  readOnly: true
                # Not the upload step's /tmp, which holds the Drive token.
                - mountPath: /tmp
                  name: publish-tmp
                - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  name: api-token
                  readOnly: true
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            # Kept apart from /backup, which is copied to Drive wholesale.
            - name: result
              emptyDir: {}
            - name: publish-tmp
              emptyDir: {}
            # What automounting would have provided, for publish only.
            - name: api-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3600
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - downwardAPI:
                      items:
                        - path: namespace
                          fieldRef:
                            fieldPath: metadata.namespace
            - name: rclone-config
              secret:
                secretName: rclone-gdrive
