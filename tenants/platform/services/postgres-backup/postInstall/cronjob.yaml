apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 */6 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # failedJobsHistoryLimit only prunes old Jobs when a *new* failure pushes
      # the count over the limit. If backups keep succeeding, a single old
      # failed Job object lingers forever and keeps kube_job_failed pinned at
      # 1. TTL-clean any finished Job after a day regardless of subsequent
      # successes.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          # 999 is the postgres account baked into the postgres image; a uid
          # above 10000 would not own the paths that image expects to own.
          # Both images declare no user, so the uid has to be numeric for
          # runAsNonRoot to be enforceable at admission. fsGroup is what makes
          # the shared backup volume writable by the dump container and
          # readable by the upload container that follows it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: postgres:17
              # Requests only, no limits: pod QoS is computed across init
              # containers too, so an unbounded one here drops the whole backup
              # pod to BestEffort and makes it first to be evicted. A memory
              # ceiling is the wrong lever — pg_dumpall's footprint scales with
              # the largest table it streams, and an OOM kill silently costs a
              # backup rather than capping anything worth capping.
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: platform-postgresql-cluster-prd-superuser
                      key: password
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  pg_dumpall \
                    -h platform-postgresql-cluster-prd-rw.database.svc \
                    -U postgres \
                    --clean --if-exists \
                  | gzip > /backup/prd-$(date -u +%Y%m%dT%H%M%SZ).sql.gz
              # The dump is streamed straight to the backup volume and the
              # password arrives by environment, so nothing needs the image's
              # own filesystem to be writable.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - mountPath: /backup
                  name: backup
          containers:
            - name: upload
              image: rclone/rclone:1.74.4@sha256:c61954aaa32328a5486715dd063a81c7879f5195ad3505cd362deddd509dc4a1
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
              env:
                # rclone rewrites its config in place whenever it refreshes the
                # Drive access token, so the config cannot be read straight off
                # the secret mount -- that mount is read-only. Copying it to a
                # scratch path keeps the write target valid while leaving the
                # rest of the filesystem sealed. The default location is under
                # the home directory, which no longer exists for this uid.
                - name: RCLONE_CONFIG
                  value: /tmp/rclone.conf
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  cp /rclone-config/rclone.conf "$RCLONE_CONFIG"
                  rclone copy /backup gdrive:postgres-backups
                  rclone delete gdrive:postgres-backups --min-age 7d || true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - mountPath: /backup
                  name: backup
                - mountPath: /rclone-config
                  name: rclone-config
                  readOnly: true
                - mountPath: /tmp
                  name: tmp
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: rclone-config
              secret:
                secretName: rclone-gdrive
