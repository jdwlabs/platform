crds:
  enabled: true

prometheusOperator:
  enabled: true
  # ArgoCD holds prior manifests in git history; no need for k8s to keep old
  # ReplicaSets around too.
  revisionHistoryLimit: 0
  admissionWebhooks:
    certManager:
      enabled: true
  # Ran BestEffort (first evicted under node memory pressure, invisible to
  # the scheduler). Observed ~58Mi; request ~1.7x that, limit leaves headroom
  # for reconciles over many ServiceMonitors.
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 256Mi
  # The operator injects this sidecar into both the Prometheus and Alertmanager
  # pods, and it shipped unbounded on all of them. Observed ~13Mi.
  prometheusConfigReloader:
    resources:
      requests:
        memory: 24Mi
      limits:
        memory: 64Mi

prometheus:
  prometheusSpec:
    # Prefer the large pve5 worker (labeled workload.jdwlabs.io/monitoring) so
    # the memory-heavy monitoring stack stays off the small general workers.
    # Soft preference: everything still schedules anywhere if that node is down.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: workload.jdwlabs.io/monitoring
                  operator: In
                  values: ["true"]
    enableRemoteWriteReceiver: true
    retention: 15d
    # Kept below the 25Gi PVC (~26.8GB) so the size-based GC trips before the
    # volume fills; retention (time) and retentionSize (bytes) together bound
    # long-run TSDB growth and the RSS that tracks it.
    retentionSize: "20GB"
    # 60s: halve ingested samples vs 30s default; head block and WAL scale with scrape rate
    scrapeInterval: "60s"
    evaluationInterval: "60s"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 25Gi
    # Discover ServiceMonitors, PodMonitors, and PrometheusRules from all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # Peaked at ~2.9Gi with no limits; explicit bounds stop the request from
    # crowding smaller workers. Replaces the earlier 3Gi-request/no-limit shape:
    # WAL-replay spikes shrink with the 60s scrape + cardinality drops above,
    # so a 2Gi ceiling now clears replay. Revisit if replay OOMs recur.
    # Request 1536Mi: steady-state RSS runs ~1.5Gi live, so a 1Gi request
    # under-declared by ~500Mi and the scheduler placed other pods into memory
    # Prometheus was already using.
    resources:
      requests:
        memory: 1536Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: "1"

kubelet:
  serviceMonitor:
    # Overrides chart defaults (must include all originals); appends TCP/UDP drops not in defaults
    # (high cardinality: state x container x interface, not referenced in any dashboard)
    cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_memory_(mapped_file|swap)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_(file_descriptors|tasks_state|threads_max)'
      - sourceLabels: [__name__, scope]
        action: drop
        regex: 'container_memory_failures_total;hierarchy'
      - sourceLabels: [__name__, interface]
        action: drop
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_spec.*'
      - sourceLabels: [id, pod]
        action: drop
        regex: '.+;'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_network_(tcp|udp)_usage_total'

alertmanager:
  enabled: true
  # Config managed via ExternalSecret (alertmanager-config) - see postInstall/alertmanager-config-externalsecret.yaml.
  # Chart's inline config is ignored when useExistingSecret=true; add new receivers/routes in that ExternalSecret template.
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-config
    # The 200Mi prometheus-operator default sat at ~9% utilized against
    # observed usage — the most disproportionate request-to-usage ratio of any
    # workload in this stack after loki. Right-sized down; 512Mi limit is
    # unchanged and still leaves generous room for alert-storm bursts.
    resources:
      requests:
        memory: 96Mi
      limits:
        memory: 512Mi
    # AlertmanagerSpec exposes no startupProbe field of its own; `containers`
    # is the operator's supported mechanism for patching a generated
    # container by name. A generous startup grace here means the operator's
    # own liveness probe (10 failures at its default 10s period) can't restart
    # the pod mid config/notification-log load right after the request above
    # was tightened.
    containers:
      - name: alertmanager
        startupProbe:
          httpGet:
            path: /-/ready
            # Matches this chart's alertmanagerSpec.portName default
            # ("http-web"), not the prometheus-operator default ("web").
            port: http-web
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 3
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    configMaps:
      - alertmanager-templates

# kube-prometheus-stack owns these going forward
kubeStateMetrics:
  enabled: true

# Configuration for the kube-state-metrics subchart.
# Cardinality control: kube-state-metrics is a top series-count contributor and
# this Prometheus also receives remote-write from the Grafana Alloy
# k8s-monitoring stack, so series count drives the RSS pressure seen on the
# control plane. kube_*_annotations emits one series per object annotation key
# (annotations routinely carry kubectl last-applied-config, Helm release
# metadata, etc.) — high fan-out and consumed by no rule or dashboard in this
# repo. This is the only kube-state series dropped; label/state metrics are
# kept. Upstream default for this key is [], so this adds rather than masks.
kube-state-metrics:
  # Surfaces the tenant namespace label as a Prometheus label dimension on
  # kube_namespace_labels. Without this, kube_namespace_labels emits with no
  # label_* dimensions at all (upstream default allowlist is empty), so the
  # label-based tenant metric scoping this cluster's dashboards join against
  # (platform.jdwlabs.io/tenant -> namespace) has nothing to join on.
  metricLabelsAllowlist:
    - "namespaces=[platform.jdwlabs.io/tenant]"
  # ArgoCD holds prior manifests in git history; no need for k8s to keep old
  # ReplicaSets around too.
  revisionHistoryLimit: 0
  prometheus:
    monitor:
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "kube_.*_annotations"
          action: drop
  # Ran BestEffort. Observed ~33Mi; request ~2x that. Memory scales with
  # object count, which grows slowly here — 128Mi limit is ample.
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 128Mi

nodeExporter:
  enabled: true
  prometheus:
    monitor:
      enabled: true

# Configuration for the prometheus-node-exporter subchart. The DaemonSet ran
# BestEffort at ~19Mi observed per node (151Mi across 8); node-exporter's
# footprint is flat, so a tight bound is safe.
prometheus-node-exporter:
  # ArgoCD holds prior manifests in git history; no need for k8s to keep old
  # controller revisions around either.
  revisionHistoryLimit: 0
  # Helm replaces lists rather than merging them, so the chart's fs-types line
  # is restated verbatim and must be re-checked whenever the pinned chart
  # revision moves. Only the mount-points regex differs: upstream excludes the
  # whole of /var/lib/kubelet, which hides the CSI staging mounts at
  # plugins/kubernetes.io/csi/.../globalmount — the one place an attached
  # volume's superblock is observable, and what storage-integrity's read-only
  # rule reads. The per-pod bind mounts under pods/ stay excluded because they
  # share that same superblock and would only duplicate it.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/pods/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 64Mi

# Grafana managed separately
grafana:
  enabled: false

# Built-in alert rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    configReloaders: true
    general: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
    etcd: true
    kubeControllerManager: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    # No kube-proxy scrape target (see kubeProxy below), so these would never
    # evaluate against data.
    kubeProxy: false
  # The node-exporter mount-points override above deliberately exports the CSI
  # staging mounts so a read-only volume is visible. Capacity on those volumes
  # is already alerted from kubelet_volume_stats in rules-storage-capacity.yaml,
  # which names the PVC; leaving them in scope here would raise a second,
  # node-scoped copy of every NodeFilesystem* alert identified only by an opaque
  # globalmount path.
  node:
    fsSelector: 'fstype!="",mountpoint!~"/var/lib/kubelet/.*"'

# Scheduler and controller-manager run as hostNetwork static pods in kube-system
# carrying component=kube-scheduler / component=kube-controller-manager, which
# is exactly what the chart's default headless-Service selector matches — no
# endpoint addresses have to be written down. Their pod IP is the node IP, so
# the scrape lands on the node's own :10259 / :10257. Both serve HTTPS with a
# self-signed serving cert generated at process start, so the chart's default
# insecureSkipVerify (on Kubernetes >= 1.23) is required, not incidental.
#
# Prerequisite: both components must be started with --bind-address=0.0.0.0.
# They default to 127.0.0.1 on Talos, which is reachable only from their own
# node, so these targets stay down until the machine config carrying the wider
# bind address is applied.
kubeControllerManager:
  enabled: true
kubeScheduler:
  enabled: true

# etcd on Talos is a host-level service, not a pod, so there is nothing in the
# cluster for the chart's selector (component=etcd) to match and its only
# fallback is a literal list of control-plane addresses. Those addresses are
# DHCP-assigned here, and a scrape config that stops resolving the moment an
# address moves is worst-useless precisely during the incident class these
# metrics exist to diagnose. Discovery is therefore done with a ScrapeConfig
# using node service discovery — see postInstall/scrapeconfig-kube-etcd.yaml.
#
# enabled stays true because the bundled etcd alert/recording rules are gated on
# it as well as on defaultRules.rules.etcd — turning it off renders no etcd rules
# at all, so the metrics would arrive with nothing watching them. Only the
# exporter's own Service and ServiceMonitor are switched off; they are the
# objects that cannot work without a pod to select.
kubeEtcd:
  enabled: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false

# kube-proxy serves /metrics on 127.0.0.1:10249 and is started with no
# metrics-bind-address override, so it is unreachable from Prometheus for the
# same reason the scheduler and controller-manager were — and fixing it needs
# the same kind of machine-config change, which is not in scope here.
kubeProxy:
  enabled: false
