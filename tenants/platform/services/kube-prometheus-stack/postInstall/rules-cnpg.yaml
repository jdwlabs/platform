apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-rules
  namespace: monitoring
spec:
  groups:
    - name: cnpg
      rules:
        - alert: CNPGClusterDown
          expr: cnpg_pg_up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "CNPG instance {{ $labels.pod }} in cluster {{ $labels.cluster }} is down"
            description: "The PostgreSQL instance has been unreachable for more than 1 minute."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#3-postgresql-operations"
        - alert: CNPGReplicationLag
          expr: cnpg_pg_replication_lag > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CNPG replication lag > 30s on {{ $labels.pod }}"
            description: "Replication lag is {{ $value }}s on instance {{ $labels.pod }}."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#3-postgresql-operations"
        - alert: CNPGLongRunningTransaction
          expr: cnpg_pg_long_running_transactions > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Long-running transaction on {{ $labels.pod }}"
            description: "A transaction has been running for over 5 minutes on {{ $labels.pod }}."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#3-postgresql-operations"
    # Cluster-scoped replacements for the cloudnative-pg/cluster chart's HA alert
    # pair. The chart's own CNPGClusterHA* expressions filter by namespace only —
    # unlike the rest of its rule set, which also filters by a per-cluster pod
    # selector — so with two clusters sharing the `database` namespace, each
    # release's copy also fires on the other cluster's series. Both releases
    # exclude the chart pair via cluster.monitoring.prometheusRule.excludeRules;
    # these rules restore HA alerting for postgresql-cluster-prd alone, keeping
    # the chart's names, expressions, thresholds, and labels, plus the same pod
    # selector shape the chart's other rules use. postgresql-cluster-non gets no
    # replacement on purpose: it is pinned to instances: 1 (no standby by
    # design), so an HA alert there is permanent noise, not signal — see the
    # comment in tenants/platform/services/postgresql-cluster-non/values.yaml.
    - name: cnpg-ha-postgresql-cluster-prd
      rules:
        - alert: CNPGClusterHACritical
          expr: |
            max by (job) (cnpg_pg_replication_streaming_replicas{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"} - cnpg_pg_replication_is_wal_receiver_up{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"}) < 1
          for: 5m
          labels:
            severity: critical
            namespace: database
            cnpg_cluster: platform-postgresql-cluster-prd
          annotations:
            summary: "CNPG Cluster has no standby replicas!"
            description: >-
              CloudNativePG Cluster "{{ $labels.job }}" has no ready standby
              replicas. The cluster is at severe risk of data loss and downtime
              if the primary instance fails.
            runbook_url: "https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHACritical.md"
        - alert: CNPGClusterHAWarning
          expr: |
            max by (job) (cnpg_pg_replication_streaming_replicas{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"} - cnpg_pg_replication_is_wal_receiver_up{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"}) < 2
          for: 5m
          labels:
            severity: warning
            namespace: database
            cnpg_cluster: platform-postgresql-cluster-prd
          annotations:
            summary: "CNPG Cluster less than 2 standby replicas."
            description: >-
              CloudNativePG Cluster "{{ $labels.job }}" has only {{ $value }}
              ready standby replicas, putting the cluster at risk if another
              instance fails.
            runbook_url: "https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterHAWarning.md"
    # An inactive slot pins WAL until its consumer returns. On 2026-11-06 the
    # slot of a dead prd replica did so for ~34h until the volume filled and
    # prd stopped taking writes; the cluster's max_slot_wal_keep_size now
    # bounds that, but the slot is then invalidated and the replica has to be
    # recovered, so it is worth knowing about long before either happens.
    # Primary only: CNPG mirrors every HA slot onto each standby, where the
    # copies are always inactive, so an unscoped `active == 0` never clears.
    - name: cnpg-slots-postgresql-cluster-prd
      rules:
        - alert: CNPGReplicationSlotInactive
          expr: |
            (
              cnpg_pg_replication_slots_active{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"} == 0
            )
            and on (namespace, pod)
            (
              cnpg_pg_replication_in_recovery{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"} == 0
            )
          for: 30m
          labels:
            severity: warning
            namespace: database
            cnpg_cluster: platform-postgresql-cluster-prd
          annotations:
            summary: "Replication slot {{ $labels.slot_name }} on {{ $labels.pod }} has been inactive for 30m"
            description: >-
              Slot {{ $labels.slot_name }} ({{ $labels.slot_type }}) on primary {{ $labels.pod }} has had no
              consumer for 30 minutes and is retaining WAL. A `_cnpg_` slot names the replica that stopped
              streaming: check that instance's pod and its CNPGInstanceMetricsAbsent / CNPGClusterHA* alerts.
              Retained WAL is capped by max_slot_wal_keep_size (4GB, about 20h of idle WAL); past it the slot
              is invalidated and the replica has to catch up from the WAL archive, so check that
              CNPGWALArchivingStalled is not firing too. A slot that is not CNPG's own is a client that went
              away: drop it if nothing will reconnect.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#3-postgresql-operations"
    # The WAL archive (Barman Cloud plugin to the TrueNAS MinIO) is prd's
    # point-in-time restore and the only copy of its data off the cluster
    # besides the 6-hourly dump. archive_timeout (5min) closes a segment at
    # least every 5 minutes, so 15 minutes with no successful archive means
    # archiving is broken, not idle. It is critical because unarchived WAL is
    # not capped by max_slot_wal_keep_size: it accumulates in pg_wal at about
    # 4.7GB a day and stops prd writes when the 16Gi volume fills, roughly
    # three days in. CNPG exports pg_stat_archiver from the primary only; the
    # in_recovery guard keeps a standby's frozen copy out if that changes.
    - name: cnpg-archive-postgresql-cluster-prd
      rules:
        # 10 minutes past the last success, held for 5: 15 minutes in all.
        # The hold keeps a switchover quiet. A promoted standby reports the
        # archiver statistics it had when it was last primary (they survive a
        # clean restart), often days old, until its first archive a few
        # seconds after promotion.
        - alert: CNPGWALArchivingStalled
          expr: |
            (
              cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"} >= 600
            )
            and on (namespace, pod)
            (
              cnpg_pg_replication_in_recovery{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"} == 0
            )
          for: 5m
          labels:
            severity: critical
            namespace: database
            cnpg_cluster: platform-postgresql-cluster-prd
            reason: archive-age
          annotations:
            summary: "No WAL archived from {{ $labels.pod }} for 15 minutes or more"
            description: >-
              Primary {{ $labels.pod }} has not archived a WAL segment to MinIO (bucket cnpg-prd) for at
              least 15 minutes (seconds since the last success, -1 if none: {{ $value }}). The recovery
              point is growing and unarchived WAL is filling pg_wal (about 4.7GB a day, no cap); prd stops
              taking writes when the volume fills. Check the plugin-barman-cloud sidecar log in that pod,
              MinIO at 192.168.1.205:9000, and the postgresql-cluster-prd-barman-s3 secret.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#33-wal-archive-and-point-in-time-restore"
        # CNPG reports -1 when the instance has never archived anything (a
        # new primary, or statistics lost in a crash), which the rule above
        # reads as healthy forever. Still -1, with attempts failing, for 15
        # minutes straight pages under the same name. A single failure
        # followed by a success leaves -1 and resets the hold.
        - alert: CNPGWALArchivingStalled
          expr: |
            (
              cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"} == -1
            )
            and on (namespace, pod)
            (
              increase(cnpg_pg_stat_archiver_failed_count{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"}[5m]) > 0
            )
            and on (namespace, pod)
            (
              cnpg_pg_replication_in_recovery{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"} == 0
            )
          for: 15m
          labels:
            severity: critical
            namespace: database
            cnpg_cluster: platform-postgresql-cluster-prd
            reason: never-archived
          annotations:
            summary: "No WAL archived from {{ $labels.pod }} for 15 minutes or more"
            description: >-
              Primary {{ $labels.pod }} has not archived a WAL segment to MinIO (bucket cnpg-prd) for at
              least 15 minutes (seconds since the last success, -1 if none: {{ $value }}). The recovery
              point is growing and unarchived WAL is filling pg_wal (about 4.7GB a day, no cap); prd stops
              taking writes when the volume fills. Check the plugin-barman-cloud sidecar log in that pod,
              MinIO at 192.168.1.205:9000, and the postgresql-cluster-prd-barman-s3 secret.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#33-wal-archive-and-point-in-time-restore"
        # The plugin reports these from the ObjectStore's status, the same value
        # on every instance, hence the max. A failure stays visible until a
        # later backup succeeds; the next scheduled one is a week away, so the
        # runbook says how to take one by hand.
        - alert: CNPGBaseBackupFailed
          expr: |
            max by (namespace) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"})
            >
            max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"})
          labels:
            severity: warning
            cnpg_cluster: platform-postgresql-cluster-prd
          annotations:
            summary: "The last base backup of platform-postgresql-cluster-prd failed"
            description: >-
              The most recent base backup to MinIO failed and none has succeeded since. WAL archiving is
              separate and may still be working, but point-in-time restore depends on a base backup inside
              the 30-day window. Read the failed Backup object (kubectl -n database get backups) and the
              plugin-barman-cloud sidecar log on the instance that took it.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#33-wal-archive-and-point-in-time-restore"
        # What CNPGBaseBackupFailed cannot see: a schedule that never runs,
        # backups that quietly stop, or the plugin's metrics disappearing (for
        # example it can no longer read the ObjectStore). Weekly schedule plus
        # a day of slack. Before the first backup the timestamp is 0, which
        # reads as stale; the hour's hold covers the backup taken on creation.
        - alert: CNPGBaseBackupStale
          expr: |
            (
              time() - max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"})
              > 8 * 86400
            )
            or
            absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", pod=~"platform-postgresql-cluster-prd-([1-9][0-9]*)$"})
          for: 1h
          labels:
            severity: warning
            namespace: database
            cnpg_cluster: platform-postgresql-cluster-prd
          annotations:
            summary: "No recent base backup of platform-postgresql-cluster-prd"
            description: >-
              The newest base backup in MinIO is more than 8 days old, or the plugin is not reporting
              backups at all. Point-in-time restore needs a base backup inside the 30-day window. Check the
              ScheduledBackup and recent Backups (kubectl -n database get scheduledbackups,backups) and the
              plugin-barman-cloud sidecar log.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#33-wal-archive-and-point-in-time-restore"
