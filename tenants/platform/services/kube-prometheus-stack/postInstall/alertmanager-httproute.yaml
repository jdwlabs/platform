apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - alertmanager.jdwlabs.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: AuthenticationFilter
            name: alertmanager-auth
      backendRefs:
        - group: ""
          kind: Service
          name: platform-kube-prometheus-s-alertmanager
          port: 9093
          weight: 1
