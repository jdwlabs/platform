apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          templates:
            - /etc/alertmanager/configmaps/alertmanager-templates/*.tmpl
          route:
            group_by: ['alertname', 'namespace']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            receiver: 'discord'
            routes:
              # Deliberately-silenced alertnames are dropped first, above every
              # other route. Routing takes the first matching sibling, so a
              # 'null' route placed lower only drops what no earlier sibling
              # already claimed — a silenced alertname that happened to carry a
              # `tenant` label or a matching severity would be notified on
              # instead. At the top, silenced means silenced whatever else the
              # alert is labeled with.
              - matchers:
                  - alertname = "Watchdog"
                receiver: 'null'
              - matchers:
                  - alertname = "InfoInhibitor"
                receiver: 'null'
              # Mirror critical/warning alerts to the AI-SRE agent for RCA.
              # `continue` resumes at the next *sibling* — it never falls back
              # to the parent's receiver, so a matching alert reaches a human
              # only if some later sibling also matches it. That is what the
              # critical route at the bottom of this list exists for.
              - matchers:
                  - severity =~ "critical|warning"
                receiver: 'ai-sre'
                continue: true
              # Tenant-labeled alerts (PrometheusRule rules carrying `tenant`)
              # route here explicitly rather than falling through to the parent
              # default, so the match path is provable per tenant and ready to
              # point at a distinct receiver later without touching alert-rule
              # labels. Both stay on 'discord' for now — no tenant has asked
              # for a separate channel yet.
              - matchers:
                  - tenant = "jdwlabs"
                receiver: 'discord'
              - matchers:
                  - tenant = "dotablaze-tech"
                receiver: 'discord'
              # Human-visible fallback for the AI-SRE path. The relay is a
              # processing path, not a notification path: when it is wedged,
              # rejecting, or dark, nothing else puts an alert in front of a
              # person. Critical only — every severity here would duplicate the
              # chart's large warning population into the channel the relay
              # posts investigations to, when both webhooks point at the same
              # one (this receiver and the relay read their Discord URLs from
              # separate Vault paths, so that is a deployment choice, not a
              # config guarantee). A channel people mute is the failure this
              # route exists to prevent. Warnings stay observable in the
              # Alertmanager and Grafana UIs, and the relay's own
              # dead-man's-switch alerts are critical so that "the processing
              # path is dark" itself arrives here.
              #
              # Must stay last: below the tenant routes so those keep owning
              # their own alerts and stay free to point somewhere else later.
              # Silenced alertnames are already out of this matcher's reach —
              # the 'null' routes at the top of the list claim them first.
              - matchers:
                  - severity = "critical"
                receiver: 'discord'
          inhibit_rules:
            - source_matchers:
                - severity = "critical"
              target_matchers:
                - severity = "warning"
              equal: ['alertname', 'namespace']
          receivers:
            - name: 'null'
            - name: 'ai-sre'
              webhook_configs:
                # Relay receives the raw alert, drives a Holmes investigation,
                # and fans out to Discord + Jira + a gated PR.
                - url: 'http://ai-sre-relay.ai-sre.svc.cluster.local:8080/webhook'
                  send_resolved: false
                  # The relay's downstream is paid and side-effecting, and
                  # nothing restricts reaching it — ai-sre renders allow-all
                  # ingress, so ClusterIP is not the control here regardless of
                  # the policy engine's state. The relay ignores this header until
                  # its own token is set, which is what lets this side ship
                  # first without a window where alerts are rejected.
                  http_config:
                    authorization:
                      type: Bearer
                      credentials: "{{ .webhook_token }}"
            - name: 'discord'
              discord_configs:
                - webhook_url: "{{ .discord_webhook_url }}"
                  send_resolved: true
                  title: '{{ `{{ template "discord.title" . }}` }}'
                  message: '{{ `{{ template "discord.message" . }}` }}'
  data:
    - secretKey: discord_webhook_url
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: alertmanager
        property: discord_webhook_url
    # Read from the relay's own kv path rather than copied into this one, so
    # the receiver and the relay can never present different tokens.
    - secretKey: webhook_token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: holmes
        property: webhook_token
