apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          templates:
            - /etc/alertmanager/configmaps/alertmanager-templates/*.tmpl
          route:
            group_by: ['alertname', 'namespace']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            receiver: 'discord'
            routes:
              # Mirror critical/warning alerts to the AI-SRE agent for RCA, then
              # continue so the default 'discord' receiver still notifies humans.
              - matchers:
                  - severity =~ "critical|warning"
                receiver: 'ai-sre'
                continue: true
              # Tenant-labeled alerts (PrometheusRule rules carrying `tenant`)
              # route here explicitly rather than falling through to the parent
              # default, so the match path is provable per tenant and ready to
              # point at a distinct receiver later without touching alert-rule
              # labels. Both stay on 'discord' for now — no tenant has asked
              # for a separate channel yet.
              - matchers:
                  - tenant = "jdwlabs"
                receiver: 'discord'
              - matchers:
                  - tenant = "dotablaze-tech"
                receiver: 'discord'
              - matchers:
                  - alertname = "Watchdog"
                receiver: 'null'
              - matchers:
                  - alertname = "InfoInhibitor"
                receiver: 'null'
          inhibit_rules:
            - source_matchers:
                - severity = "critical"
              target_matchers:
                - severity = "warning"
              equal: ['alertname', 'namespace']
          receivers:
            - name: 'null'
            - name: 'ai-sre'
              webhook_configs:
                # Relay receives the raw alert, drives a Holmes investigation,
                # and fans out to Discord + Jira + a gated PR.
                - url: 'http://ai-sre-relay.ai-sre.svc.cluster.local:8080/webhook'
                  send_resolved: false
                  # The relay's downstream is paid and side-effecting, and
                  # NetworkPolicy is unenforced cluster-wide, so ClusterIP is
                  # not the control here. The relay ignores this header until
                  # its own token is set, which is what lets this side ship
                  # first without a window where alerts are rejected.
                  http_config:
                    authorization:
                      type: Bearer
                      credentials: "{{ .webhook_token }}"
            - name: 'discord'
              discord_configs:
                - webhook_url: "{{ .discord_webhook_url }}"
                  send_resolved: true
                  title: '{{ `{{ template "discord.title" . }}` }}'
                  message: '{{ `{{ template "discord.message" . }}` }}'
  data:
    - secretKey: discord_webhook_url
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: alertmanager
        property: discord_webhook_url
    # Read from the relay's own kv path rather than copied into this one, so
    # the receiver and the relay can never present different tokens.
    - secretKey: webhook_token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: holmes
        property: webhook_token
