apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage-integrity-rules
  namespace: monitoring
spec:
  groups:
    # Capacity is already covered by storage-capacity-rules. This group is about
    # a volume that is present and the right size but no longer writable, which
    # until now produced no signal at all: an iSCSI session dropped, ext4 aborted
    # its journal and latched the mount read-only, and the first anyone knew was
    # the application crashlooping on EROFS.
    #
    # Both rules are deliberately cluster-wide. Neither underlying metric even
    # carries a namespace — they are node- and kubelet-level — and any tenant's
    # volume can latch, including tenants that define no services of their own
    # and so have nothing else watching them.
    - name: storage-integrity
      rules:
        # Reads the ro flag on the CSI staging mounts, where every attached PVC
        # is staged before any pod binds it. The per-pod bind mounts under
        # /var/lib/kubelet/pods/... share that same superblock, so the staging
        # mount is the complete picture, not a sample.
        #
        # This selector depends on the narrowed
        # collector.filesystem.mount-points-exclude in the service values.yaml:
        # the chart ships node-exporter excluding all of /var/lib/kubelet, and
        # against that default this expression matches an empty vector and can
        # never fire. The two have to move together.
        #
        # What this does NOT catch, and the reason the runbook entry matters more
        # than the rule: since Linux 6.12 ext4's error handler no longer sets
        # SB_RDONLY when it gives up on a filesystem — it sets an internal
        # emergency-read-only flag instead, because flipping the superblock needs
        # a lock it cannot safely take from an error path. Writes fail with EROFS
        # exactly as before, but /proc/mounts still says rw, so this expression
        # stays 0 through the whole event. It fires for a genuine remount, and
        # for a target that presents its LUN read-only. It did not, and could
        # not, fire for the incident that prompted it.
        #
        # It is still the only rule here that can detect the latch at all: the
        # staging-failure rule below sees the recovery, never the event. So the
        # exporter override this depends on is load-bearing, not a nicety —
        # reverting it removes the last detector rather than degrading one.
        - alert: FilesystemReadOnly
          expr: node_filesystem_readonly{mountpoint=~"/var/lib/kubelet/plugins/kubernetes.io/csi/.+/globalmount"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "CSI volume mounted read-only on {{ $labels.instance }}"
            description: "{{ $labels.mountpoint }} on {{ $labels.instance }} ({{ $labels.device }}) is mounted read-only. Writes to the workload using it are failing with EROFS."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"
        # This does NOT detect the read-only latch, and must not be read as if
        # it did. While a volume is latched the CSI layer is never called at all
        # — it is already staged, so the node plugin logs nothing and the
        # VolumeAttachment stays true; observed twice. What this catches is the
        # recovery failing: once the pod is deleted the volume is unstaged and
        # restaged, the iSCSI driver preens it with fsck before mounting, and
        # fsck refuses anything needing a decision, so a filesystem left damaged
        # by an aborted journal fails to stage over and over instead of mounting
        # and going unwritable again. Any driver's staging failures are worth
        # the same alert, so this is deliberately not scoped to one.
        #
        # Scoped to NodeStageVolume alone. Publish is the per-pod bind of an
        # already-staged volume and never reaches the fsck path, so its failures
        # are a different and far more common class — two democratic-csi
        # releases and Longhorn all report here, and folding them in would make
        # any unrelated drip anywhere hold this alert open.
        #
        # instance is kept in the aggregation so a firing alert names the node
        # to go and look at; the metric carries no volume identity, so it cannot
        # name the volume and the annotations do not pretend otherwise.
        #
        # The window and the hold are what separate a stuck volume from an
        # ordinary one. A single failure — a journal replay reporting "errors
        # corrected", which is a success the driver surfaces as an error — keeps
        # the rate positive for ten minutes and then stops, short of the hold. A
        # volume that cannot be staged is retried on kubelet's backoff well
        # inside that window, so the rate never falls back to zero.
        - alert: CSIVolumeStagingFailing
          expr: sum by (instance, driver_name, method_name) (rate(csi_operations_seconds_count{method_name=~".*/NodeStageVolume", grpc_status_code!="OK"}[10m])) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.driver_name }} cannot stage a volume on {{ $labels.instance }}"
            description: "{{ $labels.method_name }} on {{ $labels.instance }} has been failing for 15m at {{ $value | humanize }}/s. A workload there is stuck without its volume; the metric does not name which one. If the driver runs fsck on stage, the filesystem likely needs manual repair."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"
