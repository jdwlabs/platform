apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: job-freshness-rules
  namespace: monitoring
spec:
  groups:
    # Scheduled work fails in a way ordinary liveness checks are blind to: the
    # pod is Up, the schedule fires, the container exits 0, and nothing is
    # produced. A backup sidecar here ran twice daily for months writing zero
    # archives, and every signal the cluster had said healthy.
    #
    # Two independent failure modes follow from that, and conflating them is
    # why it went unnoticed: a job that stopped running or stopped completing,
    # which kube-state-metrics can see; and a job that ran, exited 0 and
    # produced nothing, which only something looking at the artifact can see.
    # The first three rules below cover the first mode for every CronJob in
    # the cluster with no opt-in. The rest cover the second, reading the
    # gauges a producer publishes about its own output under the contract in
    # docs/observability/JOB-OUTPUT-FRESHNESS.md.
    - name: job-output-freshness
      rules:
        # 24h is four times the interval of the slowest CronJob in this repo
        # (postgres-backup, every 6h), so no single missed or slow run can
        # trip it, while a job that has quietly stopped succeeding is caught
        # within a day. A CronJob scheduled less often than every 6h needs its
        # own rule rather than a bumped threshold here — see the doc.
        - alert: CronJobHasNotSucceededRecently
          expr: |
            (time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time)) > 86400
            and on (namespace, cronjob) max by (namespace, cronjob) (kube_cronjob_spec_suspend) == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded in 24h"
            description: "Last successful completion was {{ $value | humanizeDuration }} ago. The CronJob is not suspended, so it is either failing, not being scheduled, or its jobs are never completing."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # kube-state-metrics only emits last_successful_time once a job has
        # actually completed, so a CronJob that has never once succeeded has no
        # series at all and is invisible to the rule above — the failure mode
        # where something is merrily scheduled from the day it ships and has
        # never worked. Same 24h grace, measured from creation.
        - alert: CronJobNeverSucceeded
          expr: |
            (
              (time() - max by (namespace, cronjob) (kube_cronjob_created)) > 86400
              unless on (namespace, cronjob) max by (namespace, cronjob) (kube_cronjob_status_last_successful_time)
            )
            and on (namespace, cronjob) max by (namespace, cronjob) (kube_cronjob_spec_suspend) == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has never completed successfully"
            description: "The CronJob was created over 24h ago and kube-state-metrics has never recorded a successful completion for it."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # Catches a failing job hours before the 24h rule does, by comparing
        # when the CronJob last fired against when it last worked.
        #
        # The `for:` here is load-bearing and must stay longer than any covered
        # job's normal runtime: between a schedule firing and that run
        # completing, last_schedule_time has advanced while
        # last_successful_time has not, so the difference legitimately spikes
        # to a full interval on every healthy run. 1h is longer than any job
        # here takes, so a healthy run always resolves the condition before it
        # fires, while a genuinely failing run holds it true indefinitely.
        - alert: CronJobLastRunDidNotSucceed
          expr: |
            (
              max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time)
              - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time)
            ) > 3600
            and on (namespace, cronjob) max by (namespace, cronjob) (kube_cronjob_spec_suspend) == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} fired but has not succeeded since"
            description: "{{ $labels.cronjob }} was last scheduled {{ $value | humanizeDuration }} after its last success, and has stayed that way for an hour. The most recent run is failing or hanging."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # Everything above reads kube-state-metrics, so it can only ever
        # describe the process: whether a job ran and what it exited with. The
        # rules below read the artifact instead, and they exist because this
        # cluster has now twice had a backup that satisfied every process-level
        # check while producing nothing.
        #
        # They were held back until something emitted the metrics rather than
        # shipped in advance, because a rule matching no series looks exactly
        # like a rule that is passing — the same false assurance that caused
        # the original incident. The first producer is the Minecraft world
        # backup in the jdwillmsen tenant's deployment repo, whose exporter
        # derives its gauges from the archive directory itself.
        #
        # The thresholds are not restated here. Each producer publishes its own
        # budget as backup_max_age_seconds, so adopting this needs three
        # numbers from a new job and no change to these rules.
        #
        # The `artifact` label is conditional in the contract — a producer with
        # one artifact class may omit it — so the budget can arrive either per
        # artifact or once for the whole job. A default vector match would
        # silently pair nothing in the mixed case (per-artifact timestamps, one
        # job-level budget) and this alert would never fire, which is the exact
        # false assurance it exists to remove. Both shapes are matched
        # explicitly: the per-artifact budget wins where one is published, and
        # only artifacts with no budget of their own fall through to the
        # job-level one.
        - alert: BackupArtifactStale
          expr: |
            (
              (time() - max by (backup_job, artifact) (backup_last_success_timestamp_seconds))
              > on (backup_job, artifact) group_left()
                max by (backup_job, artifact) (backup_max_age_seconds)
            )
            or
            (
              (
                (time() - max by (backup_job, artifact) (backup_last_success_timestamp_seconds))
                unless on (backup_job, artifact) (backup_max_age_seconds)
              )
              > on (backup_job) group_left() max by (backup_job) (backup_max_age_seconds)
            )
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Backup {{ $labels.backup_job }} has produced no fresh artifact"
            description: "Last verified artifact for {{ $labels.backup_job }} is {{ $value | humanizeDuration }} old, past the freshness budget the job publishes for itself."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        - alert: BackupArtifactEmpty
          expr: max by (backup_job, artifact) (backup_last_artifact_bytes) == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Backup {{ $labels.backup_job }} produced an empty artifact"
            description: "The most recent artifact for {{ $labels.backup_job }} is zero bytes. The job completed successfully and wrote nothing."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # Without this, deleting the exporter that publishes the two metrics
        # above silently disables both — the same disappearing-series problem
        # the alerts themselves exist to catch, moved up one layer.
        #
        # Per producer, not cluster-wide. A bare
        # absent(backup_last_success_timestamp_seconds) is satisfied by any one
        # producer still reporting, so the moment a second one exists the first
        # can go dark unnoticed — and BackupArtifactStale goes quiet with it,
        # because a vanished series cannot be compared against anything.
        #
        # count_over_time is what makes a disappearance visible at all: the
        # left side keeps reporting a producer for as long as the lookback
        # window still holds one of its samples, while the right side drops it
        # as soon as scraping stops. The window is therefore how long this can
        # keep complaining. 14d is sized against Prometheus' own 15d retention
        # — there is no reason to set it shorter, since samples older than
        # retention cannot be counted anyway.
        #
        # It still expires, and that matters more than the number. When the
        # last sample ages out this alert stops firing and Alertmanager sends a
        # **resolved** notification, which reads as recovery for a producer
        # that is still dead. Nothing derived from a metric can do better: once
        # the series is gone there is no evidence left that it should exist. A
        # producer that must never silently disappear therefore needs a static
        # expectation naming it, which cannot expire because it is not derived
        # from anything — see the tenant's own rules and the "Adopting this"
        # section of the contract doc.
        - alert: BackupFreshnessSignalMissing
          expr: |
            count by (backup_job) (count_over_time(backup_last_success_timestamp_seconds[14d]))
            unless
            count by (backup_job) (backup_last_success_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Backup {{ $labels.backup_job }} has stopped publishing a freshness signal"
            description: "{{ $labels.backup_job }} stopped publishing its freshness gauges over an hour ago: exporter down, unscraped, or deleted, so no other backup alert can fire for it. This expires 14d after the last sample and resolves itself: the lookback ran out, not a recovery."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # A producer that publishes a timestamp but no budget gets no staleness
        # alert at all: both branches of BackupArtifactStale need a budget
        # series to compare against, and one that is missing matches nothing.
        # Same for size — BackupArtifactEmpty cannot fire without
        # backup_last_artifact_bytes. Neither is reachable for a producer that
        # emits all its gauges from one block, but the contract invites the
        # next one to adopt this by "emitting the gauges", and a half-adopted
        # contract that reports nothing is indistinguishable from a healthy
        # backup. These two rules are what make partial adoption say so.
        - alert: BackupBudgetMissing
          expr: |
            count by (backup_job) (backup_last_success_timestamp_seconds)
            unless on (backup_job)
            count by (backup_job) (backup_max_age_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Backup {{ $labels.backup_job }} publishes no freshness budget"
            description: "{{ $labels.backup_job }} reports a success timestamp but no backup_max_age_seconds, so BackupArtifactStale has nothing to compare it against and can never fire for it. The producer is publishing an incomplete gauge set."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        - alert: BackupArtifactSizeMissing
          expr: |
            count by (backup_job) (backup_last_success_timestamp_seconds)
            unless on (backup_job)
            count by (backup_job) (backup_last_artifact_bytes)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Backup {{ $labels.backup_job }} publishes no artifact size"
            description: "{{ $labels.backup_job }} reports a success timestamp but no backup_last_artifact_bytes, so BackupArtifactEmpty can never fire for it — the zero-byte artifact case is unmonitored for this producer."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # A producer that can quiesce its source publishes whether the copy
        # was taken with the source at rest. "At rest", not "held": a source
        # deliberately scaled to zero is also at rest, and its copy is as
        # consistent as a held one. Reading the gauge as "was save hold issued"
        # is the bug — it bills every planned shutdown as a degraded run, and
        # warning routes to the AI-SRE receiver, which files a ticket and
        # repeats it every 4h for the whole outage. This cluster has had that
        # argument once already on a different alert.
        #
        # So the discrimination lives in the producer, where the evidence is,
        # and it turns on the source's *desired* replica count rather than
        # anything the backup observed. Unreachable and switched-off look
        # identical from inside a job that cannot reach either. Desired state
        # is the only thing that separates them, and it is why a pod sitting
        # at one replica and crashlooping — the 2026-08-19 shape — still
        # alerts: nobody asked for it to be down. A replica count that cannot
        # be read publishes 0 here, so the unknown case alerts too.
        #
        # Warning, not critical: the artifact exists and is restorable, which
        # is the difference between this and the two rules above. Nothing here
        # is conditional on that judgement — an artifact that is missing or
        # empty pages regardless of what the source was doing, deliberate stop
        # included, because a stop is not a licence to produce nothing.
        - alert: BackupArtifactNotQuiesced
          expr: max by (backup_job, artifact) (backup_last_artifact_quiesced) == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Backup {{ $labels.backup_job }} fell back to an unquiesced copy"
            description: "The newest artifact for {{ $labels.backup_job }} was taken without its source at rest — the source was meant to be running and the job could not reach it. The archive is usable; why the source was unreachable is what needs looking at."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"
