apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: truenas-rules
  namespace: monitoring
spec:
  groups:
    # Every alert here was checked against a live capture of what the NAS
    # actually pushes (476 distinct Graphite paths, 2026-08-17) and against the
    # mapping in truenas-graphite-exporter's ConfigMap. The previous version of
    # this file alerted on truenas_zfs_pool_state, truenas_disk_space_*_gib and
    # truenas_disk_temperature_celsius — none of which any TrueNAS SCALE 25.10
    # collector emits, so seven of its nine rules could not fire under any
    # condition. They are deleted rather than left in place: a rule keyed on a
    # series that does not exist reads as coverage on a dashboard and is worse
    # than no rule at all.
    #
    # What is deliberately NOT alerted on, so the omissions are not mistaken
    # for oversights:
    #   - Pool health, pool/dataset capacity and SMART. The Graphite push
    #     carries none of them on this version; they are only reachable over
    #     the TrueNAS API, which needs a credential this cluster does not yet
    #     hold. See docs/adr/0025 and JDWLABS-367.
    #   - Disk busy percent. Pinned at ~100 for the whole duration of a scrub
    #     or resilver, which is routine on a 20TB vdev.
    - name: truenas-host
      rules:
        # An unexpected restart is the event that actually costs something —
        # every PVC on the truenas-nfs and truenas-iscsi classes hangs while
        # the host is down. It is caught here rather than through temperature
        # because the cause is not established: the host has come back on its
        # own after a two-hour absence, which no thermal cutout explains, so a
        # temperature rule would have attributed it wrongly.
        #
        # Keyed on uptime rather than on the blackbox probe because the probe
        # cannot separate a reboot from a cable or switch fault, and because
        # this survives a short outage that the probe's own `for:` window
        # would swallow. It fires on deliberate reboots too — an upgrade will
        # trip it — which is the intended trade for catching every unplanned
        # one.
        - alert: TrueNASRestarted
          expr: |
            truenas_uptime_seconds < 900
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS {{ $labels.host }} restarted {{ $value | humanizeDuration }} ago"
            description: >-
              The NAS reports an uptime under 15m, so it has restarted. If the
              restart was not deliberate, the cause is not visible from the
              cluster — the Graphite push carries no power, PSU or thermal-event
              data. Read the host's own logs and its UPS service state, and
              check whether the restart coincided with heavy pool IO.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

        # 95C is not a fault on this hardware, it is the part's design limit:
        # AM5 desktop Ryzen boosts until it reaches Tjmax and then regulates
        # there, so brief excursions to exactly 95C are the CPU working as
        # intended and must not page anyone. The X3D parts cap at 89C instead
        # — if this board ever carries one, both figures below drop by 6C.
        #
        # What is worth knowing is *sustained* saturation: a pool scrub is a
        # light enough load that a correctly sized and correctly mounted
        # cooler should not pin the package at its limit for a quarter of an
        # hour. That is a cooling-capacity signal, not a workload one, so the
        # threshold sits at the limit and the duration does the discriminating.
        #
        # The 62C figure that five days of history shows as this host's idle
        # baseline is not its healthy one. Immediately after a power cycle the
        # same host reported 34-42C under an identical pool workload, which
        # means the whole retained window was recorded with cooling already
        # degraded. Treat 35-40C as the reference and 62C as evidence of the
        # fault, not as normal.
        #
        # An earlier revision excluded this series entirely on the belief that
        # it "swings 70-105C on an idle NAS" — the measured distribution is far
        # tighter than that, so the exclusion goes, but the conclusion it
        # reached (no useful threshold without knowing Tjmax) was right, and a
        # first pass at 85C here would have paged on routine scrubs.
        #
        # The recurrence detector for the fault above. With cooling working the
        # package sits at 35-40C under a full pool scrub, so 80C sustained is
        # nowhere near reachable on this workload and can only mean heat is no
        # longer leaving the block — the same signature that preceded two
        # power-cycles inside half an hour. Set below Tjmax on purpose: by the
        # time the part is regulating at its limit the margin is already gone,
        # and this needs to fire while there is still time to shed load.
        - alert: TrueNASCPUCoolingDegraded
          expr: |
            truenas_cpu_temperature_celsius >= 80
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS {{ $labels.host }} CPU at {{ $value }}C — cooling suspect"
            description: >-
              The CPU package on {{ $labels.host }} has held at or above 80C
              for 10m, against a 35-40C reference under full pool load. Heat is
              not leaving the CPU: check that the fan is actually spinning, and
              check the fan header and curve before anything else. The host has
              previously power-cycled twice in 26 minutes in this state, taking
              every PVC on the truenas-nfs and truenas-iscsi classes with it.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

        - alert: TrueNASCPUThermallySaturated
          expr: |
            truenas_cpu_temperature_celsius >= 95
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS {{ $labels.host }} CPU pinned at Tjmax ({{ $value }}C)"
            description: >-
              The CPU package on {{ $labels.host }} has sat at its thermal
              limit for 15m, so the part is throttling rather than idling
              between boosts. Under a pool scrub that points at cooling
              capacity — heatsink mounting, fan curve, dust, or case airflow —
              rather than at the workload. Pausing the scrub sheds the load
              but does not fix it.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

        # available, not free: the NAS reports /proc/meminfo-style availability,
        # so reclaimable ARC and page cache are already counted as available.
        # ARC growing to fill RAM is normal ZFS behaviour and must not alert;
        # this fires only when memory is genuinely unreclaimable, which on a NAS
        # means services are about to be OOM-killed and NFS/iSCSI with them.
        - alert: TrueNASMemoryAvailableLow
          expr: |
            truenas_memory_available_bytes / truenas_memory_total_bytes < 0.10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS {{ $labels.host }} has under 10% memory available"
            description: "{{ $labels.host }} reports {{ $value | humanizePercentage }} of RAM available. This already accounts for reclaimable ARC, so it is real pressure rather than ZFS caching. Expect NFS and iSCSI latency before anything is killed."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

        # nfsd counts RPCs it refused. Sustained non-zero means clients are
        # being turned away — a share's allowed-networks list no longer covers
        # a node, or mapall/maproot changed — which surfaces as PVCs failing to
        # mount rather than as anything visible on the NAS itself. Both values
        # were a flat zero across the whole capture, so any sustained movement
        # is signal.
        - alert: TrueNASNFSBadRPCCalls
          expr: |
            truenas_nfsd_rpc_bad_calls_per_second > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS is rejecting NFS RPCs ({{ $labels.reason }})"
            description: "nfsd on {{ $labels.host }} has been refusing {{ $value }} RPC/s for 15m with reason={{ $labels.reason }}. Check the NFS share's allowed networks and mapall settings against the node addresses; PVCs on the truenas-nfs class will fail to mount."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

    - name: truenas-pipeline
      rules:
        # The dead-man's switch, and the one rule that would have caught
        # JDWLABS-335's original defect on day one.
        #
        # It keys on the exporter's own graphite_last_processed_timestamp_seconds
        # rather than on absent() over a mapped series, because that timestamp
        # advances only when a sample is *accepted* by the mapping. Verified on
        # the live exporter while every sample was being dropped: 455,447
        # dropped samples and graphite_last_processed_timestamp_seconds still
        # reading exactly 0. An absent() rule cannot make that distinction —
        # it looks identical whether the NAS stopped pushing or the mapping
        # stopped matching, and the previous version of this rule was keyed on
        # a series that never existed in the first place.
        #
        # Not keyed on graphite_dropped_samples_total either: the mapping
        # deliberately ignores 401 of the 476 pushed paths, so that counter
        # climbs continuously on a perfectly healthy pipeline.
        #
        # The value is 0 for a freshly restarted pod, which makes the
        # expression enormous rather than negative — a restart that cannot
        # accept samples still fires, which is intended.
        - alert: TrueNASMetricsStale
          expr: |
            time() - graphite_last_processed_timestamp_seconds{job="truenas-graphite-exporter"} > 900
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS metrics have stopped being accepted"
            description: >-
              No Graphite sample from the NAS has matched the mapping for over
              15m. Either the NAS stopped pushing, or a TrueNAS upgrade renamed
              the charts and every pattern in truenas-graphite-exporter-mapping
              now misses. Compare graphite_dropped_samples_total: climbing means
              samples arrive but no longer match; flat means nothing is arriving
              at all.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

        # The receiving half of the pipeline, as opposed to the sending half.
        # Distinguishes "the NAS stopped pushing" from "we stopped listening",
        # which are different fixes. Kept unchanged — it was one of only two
        # rules in the original set that could actually fire.
        - alert: TrueNASGraphiteExporterDown
          expr: up{job="truenas-graphite-exporter"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS graphite exporter is not scrapeable"
            description: "The graphite-exporter receiving TrueNAS metrics has been unscrapeable for 10m. Pushed samples are being dropped on the floor; expect TrueNASMetricsStale to follow."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"
