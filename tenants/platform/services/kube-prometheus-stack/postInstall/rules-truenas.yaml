apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: truenas-rules
  namespace: monitoring
spec:
  groups:
    # Every alert here was checked against a live capture of what the NAS
    # actually pushes (476 distinct Graphite paths, 2026-08-17) and against the
    # mapping in truenas-graphite-exporter's ConfigMap. The previous version of
    # this file alerted on truenas_zfs_pool_state, truenas_disk_space_*_gib and
    # truenas_disk_temperature_celsius — none of which any TrueNAS SCALE 25.10
    # collector emits, so seven of its nine rules could not fire under any
    # condition. They are deleted rather than left in place: a rule keyed on a
    # series that does not exist reads as coverage on a dashboard and is worse
    # than no rule at all.
    #
    # What is deliberately NOT alerted on, so the omissions are not mistaken
    # for oversights:
    #   - Disk busy percent. Pinned at ~100 for the whole duration of a scrub
    #     or resilver, which is routine on a 20TB vdev.
    #
    # Pool health, pool/dataset capacity and SMART are covered below, in the
    # truenas-storage-api group — not by this Graphite pipeline, which still
    # cannot carry them, but by a separate API-polling exporter
    # (truenas-prometheus-exporter) added once a read-only, user-linked
    # credential existed to poll with. See docs/adr/0025's addendum.
    - name: truenas-host
      rules:
        # An unexpected restart is the event that actually costs something —
        # every PVC on the truenas-nfs and truenas-iscsi classes hangs while
        # the host is down. It is caught here rather than through temperature
        # because the cause is not established: the host has come back on its
        # own after a two-hour absence, which no thermal cutout explains, so a
        # temperature rule would have attributed it wrongly.
        #
        # Keyed on uptime rather than on the blackbox probe because the probe
        # cannot separate a reboot from a cable or switch fault, and because
        # this survives a short outage that the probe's own `for:` window
        # would swallow. It fires on deliberate reboots too — an upgrade will
        # trip it — which is the intended trade for catching every unplanned
        # one.
        #
        # The retained window bears the temperature-independence out: of the
        # four power-offs it holds, the two on 2026-08-19 came with the package
        # at 92-95C, and the two on 2026-08-25 with it at 35-39C — half the
        # recorded events had no thermal signature at all. All four also fell
        # between 04:19 and 05:27, inside the nightly scheduled-job window.
        #
        # 600s rather than a wider threshold: the alert fires from 2m after
        # boot until uptime crosses 10m, which is long enough to be seen and
        # short enough that back-to-back power-cycles — the recorded pairs were
        # 18 and 25 minutes apart — resolve and refire as distinct events
        # instead of blurring into one episode.
        - alert: TrueNASUnexpectedReboot
          expr: |
            truenas_uptime_seconds < 600
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS {{ $labels.host }} rebooted {{ $value | humanizeDuration }} ago"
            description: >-
              The NAS reports an uptime under 10m, so it has rebooted. If the
              reboot was not deliberate, the cause is not visible from the
              cluster — the Graphite push carries no power, PSU or thermal-event
              data. Read the host's own logs and its UPS service state, and
              check whether the reboot coincided with heavy pool IO; half of
              the recorded power-offs happened with the CPU cool, so do not
              assume a thermal cause.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

        # 95C is not a fault on this hardware, it is the part's design limit:
        # AM5 desktop Ryzen boosts until it reaches Tjmax and then regulates
        # there, so brief excursions to exactly 95C are the CPU working as
        # intended and must not page anyone. The X3D parts cap at 89C instead
        # — if this board ever carries one, both figures below drop by 6C.
        #
        # What is worth knowing is *sustained* saturation: a pool scrub is a
        # light enough load that a correctly sized and correctly mounted
        # cooler should not pin the package at its limit for a quarter of an
        # hour. That is a cooling-capacity signal, not a workload one, so the
        # threshold sits at the limit and the duration does the discriminating.
        #
        # The 62C figure that five days of history shows as this host's idle
        # baseline is not its healthy one. Immediately after a power cycle the
        # same host reported 34-42C under an identical pool workload, which
        # means the whole retained window was recorded with cooling already
        # degraded. Treat 35-40C as the reference and 62C as evidence of the
        # fault, not as normal.
        #
        # An earlier revision excluded this series entirely on the belief that
        # it "swings 70-105C on an idle NAS" — the measured distribution is far
        # tighter than that, so the exclusion goes, but the conclusion it
        # reached (no useful threshold without knowing Tjmax) was right, and a
        # first pass at 85C here would have paged on routine scrubs.
        #
        # Two tiers of one alert, replacing an earlier 80C-for-10m critical and
        # a 95C-for-15m warning, and calibrated against the recorded thermal
        # power-off rather than against generic AM5 guidance:
        #
        #   - warning, >80C for 5m: the recurrence detector. With cooling
        #     working the package has not exceeded 71C in eleven days of the
        #     same workload, scrubs included, so 80C sustained can only mean
        #     heat is no longer leaving the block. On the degraded-cooling days
        #     this tier would have fired during the nightly IO window on each
        #     of the two nights *before* the first power-off — days of notice,
        #     routed to the relay for investigation.
        #   - critical, >90C for 2m: the pre-shutdown ramp. In the recorded
        #     incident the package crossed 90C nine minutes before the host
        #     went dark, and sat at 92-95C for the whole approach; a 2m hold
        #     above 90C pages Discord with roughly seven minutes still on the
        #     clock — enough to pause a scrub and shed load, not enough to
        #     waste on a longer window. Brief boost excursions to Tjmax do not
        #     survive the 2m hold and stay silent, as they must.
        #
        # The warning deliberately keeps no <=90 upper bound: both tiers firing
        # together is the expected shape of the real incident, the same
        # overlapping-tier convention the pool-capacity rules use. That only
        # works if the two tiers have distinct alertnames — alertmanager's
        # inhibit_rules suppress a severity=warning alert once a severity=critical
        # alert with the same alertname is active, which would silently drop
        # this warning the moment the critical tier fired.
        - alert: TrueNASCPUPackageHot
          expr: |
            truenas_cpu_temperature_celsius{sensor="package"} > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS {{ $labels.host }} CPU package at {{ $value }}C — cooling suspect"
            description: >-
              The CPU package on {{ $labels.host }} has held above 80C for 5m,
              against a 35-40C reference under full pool load. Heat is not
              leaving the CPU: check that the fan is actually spinning, and
              check the fan header and curve before anything else. The host has
              previously power-cycled twice in 26 minutes in this state, taking
              every PVC on the truenas-nfs and truenas-iscsi classes with it.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

        - alert: TrueNASCPUPackageCritical
          expr: |
            truenas_cpu_temperature_celsius{sensor="package"} > 90
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS {{ $labels.host }} CPU package at {{ $value }}C — power-off imminent"
            description: >-
              The CPU package on {{ $labels.host }} has held above 90C for 2m —
              the same ramp that preceded a hard power-off by nine minutes.
              Pause any running scrub or resilver from the TrueNAS UI now to
              shed load; that buys minutes, not a fix. A power-off takes every
              PVC on the truenas-nfs and truenas-iscsi classes with it.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

        # truenas_memory_available_bytes is a straight read of this host's
        # /proc/meminfo MemAvailable (traced through TrueNAS's own
        # middlewared.utils.memory.get_memory_info(), which opens
        # /proc/meminfo and returns the MemAvailable line verbatim). That
        # calculation does NOT count ZFS ARC as reclaimable: ARC is allocated
        # through the SPL/kmem layer, not the page cache or SReclaimable slab
        # accounting MemAvailable is built from. This is a known, still-open
        # upstream gap (openzfs/zfs#10255, "ARC not accounted as MemAvailable
        # in /proc/meminfo"), not something specific to this NAS's version.
        #
        # Consequence: on a sequential-read workload ARC grows to fill RAM
        # exactly as designed, and truenas_memory_available_bytes craters
        # right alongside it even though every byte of that ARC is reclaimable
        # on demand. Alerting on that ratio pages on ordinary ZFS caching, not
        # on a problem — the same "confident but backwards" mistake the CPU
        # temperature exclusion comment made elsewhere in this file. It is not
        # used below for that reason; it stays mapped for dashboards only.
        #
        # truenas_arc_available_memory_bytes is a different thing: it is
        # arcstats' own "avail" field, which is ZFS's *own* accounting of
        # memory outside the ARC, computed on Linux as
        # arc_free_memory() - arc_sys_free (module/os/linux/zfs/arc_os.c).
        # The upstream comment on that function is exact: "Positive if there
        # is sufficient free memory, negative indicates the amount of memory
        # that needs to be freed up." ARC watches this value itself to decide
        # whether to shrink, so a brief dip below zero is ARC self-correcting,
        # not an incident — the `for:` window is what separates that from
        # memory the whole system cannot free no matter how much ARC gives
        # back, which is the case worth paging on.
        - alert: TrueNASMemoryAvailableLow
          expr: |
            truenas_arc_available_memory_bytes < 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS {{ $labels.host }} has no memory headroom outside ARC"
            description: "{{ $labels.host }}'s ARC-independent memory headroom has been negative for 15m — ZFS's own signal that it cannot free enough memory, not just that ARC is large. Expect NFS and iSCSI latency before anything is killed."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

        # nfsd counts RPCs it refused. Sustained non-zero means clients are
        # being turned away — a share's allowed-networks list no longer covers
        # a node, or mapall/maproot changed — which surfaces as PVCs failing to
        # mount rather than as anything visible on the NAS itself. Both values
        # were a flat zero across the whole capture, so any sustained movement
        # is signal.
        - alert: TrueNASNFSBadRPCCalls
          expr: |
            truenas_nfsd_rpc_bad_calls_per_second > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS is rejecting NFS RPCs ({{ $labels.reason }})"
            description: "nfsd on {{ $labels.host }} has been refusing {{ $value }} RPC/s for 15m with reason={{ $labels.reason }}. Check the NFS share's allowed networks and mapall settings against the node addresses; PVCs on the truenas-nfs class will fail to mount."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

    - name: truenas-pipeline
      rules:
        # The dead-man's switch, and the one rule that would have caught
        # JDWLABS-335's original defect on day one.
        #
        # It keys on the exporter's own graphite_last_processed_timestamp_seconds
        # rather than on absent() over a mapped series, because that timestamp
        # advances only when a sample is *accepted* by the mapping. Verified on
        # the live exporter while every sample was being dropped: 455,447
        # dropped samples and graphite_last_processed_timestamp_seconds still
        # reading exactly 0. An absent() rule cannot make that distinction —
        # it looks identical whether the NAS stopped pushing or the mapping
        # stopped matching, and the previous version of this rule was keyed on
        # a series that never existed in the first place.
        #
        # Not keyed on graphite_dropped_samples_total either: the mapping
        # deliberately ignores 401 of the 476 pushed paths, so that counter
        # climbs continuously on a perfectly healthy pipeline.
        #
        # The value is 0 for a freshly restarted pod, which makes the
        # expression enormous rather than negative — a restart that cannot
        # accept samples still fires, which is intended.
        - alert: TrueNASMetricsStale
          expr: |
            time() - graphite_last_processed_timestamp_seconds{job="truenas-graphite-exporter"} > 900
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS metrics have stopped being accepted"
            description: >-
              No Graphite sample from the NAS has matched the mapping for over
              15m. Either the NAS stopped pushing, or a TrueNAS upgrade renamed
              the charts and every pattern in truenas-graphite-exporter-mapping
              now misses. Compare graphite_dropped_samples_total: climbing means
              samples arrive but no longer match; flat means nothing is arriving
              at all.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

        # The receiving half of the pipeline, as opposed to the sending half.
        # Distinguishes "the NAS stopped pushing" from "we stopped listening",
        # which are different fixes. Kept unchanged — it was one of only two
        # rules in the original set that could actually fire.
        - alert: TrueNASGraphiteExporterDown
          expr: up{job="truenas-graphite-exporter"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS graphite exporter is not scrapeable"
            description: "The graphite-exporter receiving TrueNAS metrics has been unscrapeable for 10m. Pushed samples are being dropped on the floor; expect TrueNASMetricsStale to follow."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

    # Pool state, dataset capacity, disk temperature and SMART, all read over
    # the TrueNAS JSON-RPC API by truenas-prometheus-exporter
    # (cli/cmd/truenas-prometheus-exporter), not over the Graphite push above.
    # The two-state truenas_zfs_pool_state{state="online"|"degraded"} shape
    # and the truenas_disk_temperature_celsius name are unchanged from the
    # rules docs/adr/0025 deleted — see that file's git history — because the
    # exporter was written to match what these rules already assumed, not the
    # other way around. Everything here is unverified against a live NAS
    # response beyond what docs/adr/0025's own evidence table captured: see
    # that ADR's dated addendum for exactly which fields were, and were not,
    # confirmed live before this group was written.
    - name: truenas-storage-api
      rules:
        # Mirrors truenas-host's restart/thermal comments: DEGRADED means
        # redundancy is gone but the pool still serves data, which is the
        # window in which a second failure becomes fatal.
        - alert: TrueNASPoolDegraded
          expr: max by (pool) (truenas_zfs_pool_state{state="degraded"}) == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS pool {{ $labels.pool }} is DEGRADED"
            description: "ZFS pool {{ $labels.pool }} has lost redundancy. Data is still served but a further disk failure risks the pool. Check pool status and replace the failed vdev member."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # Any state that is neither online nor degraded — faulted, unavail,
        # suspended, removed, offline. The `unless` clause keeps this
        # mutually exclusive with TrueNASPoolDegraded above, the same
        # structure the deleted version of this rule used.
        - alert: TrueNASPoolNotOnline
          expr: |
            max by (pool) (truenas_zfs_pool_state{state="online"}) == 0
            unless max by (pool) (truenas_zfs_pool_state{state="degraded"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS pool {{ $labels.pool }} is not ONLINE"
            description: "ZFS pool {{ $labels.pool }} is faulted, suspended or otherwise not online. Every democratic-csi volume and the Loki chunk store on this pool are affected."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # 85% matches the threshold PVCUsageHigh and LonghornVolumeUsageHigh
        # already use, so one number means the same thing across every
        # storage backend here. used/available are pool.dataset.query's own
        # bytes (docs/adr/0025's live-verified unit), not a rescaled GiB
        # figure — the mistake that made the deleted version of this rule
        # structurally silent.
        - alert: TrueNASPoolCapacityHigh
          expr: |
            truenas_zfs_dataset_used_bytes
              / (truenas_zfs_dataset_used_bytes + truenas_zfs_dataset_available_bytes) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS pool {{ $labels.pool }} above 85% full"
            description: "Pool {{ $labels.pool }} (dataset {{ $labels.dataset }}) is {{ $value | humanizePercentage }} full."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # A copy-on-write filesystem cannot free space by overwriting, so a
        # full pool fails writes *and* the deletes that would fix it.
        - alert: TrueNASPoolCapacityCritical
          expr: |
            truenas_zfs_dataset_used_bytes
              / (truenas_zfs_dataset_used_bytes + truenas_zfs_dataset_available_bytes) > 0.95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS pool {{ $labels.pool }} above 95% full"
            description: "Pool {{ $labels.pool }} (dataset {{ $labels.dataset }}) is {{ $value | humanizePercentage }} full and at real risk of failing writes. Free space or expand the pool now."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # Thresholds match the deleted version of this rule; disk.temperatures
        # (docs/adr/0025) reads SMART directly, cached NAS-side for 5m. Labeled
        # by device name (`disk`), not `serial` — disk.temperatures does not
        # return a serial, so the deleted rule's label was never reachable
        # either.
        - alert: TrueNASDiskTemperatureHigh
          expr: max by (disk) (truenas_disk_temperature_celsius) > 50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS disk {{ $labels.disk }} at {{ $value }}C"
            description: "Disk {{ $labels.disk }} has read above 50C for 15m. Check airflow around that bay before it becomes the critical threshold."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        - alert: TrueNASDiskTemperatureCritical
          expr: max by (disk) (truenas_disk_temperature_celsius) > 60
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS disk {{ $labels.disk }} at {{ $value }}C"
            description: "Disk {{ $labels.disk }} has read above 60C for 10m — real risk of an early failure. Check the fan and airflow for that bay now."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # smart.test.results.query's exact response shape was never live-
        # verified against this NAS (no network path to it from where this
        # exporter was written — see the ADR addendum), so this reads only
        # the two SMART self-test outcomes the exporter is confident enough
        # to classify as pass/fail at all; an unrecognised status emits no
        # metric for that disk rather than a guessed value on either side.
        - alert: TrueNASDiskSmartTestFailed
          expr: truenas_disk_smart_test_passed == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS disk {{ $labels.disk }} failed its SMART self-test"
            description: "The most recent SMART self-test on {{ $labels.disk }} reported failure. Treat this disk as failing and plan a replacement; do not wait for a pool DEGRADED alert, which only fires once redundancy is actually lost."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # The dead-man's switch for this exporter, mirroring
        # TrueNASGraphiteExporterDown's role for the push pipeline.
        - alert: TrueNASPrometheusExporterDown
          expr: up{job="truenas-prometheus-exporter"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS API-polling exporter is not scrapeable"
            description: "truenas-prometheus-exporter has been unscrapeable for 10m. Pool state, capacity, temperature and SMART alerting are blind until it recovers."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"

        # truenas_exporter_dial_ok is set once, at process start, and never
        # retried (main.go) — a rejected or failed dial stays 0 for the rest
        # of that pod's life, so this needs no `for:` window to debounce a
        # transient blip; there isn't one. Distinguishes "the exporter is
        # up but its one connection attempt failed" from
        # TrueNASPrometheusExporterDown's "the exporter is not answering
        # scrapes at all" — the fix is different (redeploy vs. investigate
        # the pod), and only this alert should mention rotating the key.
        - alert: TrueNASPrometheusExporterAuthFailed
          expr: truenas_exporter_dial_ok == 0
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS API-polling exporter never authenticated"
            description: "truenas-prometheus-exporter's one, process-lifetime dial to the TrueNAS middleware failed or was rejected. It will not retry on its own — check the pod's logs for the reason, fix it (rotate kv/truenas-prometheus, not kv/truenas-csi), and redeploy."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#8-observability-quick-refs"
