# Hourly cluster drift scan on the free local GPU tier. Pinned directly to
# sre-investigator-local (not the sre-investigator alias) so a low-value
# periodic scan never spends free-tier cloud quota. Real alerts keep the full
# cloud-first fallback chain via the relay's own model selection.
#
# Holmes's verdict is a hypothesis, not a finding. The local model has
# escalated "pending pods" with zero pods Pending and "restart spikes" that
# were lifetime restart counts on months-old pods, so every ISSUE it returns
# is re-checked against Prometheus with a fixed query per category and only
# escalated when the query agrees. Each verification prints one JSON line
# (event=drift-scan-verify) so the false-positive rate is readable from the
# job logs. When Prometheus itself cannot be queried the claim is escalated
# unverified: an unreachable ground truth is not evidence that the model was
# wrong.
#
# Known limitation: gpt-oss-20b under vLLM occasionally returns an empty
# response to Holmes for this open-ended, tool-heavy prompt (Holmes then
# 500s with "analysis: Input should be a valid string"), without ever
# attempting a tool call -- a model-capability/prompt-complexity edge, not a
# wiring bug (a trivial no-tool ask to the same model succeeds every time).
# The job treats that as "inconclusive" and retries next hour rather than
# failing loudly; a stronger small tool-calling model (the plan's original
# placeholder was Qwen) is the real fix, left for a follow-up.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: holmes-drift-scan
  namespace: ai-sre
spec:
  schedule: "0 * * * *" # hourly
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # A whole-Job retry re-runs the multi-minute investigation to redo a
      # one-second POST, and the only non-transient escalation failures (auth,
      # schema) fail identically on every attempt. Transient relay hiccups are
      # retried inside the container by curl instead, and the hourly schedule
      # is itself the retry for anything else.
      backoffLimit: 0
      # failedJobsHistoryLimit only prunes an old failed Job when a *new*
      # failure pushes the count over the limit, so one failure followed by
      # nothing but successes lingers forever and keeps kube_job_failed
      # pinned at 1. TTL-clean any finished Job after a day instead. A day
      # rather than an hour: Alertmanager's repeat_interval is 4h, and a
      # shorter TTL would retract the alert before it had been notified.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          # The image declares no user, so runAsNonRoot needs a numeric uid to
          # be enforceable — kubelet cannot verify a name against the image's
          # user database before the container starts. Nothing here owns files
          # in the image, so the uid is free to sit above the 10000 boundary
          # that keeps it clear of host-mapped system accounts.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scan
              # curlimages/curl has no jq and runs as non-root (apk install
              # fails with Permission denied); this image ships both preinstalled.
              # It publishes no version tags at all, so the digest is the only
              # thing pinning it — `latest` alone would let an upstream push
              # change what this CronJob runs with nothing in git to show it.
              image: dwdraju/alpine-curl-jq:latest@sha256:eb00b3d4864c03814885a1c15ed1f5b2b569ca102ad4d02c27d582affb4fd6b1
              # Without these the pod is BestEffort and is killed first when a
              # node comes under memory pressure. It is a curl+jq shell holding
              # one JSON response, so the floor is small; the limit only needs
              # to bound a runaway response body.
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              # The response body is the only thing this writes, and it goes to
              # the scratch volume below, so the image itself can stay sealed.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              env:
                # The relay rejects unauthenticated callers on /webhook. Read
                # fresh on every hourly pod, so a rotation needs no rollout.
                - name: RELAY_WEBHOOK_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: holmes-drift-scan
                      key: webhook_token
              command:
                - sh
                - -ec
                - |
                  ask='Scan this Kubernetes cluster for drift. Check exactly
                  these four conditions, using the available tools before
                  concluding, and use these definitions:
                  - pending-pods: a pod in phase Pending for more than 5 minutes.
                  - restart-spike: a container that restarted 3 or more times
                    in the last hour. A high lifetime restart count on an old
                    pod is NOT a spike; use increase() over the last hour.
                  - node-memory: a node with more than 90% of memory in use.
                  - tls-expiry: a cert-manager Certificate expiring within 30 days.
                  Report each condition you confirmed on its own final line,
                  in exactly this form, after all other text:
                  "VERDICT: ISSUE: <category>: <one-sentence summary> (evidence: <pod, node or certificate names and the metric values you observed>)"
                  where <category> is one of pending-pods, restart-spike,
                  node-memory, tls-expiry. Do not report a condition you could
                  not check or could not name concrete evidence for. If no
                  condition is confirmed, end with exactly one line:
                  "VERDICT: CLEAN".'

                  http_code=$(curl -s -m 480 -o /tmp/resp.json -w '%{http_code}' \
                    http://platform-holmes-holmes/api/chat \
                    -H 'Content-Type: application/json' \
                    -d "$(jq -n --arg ask "$ask" '{ask:$ask, model:"sre-investigator-local", stream:false}')")

                  if [ "$http_code" != "200" ]; then
                    echo "drift-scan: inconclusive (holmes returned HTTP $http_code), retrying next hour"
                    cat /tmp/resp.json
                    exit 0
                  fi

                  analysis=$(jq -r '.analysis // empty' /tmp/resp.json)
                  echo "$analysis"

                  claims=$(printf '%s\n' "$analysis" | sed -n 's/^VERDICT: ISSUE: *//p')
                  if [ -z "$claims" ]; then
                    echo "drift-scan: clean, nothing to escalate"
                    exit 0
                  fi

                  # Ground truth per category. Each query is wrapped so an
                  # empty instant vector still yields a scalar 0, and each
                  # threshold matches the definition given to Holmes above.
                  prom=http://platform-kube-prometheus-s-prometheus.monitoring.svc.cluster.local:9090
                  q_pending='count(kube_pod_status_phase{phase="Pending"} == 1 and on (namespace, pod) (time() - kube_pod_created) > 300) or vector(0)'
                  q_restart='count(increase(kube_pod_container_status_restarts_total[1h]) >= 3) or vector(0)'
                  q_memory='count((1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9) or vector(0)'
                  q_tls='count(certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 86400) or vector(0)'

                  # Prints the scalar result, or nothing when Prometheus could
                  # not answer, so the caller can tell "0" from "unknown".
                  truth() {
                    curl -sf -m 20 "$prom/api/v1/query" --data-urlencode "query=$1" \
                      | jq -r '.data.result[0].value[1] // empty'
                  }

                  printf '%s\n' "$claims" | while IFS= read -r claim; do
                    category=$(printf '%s' "$claim" | cut -d: -f1 | tr '[:upper:]' '[:lower:]' | tr -d ' ')
                    case "$category" in
                      pending-pods)  query="$q_pending" ;;
                      restart-spike) query="$q_restart" ;;
                      node-memory)   query="$q_memory" ;;
                      tls-expiry)    query="$q_tls" ;;
                      # An unlabelled claim is checked against every category
                      # rather than dropped: the model missing the format is
                      # not evidence that the cluster is fine.
                      *) category=unknown; query="($q_pending) + ($q_restart) + ($q_memory) + ($q_tls)" ;;
                    esac
                    count=$(truth "$query")
                    if [ -z "$count" ]; then
                      outcome=unverified
                    elif [ "${count%.*}" -gt 0 ]; then
                      outcome=confirmed
                    else
                      outcome=rejected
                    fi
                    jq -nc --arg category "$category" --arg outcome "$outcome" --arg count "${count:-null}" --arg claim "$claim" \
                      '{event: "drift-scan-verify", category: $category, outcome: $outcome, groundTruth: $count, claim: $claim}'
                    # The loop runs in a subshell, so results leave it via files.
                    if [ "$outcome" != rejected ]; then
                      printf '%s\n' "$claim" >> /tmp/confirmed
                      printf '%s: %s (prometheus: %s)\n' "$category" "$outcome" "${count:-unavailable}" >> /tmp/evidence
                    fi
                  done

                  if [ ! -s /tmp/confirmed ]; then
                    echo "drift-scan: holmes claimed $(printf '%s\n' "$claims" | wc -l) issue(s), none confirmed by prometheus, not escalating"
                    exit 0
                  fi

                  confirmed=$(cat /tmp/confirmed)
                  evidence=$(cat /tmp/evidence)
                  summary=$(printf '%s\n' "$confirmed" | head -n 1)
                  description=$(printf '%s\n\nGround truth:\n%s\n' "$analysis" "$evidence")
                  fingerprint="drift-scan-$(date -u +%Y%m%d)"
                  echo "drift-scan: $(printf '%s\n' "$confirmed" | wc -l) issue(s) confirmed or unverifiable, escalating via relay (fingerprint=$fingerprint)"

                  # --retry only covers transient classes (connection refused,
                  # timeout, 5xx/429), so a rejected bearer or a bad payload
                  # still fails on the first attempt instead of being retried
                  # into the same answer three times.
                  curl -sf -m 30 --retry 3 --retry-delay 5 --retry-connrefused \
                    http://ai-sre-relay:8080/webhook \
                    -H 'Content-Type: application/json' \
                    -H "Authorization: Bearer $RELAY_WEBHOOK_TOKEN" \
                    -d "$(jq -n --arg fp "$fingerprint" --arg summary "$summary" --arg desc "$description" '{
                      receiver: "ai-sre",
                      status: "firing",
                      alerts: [{
                        status: "firing",
                        fingerprint: $fp,
                        labels: {alertname: "ClusterDriftDetected", namespace: "ai-sre", severity: "warning"},
                        annotations: {summary: $summary, description: $desc},
                        startsAt: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
                      }]
                    }')"
          volumes:
            - name: tmp
              emptyDir: {}
