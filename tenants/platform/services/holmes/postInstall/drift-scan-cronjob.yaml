# Hourly cluster drift scan on the free local GPU tier. Pinned directly to
# sre-investigator-local (not the sre-investigator alias) so a low-value
# periodic scan never spends free-tier cloud quota. Real alerts keep the full
# cloud-first fallback chain via the relay's own model selection.
#
# Known limitation: gpt-oss-20b under vLLM occasionally returns an empty
# response to Holmes for this open-ended, tool-heavy prompt (Holmes then
# 500s with "analysis: Input should be a valid string"), without ever
# attempting a tool call -- a model-capability/prompt-complexity edge, not a
# wiring bug (a trivial no-tool ask to the same model succeeds every time).
# The job treats that as "inconclusive" and retries next hour rather than
# failing loudly; a stronger small tool-calling model (the plan's original
# placeholder was Qwen) is the real fix, left for a follow-up.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: holmes-drift-scan
  namespace: ai-sre
spec:
  schedule: "0 * * * *" # hourly
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          # The image declares no user, so runAsNonRoot needs a numeric uid to
          # be enforceable — kubelet cannot verify a name against the image's
          # user database before the container starts. Nothing here owns files
          # in the image, so the uid is free to sit above the 10000 boundary
          # that keeps it clear of host-mapped system accounts.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scan
              # curlimages/curl has no jq and runs as non-root (apk install
              # fails with Permission denied); this image ships both preinstalled.
              # It publishes no version tags at all, so the digest is the only
              # thing pinning it — `latest` alone would let an upstream push
              # change what this CronJob runs with nothing in git to show it.
              image: dwdraju/alpine-curl-jq:latest@sha256:eb00b3d4864c03814885a1c15ed1f5b2b569ca102ad4d02c27d582affb4fd6b1
              # Without these the pod is BestEffort and is killed first when a
              # node comes under memory pressure. It is a curl+jq shell holding
              # one JSON response, so the floor is small; the limit only needs
              # to bound a runaway response body.
              resources:
                requests:
                  memory: 16Mi
                limits:
                  memory: 64Mi
              # The response body is the only thing this writes, and it goes to
              # the scratch volume below, so the image itself can stay sealed.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - sh
                - -ec
                - |
                  ask='Scan this Kubernetes cluster for drift: pending pods,
                  restart spikes, near-OOM nodes, and TLS cert expiry within
                  30 days. Investigate using the available tools before
                  concluding. End your reply with exactly one final line:
                  "VERDICT: CLEAN" if nothing actionable was found, or
                  "VERDICT: ISSUE: <one-sentence summary>" if something is.'

                  http_code=$(curl -s -m 480 -o /tmp/resp.json -w '%{http_code}' \
                    http://platform-holmes-holmes/api/chat \
                    -H 'Content-Type: application/json' \
                    -d "$(jq -n --arg ask "$ask" '{ask:$ask, model:"sre-investigator-local", stream:false}')")

                  if [ "$http_code" != "200" ]; then
                    echo "drift-scan: inconclusive (holmes returned HTTP $http_code), retrying next hour"
                    cat /tmp/resp.json
                    exit 0
                  fi

                  analysis=$(jq -r '.analysis // empty' /tmp/resp.json)
                  echo "$analysis"

                  if ! echo "$analysis" | grep -q '^VERDICT: ISSUE:'; then
                    echo "drift-scan: clean, nothing to escalate"
                    exit 0
                  fi

                  summary=$(echo "$analysis" | sed -n 's/^VERDICT: ISSUE: //p')
                  fingerprint="drift-scan-$(date -u +%Y%m%d)"
                  echo "drift-scan: issue found, escalating via relay (fingerprint=$fingerprint)"

                  curl -sf -m 30 http://ai-sre-relay:8080/webhook \
                    -H 'Content-Type: application/json' \
                    -d "$(jq -n --arg fp "$fingerprint" --arg summary "$summary" --arg desc "$analysis" '{
                      receiver: "ai-sre",
                      status: "firing",
                      alerts: [{
                        status: "firing",
                        fingerprint: $fp,
                        labels: {alertname: "ClusterDriftDetected", namespace: "ai-sre", severity: "warning"},
                        annotations: {summary: $summary, description: $desc},
                        startsAt: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
                      }]
                    }')"
          volumes:
            - name: tmp
              emptyDir: {}
