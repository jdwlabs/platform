apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmes-drift-scan
  namespace: ai-sre
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: holmes-drift-scan
    creationPolicy: Owner
  data:
    # The relay enforces a bearer on /webhook, and the drift scan posts there
    # exactly like the Alertmanager receiver does. Read from the same
    # holmes/webhook_token property both of those resolve rather than copied
    # into a path of its own, so no caller can drift onto a stale token.
    # Kept out of holmes-llm: that Secret is a Reloader trigger for the agent
    # Deployment, and rotating this token has no business restarting it.
    - secretKey: webhook_token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: holmes
        property: webhook_token
