# MinIO credentials for the Barman Cloud plugin. The user behind them can reach
# only the cnpg-prd bucket; this cluster archives under its own server-name
# prefix there. The key names are the ones the cluster chart's ObjectStore
# template expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-cluster-non-barman-s3
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: postgresql-cluster-non-barman-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg-prd-s3
        property: ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: cnpg-prd-s3
        property: ACCESS_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
