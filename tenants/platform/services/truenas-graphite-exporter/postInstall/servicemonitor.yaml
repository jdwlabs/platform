apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: truenas-graphite-exporter-metrics
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: truenas-graphite-exporter
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      # Left at the global 60s rather than the 30s other ServiceMonitors here
      # use. The NAS pushes every 30s (exporter id=1, update_every), so a 60s
      # scrape reads every other sample and a faster one would mostly re-read
      # the same values.
      interval: 60s
