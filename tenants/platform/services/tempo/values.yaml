# ArgoCD holds prior manifests in git history; no need for k8s to keep old
# ReplicaSets around too. The StatefulSet template guards this field with a
# Go-template truthy check (`if .Values.revisionHistoryLimit`), and 0 is
# falsy there — setting 0 skips the field entirely and silently leaves the
# Kubernetes default of 10 in place. 1 is the lowest value this chart can
# actually apply.
revisionHistoryLimit: 1

tempo:
  # Native X-Scope-OrgID multi-tenancy, same header and tenant ids as Loki.
  # Flipped on now that the sole current OTLP producer (servicediscovery's
  # non environment — confirmed by grepping every repo for
  # OTEL_EXPORTER_OTLP_ENDPOINT/OTLP SDK init, cross-checked against live
  # Tempo span-received metrics) stamps OTEL_EXPORTER_OTLP_HEADERS with its
  # tenant id at the source, outside this repo. Unlike Loki there is still
  # no Alloy trace pipeline in front of Tempo and no fallback org — this
  # merge must land, and ArgoCD sync, strictly AFTER that producer-side
  # header is live, or its pushes are rejected outright (metrics-generator,
  # service graph, and tracesToMetrics all go blank; TempoNoSpansReceived
  # fires ~30m later). Any future OTLP producer must stamp its own tenant
  # header before its first push, the same way.
  multitenancyEnabled: true
  resources:
    requests:
      cpu: 200m
      # ~55Mi live with metrics-generator on; 128Mi covers ingest spikes
      # while the 1Gi limit keeps the real burst guard.
      memory: 128Mi
    limits:
      memory: 1Gi

  # Local filesystem backend on a Longhorn PVC. Matches the single-node-ish
  # footprint of this cluster; revisit S3/MinIO if trace volume grows.
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  # 7 days of traces; tighter than logs (14d) since trace volume is heavier.
  retention: 168h

  # OTLP is the standard ingest path. Jaeger/Zipkin receivers are left off
  # until a workload actually needs them.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  # Generate RED span metrics + service-graph metrics and remote-write them to
  # Prometheus. This is what powers trace-to-metrics and the service graph in
  # Grafana, and emits exemplars linking metrics back to traces.
  #
  # multitenancyEnabled above needs no accommodation here: Tempo processes
  # each tenant's ingested spans separately but still remote-writes every
  # tenant's generated series to this one shared, unauthenticated Prometheus
  # (matching the existing label-based metrics-tenancy decision) — there's
  # no per-tenant Prometheus to route to, so a single global remoteWriteUrl
  # is still correct. remote_write_headers (per-tenant outbound auth) is a
  # Tempo option only relevant when the remote_write target itself requires
  # per-tenant credentials, which this Prometheus does not.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://platform-kube-prometheus-s-prometheus:9090/api/v1/write"
    storage:
      path: /var/tempo/generator/wal
    traces_storage:
      path: /var/tempo/generator/traces
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics

priorityClassName: platform-critical

persistence:
  enabled: true
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  size: 20Gi

serviceMonitor:
  enabled: true
