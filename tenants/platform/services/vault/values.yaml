ui:
  enabled: true

server:
  dataStorage:
    # longhorn-single (1 Longhorn replica, best-effort locality, Retain) —
    # defined in the longhorn service's postInstall. Raft already replicates
    # the data across the 3 pods at the app layer: the default 3-replica
    # class would store 9 copies and, worse, a single Longhorn
    # instance-manager fault could stall I/O for several Vault members at
    # once — recreating the storage-layer SPOF this migration removes. With
    # one local replica per member, a Longhorn fault costs at most one
    # member and raft quorum (2/3) survives.
    storageClass: longhorn-single
  auditStorage:
    storageClass: null
  ha:
    enabled: true
    replicas: 3
    # Chart-native PDB (only rendered in HA mode). maxUnavailable: 1 keeps
    # raft quorum (2 of 3) through any single voluntary eviction; the raw
    # postInstall PDB that covered the standalone gap is removed alongside.
    disruptionBudget:
      enabled: true
      maxUnavailable: 1
    raft:
      enabled: true
      # Sets VAULT_RAFT_NODE_ID to the pod name, so raft member ids are
      # stable across pod restarts.
      setNodeId: true
      config: |
        cluster_name = "vault-integrated-storage"

        # The top-level `ui.enabled` value only renders the vault-ui
        # Service; it does not reach the server. In HA mode this config is
        # passed through verbatim, so without this line the server keeps the
        # `ui = false` default and every /ui/ request 404s while the API on
        # the same host answers normally.
        ui = true

        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = "true"
          # Vault only honors unauthenticated_metrics_access inside the
          # listener's telemetry stanza; at top level it is ignored and
          # Prometheus scrapes of /v1/sys/metrics get 403.
          telemetry {
            unauthenticated_metrics_access = true
          }
        }

        storage "raft" {
          path = "/vault/data"
          # Join via per-pod DNS on the headless internal service
          # (publishNotReadyAddresses: true, so names resolve while pods
          # are still sealed/unready). Every member lists every member;
          # self-joins are no-ops, so the same config works on all pods.
          retry_join {
            leader_api_addr = "http://platform-vault-0.platform-vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://platform-vault-1.platform-vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://platform-vault-2.platform-vault-internal:8200"
          }
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
  # Chart-default affinity is kept: REQUIRED (hard) pod anti-affinity on
  # kubernetes.io/hostname. Worker count is not what makes that satisfiable —
  # free memory is. It holds only because the two CNPG clusters no longer
  # compete for the same scarce small-worker room under a rule of their own;
  # the margin is one small worker with 152Mi to spare, and it is thin.
  #
  # Vault keeps the hard rule where the databases gave it up because the
  # consequence of co-location differs. Two CNPG instances on one node means a
  # node loss leaves one instance that the operator promotes. Two raft members
  # on one node means a node loss leaves one of three, which is quorum lost and
  # a sealed Vault — and Vault is a wave-2 dependency for every secret
  # downstream of it. `platformctl cluster drain-check` fails the moment that
  # margin stops holding, which is the signal to revisit this rather than
  # discover it during an upgrade.
  # Request 192Mi: measured steady-state usage across all three members
  # runs 79-105Mi, so the prior 384Mi request was placing against roughly
  # 4x actual holdings. The 512Mi limit is untouched, so the cgroup ceiling
  # a member could actually OOM against is unchanged. But the request also
  # sets kubelet's oom_score_adj for this Burstable pod (roughly
  # 1000 - 1000*request/nodeAllocatable), so halving it does raise Vault's
  # ranking as a node-level OOM-kill victim, and shrinks its eviction margin
  # (usage-vs-request) from ~279Mi to ~87Mi headroom. Accepted: Vault's ~100Mi
  # RSS is a small target even at a worse ranking, and hard anti-affinity
  # means one node's OOM event can cost at most one raft member — but this
  # is the real mechanism behind "could this affect quorum," not "no
  # mechanism exists." Raft standbys hold less than the active node, so the
  # same request fits all three members.
  #
  # NOTE: this StatefulSet is updateStrategy OnDelete (see
  # docs/adr/0007-vault-stays-on-ondelete.md) — merging this does NOT roll
  # the running pods. The new request only takes effect the next time a
  # member is deliberately deleted (chart bump, drain, eviction), at which
  # point that member restarts sealed and needs the ~2min unseal cronjob
  # cycle to rejoin raft. Verify this change by deleting one pod at a time
  # and confirming unseal + raft rejoin between each, not by watching for
  # flapping post-merge — ADR 0007 records that ArgoCD reports OnDelete
  # StatefulSets Healthy regardless of whether the running pods match spec.
  #
  # This chart's server StatefulSet has no startupProbe field (checked
  # against the templates for the pinned chart revision — readinessProbe
  # and livenessProbe are the only configurable probes; startupProbe is
  # not rendered regardless of values). livenessProbe stays disabled, as
  # it already was: Vault starts sealed and only becomes unsealed once the
  # unseal cronjob next runs, so a liveness check would kill-loop healthy,
  # merely-sealed pods rather than protect them. readinessProbe (exec
  # `vault status`) stays enabled and already gates Service membership;
  # it is unaffected by a request-only change since it isn't a function of
  # the memory request.
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

injector:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
