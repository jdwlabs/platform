apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: db-ui
  namespace: database
  labels:
    app.kubernetes.io/part-of: db-ui
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - dbui.jdwlabs.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: db-ui
          port: 80
          weight: 1
