apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-gdrive
  namespace: ai-sre
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: rclone-gdrive
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Same vault key the database namespace pulls: a Secret cannot be mounted
    # across namespaces, so the backup job running beside the litellm cluster
    # needs its own copy rather than a reference to that one.
    - secretKey: rclone.conf
      remoteRef:
        key: rclone-gdrive
        property: rclone_conf
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
