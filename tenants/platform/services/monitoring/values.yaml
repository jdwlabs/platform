cluster:
  name: jdwlabs

# Single collection owner: kube-prometheus-stack scrapes all metrics via
# Prometheus Operator ServiceMonitors/PodMonitors. Alloy previously re-scraped
# kubelet, cAdvisor and the kubelet /metrics/resource endpoint (plus a
# windows-exporter DaemonSet that never schedules on this Linux-only cluster)
# and remote-wrote them into the same Prometheus, duplicating those series.
# This release now ships pod logs and cluster events to Loki only.
# See docs/observability/COLLECTION-OWNERSHIP.md.
clusterMetrics:
  enabled: false

clusterEvents:
  enabled: true
  # v4 no longer auto-assigns a feature to a collector; cluster events run on
  # the singleton collector alongside (not sharded across) the per-node logs
  # collector, matching the pre-migration topology.
  collector: alloy-singleton

# Replaces the removed v3 `podLogs` feature. Of the three v4 successors,
# this is the only one that tails pod log files from a mounted hostPath
# (loki.source.file), matching v3's default collection mechanism exactly;
# podLogsViaKubernetesApi streams from the kubelet API instead (no hostPath
# read, but different load characteristics) and podLogsViaOpenTelemetry
# ships OTLP-formatted logs to a non-Loki destination. Keeping the same
# hostPath-tailing mechanism means the alloy-logs livenessProbe workaround
# below is still required post-migration.
podLogsViaLoki:
  enabled: true
  collector: alloy-logs
  # attach_metadata.namespace on the pod discovery surfaces every namespace
  # label as a __meta_kubernetes_namespace_label_* meta-label, which is the
  # only way to reach the tenant label from a log-processing stage below.
  attachNamespaceMetadata: true
  # Promotes the namespace's tenant label to a real "tenant_id" stream label.
  # Every governed namespace carries platform.jdwlabs.io/tenant (rendered by
  # tenant-envelope's namespaces.yaml), but a handful of cluster-native
  # namespaces (kube-system and friends) sit outside that model entirely and
  # would otherwise resolve to an empty tenant_id; the second rule folds
  # those into the platform org rather than dropping the header.
  extraDiscoveryRules: |
    rule {
      source_labels = ["__meta_kubernetes_namespace_label_platform_jdwlabs_io_tenant"]
      target_label  = "tenant_id"
    }
    rule {
      source_labels = ["tenant_id"]
      regex         = "^$"
      target_label  = "tenant_id"
      replacement   = "platform"
    }
  # stage.tenant reads the tenant_id stream label set above and carries it
  # as the per-entry tenant for loki.write, taking precedence over the
  # destination's static tenantId fallback below (used by writers, like
  # cluster events, that don't run this stage).
  extraLogProcessingStages: |
    stage.tenant {
      label = "tenant_id"
    }

# This feature reads systemd journal files off the node, and Talos runs no
# journald at all -- enabling it would mount a path that never has entries and
# report nothing wrong while doing it. Talos keeps kernel output in the ring
# buffer and pushes it to a remote endpoint instead, so node logs arrive on the
# alloy-logs listener configured under `collectors` below rather than here.
nodeLogs:
  enabled: false

# Emits usage-report metrics and therefore requires a metrics destination;
# metrics shipping is disabled here, so this must be off for the chart to
# render.
selfReporting:
  enabled: false

# v4 nests per-collector config under `collectors:`; alloy-operator is the
# only collector-adjacent component that stays top-level.
#
# A key under `collectors:` is now only a name. v3 shipped per-name default
# files that silently supplied each well-known collector's workload shape;
# v4 removed them, so a collector that declares no `presets` inherits the
# upstream Alloy defaults — an untolerated DaemonSet — no matter what it is
# called. Every collector below therefore states its shape explicitly.
collectors:
  alloy-logs:
    enabled: true
    # Talos has no journald and no on-disk kernel log, so the only way off the
    # node is its own push: the kernel command line names a TCP endpoint and
    # Talos streams the ring buffer to it as newline-delimited JSON. Those
    # lines carry no hostname, so the receiver has to be node-local for the
    # node label to mean anything -- hence a hostPort on this DaemonSet and a
    # loopback endpoint on the Talos side, rather than one shared collector.
    #
    # Volume is small in steady state (a quiet kernel emits a handful of lines
    # a minute) and bursty only during the faults this exists to catch. Stream
    # cardinality is bounded at one per node: facility, priority and level go
    # to structured metadata so a chatty subsystem cannot fan out into new
    # streams.
    extraConfig: |
      otelcol.receiver.tcplog "talos_kernel" {
        listen_address = "0.0.0.0:6050"

        output {
          logs = [otelcol.exporter.loki.talos_kernel.input]
        }
      }

      otelcol.exporter.loki "talos_kernel" {
        forward_to = [loki.process.talos_kernel.receiver]
      }

      loki.process "talos_kernel" {
        // The OTel-to-Loki bridge does not hand over the received line as-is:
        // it serialises the whole log record, so what arrives here is
        // {"body": "<the Talos JSON>"}. Unwrapping first is what makes the
        // stages below see Talos's own keys -- parsing the envelope directly
        // extracts nothing and every later stage silently does nothing.
        stage.json {
          expressions = {
            body = "",
          }
        }

        // Talos-emitted keys are hyphenated, which JMESPath reads as
        // subtraction unless the identifier is quoted.
        stage.json {
          source = "body"
          expressions = {
            msg        = "",
            facility   = "",
            priority   = "",
            level      = "\"talos-level\"",
            talos_time = "\"talos-time\"",
          }
        }

        // Without this the entry is timestamped on arrival, which reorders
        // the ring buffer against itself whenever the connection reconnects
        // and replays.
        stage.timestamp {
          source = "talos_time"
          format = "RFC3339"
        }

        stage.structured_metadata {
          values = {
            facility = "",
            priority = "",
            level    = "",
          }
        }

        stage.static_labels {
          values = {
            job       = "integrations/talos/kernel",
            node      = sys.env("NODE_NAME"),
            tenant_id = "platform",
          }
        }

        // The bridge stamps its own `exporter` label on every entry, which
        // says nothing about the log and only widens the stream key.
        stage.label_drop {
          values = ["exporter"]
        }

        // Drop the JSON envelope so the stored line is the kernel message the
        // alert rules and `talosctl dmesg` both show.
        stage.output {
          source = "msg"
        }

        stage.tenant {
          label = "tenant_id"
        }

        forward_to = [loki.write.loki.receiver]
      }
    # daemonset: one reader per node, plus the blanket NoSchedule toleration
    # that keeps it scheduled on the tainted control-plane nodes; without it
    # those nodes' pod logs stop reaching Loki and nothing reports an error.
    # filesystem-log-reader: mounts /var/log and /var/lib/docker/containers,
    # which podLogsViaLoki tails directly off the node.
    presets:
      - daemonset
      - filesystem-log-reader
    alloy:
      # otelcol.receiver.tcplog is Alloy's only raw-socket log listener and it
      # is still experimental, so the whole collector has to run at that
      # stability level to load it. Nothing else in this collector's config
      # depends on the relaxation -- every other component here is GA -- and
      # the alternative is no path off the node at all, since Talos emits
      # newline-delimited JSON over a plain socket and no GA source parses it.
      stabilityLevel: experimental
      # hostPort, not a Service: Talos dials the endpoint from the host
      # namespace before any cluster networking is guaranteed, and the
      # loopback address has to reach the collector on that same node so the
      # node label below is the node the message came from.
      #
      # This listener is unauthenticated and reachable beyond the node. Talos
      # offers no TLS or auth for log shipping, `hostPort` with no `hostIP`
      # binds every host address, and this chart's extraPorts contract emits
      # only containerPort/hostPort/name/protocol -- there is no way to ask for
      # a loopback-only bind through it. The same entry also publishes the port
      # on the alloy-logs Service, so it is reachable cluster-internally too.
      # Anything that can reach either path can inject lines into
      # {job="integrations/talos/kernel"} and so forge a critical alert.
      # Accepted for now: the blast radius is a spurious page, not access to
      # data or to the node, and the alternative is no fault signal at all. A
      # NetworkPolicy is deliberately not offered as the mitigation -- the
      # monitoring namespace does not set `enforce: true`, so one rendered here
      # would look like a control while evaluating nothing. Closing this needs
      # either upstream `hostIP` support or namespace enforcement first.
      extraPorts:
        - name: talos-kmsg
          port: 6050
          targetPort: 6050
          hostPort: 6050
          protocol: TCP
      # The kernel log lines carry no hostname of their own.
      extraEnv:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      # alloy-logs ran ~175Mi/node unbounded; the initial cap above still left
      # this request over-provisioned against later observed usage across the
      # DaemonSet, so it's trimmed modestly here. Limit is unchanged — it's
      # the burst ceiling for log spikes, not the steady-state signal driving
      # this change.
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          memory: 256Mi
      # No startupProbe available for this workload: the Alloy CRD's spec is
      # entirely x-kubernetes-preserve-unknown-fields (no field-level schema
      # at all, so "not in the CRD" proves nothing on its own) but the alloy
      # chart values contract the operator actually renders from exposes
      # alloy.livenessProbe and no alloy.startupProbe — checked against that
      # contract, not the CRD. The livenessProbe below is the only
      # startup-safety knob available. Its 6x10s failureThreshold already
      # gives ~90s of startup grace before a restart, which covers this
      # modest request cut.
      #
      # The chart only wires a readinessProbe (hardcoded, 1s timeout) with no
      # livenessProbe, so a wedged Alloy process just sits NotReady forever
      # instead of being restarted — one replica ran wedged for 9 days,
      # re-reading its hostPath log mounts the whole time and saturating that
      # node's disk IO queue. Reuse the same /-/ready endpoint for liveness so
      # kubelet kills and reschedules a stuck replica.
      livenessProbe:
        httpGet:
          path: /-/ready
          port: 12345
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
    # Runs on every node beside the alloy container and shipped with a request but
    # no limit, so ~44Mi/node was unbounded across the whole DaemonSet — the
    # largest uncapped footprint left after the primary-container sweep.
    configReloader:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 128Mi

  # Metrics collection is owned by kube-prometheus-stack; with clusterMetrics
  # disabled there is nothing for this instance to collect. v4 errors if a
  # collector is enabled with no feature assigned to it, so this must stay
  # explicitly disabled rather than merely absent.
  alloy-metrics:
    enabled: false

  alloy-singleton:
    enabled: true
    # Cluster events must be read by exactly one replica, and this preset is
    # the only thing that makes that true in v4 (deployment, replicas: 1).
    # Without it the collector renders as a DaemonSet, every node re-reads the
    # same event stream into Loki, and the memory request below is charged once
    # per node instead of once per cluster.
    presets:
      - singleton
    # Only ReplicaSet-backed collector here (deployment, via the singleton
    # preset above) — ArgoCD holds prior manifests in git history, so no
    # need for k8s to keep old ReplicaSets around too.
    controller:
      revisionHistoryLimit: 0
    alloy:
      # Cluster-events collector ran ~170Mi live against the chart's 50Mi default
      # request — 120Mi invisible to the scheduler. 192Mi covers observed steady
      # state with modest headroom.
      resources:
        requests:
          memory: 192Mi
        # Request without a limit left this Burstable-unbounded; the cap gives
        # roughly 2x headroom over observed steady state for event bursts.
        limits:
          memory: 384Mi
    configReloader:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 128Mi

# Operator ran BestEffort (first evicted under node memory pressure,
# invisible to the scheduler). Observed ~57Mi; request ~1.7x that, limit
# leaves headroom for Alloy CR reconcile bursts.
alloy-operator:
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 256Mi

# v4 keys destinations by name instead of a list entry's `name:` field.
destinations:
  Loki:
    type: loki
    url: "http://platform-loki:3100/loki/api/v1/push"
    # Fallback X-Scope-OrgID for any write that never runs the per-entry
    # stage.tenant override (cluster events, currently) — without this,
    # loki.write sends no tenant header at all and auth_enabled Loki rejects
    # the push outright rather than defaulting it anywhere.
    tenantId: platform
