# ArgoCD Helm values for platform tenant
# This file configures the ArgoCD installation for the platform tenant

# Global settings
global:
  # Domain for ArgoCD ingress
domain: argocd.platform.example.com

# ArgoCD server configuration
server:
  # Ingress configuration for the ArgoCD UI
ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - argocd.platform.example.com
    tls:
      - secretName: argocd-server-tls
        hosts:
          - argocd.platform.example.com

# Repository server configuration
repoServer:
  # Image configuration - rolled back to v3.5.5 due to metrics server regression in v3.5.6
  image:
    repository: quay.io/argoproj/argocd
    tag: v3.5.5
    pullPolicy: IfNotPresent
  # Resource limits
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  # Metrics configuration
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s

# Application controller configuration
applicationController:
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

# Redis configuration
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 1Gi

# Dex configuration (OIDC)
dex:
  enabled: true
  config: |
    issuer: https://argocd.platform.example.com/dex
    storage:
      type: kubernetes
      config:
        inCluster: true
    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: $DEX_GITHUB_CLIENT_ID
          clientSecret: $DEX_GITHUB_CLIENT_SECRET
          orgs:
            - name: jdwlabs
              teams:
                - platform-admins

# Prometheus metrics
prometheus:
  enabled: true
  serviceMonitors:
    enabled: true

# Notification controller
notifications:
  enabled: true

# Redis HA (disabled for single instance)
redis-ha:
  enabled: false

# MinIO for artifact storage (if needed)
minio:
  enabled: false