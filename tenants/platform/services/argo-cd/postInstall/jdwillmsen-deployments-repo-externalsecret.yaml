apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jdwillmsen-deployments-repo
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: jdwillmsen-deployments-repo
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/jdwillmsen/jdw-deployments
        githubAppID: "{{ .app_id }}"
        githubAppInstallationID: "{{ .installation_id }}"
        githubAppPrivateKey: "{{ .private_key }}"
  data:
    # Reuses the per-tenant GitHub App path rather than introducing a parallel
    # one. Seed spec discovery globs tenants/*/tenant.yaml, so the spec key
    # only resolves once the jdwillmsen tenant directory exists — seed and
    # re-seed from a tree containing it:
    #   platformctl bootstrap seed jdwillmsen-github-app
    - secretKey: app_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: jdwillmsen-github-app
        property: github_app_id
    - secretKey: installation_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: jdwillmsen-github-app
        property: github_app_installation_id
    - secretKey: private_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: jdwillmsen-github-app
        property: github_app_private_key
