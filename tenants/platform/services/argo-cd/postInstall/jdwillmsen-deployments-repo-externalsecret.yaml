apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jdwillmsen-deployments-repo
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: jdwillmsen-deployments-repo
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/jdwillmsen/jdw-deployments
        githubAppID: "{{ .app_id }}"
        githubAppInstallationID: "{{ .installation_id }}"
        githubAppPrivateKey: "{{ .private_key }}"
  data:
    # Reuses the per-tenant GitHub App path that `platformctl bootstrap phase 4`
    # already discovers and seeds, rather than introducing a parallel one. Seed
    # or re-seed it with `platformctl bootstrap seed jdwillmsen-github-app`.
    - secretKey: app_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: jdwillmsen-github-app
        property: github_app_id
    - secretKey: installation_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: jdwillmsen-github-app
        property: github_app_installation_id
    - secretKey: private_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: jdwillmsen-github-app
        property: github_app_private_key
