apiVersion: v1
kind: Service
metadata:
  name: github-repo-health-exporter
  namespace: monitoring
  labels:
    app: github-repo-health-exporter
spec:
  type: ClusterIP
  selector:
    app: github-repo-health-exporter
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
