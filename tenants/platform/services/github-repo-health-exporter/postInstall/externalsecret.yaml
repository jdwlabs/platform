# Same GitHub App as ai-sre-relay: the org-wide agent bot already holds the
# read grants this exporter needs (it only lists Actions runs), so a second
# App would be a second long-lived key guarding nothing extra.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-repo-health-exporter
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: github-repo-health-exporter
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: agent-bot
        property: app-id
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: agent-bot
        property: installation-id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: agent-bot
        property: private-key
