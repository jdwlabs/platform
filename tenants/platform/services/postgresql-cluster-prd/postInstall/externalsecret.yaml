# MinIO credentials for the Barman Cloud plugin. The user behind them can reach
# only the cnpg-prd bucket. The key names are the ones the cluster chart's
# ObjectStore template expects. Wave -1 with the ObjectStore, so the key exists
# before the instances restart with the sidecar and their first archive
# attempt does not fail.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-cluster-prd-barman-s3
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: postgresql-cluster-prd-barman-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cnpg-prd-s3
        property: ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: cnpg-prd-s3
        property: ACCESS_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
