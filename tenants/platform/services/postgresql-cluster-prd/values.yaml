externalClusters: []

cluster:
  # Headroom for WAL retained by a lagging replica slot; a PVC can grow but never shrink.
  storage:
    size: 16Gi

  postgresql:
    parameters:
      # Caps the WAL a replication slot may pin; PostgreSQL's default (-1) is
      # unbounded, which let a dead replica's slot fill the 8Gi volume and stop
      # prd writes on 2026-11-06. archive_timeout forces a 16MB segment every
      # 5 minutes even when idle (~200MB/h observed), so 4GB holds about 20h
      # of an absent replica: pg_wal tops out near 4GB + max_wal_size, well
      # inside 16Gi. Past the cap PostgreSQL invalidates the slot instead of
      # filling the disk; the replica then catches up from the WAL archive
      # (backups below) instead of being recloned. The cap does not bound WAL
      # that is waiting to be archived: if MinIO is unreachable, pg_wal grows
      # by about 4.7GB a day until CNPGWALArchivingStalled is acted on.
      # Reloadable (sighup).
      max_slot_wal_keep_size: 4GB
      # The recovery point: the longest a quiet database goes before its
      # current segment is closed and archived. CNPG's default too; pinned
      # here because the archive alert's 15-minute threshold assumes it.
      archive_timeout: 5min

  monitoring:
    enabled: true
    podMonitor:
      enabled: true
    prometheusRule:
      enabled: true
      # The chart's CNPGClusterHACritical/CNPGClusterHAWarning expressions are the
      # only ones in its rule set not scoped by the chart's own per-cluster pod
      # selector — they match every CNPG cluster in the release namespace. Both
      # clusters in the shared `database` namespace therefore render an HA rule
      # pair that also fires on the sibling's series: this release's copy is what
      # kept alerting on postgresql-cluster-non (deliberately pinned to
      # instances: 1) even after that release excluded its own copy. Excluded
      # here and replaced by cluster-scoped equivalents in
      # tenants/platform/services/kube-prometheus-stack/postInstall/rules-cnpg.yaml,
      # so real HA degradation on this cluster still alerts with the same
      # names, thresholds, and labels. Every other chart rule stays enabled —
      # they are already pod-scoped and unaffected.
      excludeRules:
        - CNPGClusterHACritical
        - CNPGClusterHAWarning

  affinity:
    # topologyKey: kubernetes.io/hostname because this homelab has no zone labels
    # (topology.kubernetes.io/zone is unset on all nodes, making zone anti-affinity a no-op).
    #
    # preferred, not required, because free memory rather than node count is what makes
    # replacement scheduling work and there isn't any. Only two workers are large, so three
    # replicas on distinct nodes force one onto a 2.31Gi worker that is ~78% committed on
    # DaemonSets alone. Under a hard rule, draining that worker excludes both large workers
    # by the rule itself, no small worker has 192Mi free, and the replica is not relocated —
    # it is stranded Pending until someone intervenes. A hard rule buys spreading it cannot
    # deliver: the third replica ends up not running rather than running elsewhere, and a
    # cluster at 2 of 3 with one dead is worse off than one at 3 of 3 with two sharing a node.
    #
    # The operator weights the soft rule at 100, which outranks the scheduler's default
    # resource scoring, so placement is unchanged whenever spreading is achievable — which it
    # is today. Co-location happens only where the alternative is a replica that does not run.
    #
    # The cost is that nothing undoes a co-location once made: no descheduler runs here, so a
    # replica that doubles up during a drain stays doubled up. `platformctl cluster drain-check`
    # reports co-located replicas against this rule; deleting the pod lets the operator place
    # it again once there is room.
    #
    # Applying this rolls the cluster. podAntiAffinityType is part of the pod spec CNPG
    # generates, so a sync marks all three instances for update: replicas are recreated
    # one at a time, then — primaryUpdateStrategy being unset, so unsupervised — the
    # operator promotes an in-sync replica and restarts the old primary without asking.
    # supervised was considered and rejected: it would not avoid the roll, only stop it
    # after the replicas, leaving the primary on the hard rule and un-relocatable until
    # a human promoted it. docs/memory-efficiency/07-drain-feasibility.md carries the
    # sequence and the reasoning.
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname

  # Without explicit limits the instance pods run BestEffort, so Talos's
  # cgroup OOM-killer reaps them first whenever a 6Gi worker is squeezed
  # (e.g. WAL replay during a node roll). Requests/limits promote them to
  # Burstable — deprioritised for OOM — and let the scheduler reserve their
  # footprint instead of overpacking a node. 768Mi fits ~3 instances per
  # worker alongside Longhorn + system overhead. 192Mi request is the floor:
  # instances idle ~75Mi but WAL replay after a node roll needs the margin —
  # do not trim further.
  resources:
    requests:
      memory: 192Mi
    limits:
      memory: 768Mi

  initdb:
    postInitSQL:
      - ALTER DEFAULT PRIVILEGES FOR ROLE postgres GRANT ALL ON TABLES TO app;
      - ALTER DEFAULT PRIVILEGES FOR ROLE postgres GRANT ALL ON SEQUENCES TO app;
      - ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL ON TABLES TO app;
      - ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL ON SEQUENCES TO app;

# Continuous WAL archiving and weekly base backups through the Barman Cloud
# plugin, to bucket cnpg-prd on the TrueNAS MinIO: point-in-time restore
# anywhere in the last 30 days, about 5 minutes' recovery point. The 6-hourly
# pg_dump to Drive (postgres-backup) stays as the copy that survives losing
# the NAS. Enabling or changing the plugin rolls the cluster (the sidecar is
# injected into each pod: replicas first, then a switchover), so merge it when
# nobody is on the Minecraft servers. Restore runbook: docs/OPERATIONS.md §3.3.
backups:
  enabled: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # Base backups read from a standby so the primary's IO is left alone.
  target: prefer-standby
  objectStore:
    # The chart's default renders the ObjectStore as a Helm hook, which ArgoCD
    # treats as ephemeral; a plain resource one wave ahead of the Cluster.
    helmHook: false
    annotations:
      argocd.argoproj.io/sync-wave: "-1"
  endpointURL: https://192.168.1.205:9000
  # MinIO's certificate is issued by the internal CA; the Secret holding it is
  # in this service's postInstall.
  endpointCA:
    create: false
    name: postgresql-cluster-prd-minio-ca
    key: ca.crt
  # prd's own bucket and key; the non-prd cluster has neither. Barman adds the
  # cluster name as a prefix inside it.
  destinationPath: s3://cnpg-prd/
  provider: s3
  secret:
    create: false
    name: postgresql-cluster-prd-barman-s3
  instanceSidecarConfiguration:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 512Mi
  # encryption is empty on purpose: the chart defaults to SSE-S3 (AES256), and
  # MinIO rejects that header because it has no KMS configured.
  wal:
    compression: gzip
    encryption: ""
    maxParallel: 1
  data:
    compression: gzip
    encryption: ""
    jobs: 2
  scheduledBackups:
    # Six-field cron (seconds first): Sundays 03:00 UTC. The chart also takes
    # one immediately when the ScheduledBackup is first created.
    - name: weekly
      schedule: "0 0 3 * * 0"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
  retentionPolicy: "30d"

# Tenant isolation is enforced at the database boundary, not at the role level. The `app`
# role owns ever tenant database and is used by Atlas migrations and application pods alike.
databases:
  - name: jdwlabs_prd
    ensure: present
    owner: app
    schemas:
      - name: auth
        owner: app
        ensure: present
  - name: jdwillmsen_prd
    ensure: present
    owner: app
    schemas:
      # The Minecraft server agent's tables: player profiles, playtime and the
      # state behind welcome variants. Its own schema rather than public, so a
      # future second service in this tenant does not share a namespace with it
      # -- the same reason jdwlabs_prd puts auth in one.
      - name: minecraft
        owner: app
        ensure: present
  - name: dotablazetech_prd
    ensure: present
    owner: app
