# Creates the Git Sync connection and repository inside Grafana on sync.
#
# Grafana's provisioning resources live in its own API server, so ArgoCD cannot
# reconcile them and a rebuilt Grafana comes back with Git Sync silently absent.
# This Job is what makes the connection reproducible from git instead of a
# remembered click in the UI.
#
# It creates but never updates: an existing connection is left alone, because
# the stored private key is write-once and re-applying would disturb a working
# sync path. The trade-off is that editing the resource definitions in git does
# not propagate to a live Grafana -- changing them means deleting the resource
# first, which is deliberate rather than accidental. A definition change that
# is not paired with a delete is a no-op, so the gate at the end checks health
# rather than existence: it is the only thing standing between "the resources
# are there" and "dashboards are actually syncing".
#
# Create-if-absent is per resource, which is what makes *adding* a repository
# different from *changing* one: a new repository is absent, so this Job
# creates it on the next sync with no delete step, while the untouched
# connection and the repositories already present are skipped. Only an edit to
# an existing definition needs the delete-first dance.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-gitsync-apply
  namespace: monitoring
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 2
  # The health gate polls, and ArgoCD blocks on this hook while it does. A
  # ceiling keeps a permanently unhealthy connection from holding the sync
  # open across all three attempts instead of just reporting the failure.
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # Numeric uid, not a name: runAsNonRoot is enforced by the kubelet
        # before the image's user database is consulted, so a named user fails
        # admission. 472 is the grafana image's own uid.
        runAsUser: 472
        runAsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply
          # Reuses the Grafana image purely for its curl and shell, pinned to
          # the chart's appVersion, which beats pulling a separate
          # mutable-tagged curl image for one HTTP call. The chart itself runs
          # the -distroless variant, which has no /bin/sh, so this is the
          # plain tag at the same version rather than the node-cached image.
          image: docker.io/grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          env:
            - name: GF_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-user
            - name: GF_PASS
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              API="http://platform-grafana.monitoring.svc/apis/provisioning.grafana.app/v0alpha1/namespaces/default"

              # status() returns only the code, so the body has to be kept
              # somewhere for the callers that need to explain a failure. An
              # unexpected status is exactly the case where the code alone says
              # nothing and the body says everything.
              LAST_BODY=/tmp/last-response

              # An empty name means "probe the collection". Appending it anyway
              # would build a trailing-slash URL that never reaches the
              # provisioning handler, so the readiness loop below would spin
              # against nothing and fall through as if Grafana were up.
              status() {
                path="$API/$1"
                if [ -n "$2" ]; then
                  path="$path/$2"
                fi
                curl -sS -o "$LAST_BODY" -w '%{http_code}' \
                  -u "$GF_USER:$GF_PASS" "$path"
              }

              # The hook can start before Grafana finishes booting; a 000/503
              # here means "not up yet", not "misconfigured".
              i=0
              while [ "$i" -lt 30 ]; do
                code=$(status repositories "" || echo 000)
                case "$code" in
                  200|404) break ;;
                esac
                i=$((i + 1))
                sleep 5
              done

              apply_if_absent() {
                kind_path="$1"
                name="$2"
                body="$3"
                code=$(status "$kind_path" "$name")
                case "$code" in
                  200)
                    echo "$kind_path/$name already present, leaving untouched"
                    return 0
                    ;;
                  404) ;;
                  *)
                    echo "unexpected status $code probing $kind_path/$name:"
                    cat "$LAST_BODY"
                    return 1
                    ;;
                esac
                # The response body carries the validation error. Discarding it
                # (curl -f) leaves nothing to diagnose from once ArgoCD deletes
                # the failed hook pod.
                resp=$(mktemp)
                code=$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
                  -H 'Content-Type: application/json' \
                  -u "$GF_USER:$GF_PASS" \
                  --data-binary "@$body" \
                  "$API/$kind_path")
                case "$code" in
                  2*)
                    echo "created $kind_path/$name"
                    ;;
                  *)
                    echo "POST $kind_path returned $code:"
                    cat "$resp"
                    return 1
                    ;;
                esac
              }

              APP_ID=$(cat /etc/secrets/gitsync/app-id)
              INSTALL_ID=$(cat /etc/secrets/gitsync/installation-id)

              # Grafana base64-decodes secure.privateKey.create before parsing
              # it, so the raw PEM is rejected at admission with a 422. Encoding
              # also removes the escaping problem entirely: the base64 alphabet
              # contains no backslash or delimiter, so it substitutes verbatim.
              # busybox base64 has no -w0, hence the explicit newline strip.
              KEY=$(base64 /etc/secrets/gitsync/private-key | tr -d '\n')

              sed -e "s|__APP_ID__|$APP_ID|" \
                  -e "s|__INSTALLATION_ID__|$INSTALL_ID|" \
                  -e "s|__PRIVATE_KEY__|$KEY|" \
                  /etc/gitsync/connection.json > /tmp/connection.json

              # Name and file together, because apply_if_absent probes by name
              # before POSTing the body: a pair that disagrees creates one
              # resource and then health-gates a different, absent one, which
              # fails loudly instead of passing over a repository that is not
              # there. Adding a tenant folder is a line in TENANT_REPOSITORIES
              # plus a ConfigMap key -- the connection is shared and never
              # repeated.
              #
              # The split is a blast-radius split: this Job is an ArgoCD Sync
              # hook, so whatever it fails on takes the whole platform-grafana
              # sync with it. The platform folder is what that Application
              # exists to serve, so it gates. A tenant folder failing is a
              # tenant-sized problem and must not become a Grafana-sized one --
              # for creation as much as for health, because the realistic
              # creation failure is not a malformed definition (a commit CI
              # could have caught) but an unmanaged-folder collision, which is
              # live state and rejected at admission with a 422.
              REQUIRED_REPOSITORY="platform-dashboards:/etc/gitsync/repository.json"
              TENANT_REPOSITORIES="jdwlabs-dashboards:/etc/gitsync/repository-jdwlabs.json
              dotablaze-tech-dashboards:/etc/gitsync/repository-dotablaze-tech.json
              jdwillmsen-dashboards:/etc/gitsync/repository-jdwillmsen.json"

              # "$degraded" collects tenant repositories that could not be
              # created or could not become healthy. Both are reported at the
              # end and neither fails the Job; the required repository below
              # does both without a guard, so its failure still aborts.
              degraded=""

              apply_if_absent connections jdwlabs-platform-github /tmp/connection.json
              apply_if_absent repositories "${REQUIRED_REPOSITORY%%:*}" "${REQUIRED_REPOSITORY#*:}"
              for entry in $TENANT_REPOSITORIES; do
                name="${entry%%:*}"
                if ! apply_if_absent repositories "$name" "${entry#*:}"; then
                  degraded="$degraded $name"
                fi
              done

              # An exit 0 must mean Git Sync is actually working, not merely
              # that the resources exist. Both are reported present the moment
              # they are accepted, and stay present while failing every sync --
              # so an existence check reports success over a connection that
              # cannot authenticate and a repository syncing nothing.
              #
              # Health is computed asynchronously (the connection check calls
              # GitHub), so a freshly created resource is legitimately not
              # healthy yet. Poll rather than read once.
              #
              # There is no jq in this image and no server-side field selector
              # for status, hence the token match: whitespace is stripped so the
              # key/value pair is contiguous, and the only other occurrence of
              # the word is "unhealthy" inside a status message, which cannot
              # match because of the leading quote.
              wait_healthy() {
                kind_path="$1"
                name="$2"
                i=0
                while [ "$i" -lt 18 ]; do
                  code=$(status "$kind_path" "$name" || echo 000)
                  if [ "$code" = "200" ] \
                    && tr -d ' \n' < "$LAST_BODY" | grep -q '"healthy":true'; then
                    echo "$kind_path/$name is healthy"
                    return 0
                  fi
                  i=$((i + 1))
                  sleep 5
                done
                echo "$kind_path/$name never became healthy (last status $code):"
                cat "$LAST_BODY"
                return 1
              }

              wait_healthy connections jdwlabs-platform-github
              wait_healthy repositories "${REQUIRED_REPOSITORY%%:*}"

              # Reported, not gated, per the blast-radius split above. Nothing
              # is swallowed: the resource keeps its own unhealthy status, and
              # `platformctl gitsync status` still exits non-zero on it. A
              # repository that failed to be created is skipped here rather
              # than waited on -- it cannot become healthy, and 90s per
              # repository of proving that delays every later sync wave.
              for entry in $TENANT_REPOSITORIES; do
                name="${entry%%:*}"
                case " $degraded " in
                  *" $name "*) continue ;;
                esac
                if ! wait_healthy repositories "$name"; then
                  degraded="$degraded $name"
                fi
              done
              if [ -n "$degraded" ]; then
                echo "WARNING: tenant repositories not syncing:$degraded"
                echo "WARNING: the platform folder is syncing, so this sync is not failed on their account"
                echo "WARNING: their folders may also be missing tenant RBAC -- run platformctl gitsync status"
              fi
              echo "git sync is connected and the platform folder is healthy"
          volumeMounts:
            - name: resources
              mountPath: /etc/gitsync
              readOnly: true
            - name: gitsync-app
              mountPath: /etc/secrets/gitsync
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: resources
          configMap:
            name: grafana-gitsync-resources
        - name: gitsync-app
          secret:
            secretName: grafana-gitsync-github-app
        - name: tmp
          emptyDir: {}
