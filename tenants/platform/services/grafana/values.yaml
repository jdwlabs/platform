revisionHistoryLimit: 0
# Prefer the large pve5 worker (labeled workload.jdwlabs.io/monitoring) so
# the memory-heavy monitoring stack stays off the small general workers.
# Soft preference: everything still schedules anywhere if that node is down.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: workload.jdwlabs.io/monitoring
              operator: In
              values: ["true"]

# Single replica on a ReadWriteOnce PVC: RollingUpdate deadlocks because the
# new pod can't attach the volume until the old one is deleted. Recreate stops
# the old pod first.
deploymentStrategy:
  type: Recreate

# Without requests Grafana is BestEffort and was evicted under node memory
# pressure alongside Prometheus. Footprint is bounded, so a limit is safe here
# (unlike Prometheus).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Runs `chown -R` over the data volume before grafana starts. Trivial and
# short-lived, but an unbounded init container drags the whole pod's QoS class
# down with it regardless of how well-bounded the containers beside it are.
initChownData:
  resources:
    requests:
      memory: 16Mi
    limits:
      memory: 64Mi

admin:
  existingSecret: grafana-admin-credentials
  userKey: admin-user
  passwordKey: admin-password

# Opt-in for Reloader (installed via the platform GitOps path, not yet
# live): rolls this Deployment when grafana-admin-credentials above is
# rotated. `annotations` (confirmed by render to reach the Deployment's own
# metadata) is this chart's hook -- podAnnotations only reaches the pod
# template. Inert until Reloader is installed.
annotations:
  secret.reloader.stakater.com/reload: "grafana-admin-credentials"

sidecar:
  # The dashboard sidecar was the one container in this pod with no bounds
  # (the grafana container above is already bounded). It watches ConfigMaps
  # and buffers dashboard JSON in memory, so give it room for large-dashboard
  # reload bursts.
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 192Mi
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    provider:
      foldersFromFilesStructure: true

datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Alertmanager
        orgId: 1
      - name: Tempo
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: PBFA97CFB590B2093
        access: proxy
        url: http://platform-kube-prometheus-s-prometheus:9090
        isDefault: true
      - name: Loki
        type: loki
        uid: P8E90F9AEF21F6940
        access: proxy
        url: http://platform-loki:3100
        # Loki is now auth_enabled; every read needs a tenant header, this
        # datasource is the platform tenant's own (Alloy stamps the same
        # "platform" org on writes that aren't explicitly tenant-stamped —
        # see the monitoring and loki services' values.yaml).
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "platform"
      - name: Loki (pre-cutover)
        type: loki
        uid: loki-pre-cutover
        access: proxy
        url: http://platform-loki:3100
        # Temporary read-only window onto everything logged before
        # auth_enabled flipped to true — Loki's hardcoded org for an
        # unauthenticated write is "fake", which the org "platform"
        # datasource above cannot see. Safe to delete once
        # retention_period (14d, see the loki service's values.yaml) has
        # fully rolled past the cutover instant and this datasource has
        # nothing left to show.
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "fake"
      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        access: proxy
        url: http://platform-kube-prometheus-s-alertmanager:9093
        jsonData:
          implementation: prometheus
      # Tracing backend (added with the tempo service). Trace-to-logs and
      # trace-to-metrics correlation reference the Loki and Prometheus UIDs
      # above. The Tempo service is provisioned separately; this datasource is
      # inert until it is reachable.
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://platform-tempo:3200
        jsonData:
          # Tempo is multitenant now (see tempo service's values.yaml). This
          # datasource is pinned to "jdwlabs", not "platform" — jdwlabs is the
          # only tenant with a live OTLP producer (servicediscovery's non
          # environment), so this is what keeps the correlation panels below
          # (tracesToLogsV2/tracesToMetrics/serviceMap/nodeGraph) showing real
          # data across the cutover instead of going silently blank. The
          # platform tenant itself emits no traces today; if/when it does,
          # this needs its own tenant-scoped datasource rather than widening
          # this one.
          httpHeaderName1: "X-Scope-OrgID"
          tracesToLogsV2:
            datasourceUid: P8E90F9AEF21F6940
            spanStartTimeShift: '-1h'
            spanEndTimeShift: '1h'
            tags:
              - key: 'service.name'
                value: 'service_name'
              - key: 'k8s.namespace.name'
                value: 'namespace'
              - key: 'k8s.pod.name'
                value: 'pod'
            filterByTraceID: true
            filterBySpanID: false
          tracesToMetrics:
            datasourceUid: PBFA97CFB590B2093
            spanStartTimeShift: '-1h'
            spanEndTimeShift: '1h'
            tags:
              - key: 'service.name'
                value: 'service'
            queries:
              - name: 'Request rate'
                query: 'sum(rate(traces_spanmetrics_calls_total{$__tags}[5m]))'
              - name: 'Request error rate'
                query: 'sum(rate(traces_spanmetrics_calls_total{$__tags,status_code="STATUS_CODE_ERROR"}[5m]))'
              - name: 'Request duration p99'
                query: 'histogram_quantile(0.99, sum(rate(traces_spanmetrics_latency_bucket{$__tags}[5m])) by (le))'
          serviceMap:
            datasourceUid: PBFA97CFB590B2093
          nodeGraph:
            enabled: true
        secureJsonData:
          httpHeaderValue1: "jdwlabs"
      - name: Tempo (pre-cutover)
        type: tempo
        uid: tempo-pre-cutover
        access: proxy
        url: http://platform-tempo:3200
        # Temporary read-only window onto everything traced before
        # multitenancyEnabled flipped to true — Tempo's internal org id for
        # an unauthenticated/pre-multitenancy push is "single-tenant", which
        # the "jdwlabs" datasource above cannot see. Safe to delete once
        # retention (168h, see the tempo service's values.yaml) has fully
        # rolled past the cutover instant and this datasource has nothing
        # left to show.
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "single-tenant"

persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi

# Git Sync (dashboards-as-code). The `provisioning` feature toggle is on by
# default in Grafana v13 OSS; repository_types must be set explicitly so the
# GitHub repository type is selectable. No other toggle is needed — the secrets
# service that stores the connection's private key is embedded in Grafana and
# is not separately enableable.
#
# The Connection and Repository resources are not created by hand in the UI:
# postInstall/gitsync-resources.yaml holds them and the companion apply Job
# creates them on sync. The GitHub App private key is staged in Vault
# (kv/grafana-gitsync, seeded via `platformctl bootstrap seed grafana-gitsync`)
# and surfaced by the grafana-gitsync-github-app ExternalSecret. See README.md
# for the edit -> commit -> PR -> sync workflow, the delete-to-change rule, and
# ConfigMap/sidecar coexistence.
grafana.ini:
  provisioning:
    repository_types: "git|github|bitbucket|gitlab|local"
  # Required so Git Sync can build PR/commit deep links back to the instance.
  server:
    root_url: https://grafana.jdwlabs.com

# Mounts the GitHub App private key (synced from Vault by the ExternalSecret)
# so the apply Job can read it off the same pod spec the chart already renders.
# This only stages the credential; the connection that consumes it is created
# by postInstall/gitsync-apply-job.yaml.
extraSecretMounts:
  - name: grafana-gitsync-github-app
    secretName: grafana-gitsync-github-app
    mountPath: /etc/secrets/gitsync
    readOnly: true
