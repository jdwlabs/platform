apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-csi-iscsi-poc
  annotations:
    # Proof-of-concept class for the official truenas-csi driver, running in
    # parallel with democratic-csi's truenas-iscsi. Exists at PoC stage
    # specifically so the fsck-on-stage question can be probed against an
    # ext4 iSCSI volume (docs/truenas-csi-migration-poc.md) — democratic-csi
    # force-fscks before every ext4 stage to recover aborted journals after a
    # session drop, and truenas-csi documents no equivalent. Never the
    # cluster default.
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: csi.truenas.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  protocol: iscsi
  # storage/k8s/truenas-csi/iscsi on the NAS — disjoint from democratic-csi's
  # storage/k8s/iscsi/vols. datasetPath is relative to the pool.
  pool: storage
  datasetPath: k8s/truenas-csi/iscsi
  # Parity with truenas-iscsi's zvolBlocksize.
  volblocksize: 16K
