# Dedicated API key for the official truenas-csi driver. The Vault path is
# deliberately NOT kv/truenas-csi — that path already holds democratic-csi's
# own TrueNAS API key and platformctl's --truenas-use-csi-api-key flag reads
# it by name; sharing one key across two CSI control planes would double the
# blast radius a single invalidated key already has (every class of
# provisioning down at once, human required to regenerate it in the TrueNAS
# UI). See docs/adr/0029-truenas-csi-evaluated-as-democratic-csi-replacement.md.
#
# The path is seeded by a human, out of band:
#   platformctl bootstrap seed truenas-csi-driver --from-file <path-to-key>
# with a freshly created TrueNAS API key. Until then this ExternalSecret
# reports SecretSyncedError and the driver pods wait on the missing Secret —
# expected pre-seed state, see docs/truenas-csi-migration-poc.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-csi-driver-api-key
  namespace: truenas-csi
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: truenas-csi-driver-api-key
  data:
    - secretKey: api-key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: truenas-csi-driver
        property: api_key
