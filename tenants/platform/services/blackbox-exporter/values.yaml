# tcp_connect (not icmp): chosen on least-privilege grounds. icmp needs the
# NET_RAW capability; tcp_connect needs none, so the chart's default
# securityContext (drop: ["ALL"], no add) stays untouched. This namespace's
# PSA is actually privileged (quotaTier: platform), so NET_RAW would be
# allowed — a TCP connect to SSH is just as good a reachability proxy without
# requesting it.
config:
  modules:
    tcp_connect:
      prober: tcp
      timeout: 5s

# Live usage sits ~26Mi (a synthetic-probe daemon issuing a handful of TCP
# connects per scrape interval, not a request-serving service). Request is
# ~1.5x that; limit leaves headroom for scrape bursts without letting a stuck
# probe consume the node. CPU is negligible (~1m observed) and floored to a
# usable value rather than scaled.
resources:
  requests:
    cpu: 10m
    memory: 40Mi
  limits:
    memory: 80Mi

serviceMonitor:
  enabled: true
  defaults:
    module: tcp_connect
    interval: 60s
    scrapeTimeout: 10s

  # Hosts have no in-cluster identity (bare hypervisors/NAS, not K8s nodes),
  # so this is the only place their reachability is declared — see
  # infrastructure repo docs/host-addressing.md for how these addresses are
  # pinned (gateway DHCP reservations, confirmed live 2026-08-14).
  targets:
    - name: pve1-mgmt
      url: "192.168.1.200:22"
      additionalMetricsRelabels:
        host: pve1
    - name: pve2-mgmt
      url: "192.168.1.201:22"
      additionalMetricsRelabels:
        host: pve2
    - name: pve3-mgmt
      url: "192.168.1.202:22"
      additionalMetricsRelabels:
        host: pve3
    - name: pve4-mgmt
      url: "192.168.1.203:22"
      additionalMetricsRelabels:
        host: pve4
    - name: pve5-mgmt
      url: "192.168.1.204:22"
      additionalMetricsRelabels:
        host: pve5
    - name: truenas-mgmt
      url: "192.168.1.205:22"
      additionalMetricsRelabels:
        host: truenas

    # tcp_connect above proves a host is reachable; it says nothing about
    # whether a real request actually clears the ingress path. The Cilium
    # endpoint-desync incident this target exists to catch dropped ~80% of
    # ingress traffic into NetworkPolicy-enforced namespaces via ETIMEDOUT
    # while every kube-probe on the affected pods kept passing (a probe hits
    # the pod directly, off-node, and never crosses the policy the desynced
    # endpoint was failing to enforce) -- so nothing already scraped noticed.
    # http_2xx (chart default, merged in via config.modules) is used rather
    # than a new module: a plain GET is enough to prove the full path works.
    #
    # The target is platform-gateway-nginx's own Service
    # (platform-gateway-nginx.nginx-gateway.svc.cluster.local, the same
    # Service the DaemonSet's 5 replicas back) -- NOT the public hostname,
    # and NOT the app's ClusterIP. The app's ClusterIP was always wrong: it
    # would bypass the gateway entirely and could pass while ingress itself
    # is broken. The public hostname turned out to be wrong too: this
    # cluster's own public IP is behind a router that cannot hairpin a LAN
    # client -- including this exporter's own pod, which lives on the same
    # LAN -- back to that IP through its port-forward rule. That limitation
    # produced probe_success==0 with a 100% healthy backend and was
    # mistaken for a live incident once already; see the runbook row this
    # rule's runbook_url points at. Hitting the gateway's Service keeps the
    # exact chain the endpoint-desync incident needs covered (gateway pod ->
    # Cilium enforcement -> backend pod) while never leaving the cluster
    # network, so the hairpin can't recur here. `hostname` (blackbox
    # exporter's own probe param, not a module setting) sets both the Host
    # header -- needed so the gateway's HTTPRoute picks the same backend the
    # public hostname would have -- and the TLS ServerName, so the
    # wildcard-jdwlabs-tls cert still validates against an address that
    # itself carries no SAN for it.
    #
    # A single node's NodePort (e.g. https://<node-ip>:30543/) was
    # considered and rejected: unlike the pve/truenas mgmt targets above,
    # this repo tracks no stable per-node address for Talos nodes (they are
    # DHCP-assigned and randomly named, e.g. talos-lx0-6a4), so pinning one
    # would both hardcode a value this repo has no source of truth for and
    # narrow the probe to one of the five replicas instead of exercising all
    # of them the way the incident's own live verification did.
    #
    # container.{prd,non} are the two backends the original incident actually
    # dropped traffic to, and both sit in `enforce: true` namespaces
    # (jdwlabs-prd, jdwlabs-non -- see tenants/jdwlabs/tenant.yaml). Named
    # with an "-ingress" suffix (as opposed to "-mgmt" above) so the alerts
    # below can select this group by regex without a job label.
    - name: container-prd-ingress
      url: "https://platform-gateway-nginx.nginx-gateway.svc.cluster.local/"
      hostname: container.prd.jdwlabs.com
      module: http_2xx
      additionalMetricsRelabels:
        app: container
        env: prd
    - name: container-non-ingress
      url: "https://platform-gateway-nginx.nginx-gateway.svc.cluster.local/"
      hostname: container.non.jdwlabs.com
      module: http_2xx
      additionalMetricsRelabels:
        app: container
        env: non

prometheusRule:
  enabled: true
  rules:
    # Scoped to -mgmt, same reasoning as HardwareHostProbeMissing below: this
    # metric now also carries -ingress targets (see IngressPathProbeFailed),
    # a separate alert class with its own labels/annotations/runbook. An
    # unscoped expr here would double-fire on ingress-path failures with
    # garbage annotations (empty $labels.host, the wrong runbook).
    - alert: HardwareHostUnreachable
      expr: probe_success{target=~".*-mgmt"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Host {{ $labels.host }} unreachable on :22"
        description: "TCP connect to {{ $labels.target }} ({{ $labels.host }}) has failed for 5m. This host has no in-cluster identity (bare hypervisor/NAS) — recovery may require Wake-on-LAN or physical access. See runbook."
        runbook_url: "https://github.com/jdwlabs/infrastructure/blob/main/scenarios/host-remote-power-recovery.md"

    # Dead-man's-switch: probe_success == 0 above only matches an EXISTING
    # series. If the exporter pod dies or its ServiceMonitor stops being
    # scraped, probe_success disappears entirely and that comparison yields
    # zero results — silently no alert, the exact "went dark, unnoticed"
    # failure mode this chart exists to close, moved up one layer.
    - alert: HardwareHostProbeMissing
      expr: absent(probe_success{target=~".*-mgmt"}) == 1
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Hardware host reachability probes have stopped reporting entirely"
        description: "No probe_success series found for 10m — the blackbox-exporter deployment or its ServiceMonitor may be down. Host unreachability alerting is blind until this is fixed."
        runbook_url: "https://github.com/jdwlabs/infrastructure/blob/main/scenarios/host-remote-power-recovery.md"

    # Distinct from HardwareHostUnreachable: that alert proves a bare host
    # accepts a TCP connection, this one proves an HTTP request actually
    # clears platform-gateway-nginx and a NetworkPolicy-enforced namespace
    # end to end. A Cilium endpoint desync leaves kube-probe traffic
    # (pod-direct, off-node) passing while real ingress ETIMEDOUTs, so this
    # is the only signal that would have caught that failure live.
    #
    # The probe now targets platform-gateway-nginx's own in-cluster Service
    # rather than the public hostname (see the target comment above), which
    # rules out the one other confirmed cause of an identical symptom: this
    # cluster's router cannot hairpin a LAN client back to the cluster's own
    # public IP, so a probe run from a LAN pod against the public hostname
    # reads probe_success==0 with an otherwise 100% healthy backend. That
    # was mistaken for a live desync once already. A probe against the
    # public hostname run manually from a LAN device while triaging this
    # alert can still hit that limitation -- if it does, it is not
    # corroboration of an incident, it is the hairpin. Rule out Cilium
    # desync by checking pod-to-pod connectivity to the backend and NodePort
    # reachability from every node FIRST; only conclude desync once those
    # are healthy and this Service-targeted probe is still failing.
    #
    # for: 5m mirrors HardwareHostUnreachable's own reasoning: the failure
    # this exists to catch is a hard, total desync (every request to the
    # backend fails), not a partial degradation, so a short window already
    # separates it cleanly from a single dropped probe or a cert-renewal
    # blip without adding avoidable delay to the page.
    - alert: IngressPathProbeFailed
      expr: probe_success{target=~".*-ingress"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Ingress-path probe to {{ $labels.target }} failing"
        description: "An HTTP probe through platform-gateway-nginx to {{ $labels.target }} ({{ $labels.app }}/{{ $labels.env }}) failed for 5m. Runs in-cluster now, so a LAN-router hairpin can't cause it — check pod-to-pod/NodePort connectivity before assuming Cilium desync. See runbook."
        runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

    # The same dead-man's-switch gap HardwareHostProbeMissing closes for the
    # -mgmt group, mirrored for -ingress: if the exporter or its
    # ServiceMonitor goes down, probe_success{target=~".*-ingress"} vanishes
    # rather than reading 0, and the comparison above silently matches
    # nothing. Kept as a separate alert rather than widening the regex on
    # HardwareHostProbeMissing, so each dead-man's-switch names the probe
    # group it actually covers.
    - alert: IngressPathProbeMissing
      expr: absent(probe_success{target=~".*-ingress"}) == 1
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Ingress-path reachability probes have stopped reporting entirely"
        description: "No probe_success series found for the ingress-path targets for 10m — the blackbox-exporter deployment or its ServiceMonitor may be down. The Cilium-desync ingress blind spot this probe exists to close is unmonitored until this is fixed."
        runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"
