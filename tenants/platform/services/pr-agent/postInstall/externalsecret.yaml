apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pr-agent
  namespace: pr-review
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: pr-agent
    creationPolicy: Owner
  data:
    - secretKey: GITHUB__APP_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: pr-agent
        property: app-id
    - secretKey: GITHUB__PRIVATE_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: pr-agent
        property: private-key
    # PR-Agent rejects every webhook with 403 while this is unset, so a
    # missing property fails closed rather than open.
    - secretKey: GITHUB__WEBHOOK_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: pr-agent
        property: webhook-secret
    # LiteLLM virtual key scoped to the pr-reviewer models, rate-limited.
    - secretKey: OPENAI__KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: litellm
        property: pr_reviewer_key
