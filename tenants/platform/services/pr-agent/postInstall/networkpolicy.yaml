# The namespace's externalEgress allow excludes in-cluster ranges, so the
# one in-cluster dependency gets its own narrow rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-litellm-egress
  namespace: pr-review
spec:
  podSelector:
    matchLabels: {app: pr-agent}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-sre
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
