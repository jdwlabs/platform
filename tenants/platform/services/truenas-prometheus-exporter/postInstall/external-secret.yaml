# Reads the least-privilege "Readonly Admin" key seeded at kv/truenas-prometheus
# — never kv/truenas-csi, which democratic-csi provisions with and an
# authentication attempt against is a mutation with a cluster-wide blast
# radius (docs/adr/0025). A scraping exporter must not share that key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-prometheus-exporter
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: truenas-prometheus-exporter
  data:
    - secretKey: api_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: truenas-prometheus
        property: api_key
