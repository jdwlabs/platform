# The rendered config below talks to TrueNAS over the REST API, which TrueNAS
# removes in 26. That is not an oversight and not a config-only fix: no build
# of democratic-csi speaks the replacement WebSocket API, so there is nothing
# to cut over to and the NAS is gated at 25.10.x instead. See
# docs/adr/0024-truenas-rest-removal-blocks-democratic-csi.md before changing
# httpConnection or the driver name here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: democratic-csi-driver-config
  namespace: democratic-csi
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: democratic-csi-driver-config
    template:
      data:
        driver-config-file.yaml: |
          driver: freenas-api-nfs
          httpConnection:
            # HTTPS, not HTTP. TrueNAS auto-revokes an API key the moment it is
            # presented over plain HTTP — "Attempt to use over an insecure
            # transport" — which takes the CSI control plane down for every
            # class at once: no provisioning, no deletion, no expansion.
            # allowInsecure skips verification of the self-signed iXsystems
            # certificate the appliance ships; the transport is still encrypted,
            # which is what the appliance is actually checking for.
            protocol: https
            host: 192.168.1.205
            port: 443
            allowInsecure: true
            apiKey: "{{ .api_key }}"
          zfs:
            datasetParentName: storage/k8s/vols
            detachedSnapshotsDatasetParentName: storage/k8s/snaps
            datasetEnableQuotas: true
            datasetEnableReservation: false
          nfs:
            shareHost: 192.168.1.205
            shareAlldirs: false
            shareAllowedNetworks:
              - 192.168.1.0/24
            shareMaprootUser: root
            shareMaprootGroup: root
  data:
    - secretKey: api_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: truenas-csi
        property: api_key
