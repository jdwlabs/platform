apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-sre-relay
  namespace: ai-sre
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: ai-sre-relay
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: holmes
        property: litellm_key
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: holmes
        property: discord_webhook_url
    - secretKey: JIRA_URL
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: holmes
        property: jira_url
    - secretKey: JIRA_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: holmes
        property: jira_email
    - secretKey: JIRA_API_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: holmes
        property: jira_api_token
    - secretKey: GITHUB_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: holmes
        property: github_token
    # jdwlabs-agent-bot App identity: the relay mints its own short-lived
    # installation token from these rather than presenting GITHUB_TOKEN
    # above, once all three are present. GITHUB_TOKEN stays wired as the
    # fallback the relay's own code falls back to when this triple is absent.
    - secretKey: GITHUB_APP_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: agent-bot
        property: app-id
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: agent-bot
        property: installation-id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: agent-bot
        property: private-key
    # Same property the Alertmanager receiver reads, so the two cannot present
    # different tokens. Its presence is what switches the relay from accepting
    # any in-cluster caller to enforcing the bearer.
    - secretKey: WEBHOOK_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: holmes
        property: webhook_token
