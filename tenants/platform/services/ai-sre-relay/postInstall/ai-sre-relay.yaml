# Webhook relay: bridges Alertmanager to HolmesGPT so every firing alert triggers
# an AI investigation via LiteLLM. Stateless; no persistent storage required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sre-relay
  namespace: ai-sre
  labels: {app: ai-sre-relay}
  # Opt-in for Reloader (installed via the platform GitOps path, not yet
  # live): rolls this Deployment when the ai-sre-relay Secret is rotated.
  # This is raw manifests with no Helm render, so the annotation goes
  # straight on the object rather than through a values hook. Inert until
  # Reloader is installed.
  annotations:
    secret.reloader.stakater.com/reload: "ai-sre-relay"
spec:
  replicas: 1
  # GitOps rollback is a git revert + ArgoCD resync, not `kubectl rollout
  # undo`; retaining old ReplicaSets buys nothing here.
  revisionHistoryLimit: 0
  selector:
    matchLabels: {app: ai-sre-relay}
  template:
    metadata:
      labels: {app: ai-sre-relay}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: relay
          image: jdwlabs/ai-sre-relay@sha256:f42b749bee02af923b7d57701fdfebf981fefcc748d4582df7f65b5a50e67dc2
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - secretRef: {name: ai-sre-relay}
          env:
            - {name: HOLMES_URL, value: "http://platform-holmes-holmes.ai-sre.svc.cluster.local"}
            - {name: LITELLM_URL, value: "http://platform-litellm.ai-sre.svc.cluster.local:4000/v1"}
            - {name: LITELLM_MODEL, value: "sre-investigator"}
            # Sole deadline for LLM-bound calls as of relay 0.1.2. Free-tier
            # latency is high-variance: 433-600s+ observed on the big model;
            # 900 gives the fallback chain room to run inside one alert.
            - {name: INVESTIGATION_TIMEOUT_SECONDS, value: "900"}
            - {name: JIRA_PROJECT, value: "JDWLABS"}
            # Names where a model-authored remediation patch is written, and
            # bounds it. A single entry is injected into the proposal rather
            # than asked for, so the destination is never something the model
            # infers from alert text; it is re-checked here before any write.
            # Path and file body still come from a model prompted with
            # untrusted alert text, so this list — not the token's scope — is
            # the intended limit. Kept to the single repo whose manifests an
            # alert would actually remediate; every extra entry widens the
            # blast radius of a hallucinated patch and turns the destination
            # back into a model choice. Unset disables the arm.
            - {name: GITHUB_REPO_ALLOWLIST, value: "jdwlabs/platform"}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-sre-relay
  namespace: ai-sre
  # ServiceMonitor selects on this, not on spec.selector (that's pod
  # selection and invisible to the operator) — without it the scrape target
  # list is empty and AiSreRelayMetricsTargetDown fires permanently.
  labels: {app: ai-sre-relay}
spec:
  selector: {app: ai-sre-relay}
  ports:
    - {name: http, port: 8080, targetPort: http}
