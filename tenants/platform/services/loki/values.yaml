deploymentMode: SingleBinary

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

singleBinary:
  replicas: 1
  # Prefer the large pve5 worker (labeled workload.jdwlabs.io/monitoring) so
  # the memory-heavy monitoring stack stays off the small general workers.
  # Soft preference: everything still schedules anywhere if that node is down.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: workload.jdwlabs.io/monitoring
                operator: In
                values: ["true"]
  priorityClassName: platform-critical
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      memory: 1.5Gi
  persistence:
    enabled: true
    # NFS-backed NAS volume; chunk data lives here now that MinIO is gone.
    # Sized to cover WAL + index + chunks previously split across two 20Gi PVCs.
    storageClass: "truenas-nfs"
    size: 30Gi

chunksCache:
  enabled: true
  # Prefer the large pve5 worker (labeled workload.jdwlabs.io/monitoring) so
  # the memory-heavy monitoring stack stays off the small general workers.
  # Soft preference: everything still schedules anywhere if that node is down.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: workload.jdwlabs.io/monitoring
                operator: In
                values: ["true"]
  allocatedMemory: 512   # MB
  maxItemMemory: 5
  replicas: 1

# The chart derives the container request from allocatedMemory (×1.2 memcached
# overhead), so this is the only knob that actually shrinks the reservation.
# Default 1024MB reserved ~1.2Gi for a cache holding ~25Mi — queries here are
# rarely repeated, so a small results cache loses nothing. chunksCache above is
# deliberately untouched: memcached fills to its allocation and it runs ~90%
# utilized.
resultsCache:
  enabled: true
  allocatedMemory: 64   # MB
  maxItemMemory: 5
  replicas: 1

# Shared by both memcached StatefulSets; the exporter sidecar ran unbounded in
# each while the memcached container beside it was capped. Observed 8-24Mi.
memcachedExporter:
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 96Mi

# The rules sidecar (k8s-sidecar) beside the loki container ran unbounded while
# loki itself was capped. It holds the watched rule ConfigMaps in memory and
# sits at ~77Mi steady state; the limit leaves room for a full re-list when the
# watch reconnects.
sidecar:
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 256Mi

loki:
  # ArgoCD holds prior manifests in git history; no need for k8s to keep old
  # ReplicaSets around too. One key drives every deployment-mode workload
  # (single-binary, distributed read/write/backend), so it takes effect
  # regardless of deploymentMode above.
  revisionHistoryLimit: 0
  # Native X-Scope-OrgID multi-tenancy. Every writer must now carry a tenant
  # header: Alloy stamps one per pod log entry (see the monitoring service's
  # values.yaml), and the Grafana datasources below carry one per tenant.
  # Rollback: flip this back to false and drop the Alloy tenant-stamping
  # stage in the same change — a header-carrying write against an
  # auth_enabled: false Loki is accepted and ignored, but the reverse
  # (headerless write against auth_enabled: true) is rejected outright, so
  # don't revert one side without the other.
  auth_enabled: true
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 14d
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40
    retention_stream:
      - selector: '{job="integrations/kubernetes/eventhandler"}'
        priority: 1
        period: 48h
  ruler:
    enable_api: true

# Gateway (nginx) ran BestEffort at ~13Mi observed; it only proxies to the
# single binary, so a tight bound is safe.
gateway:
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 64Mi

monitoring:
  serviceMonitor:
    enabled: true
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
    # Unrelated to the `enabled` flag above (that gates a separate
    # Grafana-Agent-based self-scrape this cluster doesn't use): the
    # loki-canary template reads this tenant name unconditionally whenever
    # auth_enabled is true, to set -user/-tenant-id on its own write+query
    # loop. Left at the chart default ("self-monitoring") this is a tenant
    # id no writer ever stamps, so the canary silently drops out of the org
    # that carries the platform tenant's real traffic. It's cluster infra,
    # not tenant workload, so it rides the same "platform" fallback org the
    # Alloy destination default uses.
    tenant:
      name: platform
  lokiCanary:
    enabled: true

minio:
  enabled: false

# lokiCanary is a top-level chart key (the monitoring.lokiCanary.enabled above is a
# harmless no-op left in place to avoid unrelated churn). Canary has no business
# running on control-plane nodes: explicit label-based anti-affinity (not just
# relying on the CP NoSchedule taint being present at schedule time) so a stray
# pod can't survive a taint-timing race during a CP node rejoin/reboot (a
# recurring failure mode).
lokiCanary:
  # Ran BestEffort at ~19Mi observed per node (96Mi across 5); the canary
  # write/read loop has a flat footprint, so a tight bound is safe.
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 64Mi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
