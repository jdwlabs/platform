name: jdwlabs
displayName: "Jdwlabs"
githubOrg: jdwlabs
contacts:
  - jdwillmsen@gmail.com

deploymentRepo:
  url: https://github.com/jdwlabs/deployments.git
  revision: main

namespaces:
  - name: jdwlabs-non
    quotaTier: standard
    networkPolicy: default
    enforce: true
    # Fourth attempt overall, 2026-08-21. Two root causes found and fixed
    # tonight: (1) kubelet probe traffic never got Cilium's `host` identity
    # under chained Flannel+Cilium networking -- fixed in
    # kubelet-probe-policy.yaml / PR #316. (2) the shared `database`
    # namespace's own postgres pods were mostly unmanaged, so cross-namespace
    # egress to an unlucky backend got dropped -- fixed via a CNPG-safe
    # promote+recreate sequence, all 6 postgres pods + db-ui now
    # Cilium-managed. Both fixes verified live via Hubble with zero drops
    # before this attempt. Inter-app calls (authui/rolesui/usersui/container
    # -> usersrole, servicediscovery) go out via their public *.jdwlabs.com
    # hostnames and hairpin back through the gateway rather than using
    # in-cluster Service DNS, so egress needs the external allow, not just
    # the ingress-controller allow that already covers the inbound leg.
    externalEgress: true
  - name: jdwlabs-prd
    quotaTier: standard
    networkPolicy: default
    enforce: true
    # Third attempt, 2026-08-21. #285/#286 crashlooped on the kubelet-probe
    # bug (see jdwlabs-non). A same-day retest also caught the database
    # coverage gap live (dotablaze-tech meowbot crashlooped on an unmanaged
    # postgres backend) before it ever reached jdwlabs-prd -- both root
    # causes now fixed and verified, see jdwlabs-non for detail. Same
    # hairpin egress dependency (authui/rolesui/usersui/container ->
    # usersrole.prd.jdwlabs.com, servicediscovery.prd.jdwlabs.com).
    externalEgress: true
  - name: jdwlabs-runners
    quotaTier: ci
    networkPolicy: ci
    enforce: true
    arc: true

project:
  elevated: false
  extraSourceRepos:
    - https://github.com/jdwlabs/platform.git
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

observability:
  tenantId: jdwlabs
  grafana:
    folder: jdwlabs
    team: jdwlabs
    access: edit
    gitSyncFolder: jdwlabs-dashboards

services:
  # ARC is dormant: CI runs exclusively on GitHub-hosted runners. Kept
  # commented (values/postInstall intact, namespace still defined) for easy
  # re-enable — see platform OPERATIONS.md "Self-hosted CI runners (ARC)".
  # - name: arc-runner-set-jdwlabs
  #   chart: gha-runner-scale-set
  #   repo: ghcr.io/actions/actions-runner-controller-charts
  #   revision: 0.14.1
  #   namespace: jdwlabs-runners
  #   postInstall: true
  #   syncWave: 5

  - name: jdwlabs-schemas
    chart: ""
    repo: ""
    revision: ""
    namespace: database
    postInstall: false
    rawManifests: true
    syncWave: 5

  - name: jdwlabs-alerts
    chart: ""
    repo: ""
    revision: ""
    namespace: jdwlabs-non
    postInstall: false
    rawManifests: true
    syncWave: 2
