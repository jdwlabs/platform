name: jdwlabs
displayName: "Jdwlabs"
githubOrg: jdwlabs
contacts:
  - jdwillmsen@gmail.com

deploymentRepo:
  url: https://github.com/jdwlabs/deployments.git
  revision: main

namespaces:
  - name: jdwlabs-non
    quotaTier: standard
    networkPolicy: default
    enforce: true
    # Second attempt, 2026-08-21. First attempt (PR #314) crashlooped all 6
    # pods within seconds -- kubelet probe traffic was getting dropped
    # because Cilium (chained on Flannel) never classified it as `host`.
    # Root-caused and fixed in kubelet-probe-policy.yaml / PR #316 (adds a
    # fromCIDR allow for each node's real gateway IP). All 6 pods confirmed
    # Cilium-managed. Inter-app calls (authui/rolesui/usersui/container ->
    # usersrole, servicediscovery) go out via their public *.jdwlabs.com
    # hostnames and hairpin back through the gateway rather than using
    # in-cluster Service DNS, so egress needs the external allow, not just
    # the ingress-controller allow that already covers the inbound leg.
    externalEgress: true
  - name: jdwlabs-prd
    quotaTier: standard
    networkPolicy: default
    enforce: true
    # Third attempt, 2026-08-21. #285/#286 crashlooped because kubelet probe
    # traffic was never classified as Cilium's `host` entity (chained
    # Flannel+Cilium) -- root-caused live on JDWLABS-355 and fixed in
    # kubelet-probe-policy.yaml / PR #316 (fromCIDR allow per node gateway
    # IP). Verified clean on jdwlabs-non first: zero drops, zero restarts,
    # watched live via Hubble. Same hairpin egress dependency as jdwlabs-non
    # (authui/rolesui/usersui/container -> usersrole.prd.jdwlabs.com,
    # servicediscovery.prd.jdwlabs.com).
    externalEgress: true
  - name: jdwlabs-runners
    quotaTier: ci
    networkPolicy: ci
    enforce: true
    arc: true

project:
  elevated: false
  extraSourceRepos:
    - https://github.com/jdwlabs/platform.git
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

observability:
  tenantId: jdwlabs
  grafana:
    folder: jdwlabs
    team: jdwlabs
    access: edit
    gitSyncFolder: jdwlabs-dashboards

services:
  # ARC is dormant: CI runs exclusively on GitHub-hosted runners. Kept
  # commented (values/postInstall intact, namespace still defined) for easy
  # re-enable — see platform OPERATIONS.md "Self-hosted CI runners (ARC)".
  # - name: arc-runner-set-jdwlabs
  #   chart: gha-runner-scale-set
  #   repo: ghcr.io/actions/actions-runner-controller-charts
  #   revision: 0.14.1
  #   namespace: jdwlabs-runners
  #   postInstall: true
  #   syncWave: 5

  - name: jdwlabs-schemas
    chart: ""
    repo: ""
    revision: ""
    namespace: database
    postInstall: false
    rawManifests: true
    syncWave: 5

  - name: jdwlabs-alerts
    chart: ""
    repo: ""
    revision: ""
    namespace: jdwlabs-non
    postInstall: false
    rawManifests: true
    syncWave: 2
