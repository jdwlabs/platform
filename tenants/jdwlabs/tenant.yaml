name: jdwlabs
displayName: "Jdwlabs"
githubOrg: jdwlabs
contacts:
  - jdwillmsen@gmail.com

deploymentRepo:
  url: https://github.com/jdwlabs/deployments.git
  revision: main

namespaces:
  - name: jdwlabs-non
    quotaTier: standard
    networkPolicy: default
    enforce: true
    # All 6 pods (authui/rolesui/usersui/container/usersrole/servicediscovery)
    # confirmed Cilium-managed (CiliumEndpoint present) on 2026-08-21. Allow-set
    # checked against observed traffic: every inter-app call goes out via public
    # *.jdwlabs.com hostnames and hairpins back through the gateway rather than
    # using in-cluster Service DNS (confirmed via env vars — no same-namespace
    # Service references anywhere), so the external-egress allow covers it, not
    # just the ingress-controller allow for the inbound leg. usersrole's only
    # other dependency is cross-namespace Postgres on 5432, already allowed.
    externalEgress: true
  - name: jdwlabs-prd
    quotaTier: standard
    networkPolicy: default
    # enforce is deferred, second time: #286 retried it with the #285
    # kubelet-probe allow in place and every pod crashlooped again anyway.
    # Root cause not yet re-diagnosed -- the fromEntities: [host] rule alone
    # was not sufficient this time, unlike the theory behind #285. Needs live
    # investigation (cilium policy verdict for an actual failing probe
    # request) before a third attempt, not another assumption.
    #
    # Same hairpin egress dependency as jdwlabs-non (authui/rolesui/usersui/
    # container -> usersrole.prd.jdwlabs.com, servicediscovery.prd.jdwlabs.com).
    externalEgress: true
  - name: jdwlabs-runners
    quotaTier: ci
    networkPolicy: ci
    enforce: true
    arc: true

project:
  elevated: false
  extraSourceRepos:
    - https://github.com/jdwlabs/platform.git
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

observability:
  tenantId: jdwlabs
  grafana:
    folder: jdwlabs
    team: jdwlabs
    access: edit
    gitSyncFolder: jdwlabs-dashboards

services:
  # ARC is dormant: CI runs exclusively on GitHub-hosted runners. Kept
  # commented (values/postInstall intact, namespace still defined) for easy
  # re-enable — see platform OPERATIONS.md "Self-hosted CI runners (ARC)".
  # - name: arc-runner-set-jdwlabs
  #   chart: gha-runner-scale-set
  #   repo: ghcr.io/actions/actions-runner-controller-charts
  #   revision: 0.14.1
  #   namespace: jdwlabs-runners
  #   postInstall: true
  #   syncWave: 5

  - name: jdwlabs-schemas
    chart: ""
    repo: ""
    revision: ""
    namespace: database
    postInstall: false
    rawManifests: true
    syncWave: 5

  - name: jdwlabs-alerts
    chart: ""
    repo: ""
    revision: ""
    namespace: jdwlabs-non
    postInstall: false
    rawManifests: true
    syncWave: 2
