name: jdwlabs
displayName: "Jdwlabs"
githubOrg: jdwlabs
contacts:
  - jdwillmsen@gmail.com

deploymentRepo:
  url: https://github.com/jdwlabs/deployments.git
  revision: main

namespaces:
  - name: jdwlabs-non
    quotaTier: standard
    networkPolicy: default
    # enforce is deferred: this namespace's pods predate the policy engine and
    # carry no Cilium identity, so a restrictive set resolves against nothing
    # today and would instead bite whichever pod restarts first — an unrelated
    # deploy, eviction, drain or OOM kill — under an allow-set no observation
    # window ever covered, because audit mode is per-endpoint and these
    # endpoints did not exist. Set it once this namespace's pods are
    # Cilium-managed and the allow-set below has been checked against their
    # observed traffic.
    #
    # Inter-app calls (authui/rolesui/usersui/container -> usersrole,
    # servicediscovery) go out via their public *.jdwlabs.com hostnames and
    # hairpin back through the gateway rather than using in-cluster Service
    # DNS, so egress needs the external allow, not just the ingress-controller
    # allow that already covers the inbound leg.
    externalEgress: true
  - name: jdwlabs-prd
    quotaTier: standard
    networkPolicy: default
    enforce: true
    # Same hairpin egress dependency as jdwlabs-non (authui/rolesui/usersui/
    # container -> usersrole.prd.jdwlabs.com, servicediscovery.prd.jdwlabs.com).
    externalEgress: true
  - name: jdwlabs-runners
    quotaTier: ci
    networkPolicy: ci
    enforce: true
    arc: true

project:
  elevated: false
  extraSourceRepos:
    - https://github.com/jdwlabs/platform.git
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

observability:
  tenantId: jdwlabs
  grafana:
    folder: jdwlabs
    team: jdwlabs
    access: edit

services:
  # ARC is dormant: CI runs exclusively on GitHub-hosted runners. Kept
  # commented (values/postInstall intact, namespace still defined) for easy
  # re-enable — see platform OPERATIONS.md "Self-hosted CI runners (ARC)".
  # - name: arc-runner-set-jdwlabs
  #   chart: gha-runner-scale-set
  #   repo: ghcr.io/actions/actions-runner-controller-charts
  #   revision: 0.14.1
  #   namespace: jdwlabs-runners
  #   postInstall: true
  #   syncWave: 5

  - name: jdwlabs-schemas
    chart: ""
    repo: ""
    revision: ""
    namespace: database
    postInstall: false
    rawManifests: true
    syncWave: 5

  - name: jdwlabs-alerts
    chart: ""
    repo: ""
    revision: ""
    namespace: jdwlabs-non
    postInstall: false
    rawManifests: true
    syncWave: 2
