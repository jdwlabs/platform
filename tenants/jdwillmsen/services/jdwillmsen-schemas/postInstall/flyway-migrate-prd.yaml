apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-jdwillmsen-prd-v1
  namespace: database
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      # Fully hardened, unlike the jdwlabs job this is modelled on.
      #
      # That job restricts capabilities and seccomp only, on the stated grounds
      # that the image declares no user and its JVM owns paths under /flyway,
      # so a uid or a sealed root filesystem "risks a container that never
      # starts". That was never tested. It was tested on 2026-09-08: this exact
      # image ran as uid 10001 with a read-only root filesystem and a CPU
      # limit, connected to jdwillmsen_prd and reported its schema state, given
      # writable emptyDirs at /tmp and /flyway/conf.
      #
      # The uid is above 10000 because Trivy flags lower ones as colliding with
      # host user ranges (KSV-0020/0021).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flyway
          # Digest-pinned, unlike the jdwlabs jobs this is modelled on.
          # Those are allowlisted in tools/image-pin-allowlist.yaml as
          # pre-existing, with digest-pinning recorded as follow-up work --
          # which is a reason for code that predates the check, not for code
          # being written after it. Adding a new entry to that list would grow
          # the debt it exists to track.
          image: flyway/flyway:11.2@sha256:6b6ce825edb0e199c31864aff792961ab5b37345d5cb0f4ee62a2ee917d98336
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Well above what one small migration needs, so the JVM is bounded
          # without risking an OOM kill mid-migration: a killed container
          # leaves the schema half-applied and blocks the sync.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Bounded, where the jdwlabs job leaves CPU unlimited. A
              # migration that takes twice as long on a throttled core is a
              # slower sync; a migration that can consume the node is a
              # neighbour's outage.
              cpu: "1"
              memory: 1Gi
          env:
            - name: FLYWAY_URL
              value: "jdbc:postgresql://platform-postgresql-cluster-prd-rw.database.svc:5432/jdwillmsen_prd"
            # The superuser, as the jdwlabs migrations do. Migrations create
            # schemas and objects the app role does not own; the app role is
            # what the workload connects with, and it deliberately cannot
            # reshape its own schema.
            - name: FLYWAY_USER
              value: postgres
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: platform-postgresql-cluster-prd-superuser
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_BASELINE_VERSION
              value: "0"
            - name: FLYWAY_DEFAULT_SCHEMA
              value: public
            - name: FLYWAY_SCHEMAS
              value: public,minecraft
          args:
            - "-locations=filesystem:/flyway/sql"
            - "repair"
            - "migrate"
          # Flyway's JVM writes outside its read-only root, so those paths
          # are the two emptyDirs below. Established by running the image
          # this way rather than by reading its Dockerfile.
          workingDir: /tmp
          volumeMounts:
            - mountPath: /flyway/sql
              name: migrations
            - mountPath: /tmp
              name: tmp
            - mountPath: /flyway/conf
              name: conf
      volumes:
        - name: migrations
          configMap:
            name: jdwillmsen-migrations
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
