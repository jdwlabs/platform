kind: ConfigMap
apiVersion: v1
metadata:
  name: jdwillmsen-migrations
  namespace: database
data:
  V1__minecraft_init.sql: |
    CREATE SCHEMA IF NOT EXISTS minecraft;

    -- Identity is the XUID, never the gamertag.
    --
    -- Gamertags change, and on 2026-09-08 working out which Deployment was
    -- which player took correlating pod spawn timestamps against server
    -- connection lines, because nothing recorded the mapping. The XUID is the
    -- stable handle the server itself uses; the gamertag is an attribute of it.
    CREATE TABLE IF NOT EXISTS minecraft.players
    (
        xuid              TEXT        NOT NULL PRIMARY KEY,
        current_gamertag  TEXT        NOT NULL,
        first_seen_at     TIMESTAMPTZ NOT NULL DEFAULT now(),
        last_seen_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        -- Drives welcome variants together with last_seen_at: a first-ever
        -- join and a return after a fortnight deserve different greetings, and
        -- the two facts answer both questions without a second table.
        join_count        INTEGER     NOT NULL DEFAULT 0,
        created_at        TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at        TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- Every gamertag a player has ever appeared under.
    --
    -- Kept because a rename otherwise silently rewrites history: without this,
    -- a player who changes gamertag looks like a stranger in old sessions, and
    -- there is no way back to who they were.
    CREATE TABLE IF NOT EXISTS minecraft.player_names
    (
        xuid           TEXT        NOT NULL REFERENCES minecraft.players (xuid) ON DELETE CASCADE,
        gamertag       TEXT        NOT NULL,
        first_seen_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        last_seen_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (xuid, gamertag)
    );

    -- Raw join/leave pairs rather than a running total.
    --
    -- A counter is smaller and answers exactly one question forever. Session
    -- rows answer questions not yet asked -- when someone plays, how long a
    -- typical visit runs, who was on during an incident -- and a total is a
    -- SUM away. The playtime views below are that SUM.
    CREATE TABLE IF NOT EXISTS minecraft.sessions
    (
        session_id        BIGINT      NOT NULL GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        xuid              TEXT        NOT NULL REFERENCES minecraft.players (xuid) ON DELETE CASCADE,
        -- Denormalised on purpose: this is who they were *at the time*, which
        -- players.current_gamertag stops being the moment they rename.
        gamertag          TEXT        NOT NULL,
        joined_at         TIMESTAMPTZ NOT NULL DEFAULT now(),
        left_at           TIMESTAMPTZ,
        -- 'open' is the live state. 'unknown' is the honest one: the agent
        -- observes leaves by being connected, so a server restart, an agent
        -- restart or a crash ends sessions it never sees end. Recording that
        -- as its own reason keeps those rows from being mistaken for real
        -- departures, and keeps their durations out of any average that cares.
        ended_reason      TEXT        NOT NULL DEFAULT 'open'
            CHECK (ended_reason IN ('open', 'left', 'agent_restart', 'unknown')),
        duration_seconds  INTEGER     GENERATED ALWAYS AS
            (EXTRACT(EPOCH FROM (left_at - joined_at))::INTEGER) STORED
    );

    CREATE INDEX IF NOT EXISTS sessions_xuid_joined_idx
        ON minecraft.sessions (xuid, joined_at DESC);
    CREATE INDEX IF NOT EXISTS sessions_joined_idx
        ON minecraft.sessions (joined_at DESC);
    -- Partial: the agent reopens or closes these on startup, and there is
    -- normally a handful at most, so scanning the whole table for them would
    -- get slower every day for no reason.
    CREATE INDEX IF NOT EXISTS sessions_open_idx
        ON minecraft.sessions (xuid) WHERE ended_reason = 'open';

    -- Totals are a view, not a column: a stored counter and the rows it
    -- summarises drift the first time a session is corrected, and then neither
    -- can be trusted.
    CREATE OR REPLACE VIEW minecraft.player_playtime AS
    SELECT p.xuid,
           p.current_gamertag,
           p.join_count,
           p.first_seen_at,
           p.last_seen_at,
           COALESCE(SUM(s.duration_seconds), 0)::BIGINT AS total_seconds,
           COUNT(s.session_id) FILTER (WHERE s.left_at IS NOT NULL) AS completed_sessions,
           -- Surfaced rather than hidden: a player whose sessions are mostly
           -- 'unknown' has playtime that is a lower bound, not a measurement.
           COUNT(s.session_id) FILTER (WHERE s.ended_reason = 'unknown') AS unclean_sessions
    FROM minecraft.players p
             LEFT JOIN minecraft.sessions s ON s.xuid = p.xuid
    GROUP BY p.xuid, p.current_gamertag, p.join_count, p.first_seen_at, p.last_seen_at;

    CREATE OR REPLACE VIEW minecraft.player_playtime_daily AS
    SELECT xuid,
           gamertag,
           date_trunc('day', joined_at) AS day,
           COALESCE(SUM(duration_seconds), 0)::BIGINT AS total_seconds,
           COUNT(*) AS sessions
    FROM minecraft.sessions
    WHERE left_at IS NOT NULL
    GROUP BY xuid, gamertag, date_trunc('day', joined_at);

  V2__fix_permissions.sql: |
    -- Grant the runtime role access to what V1 created.
    --
    -- Flyway runs as postgres, so every object V1 created is owned by postgres
    -- and reachable by nobody else. The workload connects as app, which held
    -- USAGE on the schema and no privilege at all on any table in it. The
    -- effect in production was that minecraft.players and minecraft.sessions
    -- stayed empty while the agent reported itself healthy: the failure only
    -- surfaced as a permission denied on startup orphan cleanup, and every
    -- other write path either was not wired yet or logged and continued.
    --
    -- Ownership moves to postgres and stays there, matching what the migration
    -- Job's own comment already describes: app is the runtime role and
    -- deliberately cannot reshape its own schema.
    --
    -- Modelled on the equivalent migration in the dotablaze-tech and jdwlabs
    -- tenants, with one deliberate difference: public is excluded. There it is
    -- swept up by a loop over every non-system schema, which also rewrites
    -- public's owner away from pg_database_owner. Nothing here needs that, and
    -- it is a wider change than a permissions fix should make.
    DO $$
    DECLARE
        s text;
        r record;
    BEGIN
        FOR s IN
            SELECT nspname FROM pg_namespace
            WHERE nspname NOT IN ('pg_catalog', 'information_schema', 'pg_toast', 'public')
              AND nspname NOT LIKE 'pg_temp_%'
              AND nspname NOT LIKE 'pg_toast_temp_%'
        LOOP
            EXECUTE format('ALTER SCHEMA %I OWNER TO postgres', s);
            EXECUTE format('GRANT USAGE ON SCHEMA %I TO app', s);

            FOR r IN
                SELECT tablename FROM pg_tables
                WHERE schemaname = s AND tablename <> 'flyway_schema_history'
            LOOP
                EXECUTE format('ALTER TABLE %I.%I OWNER TO postgres', s, r.tablename);
            END LOOP;

            -- Views carry their own ownership and are not covered by the table
            -- loop above; the agent reads playtime through two of them.
            FOR r IN SELECT viewname FROM pg_views WHERE schemaname = s LOOP
                EXECUTE format('ALTER VIEW %I.%I OWNER TO postgres', s, r.viewname);
            END LOOP;

            FOR r IN SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema = s LOOP
                EXECUTE format('ALTER SEQUENCE %I.%I OWNER TO postgres', s, r.sequence_name);
            END LOOP;

            EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO app', s);
            EXECUTE format('GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA %I TO app', s);

            -- Without these, the next migration that adds a table reintroduces
            -- exactly this bug and nothing notices until a write fails.
            EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA %I GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app', s);
            EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA %I GRANT USAGE, SELECT ON SEQUENCES TO app', s);
        END LOOP;
    END $$;

  V3__minecraft_knowledge.sql: |
    -- Curated server facts the @server answer path reads.
    --
    -- Operator-written on purpose: everything knowledge_lookup returns is
    -- quoted to players as the server's own word, so the write side is gated
    -- on the same permissions.json the ! commands already resolve against.
    CREATE TABLE IF NOT EXISTS minecraft.knowledge
    (
        topic       TEXT        NOT NULL PRIMARY KEY,
        body        TEXT        NOT NULL,
        -- SET NULL, not CASCADE: deleting a player must not delete the server
        -- rules they happened to write.
        author_xuid TEXT        REFERENCES minecraft.players (xuid) ON DELETE SET NULL,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        search      TSVECTOR    GENERATED ALWAYS AS
            (to_tsvector('english', topic || ' ' || body)) STORED
    );

    CREATE INDEX IF NOT EXISTS knowledge_search_idx
        ON minecraft.knowledge USING GIN (search);

    -- Personal named coordinates. CASCADE here, unlike knowledge above: these
    -- are the player's own data and go with them.
    CREATE TABLE IF NOT EXISTS minecraft.waypoints
    (
        xuid       TEXT        NOT NULL REFERENCES minecraft.players (xuid) ON DELETE CASCADE,
        name       TEXT        NOT NULL,
        x          INTEGER     NOT NULL,
        y          INTEGER     NOT NULL,
        z          INTEGER     NOT NULL,
        dimension  TEXT        NOT NULL DEFAULT 'overworld'
            CHECK (dimension IN ('overworld', 'nether', 'end')),
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (xuid, name)
    );

  V4__minecraft_announcements.sql: |
    -- Things the server wants said, and who has already heard them.
    --
    -- An outbox rather than a chat call: four different sources will want to
    -- announce, and every question about who sees a message, when, and
    -- whether it is still worth saying should be answered once rather than
    -- once per source.
    CREATE TABLE IF NOT EXISTS minecraft.announcements
    (
        announcement_id BIGINT      NOT NULL GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        body            TEXT        NOT NULL,
        source          TEXT        NOT NULL
            CHECK (source IN ('command', 'schedule', 'event', 'api')),
        -- SET NULL, not CASCADE: deleting a player must not delete the
        -- announcements the server made. Null for everything the server said
        -- on its own initiative.
        author_xuid     TEXT        REFERENCES minecraft.players (xuid) ON DELETE SET NULL,
        target_kind     TEXT        NOT NULL
            CHECK (target_kind IN ('everyone', 'player', 'permission', 'online_only')),
        -- The XUID for 'player', the level for 'permission', null otherwise.
        -- One nullable column rather than three: no target kind needs two.
        target_value    TEXT,
        priority        TEXT        NOT NULL DEFAULT 'normal'
            CHECK (priority IN ('normal', 'expedited')),
        -- Derived from target_kind on write rather than chosen freely: a
        -- 'player' announcement that broadcast would leak exactly what
        -- whispering a waypoint protects.
        delivery        TEXT        NOT NULL
            CHECK (delivery IN ('broadcast', 'whisper')),
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        deliver_after   TIMESTAMPTZ NOT NULL DEFAULT now(),
        -- The column that makes this a queue rather than a nag. A restart
        -- warning delivered three days late is noise; a farm relocation is
        -- still true. Null means it never expires.
        expires_at      TIMESTAMPTZ
    );

    -- Serves the pending-delivery scan: target_kind and target_value are
    -- matched by equality (a specific player's XUID or a permission level),
    -- deliver_after is the range bound, so the equality columns lead and the
    -- range column trails. 'online_only' rows are excluded because they are
    -- delivered on join rather than pulled from this queue.
    --
    -- expires_at cannot join the predicate: now() is not IMMUTABLE, and
    -- Postgres rejects it in a partial index. The anti-join against
    -- announcement_deliveries needs nothing here either -- that table's own
    -- primary key (announcement_id, xuid) already serves it.
    --
    -- This table stays small in practice; the index is as much about not
    -- misleading a future reader into thinking deliver_after alone is
    -- selective as it is about speed.
    CREATE INDEX IF NOT EXISTS announcements_pending_idx
        ON minecraft.announcements (target_kind, target_value, deliver_after)
        WHERE target_kind <> 'online_only';

    -- One row per person who actually received it: the idempotency key and
    -- the audit record at once. Written even for a broadcast, because
    -- otherwise a player who was present when it went out would receive it
    -- again on their next join.
    --
    -- CASCADE here, unlike announcements above: a delivery record is
    -- personal data about that player and goes with them.
    CREATE TABLE IF NOT EXISTS minecraft.announcement_deliveries
    (
        announcement_id BIGINT      NOT NULL REFERENCES minecraft.announcements (announcement_id) ON DELETE CASCADE,
        xuid            TEXT        NOT NULL REFERENCES minecraft.players (xuid) ON DELETE CASCADE,
        delivered_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (announcement_id, xuid)
    );

    -- Every command dispatch, whatever the outcome.
    --
    -- xuid is deliberately not a foreign key, unlike everywhere else in this
    -- schema: an audit row must outlive the player it describes, which is the
    -- opposite of what waypoints need.
    CREATE TABLE IF NOT EXISTS minecraft.command_audit
    (
        audit_id     BIGINT      NOT NULL GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        xuid         TEXT        NOT NULL,
        gamertag     TEXT        NOT NULL,
        -- The level resolved at the time, not the actor's level now.
        -- Permissions change; what they were allowed to do when they ran it
        -- is the auditable fact.
        permission   TEXT        NOT NULL,
        command      TEXT        NOT NULL,
        args         TEXT        NOT NULL,
        outcome      TEXT        NOT NULL
            CHECK (outcome IN ('ok', 'denied', 'unknown', 'error', 'rate_limited', 'timeout')),
        occurred_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS command_audit_xuid_idx ON minecraft.command_audit (xuid, occurred_at DESC);
    CREATE INDEX IF NOT EXISTS command_audit_time_idx ON minecraft.command_audit (occurred_at DESC);
