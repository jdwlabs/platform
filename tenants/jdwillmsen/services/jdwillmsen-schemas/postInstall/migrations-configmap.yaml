kind: ConfigMap
apiVersion: v1
metadata:
  name: jdwillmsen-migrations
  namespace: database
data:
  V1__minecraft_init.sql: |
    CREATE SCHEMA IF NOT EXISTS minecraft;

    -- Identity is the XUID, never the gamertag.
    --
    -- Gamertags change, and on 2026-09-08 working out which Deployment was
    -- which player took correlating pod spawn timestamps against server
    -- connection lines, because nothing recorded the mapping. The XUID is the
    -- stable handle the server itself uses; the gamertag is an attribute of it.
    CREATE TABLE IF NOT EXISTS minecraft.players
    (
        xuid              TEXT        NOT NULL PRIMARY KEY,
        current_gamertag  TEXT        NOT NULL,
        first_seen_at     TIMESTAMPTZ NOT NULL DEFAULT now(),
        last_seen_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        -- Drives welcome variants together with last_seen_at: a first-ever
        -- join and a return after a fortnight deserve different greetings, and
        -- the two facts answer both questions without a second table.
        join_count        INTEGER     NOT NULL DEFAULT 0,
        created_at        TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at        TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- Every gamertag a player has ever appeared under.
    --
    -- Kept because a rename otherwise silently rewrites history: without this,
    -- a player who changes gamertag looks like a stranger in old sessions, and
    -- there is no way back to who they were.
    CREATE TABLE IF NOT EXISTS minecraft.player_names
    (
        xuid           TEXT        NOT NULL REFERENCES minecraft.players (xuid) ON DELETE CASCADE,
        gamertag       TEXT        NOT NULL,
        first_seen_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        last_seen_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (xuid, gamertag)
    );

    -- Raw join/leave pairs rather than a running total.
    --
    -- A counter is smaller and answers exactly one question forever. Session
    -- rows answer questions not yet asked -- when someone plays, how long a
    -- typical visit runs, who was on during an incident -- and a total is a
    -- SUM away. The playtime views below are that SUM.
    CREATE TABLE IF NOT EXISTS minecraft.sessions
    (
        session_id        BIGINT      NOT NULL GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        xuid              TEXT        NOT NULL REFERENCES minecraft.players (xuid) ON DELETE CASCADE,
        -- Denormalised on purpose: this is who they were *at the time*, which
        -- players.current_gamertag stops being the moment they rename.
        gamertag          TEXT        NOT NULL,
        joined_at         TIMESTAMPTZ NOT NULL DEFAULT now(),
        left_at           TIMESTAMPTZ,
        -- 'open' is the live state. 'unknown' is the honest one: the agent
        -- observes leaves by being connected, so a server restart, an agent
        -- restart or a crash ends sessions it never sees end. Recording that
        -- as its own reason keeps those rows from being mistaken for real
        -- departures, and keeps their durations out of any average that cares.
        ended_reason      TEXT        NOT NULL DEFAULT 'open'
            CHECK (ended_reason IN ('open', 'left', 'agent_restart', 'unknown')),
        duration_seconds  INTEGER     GENERATED ALWAYS AS
            (EXTRACT(EPOCH FROM (left_at - joined_at))::INTEGER) STORED
    );

    CREATE INDEX IF NOT EXISTS sessions_xuid_joined_idx
        ON minecraft.sessions (xuid, joined_at DESC);
    CREATE INDEX IF NOT EXISTS sessions_joined_idx
        ON minecraft.sessions (joined_at DESC);
    -- Partial: the agent reopens or closes these on startup, and there is
    -- normally a handful at most, so scanning the whole table for them would
    -- get slower every day for no reason.
    CREATE INDEX IF NOT EXISTS sessions_open_idx
        ON minecraft.sessions (xuid) WHERE ended_reason = 'open';

    -- Totals are a view, not a column: a stored counter and the rows it
    -- summarises drift the first time a session is corrected, and then neither
    -- can be trusted.
    CREATE OR REPLACE VIEW minecraft.player_playtime AS
    SELECT p.xuid,
           p.current_gamertag,
           p.join_count,
           p.first_seen_at,
           p.last_seen_at,
           COALESCE(SUM(s.duration_seconds), 0)::BIGINT AS total_seconds,
           COUNT(s.session_id) FILTER (WHERE s.left_at IS NOT NULL) AS completed_sessions,
           -- Surfaced rather than hidden: a player whose sessions are mostly
           -- 'unknown' has playtime that is a lower bound, not a measurement.
           COUNT(s.session_id) FILTER (WHERE s.ended_reason = 'unknown') AS unclean_sessions
    FROM minecraft.players p
             LEFT JOIN minecraft.sessions s ON s.xuid = p.xuid
    GROUP BY p.xuid, p.current_gamertag, p.join_count, p.first_seen_at, p.last_seen_at;

    CREATE OR REPLACE VIEW minecraft.player_playtime_daily AS
    SELECT xuid,
           gamertag,
           date_trunc('day', joined_at) AS day,
           COALESCE(SUM(duration_seconds), 0)::BIGINT AS total_seconds,
           COUNT(*) AS sessions
    FROM minecraft.sessions
    WHERE left_at IS NOT NULL
    GROUP BY xuid, gamertag, date_trunc('day', joined_at);

  V2__fix_permissions.sql: |
    -- Grant the runtime role access to what V1 created.
    --
    -- Flyway runs as postgres, so every object V1 created is owned by postgres
    -- and reachable by nobody else. The workload connects as app, which held
    -- USAGE on the schema and no privilege at all on any table in it. The
    -- effect in production was that minecraft.players and minecraft.sessions
    -- stayed empty while the agent reported itself healthy: the failure only
    -- surfaced as a permission denied on startup orphan cleanup, and every
    -- other write path either was not wired yet or logged and continued.
    --
    -- Ownership moves to postgres and stays there, matching what the migration
    -- Job's own comment already describes: app is the runtime role and
    -- deliberately cannot reshape its own schema.
    --
    -- Modelled on the equivalent migration in the dotablaze-tech and jdwlabs
    -- tenants, with one deliberate difference: public is excluded. There it is
    -- swept up by a loop over every non-system schema, which also rewrites
    -- public's owner away from pg_database_owner. Nothing here needs that, and
    -- it is a wider change than a permissions fix should make.
    DO $$
    DECLARE
        s text;
        r record;
    BEGIN
        FOR s IN
            SELECT nspname FROM pg_namespace
            WHERE nspname NOT IN ('pg_catalog', 'information_schema', 'pg_toast', 'public')
              AND nspname NOT LIKE 'pg_temp_%'
              AND nspname NOT LIKE 'pg_toast_temp_%'
        LOOP
            EXECUTE format('ALTER SCHEMA %I OWNER TO postgres', s);
            EXECUTE format('GRANT USAGE ON SCHEMA %I TO app', s);

            FOR r IN
                SELECT tablename FROM pg_tables
                WHERE schemaname = s AND tablename <> 'flyway_schema_history'
            LOOP
                EXECUTE format('ALTER TABLE %I.%I OWNER TO postgres', s, r.tablename);
            END LOOP;

            -- Views carry their own ownership and are not covered by the table
            -- loop above; the agent reads playtime through two of them.
            FOR r IN SELECT viewname FROM pg_views WHERE schemaname = s LOOP
                EXECUTE format('ALTER VIEW %I.%I OWNER TO postgres', s, r.viewname);
            END LOOP;

            FOR r IN SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema = s LOOP
                EXECUTE format('ALTER SEQUENCE %I.%I OWNER TO postgres', s, r.sequence_name);
            END LOOP;

            EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO app', s);
            EXECUTE format('GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA %I TO app', s);

            -- Without these, the next migration that adds a table reintroduces
            -- exactly this bug and nothing notices until a write fails.
            EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA %I GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app', s);
            EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA %I GRANT USAGE, SELECT ON SEQUENCES TO app', s);
        END LOOP;
    END $$;

  V3__minecraft_knowledge.sql: |
    -- Curated server facts the @server answer path reads.
    --
    -- Operator-written on purpose: everything knowledge_lookup returns is
    -- quoted to players as the server's own word, so the write side is gated
    -- on the same permissions.json the ! commands already resolve against.
    CREATE TABLE IF NOT EXISTS minecraft.knowledge
    (
        topic       TEXT        NOT NULL PRIMARY KEY,
        body        TEXT        NOT NULL,
        -- SET NULL, not CASCADE: deleting a player must not delete the server
        -- rules they happened to write.
        author_xuid TEXT        REFERENCES minecraft.players (xuid) ON DELETE SET NULL,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        search      TSVECTOR    GENERATED ALWAYS AS
            (to_tsvector('english', topic || ' ' || body)) STORED
    );

    CREATE INDEX IF NOT EXISTS knowledge_search_idx
        ON minecraft.knowledge USING GIN (search);

    -- Personal named coordinates. CASCADE here, unlike knowledge above: these
    -- are the player's own data and go with them.
    CREATE TABLE IF NOT EXISTS minecraft.waypoints
    (
        xuid       TEXT        NOT NULL REFERENCES minecraft.players (xuid) ON DELETE CASCADE,
        name       TEXT        NOT NULL,
        x          INTEGER     NOT NULL,
        y          INTEGER     NOT NULL,
        z          INTEGER     NOT NULL,
        dimension  TEXT        NOT NULL DEFAULT 'overworld'
            CHECK (dimension IN ('overworld', 'nether', 'end')),
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (xuid, name)
    );

  V4__minecraft_announcements.sql: |
    -- Things the server wants said, and who has already heard them.
    --
    -- An outbox rather than a chat call: four different sources will want to
    -- announce, and every question about who sees a message, when, and
    -- whether it is still worth saying should be answered once rather than
    -- once per source.
    CREATE TABLE IF NOT EXISTS minecraft.announcements
    (
        announcement_id BIGINT      NOT NULL GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        body            TEXT        NOT NULL,
        source          TEXT        NOT NULL
            CHECK (source IN ('command', 'schedule', 'event', 'api')),
        -- SET NULL, not CASCADE: deleting a player must not delete the
        -- announcements the server made. Null for everything the server said
        -- on its own initiative.
        author_xuid     TEXT        REFERENCES minecraft.players (xuid) ON DELETE SET NULL,
        target_kind     TEXT        NOT NULL
            CHECK (target_kind IN ('everyone', 'player', 'permission', 'online_only')),
        -- The XUID for 'player', the level for 'permission', null otherwise.
        -- One nullable column rather than three: no target kind needs two.
        target_value    TEXT,
        priority        TEXT        NOT NULL DEFAULT 'normal'
            CHECK (priority IN ('normal', 'expedited')),
        -- Derived from target_kind on write rather than chosen freely: a
        -- 'player' announcement that broadcast would leak exactly what
        -- whispering a waypoint protects.
        delivery        TEXT        NOT NULL
            CHECK (delivery IN ('broadcast', 'whisper')),
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        deliver_after   TIMESTAMPTZ NOT NULL DEFAULT now(),
        -- The column that makes this a queue rather than a nag. A restart
        -- warning delivered three days late is noise; a farm relocation is
        -- still true. Null means it never expires.
        expires_at      TIMESTAMPTZ
    );

    -- Serves the pending-delivery scan: target_kind and target_value are
    -- matched by equality (a specific player's XUID or a permission level),
    -- deliver_after is the range bound, so the equality columns lead and the
    -- range column trails. 'online_only' rows are excluded because they are
    -- delivered on join rather than pulled from this queue.
    --
    -- expires_at cannot join the predicate: now() is not IMMUTABLE, and
    -- Postgres rejects it in a partial index. The anti-join against
    -- announcement_deliveries needs nothing here either -- that table's own
    -- primary key (announcement_id, xuid) already serves it.
    --
    -- This table stays small in practice; the index is as much about not
    -- misleading a future reader into thinking deliver_after alone is
    -- selective as it is about speed.
    CREATE INDEX IF NOT EXISTS announcements_pending_idx
        ON minecraft.announcements (target_kind, target_value, deliver_after)
        WHERE target_kind <> 'online_only';

    -- One row per person who actually received it: the idempotency key and
    -- the audit record at once. Written even for a broadcast, because
    -- otherwise a player who was present when it went out would receive it
    -- again on their next join.
    --
    -- CASCADE here, unlike announcements above: a delivery record is
    -- personal data about that player and goes with them.
    CREATE TABLE IF NOT EXISTS minecraft.announcement_deliveries
    (
        announcement_id BIGINT      NOT NULL REFERENCES minecraft.announcements (announcement_id) ON DELETE CASCADE,
        xuid            TEXT        NOT NULL REFERENCES minecraft.players (xuid) ON DELETE CASCADE,
        delivered_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (announcement_id, xuid)
    );

    -- Every command dispatch, whatever the outcome.
    --
    -- xuid is deliberately not a foreign key, unlike everywhere else in this
    -- schema: an audit row must outlive the player it describes, which is the
    -- opposite of what waypoints need.
    CREATE TABLE IF NOT EXISTS minecraft.command_audit
    (
        audit_id     BIGINT      NOT NULL GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        xuid         TEXT        NOT NULL,
        gamertag     TEXT        NOT NULL,
        -- The level resolved at the time, not the actor's level now.
        -- Permissions change; what they were allowed to do when they ran it
        -- is the auditable fact.
        permission   TEXT        NOT NULL,
        command      TEXT        NOT NULL,
        args         TEXT        NOT NULL,
        outcome      TEXT        NOT NULL
            CHECK (outcome IN ('ok', 'denied', 'unknown', 'error', 'rate_limited', 'timeout')),
        occurred_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS command_audit_xuid_idx ON minecraft.command_audit (xuid, occurred_at DESC);
    CREATE INDEX IF NOT EXISTS command_audit_time_idx ON minecraft.command_audit (occurred_at DESC);

  V5__minecraft_announcement_schedules.sql: |
    -- Recurring announcements. A schedule is not itself something anyone
    -- hears: each time it comes due, the agent writes one ordinary row to
    -- minecraft.announcements, so delivery, expiry and the delivery record
    -- stay the outbox's job and are not reimplemented for a second source.
    CREATE TABLE IF NOT EXISTS minecraft.announcement_schedules
    (
        schedule_id   BIGINT      NOT NULL GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        body          TEXT        NOT NULL,
        -- SET NULL, not CASCADE: a reminder the server keeps making outlives
        -- the operator who set it up.
        author_xuid   TEXT        REFERENCES minecraft.players (xuid) ON DELETE SET NULL,
        -- 'player' is excluded on purpose: a recurring whisper to one person
        -- is a nag, and a one-off message to them already has a command.
        target_kind   TEXT        NOT NULL
            CHECK (target_kind IN ('everyone', 'permission', 'online_only')),
        target_value  TEXT,
        priority      TEXT        NOT NULL DEFAULT 'normal'
            CHECK (priority IN ('normal', 'expedited')),
        -- Exactly one cadence. The floor on every_seconds keeps a typo from
        -- turning a reminder into spam.
        every_seconds INTEGER     CHECK (every_seconds >= 900),
        -- UTC. No zone is stored, so no daylight-saving rule is either.
        daily_at      TIME,
        CHECK ((every_seconds IS NULL) <> (daily_at IS NULL)),
        -- Advanced by a compare-and-set on its own previous value, which is
        -- what lets exactly one writer claim each occurrence.
        next_fire_at  TIMESTAMPTZ NOT NULL,
        -- Deactivated rather than deleted, so announcements already made
        -- from a schedule keep their provenance.
        active        BOOLEAN     NOT NULL DEFAULT true,
        created_at    TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS announcement_schedules_due_idx
        ON minecraft.announcement_schedules (next_fire_at) WHERE active;

    ALTER TABLE minecraft.announcements
        ADD COLUMN IF NOT EXISTS schedule_id BIGINT
            REFERENCES minecraft.announcement_schedules (schedule_id) ON DELETE SET NULL;

  V6__minecraft_moderation.sql: |
    -- Flagged public chat, and what the agent did about it.
    --
    -- Only messages that tripped a rule are stored, never chat as a whole: a
    -- complete chat log is a far larger privacy exposure than anything a
    -- moderation record needs, and the agent prunes these rows after 90 days.
    --
    -- xuid is not a foreign key, for the same reason command_audit's is not:
    -- the record has to outlive the player it describes.
    CREATE TABLE IF NOT EXISTS minecraft.moderation_events
    (
        event_id    BIGINT      NOT NULL GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        xuid        TEXT        NOT NULL,
        gamertag    TEXT        NOT NULL,
        message     TEXT        NOT NULL,
        rule        TEXT        NOT NULL CHECK (rule IN ('term', 'flood', 'caps')),
        detail      TEXT        NOT NULL DEFAULT '',
        action      TEXT        NOT NULL CHECK (action IN ('logged', 'warned')),
        occurred_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS moderation_events_xuid_idx ON minecraft.moderation_events (xuid, occurred_at DESC);
    CREATE INDEX IF NOT EXISTS moderation_events_time_idx ON minecraft.moderation_events (occurred_at DESC);

  V7__minecraft_auth_tokens.sql: |
    -- The agent's Xbox Live token, one row per account.
    --
    -- This exists so two agent pods can coexist during a release. The token
    -- used to live on a ReadWriteOnce volume, which one pod at a time may
    -- mount: a standby scheduled onto another node waited in
    -- ContainerCreating until the pod it was replacing released the volume,
    -- which is the absence the warm handover exists to remove. A row costs no
    -- new Kubernetes object, since the agent already holds this pool for
    -- player profiles and for its leader lock.
    --
    -- account is MC_USERNAME, the same identity the leader lock is keyed on:
    -- what two processes cannot share is the login, not the deployment. It is
    -- not a foreign key to minecraft.players -- the agent's own account is not
    -- a tracked player, and the token has to be writable before any session
    -- row exists.
    --
    -- token holds the whole encoded OAuth token rather than columns per field.
    -- Microsoft rotates the refresh token on every refresh, so the value is
    -- replaced wholesale and never read field-by-field; splitting it would
    -- invite a partial update that leaves a token that no longer refreshes.
    --
    -- The file cache this replaces was protected by its 0600 mode. A row has
    -- no equivalent, and the grant is what stands in for it: app is the only
    -- role that may read or write here, which V2's default privileges in this
    -- schema already confer on tables created after it. Nothing else in the
    -- schema references this table and nothing joins to it, so that grant is
    -- the whole of the protection at rest -- stated rather than implied,
    -- because a reader expecting the file mode to have an equivalent will
    -- otherwise go looking for one.
    CREATE TABLE IF NOT EXISTS minecraft.auth_tokens
    (
        account    TEXT        NOT NULL PRIMARY KEY,
        token      TEXT        NOT NULL,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

  V8__minecraft_presence.sql: |
    -- Runtime deviations from each actor's presence default.
    --
    -- The default lives in Helm values and git stays the source of truth for
    -- it, so this table holds only the exceptions: one row per actor at most,
    -- and no row means the default applies. Storing every actor's desired
    -- state instead would give git and the database two answers to the same
    -- question, and clearing an override would have to know what to restore.
    --
    -- actor_id is the registry slug (agent, afk-bot-1), not an XUID, and not a
    -- foreign key to minecraft.players: the agent's own account is not a
    -- tracked player, and an actor must be parkable before it has ever joined.
    --
    -- version exists only to reject a write based on a stale read. It is not
    -- a history -- a removed override takes its count with it, and the next
    -- one starts again at 1 -- because every change is already recorded in
    -- the audit log with its source and reason.
    CREATE TABLE IF NOT EXISTS minecraft.presence_overrides
    (
        actor_id  TEXT        NOT NULL PRIMARY KEY,
        state     TEXT        NOT NULL CHECK (state IN ('present', 'parked')),
        -- Null means until someone clears it, which is what the parked-long
        -- alert watches for.
        until     TIMESTAMPTZ,
        wake_on   JSONB,
        reason    TEXT        NOT NULL,
        set_by    TEXT        NOT NULL,
        set_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
        version   BIGINT      NOT NULL
    );

    -- What each actor last reported about itself.
    --
    -- A separate table because it has a different writer and lifetime than an
    -- override: the actor overwrites its own row on every poll, whether or not
    -- anyone has overridden it, and the row outlives every override. Comparing
    -- observed_state here with the effective state is how the alerts tell a
    -- deliberate park from an actor that fell over.
    --
    -- Both tables fall under V2's default privileges for app, as every table
    -- since V3 has.
    CREATE TABLE IF NOT EXISTS minecraft.presence_status
    (
        actor_id        TEXT        NOT NULL PRIMARY KEY,
        connected       BOOLEAN     NOT NULL,
        observed_state  TEXT        NOT NULL CHECK (observed_state IN ('present', 'parked')),
        last_seen       TIMESTAMPTZ NOT NULL,
        process_version TEXT        NOT NULL DEFAULT ''
    );

  V9__minecraft_crew_work.sql: |
    -- The crew work queue: what crew-control hands to a unit and what the unit
    -- reports back.
    --
    -- crew_work holds the current state of each item, so a poll reads one row.
    -- crew_work_event is the append-only trail of every state change, kept
    -- separate so the current row can be updated in place without losing how it
    -- got there. Events go with their work item on delete.
    --
    -- unit is the crew registry slug, not a foreign key: a unit must be
    -- addressable before it has ever connected. kind separates long-running
    -- tasks from one-shot commands, which share the queue and its states.
    --
    -- Both tables live in the existing minecraft schema on purpose: V2's
    -- default privileges for app cover that schema, so they and the event
    -- sequence are reachable by the runtime role with no grant here. A new
    -- schema would need its own grants.
    CREATE TABLE IF NOT EXISTS minecraft.crew_work
    (
        id           UUID        NOT NULL PRIMARY KEY,
        unit         TEXT        NOT NULL,
        kind         TEXT        NOT NULL CHECK (kind IN ('task', 'command')),
        body         JSONB       NOT NULL,
        state        TEXT        NOT NULL CHECK (state IN ('queued', 'delivered', 'running', 'done', 'failed', 'cancelled')),
        progress     INT         NOT NULL DEFAULT 0,
        reason       TEXT        NOT NULL DEFAULT '',
        operator     TEXT        NOT NULL,
        created_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
        delivered_at TIMESTAMPTZ
    );

    -- A unit's poll asks for its oldest work in a given state.
    CREATE INDEX IF NOT EXISTS crew_work_unit_state_created_idx
        ON minecraft.crew_work (unit, state, created_at);

    CREATE TABLE IF NOT EXISTS minecraft.crew_work_event
    (
        id       BIGSERIAL   NOT NULL PRIMARY KEY,
        work_id  UUID        NOT NULL REFERENCES minecraft.crew_work (id) ON DELETE CASCADE,
        state    TEXT        NOT NULL,
        progress INT         NOT NULL,
        reason   TEXT        NOT NULL DEFAULT '',
        at       TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS crew_work_event_work_at_idx
        ON minecraft.crew_work_event (work_id, at);

  V10__minecraft_crew_jobs.sql: |
    -- Crew jobs and the world ledger.
    --
    -- crew_place names a chest or an area the crew can work with, as an
    -- inclusive bounding box; a chest has min = max. crew_stock is the last
    -- count a unit saw of an item at a place, so it is a ledger of
    -- observations, not a live inventory. Stock rows go with their place.
    --
    -- crew_job is a goal with a deadline; crew_job_step is one unit of work
    -- inside it. A step's template is turned into a crew_work row when its
    -- depends_on keys are done, and work_id points back at that row. It is not
    -- a foreign key, so work can be pruned without touching the job history.
    -- Steps go with their job on delete.
    --
    -- All objects live in the existing minecraft schema on purpose: V2's
    -- default privileges for app cover that schema, so no grant is needed here.
    CREATE TABLE IF NOT EXISTS minecraft.crew_place
    (
        id         TEXT        NOT NULL PRIMARY KEY CHECK (id ~ '^[a-z][a-z0-9-]{1,31}$'),
        name       TEXT        NOT NULL,
        kind       TEXT        NOT NULL CHECK (kind IN ('chest', 'area')),
        min_x      INT         NOT NULL,
        min_y      INT         NOT NULL,
        min_z      INT         NOT NULL,
        max_x      INT         NOT NULL,
        max_y      INT         NOT NULL,
        max_z      INT         NOT NULL,
        items      TEXT[]      NOT NULL DEFAULT '{}',
        seeded     BOOLEAN     NOT NULL DEFAULT false,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS minecraft.crew_stock
    (
        place_id TEXT        NOT NULL REFERENCES minecraft.crew_place (id) ON DELETE CASCADE,
        item     TEXT        NOT NULL,
        count    INT         NOT NULL CHECK (count >= 0),
        seen_at  TIMESTAMPTZ NOT NULL,
        unit     TEXT        NOT NULL,
        PRIMARY KEY (place_id, item)
    );

    CREATE TABLE IF NOT EXISTS minecraft.crew_job
    (
        id         UUID        NOT NULL PRIMARY KEY,
        kind       TEXT        NOT NULL CHECK (kind IN ('plan', 'stock')),
        spec       JSONB       NOT NULL,
        state      TEXT        NOT NULL CHECK (state IN ('running', 'done', 'failed', 'cancelled')),
        reason     TEXT        NOT NULL DEFAULT '',
        operator   TEXT        NOT NULL,
        round      INT         NOT NULL DEFAULT 0,
        deadline   TIMESTAMPTZ NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS crew_job_state_updated_idx
        ON minecraft.crew_job (state, updated_at);

    CREATE TABLE IF NOT EXISTS minecraft.crew_job_step
    (
        id         UUID   NOT NULL PRIMARY KEY,
        job_id     UUID   NOT NULL REFERENCES minecraft.crew_job (id) ON DELETE CASCADE,
        key        TEXT   NOT NULL,
        unit       TEXT,
        template   JSONB  NOT NULL,
        depends_on TEXT[] NOT NULL DEFAULT '{}',
        state      TEXT   NOT NULL CHECK (state IN ('waiting', 'queued', 'running', 'done', 'failed', 'cancelled')),
        attempts   INT    NOT NULL DEFAULT 0,
        work_id    UUID,
        reason     TEXT   NOT NULL DEFAULT '',
        UNIQUE (job_id, key)
    );

    -- Work spawned by a job points back at it; nullable because most work is
    -- queued directly. Not foreign keys, for the same reason as work_id.
    ALTER TABLE minecraft.crew_work
        ADD COLUMN IF NOT EXISTS job_id  UUID,
        ADD COLUMN IF NOT EXISTS step_id UUID;

    CREATE INDEX IF NOT EXISTS crew_work_job_idx
        ON minecraft.crew_work (job_id);
  V11__minecraft_crew_events.sql: |
    -- The crew unit event stream: the durable counterpart of the console's
    -- fleet feed.
    --
    -- The feed lives in memory, 200 events deep, and is lost on every restart;
    -- history cannot be filtered, sorted or replayed. crew_event is the
    -- append-only record of what a unit did and what happened to it, written by
    -- crew-control as it derives events from polling the units.
    --
    -- Repeated idle polls are not one row each: a unit that finds nothing to do
    -- many times a minute is stored as one idle_rollup row whose payload holds
    -- the count and the last poll's time. Without that rule most of the table
    -- would be no-ops.
    --
    -- kind is deliberately not a CHECK: the list grows, and a constraint would
    -- need a migration per addition. crew-control owns the vocabulary and the
    -- store writes only what it accepted. severity is constrained, because the
    -- console's colouring and toasts have a fixed vocabulary.
    --
    -- unit is the crew registry slug, not a foreign key, like crew_work's: a unit
    -- must be addressable before it has ever connected. task_id and job_id are not
    -- foreign keys either, for the same reason as crew_job_step.work_id: events
    -- must outlive, or predate, the rows they name.
    --
    -- at is timestamptz, so the instant is stored UTC and read back in whatever
    -- zone the console asks for. x, y and z are nullable: an offline event happens
    -- nowhere in particular. payload is a JSON object for the kind's own detail.
    --
    -- All objects live in the existing minecraft schema on purpose: V2's default
    -- privileges for app cover that schema, so no grant is needed here.
    CREATE TABLE IF NOT EXISTS minecraft.crew_event
    (
        id       BIGINT           NOT NULL GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        unit     TEXT             NOT NULL,
        at       TIMESTAMPTZ      NOT NULL DEFAULT now(),
        kind     TEXT             NOT NULL,
        severity TEXT             NOT NULL CHECK (severity IN ('ok', 'info', 'warn', 'crit')),
        task_id  UUID,
        job_id   UUID,
        x        DOUBLE PRECISION,
        y        DOUBLE PRECISION,
        z        DOUBLE PRECISION,
        payload  JSONB            NOT NULL DEFAULT '{}'::jsonb
    );

    -- One index per console query shape: a unit's history, a kind across the
    -- fleet, one severity's slice, and the unfiltered stream (which also serves
    -- the retention delete). Each ends in (at, id) because the query pages by
    -- keyset on that pair: the cursor comparison and the ORDER BY are then both
    -- answered by one index scan in either direction, with no sort step.
    CREATE INDEX IF NOT EXISTS crew_event_unit_at_idx
        ON minecraft.crew_event (unit, at, id);
    CREATE INDEX IF NOT EXISTS crew_event_kind_at_idx
        ON minecraft.crew_event (kind, at, id);
    CREATE INDEX IF NOT EXISTS crew_event_severity_at_idx
        ON minecraft.crew_event (severity, at, id);
    CREATE INDEX IF NOT EXISTS crew_event_at_idx
        ON minecraft.crew_event (at, id);
  V12__minecraft_crew_event_analytics.sql: |
    -- The analytic columns of crew_event: why a task ended, how long it took, which
    -- session and crew build it ran under, and the earlier event that explains it.
    --
    -- They were left out of V11 because the first slice stored only what the live
    -- feed shows. The explorer and the insight rules filter on them, so they are
    -- columns rather than payload keys: a filter on a JSONB key would scan, and a
    -- CHECK catches a writer that invents an outcome.
    --
    -- Additive only, and every column is nullable: rows written before this
    -- migration, and events of kinds these do not describe, leave them null.
    -- Nothing is rewritten or dropped.
    --
    -- cause_ref names another crew_event row but is not a foreign key, for the
    -- reason task_id is not one: pruning removes old rows, and a link to a pruned
    -- cause must read as a dangling id, not block the delete.
    ALTER TABLE minecraft.crew_event
        ADD COLUMN IF NOT EXISTS reason_code  TEXT,
        ADD COLUMN IF NOT EXISTS duration_ms  INTEGER,
        ADD COLUMN IF NOT EXISTS attempt      INTEGER,
        ADD COLUMN IF NOT EXISTS session_id   TEXT,
        ADD COLUMN IF NOT EXISTS crew_version TEXT,
        ADD COLUMN IF NOT EXISTS cause_ref    BIGINT,
        ADD COLUMN IF NOT EXISTS outcome      TEXT;

    DO
    $$
        BEGIN
            IF NOT EXISTS (SELECT 1
                           FROM pg_constraint
                           WHERE conname = 'crew_event_outcome_check'
                             AND conrelid = 'minecraft.crew_event'::regclass) THEN
                ALTER TABLE minecraft.crew_event
                    ADD CONSTRAINT crew_event_outcome_check CHECK (outcome IN ('ok', 'noop', 'failed'));
            END IF;
        END
    $$;

    -- Partial indexes: most rows carry none of these, so an index over every row
    -- would be mostly nulls. Each ends in (at, id) like V11's, for keyset paging.
    CREATE INDEX IF NOT EXISTS crew_event_reason_at_idx
        ON minecraft.crew_event (reason_code, at, id) WHERE reason_code IS NOT NULL;
    CREATE INDEX IF NOT EXISTS crew_event_outcome_at_idx
        ON minecraft.crew_event (outcome, at, id) WHERE outcome IS NOT NULL;
    CREATE INDEX IF NOT EXISTS crew_event_session_at_idx
        ON minecraft.crew_event (session_id, at, id) WHERE session_id IS NOT NULL;
    CREATE INDEX IF NOT EXISTS crew_event_cause_idx
        ON minecraft.crew_event (cause_ref, at, id) WHERE cause_ref IS NOT NULL;
  V13__minecraft_crew_alerts.sql: |
    -- Alert state that survives a restart: which alerts are firing, and which are
    -- acknowledged or muted.
    --
    -- The engine keeps this in memory, so a restart used to forget every
    -- acknowledgement and mute and re-announce whatever was still wrong. One row
    -- per alert id (rule.unit); the engine's saver rewrites the set whenever it
    -- changes, and the engine reads it back once at start.
    --
    -- No coordinates and no operator identity: the alert already carries neither,
    -- so the public console may show it.
    --
    -- The table is a snapshot of the engine's list, not a history; events carry
    -- the history. Rows for alerts that left the list are deleted by the saver.
    CREATE TABLE IF NOT EXISTS minecraft.crew_alert
    (
        id          TEXT        NOT NULL PRIMARY KEY,
        rule        TEXT        NOT NULL,
        unit        TEXT        NOT NULL,
        name        TEXT        NOT NULL DEFAULT '',
        severity    TEXT        NOT NULL CHECK (severity IN ('warn', 'crit')),
        state       TEXT        NOT NULL CHECK (state IN ('firing', 'resolved')),
        text        TEXT        NOT NULL DEFAULT '',
        since       TIMESTAMPTZ NOT NULL,
        resolved_at TIMESTAMPTZ,
        acked       BOOLEAN     NOT NULL DEFAULT false,
        muted_until TIMESTAMPTZ,
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );
  V14__minecraft_crew_position.sql: |
    -- Where units stood, sampled coarsely, so the console can replay a past
    -- window on a top-down map.
    --
    -- Separate from crew_event on purpose: a position every couple of seconds per
    -- moving unit would outnumber every other event kind many times over and slow
    -- the explorer, the analytics and the retention delete that share that table.
    -- crew-control stores a row only when a unit moved or after a keepalive, and
    -- the console interpolates between rows.
    --
    -- unit is the crew registry slug, not a foreign key, like crew_event's. Only
    -- the overworld is recorded, so there is no dimension column. Rows are
    -- operator-only data: no route that serves them to a signed-out reader exists.
    -- Retention matches crew_event's and is enforced by crew-control's prune job.
    --
    -- All objects live in the existing minecraft schema, so V2's default
    -- privileges for app already cover them.
    CREATE TABLE IF NOT EXISTS minecraft.crew_position
    (
        id   BIGINT           NOT NULL GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        unit TEXT             NOT NULL,
        at   TIMESTAMPTZ      NOT NULL,
        x    DOUBLE PRECISION NOT NULL,
        y    DOUBLE PRECISION NOT NULL,
        z    DOUBLE PRECISION NOT NULL
    );

    -- Both read shapes page by keyset on (at, id): the whole fleet over a range,
    -- and one unit over a range. The first also serves the retention delete.
    CREATE INDEX IF NOT EXISTS crew_position_at_idx
        ON minecraft.crew_position (at, id);
    CREATE INDEX IF NOT EXISTS crew_position_unit_at_idx
        ON minecraft.crew_position (unit, at, id);
