apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jdwillmsen-tenant-alerts
  namespace: jdwillmsen-prd
  labels:
    tenant: jdwillmsen
spec:
  groups:
    - name: jdwillmsen-tenant
      rules:
        # The two rules below are the freshness contract's static expectations
        # for the world backup: the parts that cannot be derived from the
        # metrics, and therefore the only parts that cannot expire.
        #
        # Every other backup alert reads gauges the producer publishes, so all
        # of them go quiet together the moment the producer stops publishing —
        # a deleted exporter, exporter.enabled flipped to false, a removed
        # release, a ServiceMonitor that stopped matching. The platform's
        # BackupFreshnessSignalMissing covers that gap by remembering producers
        # seen in the last 14d, but a lookback is still evidence, and evidence
        # ages out: once the last sample falls off, that alert stops firing and
        # Alertmanager sends a resolved notification for a backup that is still
        # dead. Two weeks later the cluster is back to the posture that caused
        # the original incident — nothing produced, nothing said.
        #
        # absent() over a named series is the only shape immune to that,
        # because it asserts an expectation this repository holds rather than
        # one Prometheus can forget. It fires from the moment the series is
        # missing and keeps firing indefinitely, including on a cluster rebuilt
        # from scratch where the producer was never deployed at all.
        #
        # The literal names are the point, not an oversight: these say "this
        # specific backup must exist". Decommissioning the world backup means
        # deleting both rules in the same change, which is exactly the review
        # step that silently skipping it is meant to force.
        #
        # Living in the tenant namespace does couple the guards to it: deleting
        # jdwillmsen-prd removes them at the same moment it removes the
        # producer. Putting them in monitoring/ alongside the platform rules
        # would be namespace-independent and was considered. They sit here
        # because deleting a tenant namespace is loud in a dozen other ways and
        # is never accidental, and because keeping tenant alerts with their
        # tenant matches jdwlabs-alerts and dotablaze-tech-alerts. Worth
        # revisiting if a tenant is ever torn down and rebuilt routinely.
        #
        # Two rules rather than one because "is anything making backups?" and
        # "is anything reporting on them?" are separate questions with separate
        # producers, and a single absent() answering one of them was read as
        # answering both. That misreading is what this pair exists to end: the
        # rule below watched the exporter and was described as watching the
        # backup, so a permanently deleted CronJob went undetected while the
        # exporter kept the series alive on its behalf.

        # Is anything making backups?
        #
        # kube-state-metrics is the producer of this series, not the backup and
        # not its exporter, so nothing in the release being watched can keep it
        # alive. That is the whole difference from the rule below, which reads
        # a series the watched release publishes about itself: a switch whose
        # signal is owned by its subject is not a switch. Deleting the release
        # takes the CronJob with it, this series goes with the CronJob, and the
        # alert fires — where a gauge published on the producer's behalf would
        # have gone on reporting a healthy 0 forever.
        #
        # `== 0` inside absent() is what makes one rule cover both halves of
        # "not scheduled". A deleted CronJob has no series; a suspended one has
        # a series valued 1, which the comparison filters away, leaving
        # absent() with nothing either way. A suspended backup backs up exactly
        # as much as a deleted one.
        #
        # absent() derives its output labels from a plain selector only, so a
        # comparison inside it yields none at all. The identifying labels are
        # stated here instead, which also keeps Alertmanager's grouping and
        # inhibition — both keyed on alertname and namespace — working the way
        # they do for every other alert.
        #
        # Same seam and same shape as JdwillmsenMinecraftVolumeRecoveryAbsent
        # below, deliberately: two static expectations over kube-state-metrics
        # that read alike are two an operator can reason about at once. 1h
        # rather than that rule's 30m because a nightly backup has no need to
        # be noticed within minutes, and it matches the producer-absent rule it
        # sits beside.
        - alert: JdwillmsenMinecraftBackupCronJobAbsent
          expr: absent(kube_cronjob_spec_suspend{namespace="jdwillmsen-prd", cronjob="jdwillmsen-minecraft-fwb-prd-backup"} == 0)
          for: 1h
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
            cronjob: jdwillmsen-minecraft-fwb-prd-backup
          annotations:
            summary: "No scheduled backup exists for the Minecraft world"
            description: >-
              The CronJob jdwillmsen-minecraft-fwb-prd-backup is either suspended, deleted, or was never created in
              jdwillmsen-prd. Nothing is copying the world, and the backup exporter goes on publishing whatever it last
              read, so the freshness gauges say nothing about it. Check the CronJob and that ArgoCD has the tenant's
              deployment repo synced. If the backup is being retired deliberately, delete this rule in the same change —
              it exists to force that decision, not to be silenced.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # Is anything reporting on them?
        #
        # Scoped to the signal and nothing more. This fires when the exporter
        # Deployment is gone, disabled, or no longer scraped — the case
        # kube-state-metrics cannot see, because a CronJob can be perfectly
        # scheduled while nothing publishes a word about what it produced.
        #
        # It is emphatically not the dead-man's switch for the backup itself,
        # and the rule above exists because it was once treated as one. The
        # exporter serves placeholder values when the producer has not
        # reported, so this series is present whenever the exporter is, whether
        # or not anything is backing anything up. Presence here means "somebody
        # is reporting", never "the backup is alive".
        - alert: JdwillmsenMinecraftBackupProducerAbsent
          expr: absent(backup_last_success_timestamp_seconds{backup_job="jdwillmsen-minecraft-fwb-prd-backup"})
          for: 1h
          labels:
            severity: critical
            tenant: jdwillmsen
          annotations:
            summary: "No backup freshness signal exists for the Minecraft world"
            description: "No freshness signal exists for the Minecraft world backup. It is not merely stale — nothing is reporting on it at all, so every other backup alert for it is silent too. Check the backup exporter Deployment and its ServiceMonitor in jdwillmsen-prd."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # BackupStateNeverReported (warning, in rules-job-freshness.yaml) is
        # right about the condition it was reasoned against: a producer whose
        # exporter has not yet seen a completed run is not broken, it is
        # young. But the same condition sustained is exactly how this
        # cluster's worst backup incident happened before — the world's
        # backups were never observably failing, they were simply
        # unobserved, for months. A gap that clears in an hour and
        # one that persists for days produce the identical warning, and only
        # the second is the original incident recurring. This rule is what
        # tells them apart, at the only severity that gets looked at
        # immediately.
        #
        # It cannot be a wider threshold on the platform rule, because the
        # platform rule has nothing to widen against. backup_exporter_start_time_seconds
        # resets on every exporter restart, so "time since the exporter
        # started" can understate true elapsed blindness by as much as one
        # restart interval — honest for a young deployment, where a restart
        # replaying real state is meant to resolve the warning immediately,
        # but not a distinction a generic rule can draw for a producer it
        # knows nothing else about. What proves the difference is evidence the
        # exporter's own gauges cannot manufacture: has this CronJob actually
        # completed a run? That is a question only kube-state-metrics can
        # answer, and answering it needs the tenant's own CronJob name — which
        # is exactly the join the platform rule could not fold in and stay
        # generic, and exactly why this rule lives beside the CronJob it
        # names rather than in the shared rule set.
        #
        # Three conditions, all required:
        #   - backup_state_reported has read 0 for over twice the producer's
        #     own backup_max_age_seconds. Two intervals, not one, so a normal
        #     gap between the moment a fresh exporter comes up and its first
        #     completed run never pages critical on its own — that gap is
        #     BackupStateNeverReported's to own, at warning, and this rule
        #     starts exactly where that one already considers the wait
        #     unreasonable, doubled again for margin. The multiplier is read
        #     from the producer's own budget rather than a constant, so the
        #     threshold follows this producer's cadence and not an assumption
        #     borrowed from it.
        #   - backup_state_reported is 0 right now, not merely 0 at some point
        #     in the window — `and`, not `unless`, keeps this from latching on
        #     a gap that has already closed.
        #   - kube_cronjob_status_last_successful_time exists for this
        #     CronJob: proof, independent of anything the exporter says, that
        #     a run has actually completed. Without this a producer that has
        #     genuinely never once succeeded — covered already by
        #     CronJobNeverSucceeded and JdwillmsenMinecraftBackupCronJobAbsent
        #     above — would also cross the two-interval mark and page a second,
        #     redundant critical for the same root cause under a worse name.
        #     With it, crossing the mark can only mean the backup ran and
        #     something afterward stopped the exporter from ever finding out
        #     — a broken publish path, not a backup that has not gotten around
        #     to running yet. `on ()` because the two series share no label at
        #     all: kube-state-metrics knows this CronJob as
        #     namespace/cronjob, the exporter knows it only as backup_job.
        #
        # Deliberately not folded into a single rule with BackupStateNeverReported:
        # that rule has to stay generic across every producer that ever
        # adopts the contract, and the CronJob join is not something a
        # producer's own gauges can express.
        - alert: JdwillmsenMinecraftBackupVisibilityLost
          expr: |
            (
              (
                time() - max by (backup_job) (
                  backup_exporter_start_time_seconds{backup_job="jdwillmsen-minecraft-fwb-prd-backup"}
                )
              )
              > on (backup_job) group_left() (
                  2 * min by (backup_job) (
                    backup_max_age_seconds{backup_job="jdwillmsen-minecraft-fwb-prd-backup"}
                  )
                )
            )
            and on (backup_job) (
              max by (backup_job) (
                backup_state_reported{backup_job="jdwillmsen-minecraft-fwb-prd-backup"}
              ) == 0
            )
            and on ()
            (
              kube_cronjob_status_last_successful_time{namespace="jdwillmsen-prd", cronjob="jdwillmsen-minecraft-fwb-prd-backup"}
            )
          for: 1h
          labels:
            severity: critical
            tenant: jdwillmsen
          annotations:
            summary: "The Minecraft world backup has been unobserved for multiple backup intervals"
            description: >-
              backup_state_reported has read 0 for over twice jdwillmsen-minecraft-fwb-prd-backup's own freshness
              budget, and the CronJob has completed at least one successful run in that time — so this is not an
              exporter that simply has not seen a run yet, it is a reporting path that stopped working while the
              backup itself kept succeeding. BackupArtifactStale and BackupArtifactEmpty stay suppressed for as long
              as this is true, so nothing has been watching the artifact for multiple backup cycles — sustained
              blindness, not a transient gap. Check that the job's last step is writing its state to the
              …-backup-metrics ConfigMap in jdwillmsen-prd and that its ServiceAccount can still create it.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # The two rules below watch the volume-recovery actor: the CronJob in
        # the tenant's deployment repo that deletes the Minecraft server pod
        # when its volume latches read-only. It is the only thing in the stack
        # that detects that fault class at all — the CSI layer reports no
        # failing operation because nothing re-stages a latched mount, and
        # since Linux 6.12 ext4 sets an internal emergency-read-only bit
        # instead of the superblock flag, so /proc/mounts keeps saying `rw`
        # and node_filesystem_readonly stays 0 throughout. So the actor is the
        # detector of last resort, and nothing was watching it.
        #
        # They live here rather than beside the CronJob for the same reason
        # the rule above does: a rule shipped by the thing it watches
        # disappears with it, and the actor's CronJob vanishing is precisely
        # the case these exist for. The same tenant-namespace caveat applies —
        # deleting jdwillmsen-prd removes both of these at the moment it
        # removes the actor. It is accepted here for the same reasons, and
        # keeping the tenant's alerts in one file is worth more than diverging
        # from the convention for one rule.
        #
        # Two rules, not one, because the question splits cleanly in half and
        # each half wants a different instrument. "Could it act?" is answered
        # by the Jobs the CronJob leaves behind. "Is it scheduled at all?"
        # cannot be answered from Jobs at all, because a CronJob that is
        # suspended or deleted produces neither failed Jobs nor successful
        # ones — it simply goes quiet. A single compromise rule would have to
        # pick one of those and would be blind to the other.

        # Half one: could it act?
        #
        # The actor runs under `set -euo pipefail` with `backoffLimit: 0` and
        # the pod delete is its last statement, so a denied delete exits
        # non-zero with no retry left and the Job lands Failed rather than
        # Complete. That is what makes this rule see the case a "did it run"
        # check cannot: an actor that is scheduled, runs on time, and cannot
        # do the one thing it exists to do looks exactly like a healthy no-op
        # to anything counting executions. A healthy no-op exits 0.
        #
        # kube-state-metrics is the producer, not the actor, so this costs no
        # instrumentation in the thing being watched and does not go dark with
        # it.
        #
        # Ownership is resolved through kube_job_owner rather than a job_name
        # prefix. A generated Job name is the CronJob's name plus a suffix, so
        # a prefix match is a guess that also claims any future workload named
        # into the same space; the owner reference is the cluster's own
        # statement of which CronJob a Job belongs to.
        #
        # The start-time bound is what stops this latching forever. A CronJob
        # retains its last few failed Jobs and nothing evicts them once
        # failures stop — successful runs are kept under a separate limit — so
        # "a failed Job exists" stays true indefinitely after the fault is
        # fixed, and the alert would never resolve. Bounding on when the Job
        # started means the condition clears on its own once the actor is
        # succeeding again. 30m is six runs at the actor's five-minute
        # schedule.
        #
        # Two failures rather than one, inside that window, because a single
        # denied or evicted run is covered by the next run five minutes later,
        # while two inside half an hour is an actor that is not recovering by
        # itself. Critical because the failure it describes is silent
        # everywhere else.
        - alert: JdwillmsenMinecraftVolumeRecoveryFailing
          expr: |
            count(
                (max by (namespace, job_name) (kube_job_status_failed{namespace="jdwillmsen-prd"}) > 0)
              and on (namespace, job_name)
                (max by (namespace, job_name) (kube_job_status_start_time{namespace="jdwillmsen-prd"}) > time() - 1800)
              and on (namespace, job_name)
                max by (namespace, job_name) (
                  kube_job_owner{namespace="jdwillmsen-prd", owner_kind="CronJob", owner_name="jdwillmsen-minecraft-fwb-prd-volume-recovery"}
                )
            ) >= 2
          for: 30m
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "The Minecraft volume-recovery actor is running but failing"
            description: >-
              {{ $value }} runs of jdwillmsen-minecraft-fwb-prd-volume-recovery failed in the last 30 minutes. The actor
              is scheduled and executing, so every check that only asks whether it ran reports it healthy — but its pod
              delete is the last thing it does, so a failed run means it could not act. Usually a revoked or narrowed
              RBAC grant on the delete. Read the last failed Job's pod log in jdwillmsen-prd. Until it is fixed, a
              read-only latch will not be recovered by anything.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # Half two: is it scheduled at all?
        #
        # The rule above reads Jobs, and a CronJob that is suspended, deleted,
        # or never created produces none — no failed ones and no successful
        # ones. Nothing derived from its output can distinguish that from an
        # actor with nothing to do, which is why this half has to be a static
        # expectation this repository holds rather than a measurement.
        #
        # It must not be windowed, and that is the whole point of the shape.
        # A lookback-based expectation stops firing when its window runs out
        # and Alertmanager then sends a resolved notification — an affirmative
        # all-clear delivered at the exact moment the failure became
        # permanent. absent() over a literal series has no lookback and
        # structurally cannot expire; it fires from the moment the expectation
        # is unmet and keeps firing, including on a cluster rebuilt from
        # scratch where the actor was never deployed at all.
        #
        # `== 0` inside absent() is what makes one rule cover both halves of
        # "not scheduled". A deleted CronJob has no series; a suspended one
        # has a series valued 1, which the comparison filters away, leaving
        # absent() with nothing either way. Suspension is not a lesser state
        # here: a suspended recovery actor recovers exactly as much as a
        # deleted one.
        #
        # absent() derives its output labels from a plain selector only, so a
        # comparison inside it yields none. The identifying labels are stated
        # here instead, which also keeps grouping and inhibition — both keyed
        # on alertname and namespace — working the way they do for every other
        # alert.
        #
        # 30m, well past any kube-state-metrics restart or scrape gap, which
        # would otherwise read as a missing series. Shorter than the backup
        # producer's hour above because this actor's whole job is to act
        # within minutes.
        - alert: JdwillmsenMinecraftVolumeRecoveryAbsent
          expr: absent(kube_cronjob_spec_suspend{namespace="jdwillmsen-prd", cronjob="jdwillmsen-minecraft-fwb-prd-volume-recovery"} == 0)
          for: 30m
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
            cronjob: jdwillmsen-minecraft-fwb-prd-volume-recovery
          annotations:
            summary: "No scheduled volume-recovery actor exists for the Minecraft server"
            description: >-
              The CronJob jdwillmsen-minecraft-fwb-prd-volume-recovery is either suspended, deleted, or was never
              created in jdwillmsen-prd. It is the only thing in the cluster that detects an ext4 emergency-read-only
              latch on the world volume, so while this fires that fault recovers only when a human notices it. Check the
              CronJob and that ArgoCD has the tenant's deployment repo synced. If the actor is being retired
              deliberately, delete this rule in the same change — it exists to force that decision, not to be silenced.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # Everything above watches the machinery around the world -- the
        # backup producer, the recovery actor. Nothing watched the server
        # itself or the world's contents, which is why a two-week corruption
        # and four server crashes were all found by a human reading logs
        # rather than by anything here. The four rules below close that.
        #
        # See jdwillmsen/jdw-deployments docs/incidents/ for both write-ups.

        # mc-monitor already pings the server and publishes this; nothing
        # consumed it until now.
        #
        # 2m because the crash this server actually suffers recovers on its
        # own in about thirty seconds, so a shorter window would page for
        # something already fixed by the time anyone looked. Anything still
        # unreachable after two minutes is not self-healing. Crashes are
        # caught by the restart rule below instead, which is the signal that
        # survives the recovery.
        - alert: JdwillmsenMinecraftServerUnreachable
          expr: minecraft_status_healthy{namespace="jdwillmsen-prd"} == 0
          for: 2m
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "Minecraft server is not answering pings"
            description: >-
              The mc-monitor sidecar has been unable to reach the Bedrock server on 127.0.0.1:31132 for two minutes,
              so players cannot join either. The container restarts itself on a crash, so a fault lasting this long
              is one that did not recover: check the pod's status and its previous container's logs for a crash
              dump, and the world volume for an ext4 read-only latch.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # The rule above can only fire while something is publishing the
        # series it reads. Same reasoning as the backup producer's absent()
        # rule: an expectation this repository holds cannot be forgotten by
        # Prometheus, so it survives a deleted sidecar, a ServiceMonitor that
        # stopped matching, and a cluster rebuilt from scratch.
        - alert: JdwillmsenMinecraftServerHealthSignalAbsent
          expr: absent(minecraft_status_healthy{namespace="jdwillmsen-prd"})
          for: 15m
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "No health signal exists for the Minecraft server"
            description: >-
              minecraft_status_healthy has not been scraped from jdwillmsen-prd for fifteen minutes. The server may be
              fine, but nothing can now tell you if it is not -- JdwillmsenMinecraftServerUnreachable reads this
              series and is silent while it is missing. Check the mc-monitor sidecar, its Service and ServiceMonitor.
              If the sidecar is being retired deliberately, delete these rules in the same change.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # The server has crashed four times between 2026-08-25 and 09-01, each
        # within a second of a player connecting, and each time the container
        # restarted in place and was serving again about thirty seconds later.
        # A reachability alert cannot see that: by the time any sane `for:`
        # elapsed the server is back. The restart counter is the only evidence
        # that outlives the recovery.
        #
        # Note this also fires on a deliberate restart, because the version
        # check now upgrades the server by stopping it and letting the kubelet
        # bring the container back. That is not a false positive worth
        # engineering away -- an unplanned Bedrock version change is worth
        # seeing -- but it is why this is a warning rather than critical, and
        # why the description says how to tell the two apart.
        - alert: JdwillmsenMinecraftServerRestarted
          expr: increase(kube_pod_container_status_restarts_total{namespace="jdwillmsen-prd", container="jdwillmsen-minecraft-fwb-prd-minecraft-bedrock"}[1h]) > 0
          for: 30m
          labels:
            severity: warning
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "Minecraft server container restarted in the last hour"
            description: >-
              The Bedrock container restarted, which disconnects everyone for roughly thirty seconds. If the
              version-check CronJob logged a "restarted" event in that window this was a deliberate version upgrade
              and no action is needed. Otherwise it crashed: the previous container's logs hold the dump, and the
              known defect is an upstream crash on player connect that recovers on its own.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # A StatefulSet will not replace a pod that has never become Ready.
        # That makes a bad revision self-sustaining: the pod cannot start, so
        # the controller will not roll it, so the fix -- including a revert
        # that has already merged and already synced -- never reaches it. No
        # controller resolves this. Someone has to delete the pod.
        #
        # Every other rule here was blind to it on 2026-09-06. Unreachable
        # fired, correctly, for 42 hours; it says the server is down, not that
        # the thing that would normally fix it has stalled, and the difference
        # is whether a human is required. Restarted stayed silent because a pod
        # that never starts a container never restarts one.
        #
        # Backtested against that incident before being written: this
        # expression was true from 09-06 05:30, when the revert's sync moved
        # updateRevision and left the pod behind, to 09-07 21:45, when the pod
        # was finally deleted by hand. It was deliberately false for the first
        # two hours of the outage, while the pod was still on the current
        # revision and merely broken -- that window belongs to Unreachable.
        #
        # 30m because the server's own startup budget is ten minutes (startup
        # probe, 60 failures at 10s), so a genuinely slow rollout must be able
        # to finish without tripping this. replicas_updated is the right
        # counter rather than replicas_ready: readiness returns on its own
        # after a crash, and this is specifically about a revision that cannot
        # be delivered.
        - alert: JdwillmsenMinecraftServerRolloutWedged
          expr: kube_statefulset_status_replicas_updated{namespace="jdwillmsen-prd", statefulset="jdwillmsen-minecraft-fwb-prd-minecraft-bedrock"} < kube_statefulset_replicas{namespace="jdwillmsen-prd", statefulset="jdwillmsen-minecraft-fwb-prd-minecraft-bedrock"}
          for: 30m
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "Minecraft server StatefulSet cannot roll out its current revision"
            description: >-
              The StatefulSet has a revision its pod is not running, and has been unable to deliver it for thirty
              minutes. This does not resolve on its own: a pod that has never gone Ready is never replaced, so the
              running spec stays stuck even after a fix has merged and synced. Check why the current pod will not
              start (kubectl describe pod -- a config error naming a missing Secret or ConfigMap will not show as a
              restart), confirm the StatefulSet's spec is the one you want, then delete the pod so the controller can
              recreate it on that spec. Expect the ArgoCD Application to be stuck in a Running sync until it is.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # The only rule here that watches the world rather than the server.
        # Every other signal reports on processes; this one would have caught
        # the 2026-08-30 data loss on its own, without anyone understanding
        # iSCSI, because the archive simply got smaller.
        #
        # The baseline is the 7d median, not the 7d peak, and that is the
        # whole rule. The world is a LevelDB, and a backup that lands while a
        # compaction is in flight captures both generations of the tables being
        # merged: on 2026-09-04 that put a duplicate ~12 MB of tables in the
        # archive and made it 2.6% larger than the day before. The next
        # archive held one generation again, and against the inflated peak
        # that read as a 2.7% shrink and paged critical for a day, over a
        # world that had lost nothing -- the removed and re-created tables
        # paired byte-for-byte and the manifest had grown.
        #
        # A peak baseline cannot tell those apart, because compaction only
        # ever moves the peak in the direction that arms the rule, and the
        # alert then cannot clear until the inflated sample ages out of the
        # window. A median is unmoved by it: one anomalous archive out of
        # seven does not shift the middle one. Measured over the 12d to
        # 2026-09-06, current/median stayed in [1.0000, 1.0394] across every
        # healthy archive -- a played-in world is always at or above its own
        # recent median -- while the 08-30 loss read 0.9453. The compaction
        # transient reads 1.0111. So 2% below the median has the real loss 3.5
        # points inside it and the false positive 3.1 points outside it, and
        # 2% stays the number it was against the peak.
        #
        # Rejected: requiring the shrink to persist across two archives. The
        # one real loss in the recorded series appeared in exactly one archive
        # and was restored before the next one ran, so persistence would have
        # traded the false positive for the true positive. Also rejected:
        # publishing table counts and manifest size from the save-time file
        # list the job already logs. It would work, but the median already
        # separates the two cases by 6.6 points using gauges that exist, and
        # new gauges mean new parsing in the backup job to maintain.
        #
        # The guards are not decoration. The exporter serves zeros when it has
        # no state to serve -- for 19h on 2026-08-27, before this rule existed
        # to read them as a total loss -- and a zero is a producer that has not
        # reported, which BackupStateNeverReported and BackupVisibilityLost
        # own. A genuine zero-byte archive is BackupArtifactEmpty's. Both are
        # excluded here so each condition pages once, from the rule that can
        # actually describe it. Zeros left in the baseline are harmless: a
        # median needs half the window to move, and 19h is 11% of it.
        #
        # backup_state_reported carries artifact alongside backup_job: both
        # gauges come off the same scrape target and their label sets are
        # identical, so the guard matches on the full set and wants no on()
        # clause. The sibling rules aggregate on (backup_job) because they
        # join against series from elsewhere. Narrowing this one to match them
        # would let one exporter pod's state gauge vouch for another pod's
        # size gauge during a rollover, which is the thing the last fixture in
        # the test file exists to prevent.
        #
        # quantile_over_time weighs samples, not archives, so an archive the
        # exporter holds for days because no backup ran counts for several of
        # them. That unevenness is assumed, and it is protective rather than
        # merely tolerable: the world grows, so the newest archive is the
        # largest and a stall always plateaus at the top of the window's
        # distribution, which pushes the median up and tightens the threshold.
        # Swept from a 24h to a 168h freeze against a real 5.5% loss the ratio
        # falls monotonically, 0.9581 to 0.9450, never toward 0.98. In the
        # limit the median becomes the plateau value itself -- compare against
        # the last archive known good, which is the baseline you would have
        # picked by hand.
        - alert: JdwillmsenMinecraftWorldArchiveShrank
          expr: |
            (
              backup_last_artifact_bytes{backup_job="jdwillmsen-minecraft-fwb-prd-backup", artifact="world"}
                < quantile_over_time(0.5, backup_last_artifact_bytes{backup_job="jdwillmsen-minecraft-fwb-prd-backup", artifact="world"}[7d]) * 0.98
            )
            and (backup_last_artifact_bytes{backup_job="jdwillmsen-minecraft-fwb-prd-backup", artifact="world"} > 0)
            and (backup_state_reported{backup_job="jdwillmsen-minecraft-fwb-prd-backup", artifact="world"} == 1)
          for: 15m
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "Minecraft world backup is smaller than its recent typical size"
            description: >-
              The newest world archive is more than 2% smaller than the median of those taken in the past week. A
              world that is played in grows; it does not shrink, and it does not fall below its own recent middle.
              Treat this as data loss until proven otherwise and do not let the next backup rotate the good one
              away. Check the server log for "Corruption: N missing files" and the CSI driver's log for an fsck that
              recovered a journal. A LevelDB compaction does not produce this: it inflates one archive rather than
              shrinking the next, and the median baseline already absorbs that. If the archive is smaller and the
              save-time file list shows removed tables re-created at the same sizes, that is compaction and the
              world is intact.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # sum() rather than count(... > 0): with both bots down the count form
        # matches nothing and the alert goes silent at exactly the moment it
        # matters most — an empty vector fires no comparison. The sum exists
        # as long as the Deployments do, and both Deployments disappearing is
        # ArgoCD-drift territory, not this rule's.
        #
        # Warning, not critical: the bots keep the mob farm ticking and the
        # chat log flowing, but nothing player-facing breaks while they are
        # down. 30m so a server restart (which disconnects both, by design,
        # roughly hourly when a version bump lands) never pages — their own
        # backoff reconnects them well inside that.
        - alert: JdwillmsenMinecraftAfkBotsDegraded
          expr: sum(kube_deployment_status_replicas_available{namespace="jdwillmsen-prd", deployment=~"jdwillmsen-minecraft-fwb-prd-afk-bot(-2)?"}) < 2
          for: 30m
          labels:
            severity: warning
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "Fewer than two AFK bots are running"
            description: >-
              At least one AFK bot Deployment has had no available replica for 30 minutes. The mob farm stops ticking
              and chat capture pauses with bot 1. Deployment-level, so this is a pod that will not run — not a bot that
              runs but cannot join the server; that shape (a protocol-schema change the 0.2.0 spoof cannot bridge) shows
              as protocol_spoofed log lines followed by short session_lasted_ms reconnect events instead, with this
              rule quiet. Check both bot pods and their logs in jdwillmsen-prd.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # jdwillmsen-minecraft-fwb-prd-server-agent has published mc_agent_connected
        # since its first release and nothing has ever read it. Its Xbox Live
        # session dropped at 2026-09-09 02:48:09Z and it could not log back in
        # until 03:27:53Z — thirty-nine minutes; nothing paged, and the only
        # reason anyone knew was a player standing in the world who saw it leave.
        #
        # The agent already retries a dropped session on its own, and does so
        # fast — an ordinary server restart or a protocol bump recovers inside a
        # couple of minutes without anyone noticing, which is why this cannot be
        # a short window. Ten minutes down is past that: it is no longer the
        # agent recovering, it is the retry loop itself failing over and over.
        # The cause worth naming outright is Xbox Live parking the account in an
        # abuse-mode hold: what is confirmed is that the account was flagged
        # after a dozen headless logins over the preceding afternoon, not that
        # attempt volume is what tripped it — either way, clearing the hold is
        # not something the agent's own retry loop can do, and describing this
        # as a client bug sends whoever is paged looking in the wrong place.
        # Only a human signing into that Microsoft account in a browser and
        # clearing the security challenge fixes it; once that happens the
        # agent's existing retry loop does the rest unattended.
        - alert: JdwillmsenMinecraftAgentDisconnected
          expr: mc_agent_connected{namespace="jdwillmsen-prd"} == 0
          for: 10m
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "Minecraft chat agent has lost its Bedrock session"
            description: >-
              mc_agent_connected has read 0 in jdwillmsen-prd for ten minutes straight. The agent reconnects on its
              own inside a couple of minutes for an ordinary server restart or protocol bump, so ten minutes down
              means its own retry loop has been failing the whole time, not merely retrying. The known cause is Xbox
              Live placing the account in an abuse-mode hold after repeated login attempts, which the agent cannot
              clear itself: sign into the Microsoft account behind jdwillmsen-minecraft-fwb-prd-server-agent in a
              browser and complete the security challenge, and the agent's existing retry loop will log it back in
              without anything further.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # The rule above can only fire while something is publishing the series
        # it reads. Same reasoning as JdwillmsenMinecraftServerHealthSignalAbsent:
        # a workload that vanished outright — a crashlooping pod, a deleted
        # Deployment, a ServiceMonitor that stopped matching — produces no series
        # at all, and `== 0` is blind to that; it has nothing to compare. This is
        # the gap a human noticing the agent was gone would otherwise be the only
        # thing to catch, same as the incident above.
        #
        # 15m, not the disconnected rule's 10m: this reads a scrape gap rather
        # than a session, so it needs margin past an ordinary redeploy of the
        # single agent pod. The Deployment's strategy is Recreate, so the old
        # pod always terminates before the new one starts, and this must not
        # mistake that brief, expected gap for the workload being gone.
        - alert: JdwillmsenMinecraftAgentConnectionSignalAbsent
          expr: absent(mc_agent_connected{namespace="jdwillmsen-prd"})
          for: 15m
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "No connection signal exists for the Minecraft chat agent"
            description: >-
              mc_agent_connected has not been scraped from jdwillmsen-prd for fifteen minutes. The agent may be
              connected fine, but nothing can now tell you if it is not — JdwillmsenMinecraftAgentDisconnected reads
              this series and is silent while it is missing. Check the jdwillmsen-minecraft-fwb-prd-server-agent
              Deployment, its pod, and its ServiceMonitor in jdwillmsen-prd. If the agent is being retired
              deliberately, delete these rules in the same change.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # The world only grows, and a full datadir kills the server harder
        # than any crash — writes fail, the ext4 read-only latch follows, and
        # recovery needs human volume surgery rather than the volume-recovery
        # actor's pod delete. 80% on a 15m hold is early enough to grow the
        # PVC calmly. Covers every PVC in the namespace deliberately: the two
        # bot token caches are tiny but a full one bricks that bot's auth just
        # the same.
        - alert: JdwillmsenMinecraftVolumeNearFull
          expr: max by (persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="jdwillmsen-prd"} / kubelet_volume_stats_capacity_bytes{namespace="jdwillmsen-prd"}) > 0.8
          for: 15m
          labels:
            severity: warning
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "A jdwillmsen-prd volume is over 80% full"
            description: >-
              PVC {{ $labels.persistentvolumeclaim }} is at {{ $value | humanizePercentage }} of capacity. The world
              datadir only grows, and filling it ends in failed writes and an ext4 read-only latch that the
              volume-recovery actor cannot fix. Expand the PVC (TrueNAS iSCSI/NFS both support online expansion)
              before it crosses 90%.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # The version-check CronJob is what bounds how stale the LATEST-
        # tracking server can get, and — as one leg — dispatches the AFK bot
        # repo's protocol check. Its occasional single-run flake (candidate
        # pod missing its 60s reporting budget) is known and benign; four
        # hours of no success is four missed cycles, which is the mechanism
        # actually off, not a flake. max() because kube-state-metrics can
        # briefly serve duplicate series across a restart.
        - alert: JdwillmsenMinecraftVersionCheckStale
          expr: time() - max(kube_cronjob_status_last_successful_time{namespace="jdwillmsen-prd", cronjob="jdwillmsen-minecraft-fwb-prd-version-check"}) > 14400
          for: 15m
          labels:
            severity: warning
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "The Minecraft version-check has not succeeded for over 4 hours"
            description: >-
              The hourly version-check CronJob has missed at least four consecutive cycles, so the Bedrock server's
              staleness bound is not being enforced and the AFK bot repo is not being told the production version.
              Players on newly-updated clients lose the ability to join once Mojang ships a version the server no
              longer matches. Read the last failed Job's logs in jdwillmsen-prd; the known benign single-run flake is
              the candidate pod missing its 60s reporting budget, which this rule's four-hour threshold already
              tolerates.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"
