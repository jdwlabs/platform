apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jdwillmsen-tenant-alerts
  namespace: jdwillmsen-prd
  labels:
    tenant: jdwillmsen
spec:
  groups:
    - name: jdwillmsen-tenant
      rules:
        # The two rules below are the freshness contract's static expectations
        # for the world backup: the parts that cannot be derived from the
        # metrics, and therefore the only parts that cannot expire.
        #
        # Every other backup alert reads gauges the producer publishes, so all
        # of them go quiet together the moment the producer stops publishing —
        # a deleted exporter, exporter.enabled flipped to false, a removed
        # release, a ServiceMonitor that stopped matching. The platform's
        # BackupFreshnessSignalMissing covers that gap by remembering producers
        # seen in the last 14d, but a lookback is still evidence, and evidence
        # ages out: once the last sample falls off, that alert stops firing and
        # Alertmanager sends a resolved notification for a backup that is still
        # dead. Two weeks later the cluster is back to the posture that caused
        # the original incident — nothing produced, nothing said.
        #
        # absent() over a named series is the only shape immune to that,
        # because it asserts an expectation this repository holds rather than
        # one Prometheus can forget. It fires from the moment the series is
        # missing and keeps firing indefinitely, including on a cluster rebuilt
        # from scratch where the producer was never deployed at all.
        #
        # The literal names are the point, not an oversight: these say "this
        # specific backup must exist". Decommissioning the world backup means
        # deleting both rules in the same change, which is exactly the review
        # step that silently skipping it is meant to force.
        #
        # Living in the tenant namespace does couple the guards to it: deleting
        # jdwillmsen-prd removes them at the same moment it removes the
        # producer. Putting them in monitoring/ alongside the platform rules
        # would be namespace-independent and was considered. They sit here
        # because deleting a tenant namespace is loud in a dozen other ways and
        # is never accidental, and because keeping tenant alerts with their
        # tenant matches jdwlabs-alerts and dotablaze-tech-alerts. Worth
        # revisiting if a tenant is ever torn down and rebuilt routinely.
        #
        # Two rules rather than one because "is anything making backups?" and
        # "is anything reporting on them?" are separate questions with separate
        # producers, and a single absent() answering one of them was read as
        # answering both. That misreading is what this pair exists to end: the
        # rule below watched the exporter and was described as watching the
        # backup, so a permanently deleted CronJob went undetected while the
        # exporter kept the series alive on its behalf.

        # Is anything making backups?
        #
        # kube-state-metrics is the producer of this series, not the backup and
        # not its exporter, so nothing in the release being watched can keep it
        # alive. That is the whole difference from the rule below, which reads
        # a series the watched release publishes about itself: a switch whose
        # signal is owned by its subject is not a switch. Deleting the release
        # takes the CronJob with it, this series goes with the CronJob, and the
        # alert fires — where a gauge published on the producer's behalf would
        # have gone on reporting a healthy 0 forever.
        #
        # `== 0` inside absent() is what makes one rule cover both halves of
        # "not scheduled". A deleted CronJob has no series; a suspended one has
        # a series valued 1, which the comparison filters away, leaving
        # absent() with nothing either way. A suspended backup backs up exactly
        # as much as a deleted one.
        #
        # absent() derives its output labels from a plain selector only, so a
        # comparison inside it yields none at all. The identifying labels are
        # stated here instead, which also keeps Alertmanager's grouping and
        # inhibition — both keyed on alertname and namespace — working the way
        # they do for every other alert.
        #
        # Same seam and same shape as JdwillmsenMinecraftVolumeRecoveryAbsent
        # below, deliberately: two static expectations over kube-state-metrics
        # that read alike are two an operator can reason about at once. 1h
        # rather than that rule's 30m because a nightly backup has no need to
        # be noticed within minutes, and it matches the producer-absent rule it
        # sits beside.
        - alert: JdwillmsenMinecraftBackupCronJobAbsent
          expr: absent(kube_cronjob_spec_suspend{namespace="jdwillmsen-prd", cronjob="jdwillmsen-minecraft-fwb-prd-backup"} == 0)
          for: 1h
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
            cronjob: jdwillmsen-minecraft-fwb-prd-backup
          annotations:
            summary: "No scheduled backup exists for the Minecraft world"
            description: >-
              The CronJob jdwillmsen-minecraft-fwb-prd-backup is either suspended, deleted, or was never created in
              jdwillmsen-prd. Nothing is copying the world, and the backup exporter goes on publishing whatever it last
              read, so the freshness gauges say nothing about it. Check the CronJob and that ArgoCD has the tenant's
              deployment repo synced. If the backup is being retired deliberately, delete this rule in the same change —
              it exists to force that decision, not to be silenced.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # Is anything reporting on them?
        #
        # Scoped to the signal and nothing more. This fires when the exporter
        # Deployment is gone, disabled, or no longer scraped — the case
        # kube-state-metrics cannot see, because a CronJob can be perfectly
        # scheduled while nothing publishes a word about what it produced.
        #
        # It is emphatically not the dead-man's switch for the backup itself,
        # and the rule above exists because it was once treated as one. The
        # exporter serves placeholder values when the producer has not
        # reported, so this series is present whenever the exporter is, whether
        # or not anything is backing anything up. Presence here means "somebody
        # is reporting", never "the backup is alive".
        - alert: JdwillmsenMinecraftBackupProducerAbsent
          expr: absent(backup_last_success_timestamp_seconds{backup_job="jdwillmsen-minecraft-fwb-prd-backup"})
          for: 1h
          labels:
            severity: critical
            tenant: jdwillmsen
          annotations:
            summary: "No backup freshness signal exists for the Minecraft world"
            description: "No freshness signal exists for the Minecraft world backup. It is not merely stale — nothing is reporting on it at all, so every other backup alert for it is silent too. Check the backup exporter Deployment and its ServiceMonitor in jdwillmsen-prd."
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # BackupStateNeverReported (warning, in rules-job-freshness.yaml) is
        # right about the condition it was reasoned against: a producer whose
        # exporter has not yet seen a completed run is not broken, it is
        # young. But the same condition sustained is exactly how this
        # cluster's worst backup incident happened before — the world's
        # backups were never observably failing, they were simply
        # unobserved, for months. A gap that clears in an hour and
        # one that persists for days produce the identical warning, and only
        # the second is the original incident recurring. This rule is what
        # tells them apart, at the only severity that gets looked at
        # immediately.
        #
        # It cannot be a wider threshold on the platform rule, because the
        # platform rule has nothing to widen against. backup_exporter_start_time_seconds
        # resets on every exporter restart, so "time since the exporter
        # started" can understate true elapsed blindness by as much as one
        # restart interval — honest for a young deployment, where a restart
        # replaying real state is meant to resolve the warning immediately,
        # but not a distinction a generic rule can draw for a producer it
        # knows nothing else about. What proves the difference is evidence the
        # exporter's own gauges cannot manufacture: has this CronJob actually
        # completed a run? That is a question only kube-state-metrics can
        # answer, and answering it needs the tenant's own CronJob name — which
        # is exactly the join the platform rule could not fold in and stay
        # generic, and exactly why this rule lives beside the CronJob it
        # names rather than in the shared rule set.
        #
        # Three conditions, all required:
        #   - backup_state_reported has read 0 for over twice the producer's
        #     own backup_max_age_seconds. Two intervals, not one, so a normal
        #     gap between the moment a fresh exporter comes up and its first
        #     completed run never pages critical on its own — that gap is
        #     BackupStateNeverReported's to own, at warning, and this rule
        #     starts exactly where that one already considers the wait
        #     unreasonable, doubled again for margin. The multiplier is read
        #     from the producer's own budget rather than a constant, so the
        #     threshold follows this producer's cadence and not an assumption
        #     borrowed from it.
        #   - backup_state_reported is 0 right now, not merely 0 at some point
        #     in the window — `and`, not `unless`, keeps this from latching on
        #     a gap that has already closed.
        #   - kube_cronjob_status_last_successful_time exists for this
        #     CronJob: proof, independent of anything the exporter says, that
        #     a run has actually completed. Without this a producer that has
        #     genuinely never once succeeded — covered already by
        #     CronJobNeverSucceeded and JdwillmsenMinecraftBackupCronJobAbsent
        #     above — would also cross the two-interval mark and page a second,
        #     redundant critical for the same root cause under a worse name.
        #     With it, crossing the mark can only mean the backup ran and
        #     something afterward stopped the exporter from ever finding out
        #     — a broken publish path, not a backup that has not gotten around
        #     to running yet. `on ()` because the two series share no label at
        #     all: kube-state-metrics knows this CronJob as
        #     namespace/cronjob, the exporter knows it only as backup_job.
        #
        # Deliberately not folded into a single rule with BackupStateNeverReported:
        # that rule has to stay generic across every producer that ever
        # adopts the contract, and the CronJob join is not something a
        # producer's own gauges can express.
        - alert: JdwillmsenMinecraftBackupVisibilityLost
          expr: |
            (
              (
                time() - max by (backup_job) (
                  backup_exporter_start_time_seconds{backup_job="jdwillmsen-minecraft-fwb-prd-backup"}
                )
              )
              > on (backup_job) group_left() (
                  2 * min by (backup_job) (
                    backup_max_age_seconds{backup_job="jdwillmsen-minecraft-fwb-prd-backup"}
                  )
                )
            )
            and on (backup_job) (
              max by (backup_job) (
                backup_state_reported{backup_job="jdwillmsen-minecraft-fwb-prd-backup"}
              ) == 0
            )
            and on ()
            (
              kube_cronjob_status_last_successful_time{namespace="jdwillmsen-prd", cronjob="jdwillmsen-minecraft-fwb-prd-backup"}
            )
          for: 1h
          labels:
            severity: critical
            tenant: jdwillmsen
          annotations:
            summary: "The Minecraft world backup has been unobserved for multiple backup intervals"
            description: >-
              backup_state_reported has read 0 for over twice jdwillmsen-minecraft-fwb-prd-backup's own freshness
              budget, and the CronJob has completed at least one successful run in that time — so this is not an
              exporter that simply has not seen a run yet, it is a reporting path that stopped working while the
              backup itself kept succeeding. BackupArtifactStale and BackupArtifactEmpty stay suppressed for as long
              as this is true, so nothing has been watching the artifact for multiple backup cycles — sustained
              blindness, not a transient gap. Check that the job's last step is writing its state to the
              …-backup-metrics ConfigMap in jdwillmsen-prd and that its ServiceAccount can still create it.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # The two rules below watch the volume-recovery actor: the CronJob in
        # the tenant's deployment repo that deletes the Minecraft server pod
        # when its volume latches read-only. It is the only thing in the stack
        # that detects that fault class at all — the CSI layer reports no
        # failing operation because nothing re-stages a latched mount, and
        # since Linux 6.12 ext4 sets an internal emergency-read-only bit
        # instead of the superblock flag, so /proc/mounts keeps saying `rw`
        # and node_filesystem_readonly stays 0 throughout. So the actor is the
        # detector of last resort, and nothing was watching it.
        #
        # They live here rather than beside the CronJob for the same reason
        # the rule above does: a rule shipped by the thing it watches
        # disappears with it, and the actor's CronJob vanishing is precisely
        # the case these exist for. The same tenant-namespace caveat applies —
        # deleting jdwillmsen-prd removes both of these at the moment it
        # removes the actor. It is accepted here for the same reasons, and
        # keeping the tenant's alerts in one file is worth more than diverging
        # from the convention for one rule.
        #
        # Two rules, not one, because the question splits cleanly in half and
        # each half wants a different instrument. "Could it act?" is answered
        # by the Jobs the CronJob leaves behind. "Is it scheduled at all?"
        # cannot be answered from Jobs at all, because a CronJob that is
        # suspended or deleted produces neither failed Jobs nor successful
        # ones — it simply goes quiet. A single compromise rule would have to
        # pick one of those and would be blind to the other.

        # Half one: could it act?
        #
        # The actor runs under `set -euo pipefail` with `backoffLimit: 0` and
        # the pod delete is its last statement, so a denied delete exits
        # non-zero with no retry left and the Job lands Failed rather than
        # Complete. That is what makes this rule see the case a "did it run"
        # check cannot: an actor that is scheduled, runs on time, and cannot
        # do the one thing it exists to do looks exactly like a healthy no-op
        # to anything counting executions. A healthy no-op exits 0.
        #
        # kube-state-metrics is the producer, not the actor, so this costs no
        # instrumentation in the thing being watched and does not go dark with
        # it.
        #
        # Ownership is resolved through kube_job_owner rather than a job_name
        # prefix. A generated Job name is the CronJob's name plus a suffix, so
        # a prefix match is a guess that also claims any future workload named
        # into the same space; the owner reference is the cluster's own
        # statement of which CronJob a Job belongs to.
        #
        # The start-time bound is what stops this latching forever. A CronJob
        # retains its last few failed Jobs and nothing evicts them once
        # failures stop — successful runs are kept under a separate limit — so
        # "a failed Job exists" stays true indefinitely after the fault is
        # fixed, and the alert would never resolve. Bounding on when the Job
        # started means the condition clears on its own once the actor is
        # succeeding again. 30m is six runs at the actor's five-minute
        # schedule.
        #
        # Two failures rather than one, inside that window, because a single
        # denied or evicted run is covered by the next run five minutes later,
        # while two inside half an hour is an actor that is not recovering by
        # itself. Critical because the failure it describes is silent
        # everywhere else.
        - alert: JdwillmsenMinecraftVolumeRecoveryFailing
          expr: |
            count(
                (max by (namespace, job_name) (kube_job_status_failed{namespace="jdwillmsen-prd"}) > 0)
              and on (namespace, job_name)
                (max by (namespace, job_name) (kube_job_status_start_time{namespace="jdwillmsen-prd"}) > time() - 1800)
              and on (namespace, job_name)
                max by (namespace, job_name) (
                  kube_job_owner{namespace="jdwillmsen-prd", owner_kind="CronJob", owner_name="jdwillmsen-minecraft-fwb-prd-volume-recovery"}
                )
            ) >= 2
          for: 5m
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
          annotations:
            summary: "The Minecraft volume-recovery actor is running but failing"
            description: >-
              {{ $value }} runs of jdwillmsen-minecraft-fwb-prd-volume-recovery failed in the last 30 minutes. The actor
              is scheduled and executing, so every check that only asks whether it ran reports it healthy — but its pod
              delete is the last thing it does, so a failed run means it could not act. Usually a revoked or narrowed
              RBAC grant on the delete. Read the last failed Job's pod log in jdwillmsen-prd. Until it is fixed, a
              read-only latch will not be recovered by anything.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"

        # Half two: is it scheduled at all?
        #
        # The rule above reads Jobs, and a CronJob that is suspended, deleted,
        # or never created produces none — no failed ones and no successful
        # ones. Nothing derived from its output can distinguish that from an
        # actor with nothing to do, which is why this half has to be a static
        # expectation this repository holds rather than a measurement.
        #
        # It must not be windowed, and that is the whole point of the shape.
        # A lookback-based expectation stops firing when its window runs out
        # and Alertmanager then sends a resolved notification — an affirmative
        # all-clear delivered at the exact moment the failure became
        # permanent. absent() over a literal series has no lookback and
        # structurally cannot expire; it fires from the moment the expectation
        # is unmet and keeps firing, including on a cluster rebuilt from
        # scratch where the actor was never deployed at all.
        #
        # `== 0` inside absent() is what makes one rule cover both halves of
        # "not scheduled". A deleted CronJob has no series; a suspended one
        # has a series valued 1, which the comparison filters away, leaving
        # absent() with nothing either way. Suspension is not a lesser state
        # here: a suspended recovery actor recovers exactly as much as a
        # deleted one.
        #
        # absent() derives its output labels from a plain selector only, so a
        # comparison inside it yields none. The identifying labels are stated
        # here instead, which also keeps grouping and inhibition — both keyed
        # on alertname and namespace — working the way they do for every other
        # alert.
        #
        # 30m, well past any kube-state-metrics restart or scrape gap, which
        # would otherwise read as a missing series. Shorter than the backup
        # producer's hour above because this actor's whole job is to act
        # within minutes.
        - alert: JdwillmsenMinecraftVolumeRecoveryAbsent
          expr: absent(kube_cronjob_spec_suspend{namespace="jdwillmsen-prd", cronjob="jdwillmsen-minecraft-fwb-prd-volume-recovery"} == 0)
          for: 30m
          labels:
            severity: critical
            tenant: jdwillmsen
            namespace: jdwillmsen-prd
            cronjob: jdwillmsen-minecraft-fwb-prd-volume-recovery
          annotations:
            summary: "No scheduled volume-recovery actor exists for the Minecraft server"
            description: >-
              The CronJob jdwillmsen-minecraft-fwb-prd-volume-recovery is either suspended, deleted, or was never
              created in jdwillmsen-prd. It is the only thing in the cluster that detects an ext4 emergency-read-only
              latch on the world volume, so while this fires that fault recovers only when a human notices it. Check the
              CronJob and that ArgoCD has the tenant's deployment repo synced. If the actor is being retired
              deliberately, delete this rule in the same change — it exists to force that decision, not to be silenced.
            runbook_url: "https://github.com/jdwlabs/platform/blob/main/docs/OPERATIONS.md#5-troubleshooting-symptom--fix"
