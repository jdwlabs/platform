name: jdwillmsen
displayName: "Jdwillmsen"
githubOrg: jdwillmsen
contacts:
  - jdwillmsen@gmail.com

deploymentRepo:
  url: https://github.com/jdwillmsen/jdw-deployments.git
  revision: main

namespaces:
  # Single environment: personal workloads, no non/prd split to promote between.
  #
  # Enforcing. The rules below were applied first, beside the allow-all pair,
  # and watched matching live traffic before this flag removed the pair; the
  # flow inventory they were derived from is in
  # docs/adr/0031-jdwillmsen-prd-flow-inventory-and-staged-enforcement.md.
  # Removing the flag is the whole rollback: the pair renders again and
  # nothing needs restarting.
  - name: jdwillmsen-prd
    # standard's limits.cpu: 6 throttled the Bedrock server at its own 2-core
    # limit after tick-distance/view-distance were raised for the mob farm —
    # cgroup stats showed ~34% of periods throttled. large gives headroom for
    # an 8-core pod limit plus the exporter/cronjobs alongside it.
    quotaTier: large
    networkPolicy: default
    enforce: true
    # Every destination seen leaving the cluster from here is TCP 443: the
    # server's own calls to Microsoft, the hourly version check's dispatch to
    # GitHub, the candidate server it boots to learn the current release, and
    # the agent signing in to Xbox Live. The bots' sign-in and the server's
    # own start after a restart were not seen, so they are the first thing to
    # watch for.
    externalEgress: true
    extraNetworkPolicies:
      # The default tier has no rule for a namespace's own pods talking to
      # each other, and nearly everything here does: the agent, both bots and
      # the join probe hold sessions on the server's game port, the agent and
      # the map read the console bridge, and the map and the agent call each
      # other. Namespace-wide rather than pair by pair, because the pairs are
      # the deployment chart's business and change with it; a pair missing
      # here would be an outage that only a platform change could end.
      #
      # It also reaches pods the chart means to keep apart from the server,
      # which is why the map's browser checks cannot be isolated by a policy
      # of their own while this is in place.
      - name: allow-same-namespace
        spec:
          podSelector: {}
          policyTypes:
            - Ingress
            - Egress
          ingress:
            - from:
                - podSelector: {}
          egress:
            - to:
                - podSelector: {}
      # Players arrive through a NodePort, and kube-proxy rewrites their
      # source on the way in: to the entry node's tunnel address when that is
      # not the node the server runs on, which is how the traffic seen
      # arriving looked. No source is named because none would mean anything:
      # whatever can reach a node's port arrives as that node. An address list
      # would add nothing but a way to lock players out when a node changes.
      - name: allow-game-ingress
        spec:
          podSelector:
            matchLabels:
              app: jdwillmsen-minecraft-fwb-prd-minecraft-bedrock
          policyTypes:
            - Ingress
          ingress:
            - ports:
                - port: 31132
                  protocol: UDP
      # The second route in that the chart keeps a Service for: signaling
      # over TCP and one UDP port per player. The server does not speak it
      # today, so none of this has been seen carrying traffic. Kept apart
      # from the rule above so that a port range the engine refused could not
      # take the port players actually use down with it. It opens the way in
      # only: a server that starts connections out to its players would need
      # egress nothing here grants.
      - name: allow-game-nethernet-ingress
        spec:
          podSelector:
            matchLabels:
              app: jdwillmsen-minecraft-fwb-prd-minecraft-bedrock
          policyTypes:
            - Ingress
          ingress:
            - ports:
                - port: 31132
                  protocol: TCP
                - port: 31160
                  endPort: 31179
                  protocol: UDP
      # In-game chat answers come from the inference host on the LAN, which
      # the external allow excludes along with the rest of the LAN. One
      # address and one port, for the one workload that calls it.
      - name: allow-agent-inference-egress
        spec:
          podSelector:
            matchLabels:
              app: jdwillmsen-minecraft-fwb-prd-server-agent
          policyTypes:
            - Egress
          egress:
            - to:
                - ipBlock:
                    cidr: 192.168.1.50/32
              ports:
                - port: 8000
                  protocol: TCP
    extraCiliumNetworkPolicies:
      # The backup, the scheduled restart, the volume recovery that runs every
      # five minutes, the version check and the hook that holds a sync while
      # players are warned all drive the server through the cluster's API.
      # Only Job pods do, and only their service accounts are bound to
      # anything, so only they are selected. The port is the one the API
      # server listens on, not the Service's 443: the address is rewritten to
      # a control-plane node before the policy sees it, and the entity alone
      # would open every port on those nodes.
      - name: allow-job-kube-apiserver-egress
        spec:
          endpointSelector:
            matchExpressions:
              - key: batch.kubernetes.io/job-name
                operator: Exists
          egress:
            - toEntities:
                - kube-apiserver
              toPorts:
                - ports:
                    - port: "6443"
                      protocol: TCP

project:
  elevated: false

observability:
  tenantId: jdwillmsen
  grafana:
    folder: jdwillmsen
    team: jdwillmsen
    access: edit
    gitSyncFolder: jdwillmsen-dashboards

services:
  # Rules only — no chart. Carries the static expectation that the world
  # backup's freshness signal exists at all, which by design cannot live in
  # the deployment repo: a rule shipped by the thing it watches disappears
  # with it.
  # The Minecraft agent's tables, migrated by Flyway as a sync hook -- the
  # same shape jdwlabs-schemas uses against the same cluster. Lands in the
  # database namespace because that is where the cluster and its superuser
  # secret live; the workload that reads these tables runs in jdwillmsen-prd
  # with the app role instead, and cannot reshape its own schema.
  - name: jdwillmsen-schemas
    chart: ""
    repo: ""
    revision: ""
    namespace: database
    postInstall: false
    rawManifests: true
    # After the database exists (postgresql-cluster-prd) and before anything
    # expects the tables.
    syncWave: 5

  - name: jdwillmsen-alerts
    chart: ""
    repo: ""
    revision: ""
    namespace: jdwillmsen-prd
    postInstall: false
    rawManifests: true
    syncWave: 2
