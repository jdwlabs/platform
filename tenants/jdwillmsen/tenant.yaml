deploymentRepo:
  url: https://github.com/jdwillmsen/jdw-deployments.git
  revision: main

namespaces:
  # Single environment: personal workloads, no non/prd split to promote between.
  #
  # externalEgress declares intent rather than taking effect today. Without
  # enforce: true the envelope also renders allow-all-egress/ingress, which
  # subsume every scoped rule — the policy engine now enforces, but it has
  # nothing restrictive to enforce here. It is set because a Bedrock server in
  # online mode authenticates players against Xbox Live and will need egress
  # the moment this namespace does restrict. The scoped rule opens 443 only;
  # whether that covers Bedrock's auth path is unverified, so revisit before
  # enabling enforce here.
  - name: jdwillmsen-prd
    quotaTier: standard
    networkPolicy: default
    externalEgress: true

project:
  elevated: false

observability:
  tenantId: jdwillmsen
  grafana:
    folder: jdwillmsen
    team: jdwillmsen
    access: edit

services: []
