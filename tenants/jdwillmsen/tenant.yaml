name: jdwillmsen
displayName: "Jdwillmsen"
githubOrg: jdwillmsen
contacts:
  - jdwillmsen@gmail.com

deploymentRepo:
  url: https://github.com/jdwillmsen/jdw-deployments.git
  revision: main

namespaces:
  # Single environment: personal workloads, no non/prd split to promote between.
  #
  # externalEgress declares intent rather than taking effect today. Without
  # enforce: true the envelope also renders allow-all-egress/ingress, which
  # subsume every scoped rule — the policy engine now enforces, but it has
  # nothing restrictive to enforce here. It is set because a Bedrock server in
  # online mode authenticates players against Xbox Live and will need egress
  # the moment this namespace does restrict. The scoped rule opens 443 only;
  # whether that covers Bedrock's auth path is unverified, so revisit before
  # enabling enforce here.
  - name: jdwillmsen-prd
    # standard's limits.cpu: 6 throttled the Bedrock server at its own 2-core
    # limit after tick-distance/view-distance were raised for the mob farm —
    # cgroup stats showed ~34% of periods throttled. large gives headroom for
    # an 8-core pod limit plus the exporter/cronjobs alongside it.
    quotaTier: large
    networkPolicy: default
    externalEgress: true

project:
  elevated: false

observability:
  tenantId: jdwillmsen
  grafana:
    folder: jdwillmsen
    team: jdwillmsen
    access: edit

services:
  # Rules only — no chart. Carries the static expectation that the world
  # backup's freshness signal exists at all, which by design cannot live in
  # the deployment repo: a rule shipped by the thing it watches disappears
  # with it.
  - name: jdwillmsen-alerts
    chart: ""
    repo: ""
    revision: ""
    namespace: jdwillmsen-prd
    postInstall: false
    rawManifests: true
    syncWave: 2
