name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Every job only reads the tree. Several of them (kubeconform, helm-lint,
# prometheus-rules, alertmanager-routing) execute a binary downloaded at
# runtime, so a token they cannot write with is the point.
permissions:
  contents: read

# Cancel superseded PR runs; a main-push always runs the gates to completion.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: |
            tenants/
            bootstrap/
          config_data: |
            extends: default
            ignore: |
              bootstrap/crds/foundation-crds.yaml
            rules:
              line-length:
                max: 300
              truthy:
                allowed-values: ['true', 'false']
              comments:
                min-spaces-from-content: 1
              document-start: disable

  platformctl-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
      - name: Build platformctl
        run: go build -o /tmp/platformctl ./cmd/platformctl
      - name: Validate tenants
        working-directory: .
        run: /tmp/platformctl tenants validate tenants/

  kubeconform:
    runs-on: ubuntu-latest
    env:
      # Checksum, not just a version tag: a release asset is mutable and this
      # job runs a downloaded binary over the whole repo. Both values move
      # together — take the digest from the release's own CHECKSUMS asset.
      KUBECONFORM_VERSION: "v0.8.0"
      KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
    steps:
      - uses: actions/checkout@v7.0.1
      # The version is in the key and there are no restore-keys on purpose: a
      # prefix restore would serve a binary from a superseded pin, so bumping
      # the constants above must miss.
      - name: Cache kubeconform
        id: kubeconform-cache
        uses: actions/cache@v6.1.0
        with:
          path: /usr/local/bin/kubeconform
          key: kubeconform-${{ runner.os }}-${{ env.KUBECONFORM_VERSION }}
      - name: Install kubeconform
        if: steps.kubeconform-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      # Runs on a cache hit too, so a restored cache is proven executable
      # before validation depends on it.
      - name: Verify kubeconform version
        run: kubeconform -v
      - name: Validate Kubernetes manifests
        run: |
          find tenants -name '*.yaml' \
            ! -name 'values.yaml' \
            ! -name 'tenant.yaml' \
            ! -path '*/helm-charts/*' | \
            xargs kubeconform \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -ignore-missing-schemas \
              -summary

  # Alert rules are the one thing here that fails by staying silent, so they
  # get unit tests rather than a syntax check alone. Pinned: promtool's test
  # semantics are what the assertions are written against, and a floating
  # version would turn an upstream change into a failure on an unrelated PR.
  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/requirements.txt
      - name: Install promtool
        env:
          # Checksum, not just a version tag: a release asset is mutable and
          # this job runs a downloaded binary over the whole repo. Every other
          # supply-chain gate here (image-pin-check, signatures) already holds
          # that line. Both values move together — take the digest from the
          # release's own sha256sums.txt.
          PROMETHEUS_VERSION: "3.5.0"
          PROMETHEUS_SHA256: "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a"
        run: |
          curl -sSLo prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tar.gz" | sha256sum -c -
          tar -xzf prometheus.tar.gz --wildcards '*/promtool' --strip-components=1
          sudo mv promtool /usr/local/bin/
      - name: Check and unit-test PrometheusRules
        run: tests/prometheus-rules/run.sh

  # Rule syntax and alert delivery are different failures. promtool proves an
  # alert compiles; it cannot see a route tree that delivers that alert to the
  # wrong receiver, to none at all, or a 'null' route ordered below the routes
  # it is meant to pre-empt. Nothing here resolved the tree before, so every
  # routing claim rested on a matrix run by hand — which is how the same wrong
  # one reached the docs twice.
  #
  # Pinned for the reason promtool is, and one more specific to this job:
  # amtool resolves the tree with a particular Alertmanager release's engine,
  # so the version has to be the one the cluster runs (kube-prometheus-stack
  # 88.3.0 ships alertmanager v0.33.1) or the gate is asserting against a
  # different router than the one that delivers.
  alertmanager-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/requirements.txt
      - name: Install amtool
        env:
          # amtool ships in the alertmanager tarball, not prometheus', so this
          # is a second download and a second digest rather than a reuse of
          # the one above. Both values move together — take the digest from
          # the release's own sha256sums.txt.
          ALERTMANAGER_VERSION: "0.33.1"
          ALERTMANAGER_SHA256: "93d802cba6a8d27239d747ce117df7648d326ab67394e32247540b030e9842ba"
        run: |
          curl -sSLo alertmanager.tar.gz \
            "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz"
          echo "${ALERTMANAGER_SHA256}  alertmanager.tar.gz" | sha256sum -c -
          tar -xzf alertmanager.tar.gz --wildcards '*/amtool' --strip-components=1
          sudo mv amtool /usr/local/bin/
      - name: Check the rendered config and resolve the routing matrix
        run: tests/alertmanager-routing/run.sh

  foundation-crds-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/requirements.txt
      - name: Check vendored monitoring CRDs match the pinned chart revision
        run: python3 tools/sync-monitoring-crds.py

  image-pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/requirements.txt
      - name: Verify the checker matches the org canonical copy
        # tools/check-image-pins.py and its test file are vendored byte-for-byte
        # from jdwlabs/.github so a rule fix cannot land here and miss the other
        # delivery repo. Rule changes go there first; re-vendor both files and
        # bump this SHA in the same PR. Repo-specific layout lives in
        # tools/image-pin-check.yaml, which is deliberately not compared.
        env:
          CANONICAL_REF: accde604cc0f391e9dfd68aa9a7ed8259fad825c  # main as of 2026-08-29 (jdwlabs/.github has no tagged releases)
        run: |
          status=0
          while read -r canonical local; do
            curl -fsSL "https://raw.githubusercontent.com/jdwlabs/.github/${CANONICAL_REF}/${canonical}" -o canonical.tmp
            if ! git diff --no-index --exit-code canonical.tmp "$local"; then
              echo "::error file=$local::$local differs from jdwlabs/.github@${CANONICAL_REF}:$canonical — re-vendor it (or bump CANONICAL_REF)"
              status=1
            fi
          done <<'FILES'
          tools/check-image-pins.py tools/check-image-pins.py
          tools/tests/test_check_image_pins.py tools/tests/test_check_image_pins.py
          FILES
          rm -f canonical.tmp
          exit $status
      - name: Test the checker against its known false negatives
        run: python3 -m unittest discover -s tools/tests -t tools/tests
      - name: Reject mutable image references
        run: python3 tools/check-image-pins.py

  # Separate job from image-pin-check on purpose: this one fetches upstream
  # chart archives, so an upstream museum being unreachable must be
  # distinguishable at a glance from an actually-unpinned image.
  remote-chart-image-pin-check:
    # Waits on image-pin-check: this job's own test discovery imports the
    # vendored check-image-pins.py (test_check_image_pins.py execs it at
    # module load), so a tampered vendored copy must be caught by the drift
    # guard there before it runs here too.
    needs: image-pin-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/requirements.txt
      - name: Test the checker against its known false negatives
        run: python3 -m unittest discover -s tools/tests -t tools/tests
      - name: Reject mutable image tags in remote chart defaults
        run: python3 tools/check-remote-chart-image-pins.py

  # Separate job from the checkers above because this one is a cross-file
  # agreement check, not a content check: its failure means two files that must
  # describe the same tenant folder have drifted, and the fix is in whichever
  # of the three was not updated.
  gitsync-tenant-folders:
    # See remote-chart-image-pin-check's needs comment above — same reason.
    needs: image-pin-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/requirements.txt
      - name: Test the checker against its known false negatives
        run: python3 -m unittest discover -s tools/tests -t tools/tests
      - name: Reject a git sync tenant folder that is created but not granted
        run: python3 tools/check-gitsync-tenant-folders.py

  adr-numbering:
    # See remote-chart-image-pin-check's needs comment above — same reason.
    needs: image-pin-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/requirements.txt
      - name: Test the checker against its known false negatives
        run: python3 -m unittest discover -s tools/tests -t tools/tests
      - name: Reject duplicate ADR numeric prefixes
        run: python3 tools/check-adr-numbering.py

  go-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          # Pinned rather than "latest" so a linter release cannot turn this
          # job red without a commit changing it. Read from a file so the
          # Makefile target can check the local binary against the same pin
          # instead of the two drifting apart unnoticed.
          version-file: .golangci-lint-version
          working-directory: cli

  helm-lint:
    runs-on: ubuntu-latest
    env:
      # Same pin as the kubeconform job above; keep the two in lockstep so
      # charts and raw manifests are validated by the same release.
      KUBECONFORM_VERSION: "v0.8.0"
      KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5.0.1
        with:
          version: latest
      - name: Lint all charts
        run: |
          for chart in helm-charts/*/; do
            echo "Linting $chart"
            helm lint "$chart"
          done
      - name: Cache kubeconform
        id: kubeconform-cache
        uses: actions/cache@v6.1.0
        with:
          path: /usr/local/bin/kubeconform
          key: kubeconform-${{ runner.os }}-${{ env.KUBECONFORM_VERSION }}
      - name: Install kubeconform
        if: steps.kubeconform-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Verify kubeconform version
        run: kubeconform -v
      - name: Render + validate each chart
        run: |
          for chart in helm-charts/*/; do
            echo "Rendering $chart"
            helm template "$(basename "$chart")" "$chart" | kubeconform \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -ignore-missing-schemas \
              -summary
          done
