name: Release platformctl

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    uses: jdwlabs/.github/.github/workflows/release-go.yml@b827924589b7e129a81762131b9d451121718bdc  # main as of 2026-08-26 (jdwlabs/.github has no tagged releases)
    permissions:
      contents: write
    with:
      workdir: cli
      go-version-file: cli/go.mod
