name: Release truenas-prometheus-exporter

# Separate tag prefix from platformctl's `v[0-9]*` on purpose: the two
# binaries live in the same Go module but ship on independent cadences, and
# a shared tag pattern would force a platformctl release to also cut (or
# skip) an exporter image, or vice versa.
on:
  push:
    tags:
      - 'truenas-exporter-v[0-9]*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image tag from the pushed ref
        id: tag
        run: |
          ref="${GITHUB_REF#refs/tags/truenas-exporter-}"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push) for the Trivy scan
        uses: docker/build-push-action@v6
        with:
          context: cli
          file: cli/cmd/truenas-prometheus-exporter/Dockerfile
          load: true
          tags: ghcr.io/jdwlabs/truenas-prometheus-exporter:${{ steps.tag.outputs.version }}

      # Gate the push on the same bar the rest of this repo's images are
      # held to (see the truenas-csi chart hardening commit history) rather
      # than publishing first and finding out later.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/jdwlabs/truenas-prometheus-exporter:${{ steps.tag.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: cli
          file: cli/cmd/truenas-prometheus-exporter/Dockerfile
          push: true
          tags: |
            ghcr.io/jdwlabs/truenas-prometheus-exporter:${{ steps.tag.outputs.version }}
            ghcr.io/jdwlabs/truenas-prometheus-exporter:latest

      - name: Resolve pushed digest
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/jdwlabs/truenas-prometheus-exporter:${{ steps.tag.outputs.version }}" \
            --format '{{json .Manifest}}' | tee digest.json
          echo "Copy the sha256 digest above into the Deployment's image reference \
            (tenants/platform/services/truenas-prometheus-exporter/postInstall/deployment.yaml) \
            in a follow-up commit — this workflow does not write back to the repo."
