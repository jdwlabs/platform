apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-vault
  namespace: vault
spec:
  serviceName: platform-vault
  replicas: 2
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - talos-2qd-v0u
      containers:
      - name: vault
        image: vault:1.15
        ports:
        - containerPort: 8200
        readinessProbe:
          exec:
            command:
            - vault
            - status
            - -tls-skip-verify
          initialDelaySeconds: 5
          periodSeconds: 10
